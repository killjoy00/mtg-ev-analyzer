<body>
  <p>Opening Pack One…</p>
  <script>
    // Opens the recipient's own current Daily. The sharer's date (d) lets the
    // game explain when their score came from an earlier Daily.
    const params=new URLSearchParams(location.search);
    const target=new URL('/',location.origin);
    target.searchParams.set('game','draft-run');
    target.searchParams.set('daily','1');
    if(params.get('ref')==='result_share')target.searchParams.set('ref','result_share');
    if(/^\d{4}-\d{2}-\d{2}$/.test(params.get('d')||''))target.searchParams.set('d',params.get('d'));
    location.replace(target.pathname+target.search);
  </script>
  <noscript><a href="/">Open Pack One</a></noscript>
