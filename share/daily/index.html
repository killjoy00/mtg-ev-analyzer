<body>
  <p>Opening Pack One…</p>
  <script>
    const params=new URLSearchParams(location.search);
    const environment=params.get('environment')||'mixed';
    const set=environment==='powered-cube'||environment==='latest'?environment:'mixed';
    const target=new URL('/',location.origin);
    target.searchParams.set('game','draft-run');
    target.searchParams.set('daily','1');
    if(set!=='mixed')target.searchParams.set('set',set);
    if(params.get('ref')==='result_share')target.searchParams.set('ref','result_share');
    location.replace(target.pathname+target.search);
  </script>
