name = "pack1-api"
main = "index.js"
compatibility_date = "2026-09-06"
workers_dev = true

[vars]
STATIC_ORIGIN = "https://magic.planitnow.us"
ALLOWED_ORIGINS = "https://magic.planitnow.us,https://killjoy00.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "pack1"
database_id = "replace-after-bootstrap"

[[routes]]
pattern = "pack1-api.planitnow.us"
custom_domain = true
