<body>
  <p>Opening Pack One…</p>
  <script>
    // Short result-share link. The path itself marks a result share, so the
    // visible link carries only the sharer's date (d), which lets the game
    // explain when a friend's score came from an earlier Daily.
    const params=new URLSearchParams(location.search);
    const target=new URL('/',location.origin);
    target.searchParams.set('game','draft-run');
    target.searchParams.set('daily','1');
    target.searchParams.set('set','latest');
    target.searchParams.set('ref','result_share');
    if(/^\d{4}-\d{2}-\d{2}$/.test(params.get('d')||''))target.searchParams.set('d',params.get('d'));
    // Explicit device-test opt-in only. Ordinary shared URLs remain untouched.
    // iOS may keep a same-domain client redirect in Safari; test on a device
    // before considering wider use.
    if(params.get('app_handoff_test')==='1'){
      const handoff=new URL('/open/daily/',location.origin);
      handoff.searchParams.set('environment','latest');
      handoff.searchParams.set('ref','result_share');
      if(target.searchParams.has('d'))handoff.searchParams.set('d',target.searchParams.get('d'));
      location.replace(handoff.pathname+handoff.search);
    }else{
      location.replace(target.pathname+target.search);
    }
  </script>
  <noscript><a href="/">Open Pack One</a></noscript>
</body>
