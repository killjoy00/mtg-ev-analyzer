# GitHub Pages still publishes from the repository root using Jekyll.
# Explicitly exclude non-public source material until a separate
# artifact-only publishing source can be configured. The preflight checks
# compare the actual Jekyll output against the public allowlist.
include:
  - ".well-known"
  - "results-copy.json"
  - "results-settings.mjs"
exclude:
  # Private / development source trees (regardless of extension).
  - ".devcontainer"
  - ".github"
  - "analytics"
  - "docs"
  - "edge"
  - "migrations"
  - "mobile/**"
  - "reports"
  - "research"
  - "results"
  - "scripts"
  - "tests"
  - "worker"
  - "patreon-post-read.mjs"
  - "weekly-patreon-contract.mjs"
  # Root documentation, package metadata, source declarations.
  - "**/*.md"
  - "README.md"
  - "AGENTS.md"
  - "MONETIZATION.md"
  - "ads.txt.example"
  - "package.json"
  - "package-lock.json"
  - "requirements-test.txt"
  - "card-faces.d.mts"
  - "card-image-policy.d.mts"
  # Nested non-site material; retain allowed corpus/data/browser assets.
  - "assets/brand"
  - "corpus/card-strength/README.md"
  - "corpus/trophy-decks/README.md"
  - "data/import-queue.json"
