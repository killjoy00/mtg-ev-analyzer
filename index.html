<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f0e6" />
  <meta name="description" content="Play Pack 1, take the Daily Challenge, score your Limited draft instincts out of 100, and climb the leaderboard." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pack 1 — How good are your draft instincts?" />
  <meta property="og:description" content="Play the same Pack 1 Daily Challenge as everyone else, get a score out of 100, and challenge a friend to beat it." />
  <meta property="og:url" content="https://magic.planitnow.us/" />
  <meta name="twitter:card" content="summary" />

  <meta name="twitter:description" content="Play the Pack 1 Daily Challenge, get a score out of 100, and challenge a friend to beat it." />
  <title>Pack 1 — Limited Draft Training</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="score.css" />
  <link rel="stylesheet" href="engagement.css" />
  <link rel="stylesheet" href="social.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brand-home" type="button" aria-label="Return to Pack 1 home">
        <span class="brand-mark">P1</span>
        <span class="brand-copy">
          <strong>Pack 1</strong>
          <small>Limited draft training</small>
        </span>
      </button>
      <div class="top-actions">
        <button class="top-nav-button" id="daily-nav" type="button">Daily</button>
        <button class="top-nav-button" id="leaderboard-nav" type="button">Leaders</button>
        <span class="source-note">Built from real 17Lands draft data</span>
      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>
  </div>

  <template id="loading-template">
    <section class="message-card">
      <p class="eyebrow">Loading</p>
      <h1>Shuffling a pack…</h1>
    </section>
  </template>

  <script src="leaderboard-config.js"></script>
  <script type="module" src="bootstrap.mjs"></script>
