<!doctype html>
<html lang="en">
<head>

  <meta name="twitter:card" content="summary" />

  <script>
    if (location.protocol === 'http:' && location.hostname === 'magic.planitnow.us') {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  </script>
  <link rel="stylesheet" href="pack1.css?v=2" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brand-home" type="button" aria-label="Return to Pack 1 home">
        <span class="brand-mark">P1</span>
        <span class="brand-copy">
          <strong>Pack 1</strong>
          <small>Limited draft game</small>
        </span>

      <div class="top-actions">

      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

  <template id="loading-template">
    <section class="message-card">
      <p class="eyebrow">Loading</p>
      <h1>Shuffling a pack…</h1>

  <script src="leaderboard-config.js"></script>
