<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101410" />
  <meta name="description" content="Replay real Limited draft decisions and compare your picks with strong-player consensus." />
  <title>Draft Study</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brand-home" type="button" aria-label="Return home">
        <span class="brand-mark">DS</span>
        <span>
          <strong>Draft Study</strong>
          <small>17Lands replay trainer</small>
        </span>
      </button>
      <div class="source-note">Offline consensus · no runtime AI</div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>
  </div>

  <template id="loading-template">
    <section class="center-card">
      <p class="eyebrow">Loading</p>
      <h1>Preparing replay data…</h1>
    </section>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
