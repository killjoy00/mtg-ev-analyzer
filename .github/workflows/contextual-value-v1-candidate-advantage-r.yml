name: contextual-value-v1-candidate-advantage-r

on:
  workflow_dispatch:
  push:
    branches:
      - research/contextual-value-v1-h-freeze-audit-529

permissions:
  actions: read
  contents: read

env:
  PHASE_A1_RUN: '36286752890'
  PHASE_A2_PILOT_RUN: '36289846820'
  PHASE_A2_RUN: '36290030236'
  PYTHONUNBUFFERED: '1'

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'

      - name: Compile candidate-advantage R
        run: python -m py_compile research/contextual_value_candidate_advantage_r.py

      - name: Download Phase A2 fold 0
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-phase-a2-fold-0
          path: folds
          run-id: ${{ env.PHASE_A2_PILOT_RUN }}
          github-token: ${{ github.token }}

      - name: Download Phase A2 validation and folds 1-4
        uses: actions/download-artifact@v4
        with:
          pattern: contextual-value-v1-phase-a2-fold-*
          path: folds
          merge-multiple: true
          run-id: ${{ env.PHASE_A2_RUN }}
          github-token: ${{ github.token }}

      - name: Download exact rich feature schema report
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-phase-a-rich-report-fold--1
          path: feature
          run-id: ${{ env.PHASE_A1_RUN }}
          github-token: ${{ github.token }}

      - name: Run frozen orthogonal candidate-advantage development
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/contextual-value-v1/candidate-advantage-r
          TRAIN_ARGS=()
          REPORT_ARGS=()
          for f in 0 1 2 3 4; do
            TRAIN_ARGS+=(--train-shard "folds/phase-a2-fold-$f.npz")
            REPORT_ARGS+=(--train-report "folds/phase-a2-fold-$f-report.json")
          done
          python3 research/contextual_value_candidate_advantage_r.py \
            "${TRAIN_ARGS[@]}" \
            "${REPORT_ARGS[@]}" \
            --validation-shard folds/phase-a2-fold--1.npz \
            --validation-report folds/phase-a2-fold--1-report.json \
            --feature-report feature/phase-a-rich-fold--1-report.json \
            --model-output results/contextual-value-v1/candidate-advantage-r/model.json \
            --output results/contextual-value-v1/candidate-advantage-r/report.json

      - name: Assert development boundary and single frozen model
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('results/contextual-value-v1/candidate-advantage-r/report.json'))
          m=json.load(open('results/contextual-value-v1/candidate-advantage-r/model.json'))
          assert r['phase'] == 'candidate_advantage_R_development'
          assert r['assessment_opened'] is False
          assert r['assessment_outcomes_used'] is False
          assert r['twenty_k_confirmation_used'] is False
          assert m['model'] == 'R_orthogonal_candidate_advantage'
          assert m['global_l2'] == 100.0
          assert m['set_deviation_l2'] == 1000.0
          assert m['policy_uses_set_deviations'] is False
          assert not any('strong_choice_probability' in x for x in m['feature_names'])
          assert r['training']['behavior_probability_max_sum_error'] <= 1e-6
          PY

      - name: Upload candidate-advantage R development result
        uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-candidate-advantage-r
          path: results/contextual-value-v1/candidate-advantage-r/
          retention-days: 90
