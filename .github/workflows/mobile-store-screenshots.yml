name: Mobile store screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/store-screenshot-request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-store-screenshots
  cancel-in-progress: false

jobs:
  validate:
    name: validate screenshot fixture build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Resolve reviewed screenshot request
        if: github.event_name == 'push'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('.github/store-screenshot-request.json').read_text())
          if set(request) != {'operation','reason'}:
              raise SystemExit('Invalid store screenshot request keys.')
          if request.get('operation') != 'generate-mobile-store-screenshots':
              raise SystemExit('Invalid store screenshot operation.')
          if not isinstance(request.get('reason'),str) or not request['reason'].strip():
              raise SystemExit('Store screenshot request requires a reason.')
          print('Reviewed store screenshot request:', request['reason'])
          PY
      - name: Require current main for generated store evidence
        if: github.event_name == 'push'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse FETCH_HEAD)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Validate mobile project with screenshot fixtures enabled
        run: npm test

  ios:
    name: capture iPhone and iPad
    needs: validate
    runs-on: macos-latest
    env:
      EXPO_PUBLIC_PACKONE_ENV: preview
      EXPO_PUBLIC_PACKONE_SCREENSHOT_FIXTURES: '1'
      PACKONE_BUILD_PROFILE: preview
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Generate preview iOS project
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean
      - id: simulators
        name: Select current iPhone and iPad simulator types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/simulators.env"
          import json, subprocess

          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))
          available=[r for r in runtimes['runtimes'] if r.get('isAvailable') and r.get('platform')=='iOS']
          if not available:
              raise SystemExit('No available iOS Simulator runtime.')
          def version(runtime):
              return tuple(int(p) for p in runtime.get('version','0').split('.') if p.isdigit())
          runtime=max(available,key=version)['identifier']

          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          by_name={d['name']:d['identifier'] for d in types}
          def choose(preferred, contains):
              for name in preferred:
                  if name in by_name:
                      return by_name[name]
              matches=[d for d in types if all(term.lower() in d['name'].lower() for term in contains)]
              if not matches:
                  raise SystemExit(f'No simulator type matching {contains}')
              return matches[-1]['identifier']

          phone=choose(
              ['iPhone 17 Pro Max','iPhone 16 Pro Max','iPhone 15 Pro Max','iPhone 14 Pro Max'],
              ['iPhone','Pro Max'],
          )
          ipad=choose(
              ['iPad Pro 13-inch (M4)','iPad Pro (12.9-inch) (6th generation)','iPad Pro (12.9-inch) (5th generation)'],
              ['iPad Pro'],
          )
          print(f'RUNTIME={runtime}')
          print(f'PHONE_TYPE={phone}')
          print(f'IPAD_TYPE={ipad}')
          PY
          cat "$RUNNER_TEMP/simulators.env"
          source "$RUNNER_TEMP/simulators.env"
          phone_udid="$(xcrun simctl create 'Pack One Store iPhone' "$PHONE_TYPE" "$RUNTIME")"
          ipad_udid="$(xcrun simctl create 'Pack One Store iPad' "$IPAD_TYPE" "$RUNTIME")"
          {
            echo "phone_udid=$phone_udid"
            echo "ipad_udid=$ipad_udid"
          } >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$phone_udid"
          xcrun simctl boot "$ipad_udid"
          xcrun simctl bootstatus "$phone_udid" -b
          xcrun simctl bootstatus "$ipad_udid" -b
      - name: Build preview app for iOS Simulator
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(
            xcodebuild -list -json -workspace "$workspace" |
            python3 -c 'import json,sys,pathlib; data=json.load(sys.stdin); schemes=data.get("workspace",{}).get("schemes",[]); preferred=pathlib.Path(sys.argv[1]).stem; candidates=[s for s in schemes if s != "Pods"]; print(preferred if preferred in candidates else (candidates[0] if len(candidates)==1 else ""))' "$workspace"
          )"
          if [[ -z "$scheme" ]]; then
            echo "Could not resolve a unique preview app scheme from $workspace." >&2
            xcodebuild -list -workspace "$workspace"
            exit 1
          fi
          echo "Building preview scheme: $scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PackOneScreenshotDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app=""
          while IFS= read -r candidate; do
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$candidate/Info.plist" 2>/dev/null || true)"
            if [[ "$bundle_id" == "pro.packone.preview" ]]; then
              app="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/PackOneScreenshotDerivedData/Build/Products" -path '*Release-iphonesimulator/*.app' -type d -print)
          test -d "$app"
          echo "SCREENSHOT_IOS_APP=$app" >> "$GITHUB_ENV"
      - name: Install preview app on simulators
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install '${{ steps.simulators.outputs.phone_udid }}' "$SCREENSHOT_IOS_APP"
          xcrun simctl install '${{ steps.simulators.outputs.ipad_udid }}' "$SCREENSHOT_IOS_APP"
      - name: Capture iPhone screenshots
        shell: bash
        run: bash ./scripts/capture-store-screenshots-ios.sh '${{ steps.simulators.outputs.phone_udid }}' iphone "$GITHUB_WORKSPACE/store-screenshots"
      - name: Capture iPad screenshots
        shell: bash
        run: bash ./scripts/capture-store-screenshots-ios.sh '${{ steps.simulators.outputs.ipad_udid }}' ipad "$GITHUB_WORKSPACE/store-screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: pack-one-ios-store-screenshots
          path: store-screenshots
          if-no-files-found: error
          retention-days: 30

  android:
    name: capture Android phone
    needs: validate
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_PACKONE_ENV: preview
      EXPO_PUBLIC_PACKONE_SCREENSHOT_FIXTURES: '1'
      PACKONE_BUILD_PROFILE: preview
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Generate preview Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Build installable preview APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Locate preview APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -size +1M -print -quit)"
          test -f "$apk"
          echo "SCREENSHOT_ANDROID_APK=$GITHUB_WORKSPACE/mobile/$apk" >> "$GITHUB_ENV"
      - name: Enable KVM for Android emulator
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      - name: Capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        # The action runs each script line through /bin/sh. Keep the Bash
        # program in one environment value and explicitly invoke Bash once.
        env:
          PACKONE_ANDROID_SCREENSHOT_SCRIPT: |
            set -euo pipefail
            adb wait-for-device
            for attempt in 1 2 3 4 5 6; do
              if adb shell service check package 2>/dev/null | grep -F 'Service package: found' >/dev/null; then
                break
              fi
              if [[ "$attempt" == 6 ]]; then
                echo "Android package manager never became ready." >&2
                exit 1
              fi
              sleep 5
            done
            installed=0
            for attempt in 1 2 3; do
              if adb install -r "$SCREENSHOT_ANDROID_APK"; then
                installed=1
                break
              fi
              echo "APK install attempt $attempt failed; recovering adb before retry." >&2
              adb kill-server || true
              sleep 2
              adb start-server
              adb wait-for-device
              sleep 5
            done
            [[ "$installed" == 1 ]]
            cd mobile
            bash ./scripts/capture-store-screenshots-android.sh "$GITHUB_WORKSPACE/store-screenshots"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -c "$PACKONE_ANDROID_SCREENSHOT_SCRIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: pack-one-android-store-screenshots
          path: store-screenshots
          if-no-files-found: error
          retention-days: 30
