name: Mobile store screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/store-screenshot-request.json'
  workflow_dispatch:
    inputs:
      android_only:
        description: Run Android capture without repeating iOS
        type: boolean
        default: false
  workflow_call:
    inputs:
      android_only:
        type: boolean
        default: false
  pull_request:
    paths: ['mobile/**', '.github/actions/mobile-validate/**', '.github/workflows/mobile-store-screenshots.yml']

permissions:
  contents: read

concurrency:
  group: mobile-store-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate screenshot fixture build
    timeout-minutes: 10
    outputs:
      capture_required: ${{ steps.capture.outputs.capture_required }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select native screenshot coverage
        id: capture
        shell: bash
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            node mobile/scripts/screenshot-ci-scope.mjs "$base" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'capture_required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve reviewed screenshot request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('.github/store-screenshot-request.json').read_text())
          if set(request) != {'operation','reason'}:
              raise SystemExit('Invalid store screenshot request keys.')
          if request.get('operation') != 'generate-mobile-store-screenshots':
              raise SystemExit('Invalid store screenshot operation.')
          if not isinstance(request.get('reason'),str) or not request['reason'].strip():
              raise SystemExit('Store screenshot request requires a reason.')
          print('Reviewed store screenshot request:', request['reason'])
          PY
      - name: Require current main for generated store evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse FETCH_HEAD)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Validate mobile project with screenshot fixtures enabled
        uses: ./.github/actions/mobile-validate

  ios:
    name: capture iPhone and iPad
    needs: validate
    if: needs.validate.outputs.capture_required == 'true' && !inputs.android_only
    timeout-minutes: 45
    runs-on: macos-latest
    env:
      EXPO_PUBLIC_PACKONE_ENV: preview
      EXPO_PUBLIC_PACKONE_SCREENSHOT_FIXTURES: '1'
      PACKONE_BUILD_PROFILE: preview
      ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Generate preview iOS project
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean
      - id: simulators
        name: Select current iPhone and iPad simulator types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/simulators.env"
          import json, subprocess

          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))
          available=[r for r in runtimes['runtimes'] if r.get('isAvailable') and r.get('platform')=='iOS']
          if not available:
              raise SystemExit('No available iOS Simulator runtime.')
          def version(runtime):
              return tuple(int(p) for p in runtime.get('version','0').split('.') if p.isdigit())
          runtime=max(available,key=version)['identifier']

          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          by_name={d['name']:d['identifier'] for d in types}
          def choose(preferred, contains):
              for name in preferred:
                  if name in by_name:
                      return by_name[name]
              matches=[d for d in types if all(term.lower() in d['name'].lower() for term in contains)]
              if not matches:
                  raise SystemExit(f'No simulator type matching {contains}')
              return matches[-1]['identifier']

          phone=choose(
              ['iPhone 17 Pro Max','iPhone 16 Pro Max','iPhone 15 Pro Max','iPhone 14 Pro Max'],
              ['iPhone','Pro Max'],
          )
          ipad=choose(
              ['iPad Pro 13-inch (M4)','iPad Pro (12.9-inch) (6th generation)','iPad Pro (12.9-inch) (5th generation)'],
              ['iPad Pro'],
          )
          print(f'RUNTIME={runtime}')
          print(f'PHONE_TYPE={phone}')
          print(f'IPAD_TYPE={ipad}')
          PY
          cat "$RUNNER_TEMP/simulators.env"
          source "$RUNNER_TEMP/simulators.env"
          phone_udid="$(xcrun simctl create 'Pack One Store iPhone' "$PHONE_TYPE" "$RUNTIME")"
          ipad_udid="$(xcrun simctl create 'Pack One Store iPad' "$IPAD_TYPE" "$RUNTIME")"
          {
            echo "phone_udid=$phone_udid"
            echo "ipad_udid=$ipad_udid"
          } >> "$GITHUB_OUTPUT"
      - name: Build preview app for iOS Simulator
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(
            xcodebuild -list -json -workspace "$workspace" |
            python3 -c 'import json,sys,pathlib; data=json.load(sys.stdin); schemes=data.get("workspace",{}).get("schemes",[]); preferred=pathlib.Path(sys.argv[1]).stem; candidates=[s for s in schemes if s != "Pods"]; print(preferred if preferred in candidates else (candidates[0] if len(candidates)==1 else ""))' "$workspace"
          )"
          if [[ -z "$scheme" ]]; then
            echo "Could not resolve a unique preview app scheme from $workspace." >&2
            xcodebuild -list -workspace "$workspace"
            exit 1
          fi
          echo "Building preview scheme: $scheme"
          xcodebuild \
            -quiet \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PackOneScreenshotDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="$(uname -m)" \
            build
          app=""
          while IFS= read -r candidate; do
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$candidate/Info.plist" 2>/dev/null || true)"
            if [[ "$bundle_id" == "pro.packone.preview" ]]; then
              app="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/PackOneScreenshotDerivedData/Build/Products" -path '*Release-iphonesimulator/*.app' -type d -print)
          test -d "$app"
          echo "SCREENSHOT_IOS_APP=$app" >> "$GITHUB_ENV"
      - name: Boot and install iPhone preview
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Build before booting, then keep one simulator active at a time.
          # Two booted iOS runtimes compete with native compilation/capture on
          # the hosted runner; preserve diagnostics with bounded capture steps.
          xcrun simctl boot '${{ steps.simulators.outputs.phone_udid }}'
          xcrun simctl bootstatus '${{ steps.simulators.outputs.phone_udid }}' -b
          xcrun simctl install '${{ steps.simulators.outputs.phone_udid }}' "$SCREENSHOT_IOS_APP"
      - name: Capture iPhone screenshots
        timeout-minutes: 10
        shell: bash
        run: bash ./scripts/capture-store-screenshots-ios.sh '${{ steps.simulators.outputs.phone_udid }}' iphone "$GITHUB_WORKSPACE/store-screenshots"
      - name: Capture native iPhone acceptance states
        if: always() && env.SCREENSHOT_IOS_APP != ''
        timeout-minutes: 25
        run: python3 ./scripts/native-acceptance.py ios "$GITHUB_WORKSPACE/native-acceptance/iphone" '${{ steps.simulators.outputs.phone_udid }}' iphone
      - name: Switch from iPhone to iPad simulator
        if: always() && env.SCREENSHOT_IOS_APP != ''
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown '${{ steps.simulators.outputs.phone_udid }}' || true
          xcrun simctl boot '${{ steps.simulators.outputs.ipad_udid }}'
          xcrun simctl bootstatus '${{ steps.simulators.outputs.ipad_udid }}' -b
          xcrun simctl install '${{ steps.simulators.outputs.ipad_udid }}' "$SCREENSHOT_IOS_APP"
      - name: Capture iPad screenshots
        if: always() && env.SCREENSHOT_IOS_APP != ''
        timeout-minutes: 10
        shell: bash
        run: bash ./scripts/capture-store-screenshots-ios.sh '${{ steps.simulators.outputs.ipad_udid }}' ipad "$GITHUB_WORKSPACE/store-screenshots"
      - name: Capture native iPad acceptance states
        if: always() && env.SCREENSHOT_IOS_APP != ''
        timeout-minutes: 25
        run: python3 ./scripts/native-acceptance.py ios "$GITHUB_WORKSPACE/native-acceptance/ipad" '${{ steps.simulators.outputs.ipad_udid }}' ipad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-one-ios-native-acceptance
          path: native-acceptance
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-one-ios-store-screenshots
          path: store-screenshots
          if-no-files-found: error
          retention-days: 30

  android:
    name: capture Android phone
    needs: validate
    if: needs.validate.outputs.capture_required == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_PACKONE_ENV: preview
      EXPO_PUBLIC_PACKONE_SCREENSHOT_FIXTURES: '1'
      PACKONE_BUILD_PROFILE: preview
      ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Install Android screenshot image tools
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate preview Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Resolve exact Android toolchain cache inputs
        id: toolchain-inputs
        run: python3 scripts/prepare-android-toolchain.py --outputs
      - name: Restore verified Android SDK packages
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/ndk/${{ steps.toolchain-inputs.outputs.ndk_version }}
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/cmake/3.22.1
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/platforms/android-36
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/build-tools/36.0.0
          key: ${{ steps.toolchain-inputs.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}
      - name: Verify and prepare SDK dependencies before the app build
        id: prepare-toolchain
        timeout-minutes: 12
        run: python3 scripts/prepare-android-toolchain.py
      - name: Save only verified SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/ndk/${{ steps.toolchain-inputs.outputs.ndk_version }}
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/cmake/3.22.1
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/platforms/android-36
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/build-tools/36.0.0
          key: ${{ steps.toolchain-inputs.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}
      - name: Compute unsigned Gradle cache key
        id: gradle-cache
        env:
          PACKONE_GRADLE_CACHE_JAVA: '17'
        run: node scripts/gradle-cache-key.mjs
      - name: Restore shared unsigned Gradle dependencies and build state
        id: gradle-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/node_modules/**/.cxx
          key: ${{ steps.gradle-cache.outputs.key }}
          restore-keys: |
            ${{ steps.gradle-cache.outputs.restore_key }}
      - name: Resolve Gradle plugin dependencies with bounded HTTP recovery
        working-directory: mobile/android
        timeout-minutes: 9
        run: node ../scripts/prepare-gradle-dependencies.mjs
      - name: Build installable preview APK
        id: apk-build
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/native-build
          ./gradlew :app:assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64 2>&1 | tee ../../artifacts/native-build/gradle.log
      - name: Save successful unsigned Gradle build state
        if: steps.gradle-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/node_modules/**/.cxx
          key: ${{ steps.gradle-cache.outputs.key }}
      - name: Locate preview APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -size +1M -print -quit)"
          test -f "$apk"
          echo "SCREENSHOT_ANDROID_APK=$GITHUB_WORKSPACE/mobile/$apk" >> "$GITHUB_ENV"
      - name: Enable KVM for Android emulator when available
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            ls -l /dev/kvm
          else
            echo "No /dev/kvm exposed on this hosted runner; emulator action may fall back to software acceleration."
          fi
      - name: Capture Android screenshots
        id: android-capture
        uses: reactivecircus/android-emulator-runner@v2
        # The action runs each script line through /bin/sh. Keep the Bash
        # program in one environment value and explicitly invoke Bash once.
        env:
          PACKONE_ANDROID_SCREENSHOT_SCRIPT: |
            set -euo pipefail
            adb wait-for-device
            for attempt in 1 2 3 4 5 6; do
              if adb shell service check package 2>/dev/null | grep -F 'Service package: found' >/dev/null; then
                break
              fi
              if [[ "$attempt" == 6 ]]; then
                echo "Android package manager never became ready." >&2
                exit 1
              fi
              sleep 5
            done
            installed=0
            for attempt in 1 2 3; do
              if adb install -r "$SCREENSHOT_ANDROID_APK"; then
                installed=1
                break
              fi
              echo "APK install attempt $attempt failed; recovering adb before retry." >&2
              adb kill-server || true
              sleep 2
              adb start-server
              adb wait-for-device
              sleep 5
            done
            [[ "$installed" == 1 ]]
            cd mobile
            bash ./scripts/capture-store-screenshots-android.sh "$GITHUB_WORKSPACE/store-screenshots"
            python3 ./scripts/native-acceptance.py android "$GITHUB_WORKSPACE/native-acceptance"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -c "$PACKONE_ANDROID_SCREENSHOT_SCRIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-one-android-native-acceptance
          path: native-acceptance
          if-no-files-found: ${{ steps.android-capture.outcome == 'success' && 'error' || 'ignore' }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-one-android-store-screenshots
          path: store-screenshots
          if-no-files-found: ${{ steps.android-capture.outcome == 'success' && 'error' || 'ignore' }}
          retention-days: 30
      - name: Preserve Android dependency and build failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-android-build-diagnostics-${{ github.run_attempt }}
          path: artifacts/native-build
          if-no-files-found: ignore
          retention-days: 30
