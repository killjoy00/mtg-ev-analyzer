name: deploy neon functions

# Manual promotion of one reviewed main commit. Schema is verified, not mutated.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Neon branch to deploy'
        type: choice
        options: [development, production]
        default: development
        required: true
      commit:
        description: 'Full 40-character main commit SHA (use the same SHA for both targets)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-neon-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: patient-shadow-91417882
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TARGET: ${{ inputs.target }}
      PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
      PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
      PATREON_WEBHOOK_SECRET: ${{ secrets.PATREON_WEBHOOK_SECRET }}
      PACK1_RATE_LIMIT_SECRET: ${{ secrets.PACK1_RATE_LIMIT_SECRET }}
      PACK1_DELETION_ADMIN_EMAIL: ${{ secrets.PACK1_DELETION_ADMIN_EMAIL }}
      PACK1_DELETION_ADMIN_PASSWORD: ${{ secrets.PACK1_DELETION_ADMIN_PASSWORD }}
      PACK1_ACCOUNT_DELETE_RESEND_API_KEY: ${{ secrets.PACK1_ACCOUNT_DELETE_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve reviewed commit and target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY" || { echo '::error::NEON_API_KEY is missing.'; exit 1; }
          test ${#PACK1_RATE_LIMIT_SECRET} -ge 32 || { echo '::error::PACK1_RATE_LIMIT_SECRET is missing or too short.'; exit 1; }
          [[ "$PACK1_DELETION_ADMIN_EMAIL" == *@* ]] || { echo '::error::PACK1_DELETION_ADMIN_EMAIL is missing or malformed.'; exit 1; }
          test ${#PACK1_DELETION_ADMIN_PASSWORD} -ge 16 || { echo '::error::PACK1_DELETION_ADMIN_PASSWORD is missing or too short.'; exit 1; }
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Use a full commit SHA.'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"
          case "$RELEASE_TARGET" in
            development)
              branch=br-twilight-hill-ayffyd2b
              deletion_email_expected=false
              ;;
            production)
              branch=br-orange-feather-ayps8kep
              [[ "$PACK1_ACCOUNT_DELETE_RESEND_API_KEY" == re_* && ${#PACK1_ACCOUNT_DELETE_RESEND_API_KEY} -gt 3 ]] || { echo '::error::PACK1_ACCOUNT_DELETE_RESEND_API_KEY is missing or malformed.'; exit 1; }
              deletion_email_expected=true
              ;;
            *) exit 1 ;;
          esac
          echo "TARGET_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "DELETION_EMAIL_EXPECTED=$deletion_email_expected" >> "$GITHUB_ENV"
          echo "Deploying $RELEASE_COMMIT to $RELEASE_TARGET ($branch)"

      - name: Install pinned release tools
        run: npm install -g neon@4.17.4 esbuild@0.28.2

      - name: Verify schema prerequisites
        shell: bash
        run: |
          set -euo pipefail
          connection=$(neon connection-string "$TARGET_BRANCH" --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          DATABASE_URL="$connection" node scripts/verify-neon-schema.mjs

      - name: Require the same revision tested in development before production
        if: inputs.target == 'production'
        shell: bash
        run: |
          set -euo pipefail
          node tests/release-functions-smoke.mjs br-twilight-hill-ayffyd2b "$RELEASE_COMMIT" --daily --expect-deletion-email=false
          # The old frontend assumes ten picks. It must be replaced first.
          curl -fsS --max-time 30 https://packone.pro/draft-run-format.mjs -o "$RUNNER_TEMP/run-format.mjs"
          grep -q 'function draftRunLength' "$RUNNER_TEMP/run-format.mjs"
          curl -fsS --max-time 30 https://packone.pro/data/selection-policy.json -o "$RUNNER_TEMP/selection-policy.json"
          node -e 'const p=require(process.argv[1]);if(p.run_length!==8||p.selection_version!=="eight-pick-v4")throw Error("Compatible frontend is not published")' "$RUNNER_TEMP/selection-policy.json"

      - name: Check optional Patreon activation before any upload
        run: |
          set -euo pipefail
          enabled=$(node --input-type=module -e "import {validPatreonPolicy} from './patreon-policy.mjs';console.log(validPatreonPolicy())")
          echo "PATREON_RUNTIME_ENABLED=$enabled" >> "$GITHUB_ENV"
          if [[ "$enabled" == true && "$RELEASE_TARGET" == production ]]; then
            test -n "$PATREON_CLIENT_ID" && test -n "$PATREON_CLIENT_SECRET" && test -n "$PATREON_WEBHOOK_SECRET" || { echo '::error::Activated Patreon requires all runtime secrets.'; exit 1; }
          fi

      - name: Build and verify all bundles before upload
        run: node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$RELEASE_COMMIT"

      - name: Deploy the checked bundles without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          while IFS=: read -r slug entry; do
            extra=()
            if [[ "$slug" == pack1growth ]]; then
              extra+=(--env "PACK1_RATE_LIMIT_SECRET=$PACK1_RATE_LIMIT_SECRET"
                --env "PACK1_DELETION_ADMIN_EMAIL=$PACK1_DELETION_ADMIN_EMAIL"
                --env "PACK1_DELETION_ADMIN_PASSWORD=$PACK1_DELETION_ADMIN_PASSWORD"
                --env "PACK1_ACCOUNT_DELETION_ENABLED=1"
                --env "PACK1_VERIFICATION_SWEEP_ENABLED=1")
              if [[ "$RELEASE_TARGET" == production ]]; then
                extra+=(--env "PACK1_ACCOUNT_DELETE_RESEND_API_KEY=$PACK1_ACCOUNT_DELETE_RESEND_API_KEY")
              fi
              if [[ "$RELEASE_TARGET" == production && "$PATREON_RUNTIME_ENABLED" == true ]]; then
                extra+=(--env "PATREON_CLIENT_ID=$PATREON_CLIENT_ID" --env "PATREON_CLIENT_SECRET=$PATREON_CLIENT_SECRET" --env "PATREON_WEBHOOK_SECRET=$PATREON_WEBHOOK_SECRET")
              fi
            fi
            neon functions deploy "$slug" --src "$RUNNER_TEMP/pack1-bundles/$slug" --no-bundle \
              --project-id "$PROJECT_ID" --branch "$TARGET_BRANCH" --runtime nodejs24 --wait "${extra[@]}"
          done < .github/neon-functions.txt

      # --settle: this runs seconds after the deploy call returned, and a
      # "completed" deployment is not yet guaranteed to be what every instance
      # answers with. The closing marker check inside the smoke stays strict.
      - name: Verify revision, coverage and complete all three unranked Daily flows
        run: node tests/release-functions-smoke.mjs "$TARGET_BRANCH" "$RELEASE_COMMIT" --daily --settle "--expect-deletion-email=$DELETION_EMAIL_EXPECTED"
