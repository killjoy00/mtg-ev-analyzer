name: Collect vendor-authentic store badges (temporary)
on:
  push:
    branches:
      - assets/app-store-badges-2026-11-22
    paths:
      - .github/workflows/collect-official-store-badges.yml
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/app-store-badges-2026-11-22
          persist-credentials: true
      - name: Fetch untouched Apple and Google badge assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 45 --silent --show-error 'https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg' -o /tmp/app-store-official.svg
          curl --fail --location --retry 3 --max-time 45 --silent --show-error 'https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png' -o /tmp/google-play-official.png
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          a=Path('/tmp/app-store-official.svg').read_bytes()
          g=Path('/tmp/google-play-official.png').read_bytes()
          assert a.lstrip().startswith((b'<svg',b'<?xml')) and b'<svg' in a[:5000], 'Apple file must be SVG'
          assert 1000<len(a)<300000, 'Apple SVG byte length not plausible'
          assert g.startswith(bytes.fromhex('89504e470d0a1a0a')), 'Google file must be PNG'
          assert 5000<len(g)<1500000, 'Google PNG byte length not plausible'
          print('Apple original bytes:',len(a),'SHA256:',sha256(a).hexdigest())
          print('Google original bytes:',len(g),'SHA256:',sha256(g).hexdigest())
          Path('assets/store-badges/app-store-en-black.svg').write_bytes(a)
          Path('assets/store-badges/google-play-en.png').write_bytes(g)
          PY
      - name: Commit first-party files to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/store-badges/app-store-en-black.svg assets/store-badges/google-play-en.png
          git diff --cached --quiet && exit 0
          git commit -m 'assets: replace mirrored store badges with original vendor downloads'
          git push origin HEAD:refs/heads/assets/app-store-badges-2026-11-22
