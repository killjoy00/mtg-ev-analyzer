name: import-set-backlog

on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'Optional comma-separated set codes. Leave blank to import the next missing public sets.'
        required: false
        default: ''
        type: string
      limit:
        description: 'Maximum auto-discovered sets to import this run'
        required: true
        default: '3'
        type: string
      earliest:
        description: 'Earliest Scryfall release date to consider for backlog discovery'
        required: true
        default: '2021-01-01'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-more-sets.yml'
      - 'scripts/import_sets.py'
      - 'scripts/build_replays.py'
      - 'scripts/build_path_model.py'
      - 'scripts/fetch_card_metadata.py'
      - 'scripts/validate_dataset.py'
      - 'tests/test_import_sets.py'
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

concurrency:
  group: set-data-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-sets:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run unit tests
        run: npm test

      - name: Import public Premier Draft backlog
        id: importer
        continue-on-error: true
        env:
          SETS: ${{ inputs.sets || '' }}
          LIMIT: ${{ inputs.limit || '3' }}
          EARLIEST: ${{ inputs.earliest || '2021-01-01' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --format PremierDraft
            --limit "$LIMIT"
            --earliest "$EARLIEST"
            --max-training-drafts 5000
            --max-output-drafts 300
            --minimum-replays 100
            --minimum-picks 30
            --folds 5
            --shard-size 2
            --max-path-bytes 4000000
          )
          if [[ -n "$SETS" ]]; then
            args+=(--sets "$SETS")
          fi
          python scripts/import_sets.py "${args[@]}"

      - name: Publish import report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f generated/import-report.json ]]; then
            echo '## Set import report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/import-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: set-import-report-${{ github.run_id }}
          path: generated/import-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit successful imports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/
          if git diff --cached --quiet; then
            echo 'No generated set data changed.'
            exit 0
          fi

          git commit -m 'Import 17Lands set backlog [data-generated]'
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          echo 'Could not publish generated set data after three attempts.' >&2
          exit 1

      - name: Surface importer failure after preserving successful sets
        if: steps.importer.outcome == 'failure'
        run: |
          echo 'One or more selected sets failed. Successful staged sets were committed; see the import report artifact.' >&2
          exit 1
