name: QA auth recovery alert proof cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auth-webhook-alert-proof.yml'

permissions:
  contents: read

concurrency:
  group: pack1-authhook-alert-proof
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.head_ref == 'release/345-authhook-alert-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Disable leftover disposable Auth webhook
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://console.neon.tech/api/v2/projects/patient-shadow-91417882/branches/br-shy-resonance-ayf5djjc/auth/webhooks';
          const headers={
            accept:'application/json',
            authorization:'Bearer '+process.env.NEON_API_KEY,
            'content-type':'application/json',
          };
          const get=async()=>{
            const response=await fetch(endpoint,{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error('Disposable Auth webhook read failed; HTTP '+response.status+'.');
            return response.json();
          };
          const before=await get();
          const safe=value=>({
            enabled:Boolean(value?.enabled),
            webhook_url:String(value?.webhook_url||''),
            enabled_events:Array.isArray(value?.enabled_events)?value.enabled_events:[],
            timeout_seconds:Number(value?.timeout_seconds||0),
          });
          console.log('DISPOSABLE_AUTH_WEBHOOK_BEFORE '+JSON.stringify(safe(before)));
          if(before.enabled){
            if(String(before.webhook_url||'')!=='https://pack1-authhook-qa.killjoy00.workers.dev/webhook')
              throw Error('Disposable Auth webhook points somewhere unexpected; refusing to overwrite it.');
            const desired={
              enabled:false,
              webhook_url:String(before.webhook_url||''),
              enabled_events:Array.isArray(before.enabled_events)?before.enabled_events:['send.magic_link'],
              timeout_seconds:Number(before.timeout_seconds||5),
            };
            const update=await fetch(endpoint,{
              method:'PUT',headers,body:JSON.stringify(desired),redirect:'error',signal:AbortSignal.timeout(15000),
            });
            if(!update.ok)throw Error('Disposable Auth webhook disable failed; HTTP '+update.status+'.');
          }
          const after=await get();
          if(after.enabled!==false)throw Error('Disposable Auth webhook remained enabled after cleanup.');
          console.log('DISPOSABLE_AUTH_WEBHOOK_AFTER '+JSON.stringify(safe(after)));
          NODE
