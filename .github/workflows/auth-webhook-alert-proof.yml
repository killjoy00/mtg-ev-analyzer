name: QA auth recovery alert proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auth-webhook-alert-proof.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: pack1-authhook-alert-proof
  cancel-in-progress: true

jobs:
  proof:
    if: github.head_ref == 'release/345-authhook-alert-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      PACK1_AUTHHOOK_ALERT_SERVICE: pack1-authhook-qa
      PACK1_AUTHHOOK_ALERT_TITLE: '[authhook alert test] Genuine QA recovery webhook failure'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Route the already-generated genuine QA failure through the real alert code
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            output="$(node scripts/auth-webhook-alert.mjs alert)"
            printf '%s\n' "$output"
            if grep -Eq 'route (created|commented); new events [1-9]' <<<"$output"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Genuine QA retained-log alert did not route within five minutes."
          exit 1
