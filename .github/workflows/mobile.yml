name: mobile

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'mobile/**'
      - 'docs/mobile-**'
      - 'docs/parity.md'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'docs/mobile-**'
      - 'docs/parity.md'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Upload resolved mobile lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Lint, typecheck and validate Expo config
        run: npm test
