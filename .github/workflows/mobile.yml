name: mobile

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'mobile/**'
      - 'docs/mobile-**'
      - 'docs/parity.md'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'docs/mobile-**'
      - 'docs/parity.md'
      - '.github/workflows/mobile.yml'

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Upload resolved mobile lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit resolved lock candidate to this temporary branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/mobile-package-lock.json"
          head_ref="${{ github.head_ref }}"
          git fetch --no-tags origin "$head_ref"
          git checkout -B lock-seed FETCH_HEAD
          cp "$RUNNER_TEMP/mobile-package-lock.json" package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the resolved candidate."
            exit 0
          fi
          git commit -m "Capture runner-resolved mobile package lock"
          git push origin "HEAD:$head_ref"
      - name: Lint, typecheck and validate Expo config
        run: npm test
