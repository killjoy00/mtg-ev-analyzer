name: mobile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mobile/**'
      - 'card-faces.mjs'
      - 'card-faces.d.mts'
      - '.github/actions/mobile-validate/**'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-store-screenshots.yml'
      - '.github/workflows/android-internal-testing.yml'
      - '.github/workflows/android-production-bundle.yml'
      - '.github/workflows/ios-testflight.yml'
      - '.github/workflows/mobile-exact-main-rc.yml'
      - '.github/android-internal-release-request.json'
      - '.github/android-production-bundle-request.json'
      - 'docs/mobile-**'
      - 'docs/parity.md'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'card-faces.mjs'
      - 'card-faces.d.mts'
      - '.github/actions/mobile-validate/**'
      - 'docs/mobile-**'
      - 'docs/parity.md'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Lint, typecheck and validate Expo config
        uses: ./.github/actions/mobile-validate
