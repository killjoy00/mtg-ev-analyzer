name: contextual-value-v1-final-outcomes

on:
  push:
    branches:
      - research/contextual-value-v1-h-freeze-audit-529
    paths:
      - .github/workflows/contextual-value-v1-final-outcomes.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FREEZE_RUN: '36475098718'
  P1P1_PREFLIGHT_RUN: '36453124664'
  CONFIRM_RUN: '36371215506'
  BASE: https://17lands-public.s3.amazonaws.com/analysis_data
  PYTHONUNBUFFERED: '1'

jobs:
  wait-for-r-transfer-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require successful outcome-free R transfer freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$FREEZE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FREEZE_RUN" --jq .conclusion)"
          test "$conclusion" = "success"

  p1p1-eoe:
    needs: wait-for-r-transfer-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'

      - name: Download frozen P1P1 preflight
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-p1p1-eoe-preflight
          path: preflight
          run-id: ${{ env.P1P1_PREFLIGHT_RUN }}
          github-token: ${{ github.token }}

      - name: Download exact frozen EOE 13k boundary
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-q-guard10-20k-cohort-EOE
          path: cohort
          run-id: ${{ env.CONFIRM_RUN }}
          github-token: ${{ github.token }}

      - name: Download exact EOE draft archive
        run: |
          set -euo pipefail
          mkdir -p raw
          curl --fail --location --retry 5 --retry-delay 3 \
            --output raw/EOE.csv.gz \
            "$BASE/draft_data/draft_data_public.EOE.PremierDraft.csv.gz"
          echo "1dd9d1baf31fa56e06bbd2d9d9bb8c2c87cf342bc15872b5a30dbe9d4ecab648  raw/EOE.csv.gz" | sha256sum -c -

      - name: Run frozen 91,377-draft EOE P1P1 study
        run: |
          mkdir -p results/p1p1-eoe
          python3 research/contextual_value_p1p1_eoe_primary_final.py \
            --draft-archive raw/EOE.csv.gz \
            --cohort-manifest cohort/cohort.json \
            --card-metadata preflight/card-metadata.json \
            --metadata-report preflight/preflight-report.json \
            --output results/p1p1-eoe/report.json

      - name: Assert frozen P1P1 boundaries
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('results/p1p1-eoe/report.json'))
          assert r['phase']=='p1p1_eoe_randomized_pack_primary_final'
          assert r['primary_changed_after_outcomes'] is False
          assert r['frozen_sample_size']==91377
          assert len(r['primary_cards'])==10
          assert r['archive_sha256']=='1dd9d1baf31fa56e06bbd2d9d9bb8c2c87cf342bc15872b5a30dbe9d4ecab648'
          assert r['nonterminal_or_retired_records_excluded'] is False
          assert r['collation_diagnostics']['rarity_composition_available'] is True
          assert r['collation_diagnostics']['booster_slot_provenance_available'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-p1p1-eoe-primary-final
          path: results/p1p1-eoe/
          retention-days: 90

  r-confirmation-45k:
    needs: wait-for-r-transfer-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2'

      - name: Download exact frozen R transfer contexts
        uses: actions/download-artifact@v4
        with:
          pattern: contextual-value-v1-r-independent-confirmation-freeze-*
          path: frozen
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}

      - name: Verify aggregate transfer freeze is present and outcome-free
        run: |
          python3 - <<'PY'
          import json
          p='frozen/contextual-value-v1-r-independent-confirmation-freeze-aggregate/freeze-aggregate.json'
          r=json.load(open(p))
          assert r['confirmation_outcomes_opened'] is False
          assert set(r['environments'])=={'FIN','TDM','DFT'}
          for e in ('FIN','TDM','DFT'):
            assert r['environments'][e]['context_sha256']
          PY

      - name: Download exact FIN/TDM/DFT draft archives
        run: |
          set -euo pipefail
          mkdir -p raw
          for E in FIN TDM DFT; do
            curl --fail --location --retry 5 --retry-delay 3 \
              --output "raw/$E.csv.gz" \
              "$BASE/draft_data/draft_data_public.$E.PremierDraft.csv.gz"
          done
          echo "9d5b2a3e908bb8daf0ea6e951097714b651546370a5c852893dc90a1f2f6ab8b  raw/FIN.csv.gz" | sha256sum -c -
          echo "831ba8bc4be5eabe140fac00a8e6eaded3f3f931685be8f91403ad9cfde5cbf5  raw/TDM.csv.gz" | sha256sum -c -
          echo "7812d16e0de78ff7a69faf9981f7ff03be4dfc618a86f14369424ec2204580cd  raw/DFT.csv.gz" | sha256sum -c -

      - name: Score exact frozen R-LCB confirmation on 45k outcomes
        run: |
          mkdir -p results/r-confirmation
          python3 research/contextual_value_r_confirmation_outcome.py \
            --frozen-context FIN=frozen/contextual-value-v1-r-independent-confirmation-freeze-FIN/frozen-evaluation-context.npz \
            --frozen-context TDM=frozen/contextual-value-v1-r-independent-confirmation-freeze-TDM/frozen-evaluation-context.npz \
            --frozen-context DFT=frozen/contextual-value-v1-r-independent-confirmation-freeze-DFT/frozen-evaluation-context.npz \
            --draft-archive FIN=raw/FIN.csv.gz \
            --draft-archive TDM=raw/TDM.csv.gz \
            --draft-archive DFT=raw/DFT.csv.gz \
            --output results/r-confirmation/report.json

      - name: Assert frozen R confirmation boundaries
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('results/r-confirmation/report.json'))
          assert r['phase']=='R_independent_confirmation_frozen_policy'
          assert r['drafts_total']==45000
          assert r['drafts_per_environment']==15000
          assert r['environments']==['FIN','TDM','DFT']
          assert r['primary_estimator'].startswith('paired cap20 DR')
          assert r['planning_effect_wins']==0.03
          assert r['production_change_authorized'] is False
          assert r['prior_R_development_result_changed'] is False
          assert len(r['hidden_confounding']['grid'])==8
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-r-independent-confirmation-45k-final
          path: results/r-confirmation/
          retention-days: 90

  completion-gate:
    needs: [p1p1-eoe, r-confirmation-45k]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Both frozen outcome studies completed successfully; durable repo/issue reporting remains separate."
