name: Deploy Pack 1 API

on:
  push:
    branches: [feature/leaderboards-engagement, main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack1-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare repository secrets are not configured; skipping deployment."
          fi
      - name: Test Pack 1
        run: npm test
      - name: Resolve or create D1
        if: steps.cloudflare.outputs.configured == 'true'
        run: node worker/resolve-d1.mjs
      - name: Apply D1 schema
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4.127.0 d1 execute pack1 --remote --file=worker/schema.sql --config=worker/wrangler.toml
      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4.127.0 deploy --config=worker/wrangler.toml --minify
      - name: Verify API
        if: steps.cloudflare.outputs.configured == 'true'
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 https://pack1-api.planitnow.us/health | grep '"ok":true'
