name: a-regret-later-null-calibration-756

on:
  push:
    branches:
      - research/a-regret-null-calibration-756
    paths:
      - research/A-REGRET-NULL-CALIBRATION-RUN-LATER-756.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PRERUN_RUN: '36451550413'
  BASE: https://17lands-public.s3.amazonaws.com/analysis_data
  PYTHONUNBUFFERED: '1'

jobs:
  calibrate:
    name: later-null-${{ matrix.expansion }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - expansion: FIN
            draft_sha: 9d5b2a3e908bb8daf0ea6e951097714b651546370a5c852893dc90a1f2f6ab8b
            game_sha: f6452e622976f66dd5420c55741da5b246c7e8d25d63c080e728635e1741a6a6
            retained_run: '36587913521'
            retained_artifact: a-regret-later-FIN
          - expansion: TDM
            draft_sha: 831ba8bc4be5eabe140fac00a8e6eaded3f3f931685be8f91403ad9cfde5cbf5
            game_sha: e2e679168818d67d812972343ba541d626d0f57140bc22955e09dd07bc2086e4
            retained_run: '36587913521'
            retained_artifact: a-regret-later-TDM
          - expansion: DFT
            draft_sha: 7812d16e0de78ff7a69faf9981f7ff03be4dfc618a86f14369424ec2204580cd
            game_sha: 734325afbe5c023245e7769fab66c88dcf241407666becb06b956d7fee13a28b
            retained_run: '36587913521'
            retained_artifact: a-regret-later-DFT
          - expansion: MSH
            draft_sha: 64100d71db77e0f0ef8ba893b259a1024eb6d15816db337c7758e7d96bc29cf7
            game_sha: 8a6bd93a5d50554a3d87703e93624d09e638dc6dd03eda12be9c3f2925484edf
            retained_run: '36602844254'
            retained_artifact: a-regret-later-recovery-MSH
          - expansion: SOS
            draft_sha: df6220d8941e99b7264a54a7a7427096246ee6510057a83d4c9424b472761853
            game_sha: 1be513933918ca243c137af0314aae099c721c408786c9cb56f08027d9b113fb
            retained_run: '36602844254'
            retained_artifact: a-regret-later-recovery-SOS

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2'

      - name: Materialize final #756 later-pick analyzer semantics
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin e966e4d7c92aeb1b3e86ccbe3dea469f1ee72c77
          git show e966e4d7c92aeb1b3e86ccbe3dea469f1ee72c77:research/one_time/a_regret_later.py.gz.b64 \
            | base64 -d | gzip -d > research/a_regret_later_base_runtime.py
          python research/one_time/a_regret_later_recovery_patch.py \
            research/a_regret_later_base_runtime.py research/a_regret_later_frozen_runtime.py
          python -m py_compile research/a_regret_later_frozen_runtime.py research/a_regret_later_null_calibration.py research/a_regret_null_common.py

      - name: Download exact retained #529 prior-use ledger
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-r-independent-confirmation-prerun
          path: prior
          run-id: ${{ env.PRERUN_RUN }}
          github-token: ${{ github.token }}

      - name: Download retained #756 later-pick artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.retained_artifact }}
          path: retained
          run-id: ${{ matrix.retained_run }}
          github-token: ${{ github.token }}

      - name: Download and verify exact public archives
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
          DRAFT_SHA: ${{ matrix.draft_sha }}
          GAME_SHA: ${{ matrix.game_sha }}
        run: |
          set -euo pipefail
          mkdir -p raw
          curl --fail --location --retry 5 --retry-delay 3 \
            --output raw/draft.csv.gz \
            "$BASE/draft_data/draft_data_public.$EXPANSION.PremierDraft.csv.gz"
          curl --fail --location --retry 5 --retry-delay 3 \
            --output raw/game.csv.gz \
            "$BASE/game_data/game_data_public.$EXPANSION.PremierDraft.csv.gz"
          echo "$DRAFT_SHA  raw/draft.csv.gz" | sha256sum -c -
          echo "$GAME_SHA  raw/game.csv.gz" | sha256sum -c -

      - name: Run synthetic later-pick null calibration
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
        run: |
          set -euo pipefail
          mkdir -p "results/$EXPANSION"
          python research/a_regret_later_null_calibration.py \
            --expansion "$EXPANSION" \
            --draft-archive raw/draft.csv.gz \
            --game-archive raw/game.csv.gz \
            --spent-ledger prior/spent-draft-ledger.json.gz \
            --reserve-json prior/reserve.json \
            --frozen-analyzer research/a_regret_later_frozen_runtime.py \
            --retained-result-dir retained \
            --output-dir "results/$EXPANSION"

      - name: Assert synthetic-only boundary
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
        run: |
          python - <<'PY'
          import json, os
          e=os.environ['EXPANSION']
          r=json.load(open(f'results/{e}/later-null-environment.json'))
          assert r['outcome_columns_read']==[]
          assert r['a_reconstruction']['outcome_columns_read']==[]
          assert r['a_validation']['checked_rows']>0
          assert r['replicates']>=10
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: later-null-calibration-${{ matrix.expansion }}
          path: results/${{ matrix.expansion }}/
          retention-days: 90

  aggregate:
    needs: calibrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: later-null-calibration-*
          path: sets
      - name: Aggregate later-pick null calibration
        run: |
          mkdir -p results
          python research/a_regret_later_null_aggregate.py \
            --input-root sets \
            --output results/later-null-calibration-aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: later-null-calibration-aggregate-756
          path: results/later-null-calibration-aggregate.json
          retention-days: 90
