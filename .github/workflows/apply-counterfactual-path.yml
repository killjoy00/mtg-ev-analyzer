name: apply-counterfactual-path

on:
  push:
    branches: [feature/counterfactual-pack-paths]
    paths:
      - scripts/apply_counterfactual_path_patch.py
      - .github/workflows/apply-counterfactual-path.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python scripts/apply_counterfactual_path_patch.py
      - name: Run tests
        run: npm test
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js worker/core.mjs worker/index.js package.json
          if git diff --cached --quiet; then
            echo 'Source already patched.'
            exit 0
          fi
          git commit -m 'Condition Full Pack scoring on the player path'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
