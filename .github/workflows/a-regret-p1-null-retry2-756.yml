name: a-regret-p1-null-retry2-756

on:
  push:
    branches:
      - research/a-regret-null-calibration-756
    paths:
      - .github/workflows/a-regret-p1-null-retry2-756.yml

permissions:
  actions: read
  contents: read

env:
  PRERUN_RUN: '36451550413'
  ORIGINAL_P1_RUN: '36583791463'
  BASE: https://17lands-public.s3.amazonaws.com/analysis_data
  PYTHONUNBUFFERED: '1'

jobs:
  p1:
    name: p1-null-retry2-${{ matrix.expansion }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - expansion: FIN
            draft_sha: 9d5b2a3e908bb8daf0ea6e951097714b651546370a5c852893dc90a1f2f6ab8b
            game_sha: f6452e622976f66dd5420c55741da5b246c7e8d25d63c080e728635e1741a6a6
          - expansion: TDM
            draft_sha: 831ba8bc4be5eabe140fac00a8e6eaded3f3f931685be8f91403ad9cfde5cbf5
            game_sha: e2e679168818d67d812972343ba541d626d0f57140bc22955e09dd07bc2086e4
          - expansion: DFT
            draft_sha: 7812d16e0de78ff7a69faf9981f7ff03be4dfc618a86f14369424ec2204580cd
            game_sha: 734325afbe5c023245e7769fab66c88dcf241407666becb06b956d7fee13a28b
          - expansion: MSH
            draft_sha: 64100d71db77e0f0ef8ba893b259a1024eb6d15816db337c7758e7d96bc29cf7
            game_sha: 8a6bd93a5d50554a3d87703e93624d09e638dc6dd03eda12be9c3f2925484edf
          - expansion: SOS
            draft_sha: df6220d8941e99b7264a54a7a7427096246ee6510057a83d4c9424b472761853
            game_sha: 1be513933918ca243c137af0314aae099c721c408786c9cb56f08027d9b113fb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2'
      - name: Materialize exact frozen P1P1 analyzer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin d121aa4b63f738ea039e15a21f839d97cbafb427
          git show d121aa4b63f738ea039e15a21f839d97cbafb427:research/one_time/a_regret_p1p1.py.gz.b64 | base64 -d | gzip -d > /tmp/a_regret_p1p1_frozen.py
          python -m py_compile /tmp/a_regret_p1p1_frozen.py
      - uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-r-independent-confirmation-prerun
          path: prior
          run-id: ${{ env.PRERUN_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: a-regret-p1p1-${{ matrix.expansion }}
          path: original
          run-id: ${{ env.ORIGINAL_P1_RUN }}
          github-token: ${{ github.token }}
      - name: Download and verify exact archives
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
          DRAFT_SHA: ${{ matrix.draft_sha }}
          GAME_SHA: ${{ matrix.game_sha }}
        run: |
          set -euo pipefail
          mkdir -p raw
          curl --fail --location --retry 5 --retry-delay 3 --output raw/draft.csv.gz "$BASE/draft_data/draft_data_public.$EXPANSION.PremierDraft.csv.gz"
          curl --fail --location --retry 5 --retry-delay 3 --output raw/game.csv.gz "$BASE/game_data/game_data_public.$EXPANSION.PremierDraft.csv.gz"
          echo "$DRAFT_SHA  raw/draft.csv.gz" | sha256sum -c -
          echo "$GAME_SHA  raw/game.csv.gz" | sha256sum -c -
      - name: Run synthetic-only calibration
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
        run: |
          set -euo pipefail
          mkdir -p "results/$EXPANSION"
          PYTHONPATH="$PWD/scripts:$PWD/research" python research/a_regret_p1p1_null_calibration_756.py \
            --frozen-analyzer /tmp/a_regret_p1p1_frozen.py \
            --expansion "$EXPANSION" \
            --draft-archive raw/draft.csv.gz \
            --game-archive raw/game.csv.gz \
            --spent-ledger prior/spent-draft-ledger.json.gz \
            --reserve-json prior/reserve.json \
            --original-regret-rows original/regret-rows.jsonl.gz \
            --output-dir "results/$EXPANSION"
      - uses: actions/upload-artifact@v4
        with:
          name: a-regret-p1-null-cal-${{ matrix.expansion }}
          path: results/${{ matrix.expansion }}/
          retention-days: 90
