name: Pack One Lab private editorial review

on:
  schedule:
    # Both Central offsets; the worker checks local weekday/hour for DST.
    # Tue prepares the pinned pilot evidence; Wed–Fri handle reviews/revisions.
    - cron: '12 12-23 * * 2-5'
    - cron: '12 0 * * 3-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-one-lab-private-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/main' && vars.PACK1_LAB_REVIEW_ENABLED == 'true'
    environment: pack-one-lab-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run private review-only pilot
        run: node scripts/pack-one-lab-weekly.mjs
        env:
          PACK1_LAB_REVIEW_ENABLED: 'true'
          PACK1_LAB_DATABASE_URL: ${{ secrets.PACK1_LAB_DATABASE_URL }}
          PACK1_LAB_AI_KEY: ${{ secrets.PACK1_LAB_AI_KEY }}
          PACK1_LAB_WRITER_MODEL: ${{ vars.PACK1_LAB_WRITER_MODEL }}
          PACK1_LAB_REVIEWER_MODEL: ${{ vars.PACK1_LAB_REVIEWER_MODEL }}
          PACK1_LAB_RESEND_API_KEY: ${{ secrets.PACK1_LAB_RESEND_API_KEY }}
