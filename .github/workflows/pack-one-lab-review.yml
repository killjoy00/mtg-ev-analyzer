name: Pack One Lab private editorial review

on:
  schedule:
    # Both Central offsets; the worker checks local weekday/hour for DST.
    # Tue prepares existing Pack One corpus evidence; Wed–Fri handle reviews/revisions.
    - cron: '12 11-23 * * 2-5'
    - cron: '12 0 * * 3-6'
  workflow_dispatch:
    inputs:
      mode:
        description: Private review or private sample handoff
        type: choice
        default: review
        options:
          - review
          - samples

permissions:
  contents: read

concurrency:
  group: pack-one-lab-private-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'samples') || vars.PACK1_LAB_REVIEW_ENABLED == 'true')
    environment: pack-one-lab-review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Advance private ChatGPT editorial queue
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'samples'
        run: node scripts/pack-one-lab-weekly.mjs
        env:
          PACK1_LAB_REVIEW_ENABLED: 'true'
          PACK1_LAB_DATABASE_URL: ${{ secrets.PACK1_LAB_DATABASE_URL }}
          PACK1_LAB_RESEND_API_KEY: ${{ secrets.PACK1_LAB_RESEND_API_KEY }}

      - name: Advance five private sample articles
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'samples'
        run: node scripts/pack-one-lab-samples.mjs
        env:
          PACK1_LAB_SAMPLE_MODE: 'true'
          PACK1_LAB_DATABASE_URL: ${{ secrets.PACK1_LAB_DATABASE_URL }}
