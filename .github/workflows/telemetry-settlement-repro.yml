name: temporary retained telemetry settlement reproduction
# Focused disposable validation only; no gameplay capacity workload.
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/telemetry-settlement-repro.yml']
permissions:
  contents: read
concurrency:
  group: pack1-gateway-preview
  cancel-in-progress: false
jobs:
  repro:
    if: github.event.pull_request.draft == true && github.head_ref == 'fix/distributed-telemetry-settlement-poll-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify scoped preview access
        run: node scripts/edge-control.mjs preflight
      - name: Set disposable expiry
        id: expiry
        run: echo "expires_at=$(date -u --date '+30 minutes' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Create disposable Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: patient-shadow-91417882
          parent_branch: br-orange-feather-ayps8kep
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: telemetry-repro-${{ github.run_id }}-${{ github.run_attempt }}
          database: pack1
          role: pack1_owner
          suspend_timeout: 300
          expires_at: ${{ steps.expiry.outputs.expires_at }}
      - name: Install pinned deployment tools
        run: node .github/scripts/install-wrangler-tool.mjs "$RUNNER_TEMP/edge-tools" neon@4.17.4 esbuild@0.28.2
      - name: Prepare exact-revision isolated functions
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          ESBUILD_BIN: ${{ runner.temp }}/edge-tools/node_modules/.bin/esbuild
        run: |
          node --input-type=module -e "import {checkBranch} from './scripts/edge-control.mjs';checkBranch(process.env.PREVIEW_BRANCH);if(process.env.PREVIEW_CREATED!=='true')throw Error('Fresh isolated branch required');"
          node scripts/verify-neon-schema.mjs
          node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$GITHUB_SHA"
      - name: Deploy private preview
        env:
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          EDGE_TOOLS_DIR: ${{ runner.temp }}/edge-tools
        run: node scripts/edge-control.mjs deploy
      - name: Measure visibility curve and corrected collector
        env:
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {policy} from './scripts/launch-distributed-control.mjs';
          import {previewAccount,queryPreviewEvents,settlePreviewTelemetry} from './scripts/launch-distributed-telemetry.mjs';
          const key=process.env.PREVIEW_ACCESS_KEY,sha=process.env.GITHUB_SHA,token=process.env.CLOUDFLARE_EDGE_TOKEN;
          if(!/^[a-f0-9]{64}$/.test(key||'')||!/^[a-f0-9]{40}$/.test(sha||''))throw Error('missing preview evidence scope');
          const account=await previewAccount({token}),requests=[];
          const from=Date.now(),total=600,batch=10,interval=1000;
          for(let sent=0;sent<total;sent+=batch) {
            const target=from+(sent/batch)*interval;
            const wait=Math.max(0,target-Date.now());if(wait)await new Promise(r=>setTimeout(r,wait));
            await Promise.all(Array.from({length:batch},async()=>{
              const at=Date.now();requests.push({at});
              const response=await fetch('https://api-preview.packone.pro/draft/health?quick=1',{headers:{'x-pack1-preview-key':key},redirect:'error',signal:AbortSignal.timeout(10000)});
              const body=await response.json();
              if(response.status!==200||body.release_commit!==sha)throw Error('preview health mismatch');
            }));
          }
          const to=Date.now(),curve=[];
          for(const delay of [0,5000,15000,30000,60000,120000]) {
            const target=to+delay,wait=Math.max(0,target-Date.now());if(wait)await new Promise(r=>setTimeout(r,wait));
            const events=await queryPreviewEvents(fetch,token,account,from,to),matching=events.filter(e=>e.release===sha&&e.status===200&&e.route==='health');
            curve.push({delay_ms:delay,queried_at:new Date().toISOString(),retained_events:events.length,matching_health_events:matching.length,
              status_429:events.filter(e=>e.status===429).length,status_5xx:events.filter(e=>e.status>=500).length,wrong_release_events:events.filter(e=>e.release!==sha).length});
          }
          const settled=await settlePreviewTelemetry({reports:[{requests}],sha,from,to,policy,account,token,fetcher:fetch,clock:Date.now,sleep:ms=>new Promise(r=>setTimeout(r,ms))});
          const sanitized={from:new Date(from).toISOString(),to:new Date(to).toISOString(),client_requests:requests.length,curve,
            corrected_collector:{passed:settled.passed,settlement_seconds:settled.settlement_seconds,timeout_seconds:settled.timeout_seconds,checks:settled.checks,
              bins:settled.bins.map(({from,to,client_requests,retained_events,required_events,failures,passed})=>({from,to,client_requests,retained_events,required_events,failures,passed}))}};
          fs.mkdirSync('artifacts/telemetry-repro',{recursive:true});fs.writeFileSync('artifacts/telemetry-repro/result.json',JSON.stringify(sanitized,null,2));
          console.log(JSON.stringify({event:'telemetry_settlement_repro',...sanitized}));
          if(!settled.passed)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetry-settlement-repro
          path: artifacts/telemetry-repro/result.json
          retention-days: 7
      - name: Disable private preview
        if: always() && steps.neon.outputs.created == 'true'
        run: node scripts/edge-control.mjs disable
      - name: Delete disposable Neon branch
        if: always() && steps.neon.outputs.created == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: patient-shadow-91417882
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
      - name: Verify cleanup
        if: always() && steps.neon.outputs.created == 'true'
        env:
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: node scripts/launch-distributed-setup.mjs cleanup
