name: Capacity development source checkpoint
on:
  push:
    branches: ['chatgpt/distributed-capacity-629']
    paths: ['.github/capacity-source-patch.json']
permissions:
  contents: write
jobs:
  checkpoint:
    if: "!startsWith(github.event.head_commit.message, 'Apply validated capacity source')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply checksum-bound public source patch on this development branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/chatgpt/distributed-capacity-629'
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          envelope=json.loads(pathlib.Path('.github/capacity-source-patch.json').read_text())
          raw=gzip.decompress(base64.b64decode(envelope['payload']))
          assert hashlib.sha256(raw).hexdigest()==envelope['sha256']
          files=json.loads(raw)
          allowed={'scripts/launch-alert.mjs','scripts/launch-distributed-bundle.mjs','scripts/launch-distributed-collect.mjs','scripts/launch-distributed-fixtures.mjs','scripts/launch-distributed-run.mjs','scripts/launch-distributed-control.mjs','scripts/launch-distributed-core.mjs','scripts/launch-distributed-player.mjs','scripts/launch-distributed-policy.json','scripts/launch-distributed-setup.mjs','scripts/launch-distributed-telemetry.mjs','tests/launch-distributed-capacity.test.mjs','docs/reports/DISTRIBUTED-CAPACITY-629.md'}
          assert set(files)==allowed
          for name,item in files.items():
            p=pathlib.Path(name)
            observed=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
            assert observed==item['before'],name
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(item['content'])
          PY
      - name: Run executable capacity and monitoring regression tests
        run: node --test tests/launch-distributed-capacity.test.mjs tests/launch-alert.test.mjs tests/launch-controls.test.mjs
      - name: Full JavaScript regressions on Node 24
        run: npm run test:js
      - name: Commit only validated non-workflow source on the owned branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/launch-alert.mjs scripts/launch-distributed* tests/launch-distributed-capacity.test.mjs docs/reports/DISTRIBUTED-CAPACITY-629.md
          git rm .github/capacity-source-patch.json
          git commit -m 'Apply validated capacity source for #629'
          git push origin HEAD:chatgpt/distributed-capacity-629
