name: production Auth binding guard

on:
  workflow_run:
    workflows: ['production launch telemetry and usage alert']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-auth-binding-guard
  cancel-in-progress: true

jobs:
  guard:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production Auth branch binding
        run: node scripts/production-auth-binding-guard.mjs
