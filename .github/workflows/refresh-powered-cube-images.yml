name: refresh Pack One card images
run-name: refresh Pack One card images / ${{ inputs.request_id || 'manual' }}

# Image maintenance is an explicit operation, never a side effect of a code merge.
# Keep this workflow path stable: the Draft Run API pins its OIDC identity.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Fixed release request identifier used only to identify this run'
        type: string
        required: false
        default: manual
      code_commit:
        description: 'Optional reviewed main commit whose image-maintenance code must run'
        type: string
        required: false
        default: ''
      mode:
        description: 'Image maintenance scope'
        type: choice
        required: false
        default: full
        options:
          - full
          - targeted
      card_name:
        description: 'Exact served card name for targeted repair'
        type: string
        required: false
        default: ''
      environments:
        description: 'Comma-separated exact environment ids for targeted repair'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

concurrency:
  group: packone-corpus-mutation
  cancel-in-progress: false

jobs:
  refresh:
    if: inputs.mode != 'targeted'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEV_IMPORT_API: https://br-twilight-hill-ayffyd2b-draftrunapi.compute.c-5.us-east-2.aws.neon.tech
      PROD_IMPORT_API: https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve reviewed image-maintenance revision
        shell: bash
        env:
          CODE_COMMIT: ${{ inputs.code_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ -n "$CODE_COMMIT" ]]; then
            [[ "$CODE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$CODE_COMMIT" origin/main
            git reset --hard "$CODE_COMMIT"
          else
            git reset --hard origin/main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Hydrate replay shards from R2
        run: bash scripts/r2_replay_shards.sh hydrate

      - name: Normalize all served cards to deterministic main art
        run: python scripts/refresh_card_images.py

      - name: Run full test suite
        run: REQUIRE_REPLAY_SHARDS=1 npm test

      - name: Audit all production datasets
        run: python scripts/audit_datasets.py --fail-on-error

      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-image-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            generated/card-image-refresh/*.json
            generated/card-image-refresh-report.json

      - name: Verify marked, matching backend releases
        run: node scripts/verify-image-refresh-release.mjs "${{ inputs.code_commit }}"

      - name: Publish normalized replay shards to R2
        run: bash scripts/r2_replay_shards.sh upload

      - name: Refresh development Draft Run image metadata
        run: node scripts/refresh_card_backend_images.mjs "$DEV_IMPORT_API"

      - name: Verify development gameplay
        run: |
          set -euo pipefail
          commit=$(curl -fsS --max-time 30 "$DEV_IMPORT_API/health?quick=1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).release_commit))")
          node tests/release-functions-smoke.mjs br-twilight-hill-ayffyd2b "$commit" --daily

      - name: Refresh production Draft Run image metadata
        run: |
          node scripts/verify-image-refresh-release.mjs "${{ inputs.code_commit }}"
          node scripts/refresh_card_backend_images.mjs "$PROD_IMPORT_API"

      - name: Verify production gameplay
        run: |
          set -euo pipefail
          commit=$(curl -fsS --max-time 30 "$PROD_IMPORT_API/health?quick=1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).release_commit))")
          node tests/release-functions-smoke.mjs br-orange-feather-ayps8kep "$commit" --daily

      - name: Publish refreshed card-image source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corpus/draft-run/*.json.gz corpus/draft-run/catalog.json corpus/draft-run/card-images.json
          if git diff --cached --quiet; then
            echo 'Pack One display metadata is already normalized.'
            exit 0
          fi
          git commit -m 'Refresh Pack One to main card art [card-images-refreshed]'

          publish_dir="$(mktemp -d "${RUNNER_TEMP}/card-image-publish.XXXXXX")"
          trap 'git worktree remove --force "$publish_dir"' EXIT
          git worktree add --detach "$publish_dir" HEAD
          git fetch origin main
          git -C "$publish_dir" rebase origin/main

          branch="automation/card-image-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$publish_dir" push origin "HEAD:refs/heads/$branch"
          echo "Generated card-image source branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "Open that branch as a pull request to main with the normal required checks." >> "$GITHUB_STEP_SUMMARY"

  repair:
    if: inputs.mode == 'targeted'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEV_IMPORT_API: https://br-twilight-hill-ayffyd2b-draftrunapi.compute.c-5.us-east-2.aws.neon.tech
      PROD_IMPORT_API: https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve reviewed image-maintenance revision
        shell: bash
        env:
          CODE_COMMIT: ${{ inputs.code_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ -n "$CODE_COMMIT" ]]; then
            [[ "$CODE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$CODE_COMMIT" origin/main
            git reset --hard "$CODE_COMMIT"
          else
            git reset --hard origin/main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Hydrate all replay shards for targeted audit
        run: bash scripts/r2_replay_shards.sh hydrate

      - name: Repair exact card image metadata
        env:
          CARD_NAME: ${{ inputs.card_name }}
          REPAIR_ENVIRONMENTS: ${{ inputs.environments }}
        run: python scripts/repair_card_image.py

      - name: Export validated targeted environments
        shell: bash
        run: |
          set -euo pipefail
          replay_sets="$(node -e "const fs=require('node:fs');const report=JSON.parse(fs.readFileSync('generated/card-image-repair/report.json','utf8'));process.stdout.write(report.environments.join(','))")"
          [[ -n "$replay_sets" ]]
          printf 'REPLAY_SETS=%s\n' "$replay_sets" >> "$GITHUB_ENV"

      - name: Run full test suite
        run: REQUIRE_REPLAY_SHARDS=1 npm test

      - name: Audit all production datasets
        run: python scripts/audit_datasets.py --fail-on-error

      - name: Verify marked, matching backend releases
        env:
          EXPECTED_COMMIT: ${{ inputs.code_commit }}
        run: node scripts/verify-image-refresh-release.mjs "$EXPECTED_COMMIT"

      - name: Publish targeted replay shards to R2
        run: |
          bash scripts/r2_replay_shards.sh upload
          bash scripts/r2_replay_shards.sh verify

      - name: Repair development Draft Run image metadata
        env:
          CARD_IMAGE_BACKEND_STAGE: development-repair
          CARD_IMAGE_BACKEND_DIAGNOSTICS: generated/card-image-repair/backend/development-repair.json
        run: node scripts/repair_card_backend_image.mjs "$DEV_IMPORT_API"

      - name: Verify development targeted image metadata and gameplay
        env:
          CARD_IMAGE_BACKEND_STAGE: development-verify
          CARD_IMAGE_BACKEND_DIAGNOSTICS: generated/card-image-repair/backend/development-verify.json
        run: |
          set -euo pipefail
          node scripts/repair_card_backend_image.mjs "$DEV_IMPORT_API" --verify
          commit=$(curl -fsS --max-time 30 "$DEV_IMPORT_API/health?quick=1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).release_commit))")
          node tests/release-functions-smoke.mjs br-twilight-hill-ayffyd2b "$commit" --daily

      - name: Re-verify marked, matching backend releases
        env:
          EXPECTED_COMMIT: ${{ inputs.code_commit }}
        run: node scripts/verify-image-refresh-release.mjs "$EXPECTED_COMMIT"

      - name: Repair production Draft Run image metadata
        env:
          CARD_IMAGE_BACKEND_STAGE: production-repair
          CARD_IMAGE_BACKEND_DIAGNOSTICS: generated/card-image-repair/backend/production-repair.json
        run: node scripts/repair_card_backend_image.mjs "$PROD_IMPORT_API"

      - name: Verify production targeted image metadata and gameplay
        env:
          CARD_IMAGE_BACKEND_STAGE: production-verify
          CARD_IMAGE_BACKEND_DIAGNOSTICS: generated/card-image-repair/backend/production-verify.json
        run: |
          set -euo pipefail
          node scripts/repair_card_backend_image.mjs "$PROD_IMPORT_API" --verify
          commit=$(curl -fsS --max-time 30 "$PROD_IMPORT_API/health?quick=1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).release_commit))")
          node tests/release-functions-smoke.mjs br-orange-feather-ayps8kep "$commit" --daily

      - name: Publish repaired card-image source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corpus/draft-run/*.json.gz corpus/draft-run/catalog.json corpus/draft-run/card-images.json
          if git diff --cached --quiet; then
            echo 'Targeted Pack One display metadata source is already normalized.'
            exit 0
          fi
          git commit -m 'Repair targeted Pack One card art [card-images-repaired]'

          publish_dir="$(mktemp -d "${RUNNER_TEMP}/card-image-repair-publish.XXXXXX")"
          trap 'git worktree remove --force "$publish_dir"' EXIT
          git worktree add --detach "$publish_dir" HEAD
          git fetch origin main
          git -C "$publish_dir" rebase origin/main

          branch="automation/card-image-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$publish_dir" push origin "HEAD:refs/heads/$branch"
          echo "Generated targeted card-image source branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "Open that branch as a pull request to main with the normal required checks." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-image-repair-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            generated/card-image-repair/report.json
            generated/card-image-repair/backend/*.json
