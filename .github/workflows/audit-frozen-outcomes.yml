name: Audit frozen Premier source outcomes
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-source-audit
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35289844612
          name: verified-premier-trophies-35289844612-1
          path: generated/frozen-v7
      - run: python scripts/audit_frozen_outcomes.py --prepare generated/frozen-v7 --out generated/outcome-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: outcome-inputs
          path: generated/outcome-inputs
          retention-days: 90
  audit:
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        set: [blb, bro, dft, dmu, dsk, ecl, eoe, fdn, fin, hbg, hob, ktk, lci, ltr, mh3, mid, mkm, mom, msh, neo, one, otj, pio, powered-cube, sir, snc, sos, tdm, tla, tmt, vow, woe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: outcome-inputs
          path: generated/outcome-inputs
      - name: Audit every included trajectory against the pinned public archive
        env:
          AUDIT_SET: ${{ matrix.set }}
        run: python -u scripts/audit_frozen_outcomes.py --input "generated/outcome-inputs/$AUDIT_SET.json" --out generated/outcome-audit
      - uses: actions/upload-artifact@v4
        with:
          name: outcome-audit-${{ matrix.set }}
          path: generated/outcome-audit/*.json
          retention-days: 90
  report:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: outcome-audit-*
          path: generated/outcome-audit
          merge-multiple: true
      - name: Verify complete audit coverage
        run: |
          python - <<'PY'
          import pathlib,json,collections
          reports=[json.loads(p.read_text()) for p in pathlib.Path('generated/outcome-audit').glob('*.json') if not p.name.endswith('.gz.json')]
          assert len(reports)==32 and len({r['set'] for r in reports})==32
          counts=collections.Counter()
          for r in reports:counts.update(r['approved_outcomes'])
          result={'sets':reports,'approved_outcomes':dict(counts),'blocked_sources':sum(len(r['blocked_sources']) for r in reports),'production_changed':False}
          pathlib.Path('generated/outcome-audit/report.json').write_text(json.dumps(result,separators=(',',':')))
          print(json.dumps({k:v for k,v in result.items() if k!='sets'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-outcomes-report
          path: generated/outcome-audit/report.json
          retention-days: 90
