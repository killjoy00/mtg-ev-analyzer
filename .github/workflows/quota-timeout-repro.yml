name: isolated quota timeout stage reproduction
on:
  pull_request:
    paths: ['edge/quota-benchmark.mjs', 'scripts/quota-benchmark.mjs',
      'scripts/quota-timeout-repro.mjs', 'tests/quota-timeout-repro.test.mjs',
      'tests/quota-timeout-runtime.mjs', '.github/workflows/quota-timeout-repro.yml']
  push:
    branches: [main]
    paths: ['edge/quota-benchmark.mjs', 'scripts/quota-benchmark.mjs',
      'scripts/quota-timeout-repro.mjs', 'tests/quota-timeout-repro.test.mjs',
      'tests/quota-timeout-runtime.mjs', '.github/workflows/quota-timeout-repro.yml']
permissions:
  contents: read
concurrency:
  group: pack1-synthetic-quota-timeout
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate synthetic quota timeout fault-path invariants
        run: node --test tests/quota-timeout-repro.test.mjs tests/quota-benchmark.test.mjs
      - name: Install pinned Workers tools
        run: node .github/scripts/install-wrangler-tool.mjs "$RUNNER_TEMP/quota-timeout-tools" esbuild@0.28.2
      - name: Verify synthetic-only controls in Workers/SQLite
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/quota-timeout-tools
        run: |
          "$EDGE_TOOLS_DIR/node_modules/.bin/esbuild" edge/quota-benchmark.mjs --bundle --format=esm --platform=browser --external:node:net --outfile="$RUNNER_TEMP/quota-timeout-worker.mjs"
          node tests/quota-timeout-runtime.mjs "$RUNNER_TEMP/quota-timeout-worker.mjs"
  reproduce:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Cloudflare Worker tool
        run: node .github/scripts/install-wrangler-tool.mjs "$RUNNER_TEMP/quota-timeout-tools"
      - name: Run bounded 5-second quota dispatch/handler/ack fault reproduction
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/quota-timeout-tools
        run: node scripts/quota-timeout-repro.mjs
      - name: Verify removal of run-owned synthetic Worker and namespaces
        if: always()
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/quota-timeout-tools
        run: node scripts/quota-benchmark.mjs cleanup
