name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Hydrate replay shards from R2 for local browser tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/r2_replay_shards.sh hydrate
      - name: Start static site
        run: |
          nohup python -m http.server 4173 >/tmp/pack1-http.log 2>&1 &
          echo $! > /tmp/pack1-http.pid
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ -o /dev/null
      - name: Run browser regression
        run: node tests/e2e.mjs
      - name: Run Daily / Set Practice regression
        run: node tests/practice-e2e.mjs
      - name: Run Player Profile / Progression regression
        run: node tests/profile-e2e.mjs
      - name: Run ten-decision Draft Run regression
        run: node tests/draft-run-e2e.mjs
      - name: Run Powered Cube ten-decision regression
        run: PACK1_TEST_ENVIRONMENT=powered-cube node tests/draft-run-e2e.mjs
      - name: Run account browser contract
        run: node tests/account-e2e.mjs
      - name: Run admin reporting browser contract
        run: node tests/admin-e2e.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack1-ui-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Stop static site
        if: always()
        run: |
          if [ -f /tmp/pack1-http.pid ]; then kill "$(cat /tmp/pack1-http.pid)" || true; fi
