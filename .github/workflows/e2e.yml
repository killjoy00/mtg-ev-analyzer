name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore: ['.github/model-rollout-request.json']

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          output="$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/ci-change-scope.mjs --force broad --github-output "$output"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if ! git fetch --no-tags origin main:refs/remotes/origin/main; then
              echo '::warning::Unable to fetch origin/main; running broad validation.'
              node scripts/ci-change-scope.mjs --force broad --github-output "$output"
              exit 0
            fi
            if ! base="$(git merge-base origin/main "$PR_HEAD_SHA")"; then
              echo '::warning::Unable to compute merge base; running broad validation.'
              node scripts/ci-change-scope.mjs --force broad --github-output "$output"
              exit 0
            fi
            node scripts/ci-change-scope.mjs --base "$base" --head "$PR_HEAD_SHA" --github-output "$output"
            exit 0
          fi
          if [[ "$PUSH_BEFORE" =~ ^[a-f0-9]{40}$ && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            node scripts/ci-change-scope.mjs --base "$PUSH_BEFORE" --head "$GITHUB_SHA" --github-output "$output"
          else
            echo '::warning::Push base is unavailable; running broad validation.'
            node scripts/ci-change-scope.mjs --force broad --github-output "$output"
          fi

      - name: Confirm browser validation not required
        if: steps.scope.outputs.browser_mode == 'none'
        shell: bash
        run: |
          echo "No browser suite is relevant for CI profile ${{ steps.scope.outputs.profile }}."
          printf '%s\n' "${{ steps.scope.outputs.profile }}" > "$RUNNER_TEMP/ci-selected-browser-validation"

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.browser_mode == 'core' || steps.scope.outputs.browser_mode == 'full'
        with:
          python-version: '3.12'

      - name: Install focused browser dependency
        if: steps.scope.outputs.browser_mode == 'publication' || steps.scope.outputs.browser_mode == 'core'
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Install full browser dependencies
        if: steps.scope.outputs.browser_mode == 'full'
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium webkit

      - name: Run focused publication browser smoke
        if: steps.scope.outputs.browser_mode == 'publication'
        env:
          PUBLICATION_KIND: ${{ steps.scope.outputs.publication_kind }}
          PUBLICATION_SLUG: ${{ steps.scope.outputs.publication_slug }}
          PUBLICATION_ACTION: ${{ steps.scope.outputs.publication_action }}
        run: |
          node --import ./tests/e2e-production-guard.mjs tests/publication-route-e2e.mjs
          printf '%s\n' publication > "$RUNNER_TEMP/ci-selected-browser-validation"

      - name: Start static site
        if: steps.scope.outputs.browser_mode == 'core' || steps.scope.outputs.browser_mode == 'full'
        run: |
          nohup python -m http.server 4173 >/tmp/pack1-http.log 2>&1 &
          echo $! > /tmp/pack1-http.pid
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ -o /dev/null

      - name: Run lightweight static browser regression
        if: steps.scope.outputs.browser_mode == 'core'
        run: |
          node --import ./tests/e2e-production-guard.mjs tests/e2e.mjs
          printf '%s\n' static > "$RUNNER_TEMP/ci-selected-browser-validation"

      - name: Run full affected browser regression
        if: steps.scope.outputs.browser_mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          node --import ./tests/e2e-production-guard.mjs tests/e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/sets-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/practice-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/practice-hub-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/practice-access-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/profile-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/home-today-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/home-auth-hydration-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/draft-run-e2e.mjs
          PACK1_TEST_ENVIRONMENT=powered-cube node --import ./tests/e2e-production-guard.mjs tests/draft-run-e2e.mjs
          PACK1_TEST_DAILY=1 node --import ./tests/e2e-production-guard.mjs tests/draft-run-e2e.mjs
          PACK1_TEST_DAILY=1 PACK1_TEST_ENVIRONMENT=powered-cube node --import ./tests/e2e-production-guard.mjs tests/draft-run-e2e.mjs
          PACK1_TEST_SELECTION_VERSION=first-pack-v2 node --import ./tests/e2e-production-guard.mjs tests/draft-run-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/account-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/auth-context-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/email-verification-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/patreon-activation-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/password-recovery-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/credential-management-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/account-deletion-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/ads-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/admin-e2e.mjs
          node --import ./tests/e2e-production-guard.mjs tests/corpus-readiness-e2e.mjs
          printf '%s\n' "${{ steps.scope.outputs.profile }}" > "$RUNNER_TEMP/ci-selected-browser-validation"

      - name: Upload UI screenshots
        if: always() && (steps.scope.outputs.browser_mode == 'core' || steps.scope.outputs.browser_mode == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: pack1-ui-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore

      - name: Stop static site
        if: always()
        run: |
          if [ -f /tmp/pack1-http.pid ]; then kill "$(cat /tmp/pack1-http.pid)" || true; fi

      - name: Verify selected browser validation completed
        if: always()
        shell: bash
        env:
          EXPECTED_PROFILE: ${{ steps.scope.outputs.profile }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ci-selected-browser-validation" || {
            echo "::error::No selected browser validation path completed for profile $EXPECTED_PROFILE."
            exit 1
          }
          actual="$(cat "$RUNNER_TEMP/ci-selected-browser-validation")"
          [[ "$actual" == "$EXPECTED_PROFILE" ]] || {
            echo "::error::Completed browser validation '$actual' does not match selected profile '$EXPECTED_PROFILE'."
            exit 1
          }
          echo "Selected browser validation passed: $EXPECTED_PROFILE"
