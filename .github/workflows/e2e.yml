name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Start static site
        run: |
          python -m http.server 4173 >/tmp/pack1-http.log 2>&1 &
          echo $! > /tmp/pack1-http.pid
      - name: Run browser regression
        run: node tests/e2e.mjs
      - name: Debug Cube launch on browser failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, channel: 'chrome' });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          page.on('pageerror', (error) => console.log('PAGE_ERROR', error.message));
          page.on('console', (message) => {
            if (['error', 'warning'].includes(message.type())) console.log('BROWSER_CONSOLE', message.type(), message.text());
          });
          page.on('request', (request) => {
            if (request.url().includes('/data/powered-cube/')) console.log('CUBE_REQUEST', request.url());
          });
          page.on('response', (response) => {
            if (response.url().includes('/data/powered-cube/')) console.log('CUBE_RESPONSE', response.status(), response.url());
          });
          page.on('requestfailed', (request) => {
            if (request.url().includes('/data/powered-cube/')) console.log('CUBE_REQUEST_FAILED', request.url(), request.failure()?.errorText || 'unknown');
          });
          await page.route('https://br-orange-feather-ayps8kep-pack1growth.compute.c-5.us-east-2.aws.neon.tech/**', async (route) => {
            const path = new URL(route.request().url()).pathname;
            let status = 200;
            let body = { ok: true };
            if (path === '/v1/session') body = { token: 'p1_00000000-0000-4000-8000-000000000000.e2e', playerId: '00000000-0000-4000-8000-000000000000', displayName: 'Pack Player' };
            else if (path === '/v1/stats') body = { summary: { games: 0, average_score: 0, best_score: 0, challenge_wins: 0, challenge_losses: 0, challenge_ties: 0 }, daily: { daily_plays: 0, daily_days: 0, daily_best: 0 }, bySet: [], byMode: [], recent: [] };
            else if (path === '/v1/account/daily-dates') body = { dates: [] };
            else if (path === '/v1/account/session') { status = 401; body = { error: 'Account session required.' }; }
            await route.fulfill({ status, contentType: 'application/json', body: JSON.stringify(body) });
          });
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded' });
          await page.locator('[data-powered-cube-section="1"]').waitFor({ timeout: 10000 });
          const href = await page.getByRole('button', { name: 'New Cube Run', exact: true }).getAttribute('data-cube-href');
          console.log('CUBE_HREF', href);
          await page.getByRole('button', { name: 'New Cube Run', exact: true }).click();
          await new Promise((resolve) => setTimeout(resolve, 15000));
          console.log('CUBE_FINAL_URL', page.url());
          await browser.close().catch(() => null);
          NODE
      - name: Dump static-site requests after browser failure
        if: failure()
        run: |
          echo '--- static server tail ---'
          tail -n 120 /tmp/pack1-http.log || true
      - name: Run Daily / Set Practice regression
        run: node tests/practice-e2e.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack1-ui-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Stop static site
        if: always()
        run: |
          if [ -f /tmp/pack1-http.pid ]; then kill "$(cat /tmp/pack1-http.pid)" || true; fi
