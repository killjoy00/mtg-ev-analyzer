name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore: ['.github/model-rollout-request.json']

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify complete change set
        id: scope
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="$GITHUB_SHA"
          base_sha=''
          force_full=false
          changed_files=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            head_sha="$PR_HEAD_SHA"
            if ! git fetch --no-tags origin main:refs/remotes/origin/main; then
              echo '::warning::Unable to fetch origin/main; forcing broad validation.'
              force_full=true
            elif ! base_sha="$(git merge-base origin/main "$head_sha")"; then
              echo '::warning::Unable to compute merge base; forcing broad validation.'
              force_full=true
            else
              mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$PUSH_BEFORE_SHA" =~ ^[a-f0-9]{40}$ || "$PUSH_BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              force_full=true
            else
              base_sha="$PUSH_BEFORE_SHA"
              if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then git fetch --no-tags origin "$base_sha" || force_full=true; fi
              if [[ "$force_full" == false ]]; then mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha"); fi
            fi
          else
            force_full=true
          fi
          fallback_full() {
            {
              echo 'plan=full'
              echo 'unit_plan=full'
              echo 'browser_plan=full'
              echo 'hydrate_replays=true'
              echo 'dataset_audit=true'
              echo 'build_bundles=true'
              echo 'ci_contracts=true'
              echo 'publication_kind='
              echo 'publication_slug='
              echo 'browser_groups='
              echo 'reason=classifier failure; broad validation'
            } >> "$GITHUB_OUTPUT"
          }
          if [[ "$force_full" == true ]]; then
            if ! node scripts/ci-change-classifier.mjs --full --github-output; then
              echo '::warning::Classifier failed while selecting broad validation; using shell fail-closed outputs.'
              fallback_full
            fi
          else
            printf 'Changed files from %s to %s:\n' "$base_sha" "$head_sha"
            printf ' - %s\n' "${changed_files[@]}"
            if ! node scripts/ci-change-classifier.mjs --github-output "${changed_files[@]}"; then
              echo '::warning::Classifier failed; forcing broad validation.'
              fallback_full
            fi
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Summarize selected browser validation
        env:
          PLAN: ${{ steps.scope.outputs.browser_plan }}
          GROUPS: ${{ steps.scope.outputs.browser_groups }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "Browser plan: $PLAN ($REASON)" >> "$GITHUB_STEP_SUMMARY"
          [[ -z "$GROUPS" ]] || echo "Browser groups: $GROUPS" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate publication diff and generated outputs
        id: publication
        if: steps.scope.outputs.plan == 'publication'
        env:
          CI_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          CI_HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/ci-publication-validate.mjs --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --github-output
          node scripts/generate-campaign-links.mjs --check
          node scripts/check-creator-challenges.mjs
      - name: Install browser test dependency
        if: steps.scope.outputs.browser_plan != 'none'
        env:
          BROWSER_PLAN: ${{ steps.scope.outputs.browser_plan }}
          BROWSER_GROUPS: ${{ steps.scope.outputs.browser_groups }}
        run: |
          npm ci --no-audit --no-fund
          if [[ "$BROWSER_PLAN" == full || ",$BROWSER_GROUPS," == *,account,* ]]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Start static site
        if: steps.scope.outputs.browser_plan != 'none'
        run: |
          nohup python -m http.server 4173 >/tmp/pack1-http.log 2>&1 &
          echo $! > /tmp/pack1-http.pid
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ -o /dev/null
      - name: Run focused publication browser smoke
        if: steps.scope.outputs.browser_plan == 'publication'
        env:
          CI_PUBLICATION_KIND: ${{ steps.publication.outputs.kind }}
          CI_PUBLICATION_SLUG: ${{ steps.publication.outputs.slug }}
          CI_PUBLICATION_ACTION: ${{ steps.publication.outputs.action }}
        run: |
          set -euo pipefail
          node --import ./tests/e2e-production-guard.mjs tests/publication-route-e2e.mjs
          touch "$RUNNER_TEMP/browser-validation-complete"
      - name: Run static presentation browser smoke
        if: steps.scope.outputs.browser_plan == 'presentation'
        run: |
          set -euo pipefail
          node scripts/run-browser-tests.mjs --presentation
          touch "$RUNNER_TEMP/browser-validation-complete"
      - name: Run scoped application browser groups
        if: steps.scope.outputs.browser_plan == 'groups'
        env:
          BROWSER_GROUPS: ${{ steps.scope.outputs.browser_groups }}
        run: |
          set -euo pipefail
          test -n "$BROWSER_GROUPS"
          node scripts/run-browser-tests.mjs --groups "$BROWSER_GROUPS"
          touch "$RUNNER_TEMP/browser-validation-complete"
      - name: Run full browser regression
        if: steps.scope.outputs.browser_plan == 'full'
        run: |
          set -euo pipefail
          node scripts/run-browser-tests.mjs --full
          touch "$RUNNER_TEMP/browser-validation-complete"
      - name: Confirm no browser suite is required
        if: steps.scope.outputs.browser_plan == 'none'
        run: |
          echo 'No browser behavior is affected by this change set.'
          touch "$RUNNER_TEMP/browser-validation-complete"
      - name: Upload UI screenshots
        if: always() && (steps.scope.outputs.browser_plan == 'full' || steps.scope.outputs.browser_plan == 'groups' || steps.scope.outputs.browser_plan == 'presentation')
        uses: actions/upload-artifact@v4
        with:
          name: pack1-ui-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - name: Stop static site
        if: always() && steps.scope.outputs.browser_plan != 'none'
        run: |
          if [ -f /tmp/pack1-http.pid ]; then kill "$(cat /tmp/pack1-http.pid)" || true; fi
      - name: Verify selected browser validation completed
        if: always()
        run: |
          test -f "$RUNNER_TEMP/browser-validation-complete" || { echo '::error::Selected browser validation did not complete successfully.'; exit 1; }
