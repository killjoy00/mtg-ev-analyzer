name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Start static site
        run: |
          python -m http.server 4173 >/tmp/pack1-http.log 2>&1 &
          echo $! > /tmp/pack1-http.pid
      - name: Run browser regression
        run: node tests/e2e.mjs
      - name: Run Daily / Set Practice regression
        run: node tests/practice-e2e.mjs
      - name: Run Player Profile / Progression regression
        run: node tests/profile-e2e.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack1-ui-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Stop static site
        if: always()
        run: |
          if [ -f /tmp/pack1-http.pid ]; then kill "$(cat /tmp/pack1-http.pid)" || true; fi
