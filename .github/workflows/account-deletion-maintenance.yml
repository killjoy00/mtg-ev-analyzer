name: account deletion maintenance

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pack1-account-deletion-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtain short-lived maintenance identity
        id: oidc
        shell: bash
        env:
          AUDIENCE: pack-one-account-deletion-maintenance
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          response=$(curl -fsS --max-time 20 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          token=$(node -e 'const x=JSON.parse(process.argv[1]);if(!x.value)process.exit(1);process.stdout.write(x.value)' "$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Resume deletions, sweep expired verification rows, and detect stuck work
        id: run
        shell: bash
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
          URL: https://br-orange-feather-ayps8kep-pack1growth.compute.c-5.us-east-2.aws.neon.tech/internal/account-deletion-maintenance
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 60 -o "$RUNNER_TEMP/maintenance.json" -w '%{http_code}'             -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' "$URL")
          cat "$RUNNER_TEMP/maintenance.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/maintenance.json','utf8'));
          const attention=Array.isArray(data.attention)?data.attention:[];
          const lines=[
            '# Account deletion maintenance',
            '',
            `- deletion enabled: ${Boolean(data.deletion_enabled)}`,
            `- verification sweep enabled: ${Boolean(data.sweep_enabled)}`,
            `- expired verification rows swept: ${data.swept_expired_verifications??'disabled'}`,
            `- deletion operations advanced: ${Array.isArray(data.advanced)?data.advanced.length:0}`,
            `- operations requiring attention: ${attention.length}`,
          ];
          if(attention.length) {
            lines.push('','| operation | state | age (s) | attempts | error |','|---|---|---:|---:|---|');
            for(const row of attention)lines.push(`| ${row.operation_id} | ${row.state} | ${row.age_seconds} | ${row.attempts} | ${row.error_code||''} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          if(attention.length)process.exitCode=2;
          NODE
          if [[ "$status" != 200 ]]; then
            echo "::error::Deletion maintenance requires operator attention (HTTP $status)."
            exit 1
          fi
