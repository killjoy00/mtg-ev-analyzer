name: Issue 179A isolated recovery QA

on:
  push:
    branches:
      - ops/179a-recovery-qa

permissions:
  contents: read

jobs:
  recovery-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run one-shot isolated recovery capability suite
        shell: bash
        env:
          QA_URL: https://br-super-snow-b5ufhq30-qa179arecovery.compute.c-7.us-east-2.aws.neon.tech/
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 300 -o /tmp/qa.json -w '%{http_code}' "$QA_URL")"
          if [ "$status" != 200 ]; then
            echo "qa_http_status=$status"
            cat /tmp/qa.json
            exit 1
          fi
          QA_FILE=/tmp/qa.json node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync(process.env.QA_FILE,'utf8'));
          if(data.ok!==true) throw new Error('QA suite did not report success');
          console.log(JSON.stringify({ok:true,checks:data.checks},null,2));
          NODE
