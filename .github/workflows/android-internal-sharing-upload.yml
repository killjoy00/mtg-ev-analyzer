name: Upload Android internal beta

on:
  push:
    branches:
      - 'chatgpt/pack-one-mobile-v2-internal-sharing'
    paths:
      - '.github/play-internal-share-request.txt'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  upload:
    name: upload verified AAB to Internal App Sharing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve verified bundle artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(tr -d '[:space:]' < .github/play-internal-share-request.txt)"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Request must contain one workflow run ID." >&2; exit 1; }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          event="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.event||"")' "$run_json")"
          conclusion="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.conclusion||"")' "$run_json")"
          head_branch="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.head_branch||"")' "$run_json")"

          [[ "$event" == "pull_request" ]] || { echo "Requested run was not a pull-request validation." >&2; exit 1; }
          [[ "$conclusion" == "success" ]] || { echo "Requested run did not complete successfully." >&2; exit 1; }
          [[ "$head_branch" == "chatgpt/pack-one-mobile-v2-internal-sharing" ]] || {
            echo "Requested run came from unexpected branch: $head_branch" >&2
            exit 1
          }

          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(node -e 'const v=JSON.parse(process.argv[1]); const a=(v.artifacts||[]).find(x=>x.name==="pack-one-production-aab"&&!x.expired); if(!a)process.exit(2); process.stdout.write(String(a.id))' "$artifacts")"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/pack-one-aab.zip
          mkdir -p /tmp/pack-one-aab
          unzip -q /tmp/pack-one-aab.zip -d /tmp/pack-one-aab
          bundle="$(find /tmp/pack-one-aab -name '*.aab' -type f -print -quit)"
          test -n "$bundle"
          test -s "$bundle"
          echo "BUNDLE_PATH=$bundle" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Re-verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs "$BUNDLE_PATH" | tee /tmp/jarsigner.txt
          grep -q "jar verified" /tmp/jarsigner.txt

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play Internal App Sharing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: pro.packone.app
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/play-internal-sharing-response.json"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$BUNDLE_PATH" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/internalappsharing/$PACKAGE_NAME/artifacts/bundle?uploadType=media")"

          response="$(cat "$response_file")"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Google Play Internal App Sharing upload failed with HTTP $http_code." >&2
            node -e 'const v=JSON.parse(process.argv[1]); console.error(JSON.stringify(v.error || v, null, 2))' "$response" || cat "$response_file" >&2
            exit 1
          fi

          download_url="$(node -e 'const v=JSON.parse(process.argv[1]); if(!v.downloadUrl) process.exit(2); process.stdout.write(v.downloadUrl)' "$response")"
          sha256="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.sha256 || "")' "$response")"

          echo "::notice title=Pack One Internal App Sharing::$download_url"
          {
            echo "## Pack One Android internal beta"
            echo
            echo "- Source validation run: `$SOURCE_RUN_ID`"
            echo "- Package: `$PACKAGE_NAME`"
            echo "- SHA-256: `$sha256`"
            echo "- Install link: $download_url"
          } >> "$GITHUB_STEP_SUMMARY"
