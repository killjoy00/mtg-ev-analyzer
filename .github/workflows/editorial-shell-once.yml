name: Editorial shell once

on:
  push:
    branches:
      - feature/editorial-monetization-shell
    paths:
      - scripts/editorial_monetization_sprint.py
      - .github/workflows/editorial-shell-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate editorial and monetization shell
        run: python scripts/editorial_monetization_sprint.py
      - name: Run test suite
        run: npm test
      - name: Check generated HTML links and whitespace
        run: |
          git diff --check
          test -f sitemap.xml
          test -f disclosure/index.html
          test -f sets/msh/index.html
          test -f tcgplayer.mjs
      - name: Commit generated release
        run: |
          rm scripts/editorial_monetization_sprint.py .github/workflows/editorial-shell-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build the Pack One editorial monetization shell"
          git push origin HEAD:feature/editorial-monetization-shell
