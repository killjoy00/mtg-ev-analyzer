name: Pool-aware skill contrast - recovery and component audit

on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-skill-recovery.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pool-aware-skill-recovery
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python scripts/pool_aware_skill_recovery.py --self-test
          python scripts/test_pool_aware_archive.py
  recover:
    needs: preflight
    name: Recover - ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        set: [woe, bro, dmu, hbg, mom, neo, one, sir, snc]
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      AWS_DEFAULT_REGION: auto
      RESEARCH_SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Restore original pinned public archives
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u scripts/pool_aware_skill_recovery.py --stage restore --set "$RESEARCH_SET" --work artifacts/recovery/input --output artifacts/recovery/result
      - name: Freeze metadata and windows
        run: python -u scripts/pool_aware_skill_recovery.py --stage inputs --set "$RESEARCH_SET" --work artifacts/recovery/input --output artifacts/recovery/result
      - name: Measure with complete-source deduplication and explicit chronology classification
        run: python -u scripts/pool_aware_skill_recovery.py --stage measure --set "$RESEARCH_SET" --work artifacts/recovery/input --output artifacts/recovery/result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-recovery-report-${{ matrix.set }}
          retention-days: 90
          if-no-files-found: error
          path: |
            artifacts/recovery/result/report.json
            artifacts/recovery/input/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-recovery-transfer-${{ matrix.set }}
          retention-days: 1
          if-no-files-found: error
          path: artifacts/recovery/result/
  ablate:
    needs: preflight
    name: Component audit - ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        set: [dft, fra, ltr, tdm, powered-cube]
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      AWS_DEFAULT_REGION: auto
      RESEARCH_SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Restore frozen fit and exact metadata snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45942026287
          name: pool-aware-expansion-report-${{ matrix.set }}
          path: artifacts/ablation/prior
      - name: Restore exact retained public source archives
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u scripts/pool_aware_skill_recovery.py --stage restore --set "$RESEARCH_SET" --work artifacts/ablation/input --output artifacts/ablation/result
      - name: Pin previous source hashes, windows and rules
        run: python -u scripts/pool_aware_skill_recovery.py --stage ablation-inputs --set "$RESEARCH_SET" --previous artifacts/ablation/prior --work artifacts/ablation/input --output artifacts/ablation/result
      - name: Compare frozen full, card-only, context-only and card-plus-elite-context arms
        run: python -u scripts/pool_aware_skill_recovery.py --stage ablation --set "$RESEARCH_SET" --previous artifacts/ablation/prior --work artifacts/ablation/input --output artifacts/ablation/result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-ablation-${{ matrix.set }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/ablation/result/ablation.json
  aggregate:
    if: always() && needs.preflight.result == 'success' && needs.recover.result != 'cancelled' && needs.ablate.result != 'cancelled'
    needs: [preflight, recover, ablate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45942026287
          pattern: pool-aware-expansion-transfer-*
          path: artifacts/combined/original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pool-aware-recovery-transfer-*
          path: artifacts/combined/recovered
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pool-aware-ablation-*
          path: artifacts/combined/ablations
      - name: Report strict and legacy coverage separately, paired outcomes and component diagnostics
        run: python -u scripts/pool_aware_skill_recovery.py --stage combine --previous artifacts/combined/original --recovered artifacts/combined/recovered --ablations artifacts/combined/ablations --output artifacts/combined/combined-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-recovery-combined-report
          retention-days: 90
          if-no-files-found: error
          path: artifacts/combined/combined-report.json
