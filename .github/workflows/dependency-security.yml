name: dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/dependency-security.yml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/dependency-security.yml'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Audit mobile runtime dependencies
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/dependency-audit"
          cd mobile
          set +e
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/dependency-audit/mobile-runtime.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/dependency-audit/mobile-runtime.status"

      - name: Audit complete mobile dependency tree
        shell: bash
        run: |
          set -u
          cd mobile
          set +e
          npm audit --audit-level=high --json > "$RUNNER_TEMP/dependency-audit/mobile-full.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/dependency-audit/mobile-full.status"

      - name: Audit pinned workflow tools
        shell: bash
        run: |
          set -euo pipefail
          overall=0
          while read -r name spec; do
            dir="$RUNNER_TEMP/dependency-audit/tool-$name"
            mkdir -p "$dir"
            npm init --yes --prefix "$dir" >/dev/null
            npm install --prefix "$dir" --package-lock-only --ignore-scripts --no-fund "$spec" >/dev/null
            set +e
            npm audit --prefix "$dir" --omit=dev --audit-level=high --json > "$RUNNER_TEMP/dependency-audit/tool-$name.json"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNNER_TEMP/dependency-audit/tool-$name.status"
            if (( status != 0 )); then overall=1; fi
          done <<'EOF'
          neon4 neon@4.17.4
          neon5 neon@5.0.0
          esbuild esbuild@0.28.2
          wrangler wrangler@4.143.0
          playwright playwright@1.63.0
          EOF
          printf '%s\n' "$overall" > "$RUNNER_TEMP/dependency-audit/workflow-tools.status"

      - name: Summarize audit evidence
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const dir=path.join(process.env.RUNNER_TEMP,'dependency-audit');
          const reports=fs.existsSync(dir)?fs.readdirSync(dir).filter(name=>name.endsWith('.json')).sort():[];
          const rows=[];
          for(const name of reports){
            let data={};
            try{data=JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'));}catch{}
            const v=data.metadata?.vulnerabilities||{};
            rows.push({
              report:name,
              info:Number(v.info||0),
              low:Number(v.low||0),
              moderate:Number(v.moderate||0),
              high:Number(v.high||0),
              critical:Number(v.critical||0),
              total:Number(v.total||0),
            });
          }
          const lines=['## Pack One dependency security audit','',`Source: \`${process.env.GITHUB_SHA}\``,'','| Report | Info | Low | Moderate | High | Critical | Total |','| --- | ---: | ---: | ---: | ---: | ---: | ---: |'];
          for(const r of rows) lines.push(`| ${r.report} | ${r.info} | ${r.low} | ${r.moderate} | ${r.high} | ${r.critical} | ${r.total} |`);
          lines.push('','Runtime and pinned workflow-tool high/critical findings are blocking. Full-tree mobile findings are retained separately so dev-only tooling risk stays visible without being confused with shipped runtime risk.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE

      - name: Upload machine-readable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-dependency-security
          path: ${{ runner.temp }}/dependency-audit
          if-no-files-found: error
          retention-days: 30

      - name: Enforce runtime and workflow-tool baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(cat "$RUNNER_TEMP/dependency-audit/mobile-runtime.status")"
          tools="$(cat "$RUNNER_TEMP/dependency-audit/workflow-tools.status")"
          full="$(cat "$RUNNER_TEMP/dependency-audit/mobile-full.status")"
          if [[ "$full" != 0 ]]; then
            echo "::warning::The complete mobile dependency tree has high/critical advisories; inspect the retained report to distinguish dev-only findings."
          fi
          [[ "$runtime" == 0 ]] || { echo "::error::High/critical advisory or audit failure in shipped mobile runtime dependencies."; exit 1; }
          [[ "$tools" == 0 ]] || { echo "::error::High/critical advisory or audit failure in pinned workflow tooling."; exit 1; }
