name: Android internal app sharing

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-internal-sharing.yml'
  push:
    branches:
      - 'chatgpt/pack-one-mobile-v2-internal-sharing'
    paths:
      - '.github/play-internal-share-request.txt'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-internal-sharing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: build production Android bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production mobile config
        run: npm test
      - name: Generate production Android project
        env:
          CI: '1'
          PACKONE_BUILD_PROFILE: production
        run: npx expo prebuild --platform android --clean
      - name: Build release app bundle
        working-directory: mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Verify bundle is signed
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" | tee /tmp/jarsigner.txt
          grep -q "jar verified" /tmp/jarsigner.txt
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-production-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - id: auth
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play Internal App Sharing
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: pro.packone.app
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          bundle="app/build/outputs/bundle/release/app-release.aab"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$bundle" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/internalappsharing/$PACKAGE_NAME/artifacts/bundle?uploadType=media")"

          download_url="$(node -e 'const v=JSON.parse(process.argv[1]); if(!v.downloadUrl) process.exit(2); process.stdout.write(v.downloadUrl)' "$response")"
          sha256="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.sha256 || "")' "$response")"

          echo "::notice title=Pack One Internal App Sharing::$download_url"
          {
            echo "## Pack One Android internal build"
            echo
            echo "Google Play Internal App Sharing upload succeeded."
            echo
            echo "- Package: `$PACKAGE_NAME`"
            echo "- SHA-256: `$sha256`"
            echo "- Install link: $download_url"
          } >> "$GITHUB_STEP_SUMMARY"
