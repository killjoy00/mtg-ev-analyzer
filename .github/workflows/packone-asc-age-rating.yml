name: Pack One ASC age rating and screenshots
on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-asc-age-rating.yml"]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply age rating and inspect screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os,time,json,jwt,requests,sys
          info_id="382f1166-fe38-45d0-a3dd-0edb6cc3c684"
          loc_id="cc3dfd3b-b29c-4387-8f4b-a2df20f5c49a"
          kid=os.environ["ASC_KEY_ID"].strip(); iss=os.environ["ASC_ISSUER_ID"].strip()
          key=os.environ["ASC_KEY_P8"].replace("\\n","\n").strip(); now=int(time.time())
          tok=jwt.encode({"iss":iss,"iat":now-5,"exp":now+900,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          H={"Authorization":f"Bearer {tok}","Content-Type":"application/json"}
          B="https://api.appstoreconnect.apple.com/v1"

          r=requests.get(f"{B}/appInfos/{info_id}/ageRatingDeclaration",headers=H,timeout=30)
          r.raise_for_status()
          rid=r.json()["data"]["id"]
          attrs={
            "advertising":False,
            "alcoholTobaccoOrDrugUseOrReferences":"NONE",
            "contests":"FREQUENT",
            "gambling":False,
            "gamblingSimulated":"NONE",
            "gunsOrOtherWeapons":"INFREQUENT",
            "healthOrWellnessTopics":False,
            "lootBox":False,
            "medicalOrTreatmentInformation":"NONE",
            "messagingAndChat":False,
            "parentalControls":False,
            "profanityOrCrudeHumor":"NONE",
            "ageAssurance":False,
            "sexualContentGraphicAndNudity":"NONE",
            "sexualContentOrNudity":"NONE",
            "socialMedia":False,
            "socialMediaAgeRestricted":False,
            "horrorOrFearThemes":"INFREQUENT",
            "matureOrSuggestiveThemes":"NONE",
            "unrestrictedWebAccess":False,
            "userGeneratedContent":True,
            "violenceCartoonOrFantasy":"INFREQUENT",
            "violenceRealisticProlongedGraphicOrSadistic":"NONE",
            "violenceRealistic":"NONE",
            "ageRatingOverrideV2":"NONE",
            "koreaAgeRatingOverride":"NONE"
          }
          p=requests.patch(f"{B}/ageRatingDeclarations/{rid}",headers=H,json={
            "data":{"type":"ageRatingDeclarations","id":rid,"attributes":attrs}
          },timeout=30)
          print("age_rating_patch_http="+str(p.status_code))
          if p.status_code not in (200,204):
              print(p.text[:1000]); sys.exit(1)

          v=requests.get(f"{B}/appInfos/{info_id}/ageRatingDeclaration",headers=H,timeout=30)
          v.raise_for_status()
          va=v.json()["data"]["attributes"]
          print("age_rating_nondefault="+json.dumps({k:va.get(k) for k in attrs if va.get(k) not in (False,None,"NONE")},sort_keys=True,separators=(",",":")))

          ss=requests.get(f"{B}/appStoreVersionLocalizations/{loc_id}/appScreenshotSets",headers=H,params={"limit":50},timeout=30)
          print("screenshot_sets_http="+str(ss.status_code))
          if ss.status_code==200:
              sets=ss.json().get("data",[])
              print("screenshot_set_count="+str(len(sets)))
              total=0
              for s in sets:
                  x=requests.get(f"{B}/appScreenshotSets/{s['id']}/appScreenshots",headers=H,params={"limit":50},timeout=30)
                  count=len(x.json().get("data",[])) if x.status_code==200 else -1
                  total += max(count,0)
                  dtype=s.get("attributes",{}).get("screenshotDisplayType")
                  print("screenshot_set="+str(dtype)+" count="+str(count))
              print("screenshot_total="+str(total))
          PY
