name: Pack One ASC final safe verify
on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-asc-age-rating.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify non-sensitive App Store state
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os,time,json,jwt,requests
          kid=os.environ["ASC_KEY_ID"].strip(); iss=os.environ["ASC_ISSUER_ID"].strip()
          key=os.environ["ASC_KEY_P8"].replace("\\n","\n").strip(); now=int(time.time())
          tok=jwt.encode({"iss":iss,"iat":now-5,"exp":now+900,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          H={"Authorization":f"Bearer {tok}"}; B="https://api.appstoreconnect.apple.com/v1"
          def g(path,params=None):
              r=requests.get(B+path,headers=H,params=params,timeout=30)
              print("GET",path,r.status_code)
              return r.json() if r.status_code<300 else None

          app=g("/apps/6814318676")
          info=g("/appInfos/382f1166-fe38-45d0-a3dd-0edb6cc3c684")
          al=g("/appInfoLocalizations/73302616-4346-4b3c-8540-140a431cb6a0")
          v=g("/appStoreVersions/04b0ee74-7d94-41e4-8463-79524972fce6")
          vl=g("/appStoreVersionLocalizations/cc3dfd3b-b29c-4387-8f4b-a2df20f5c49a")
          ar=g("/appInfos/382f1166-fe38-45d0-a3dd-0edb6cc3c684/ageRatingDeclaration")
          usage=g("/apps/6814318676/appDataUsages",{"limit":200})
          pub=g("/apps/6814318676/appDataUsagesPublishState")

          print("FINAL_SAFE_VERIFY_BEGIN")
          print("content_rights="+str(app["data"]["attributes"].get("contentRightsDeclaration")))
          ia=info["data"]["attributes"]
          for k in ["appStoreAgeRating","australiaAgeRating","brazilAgeRating","brazilAgeRatingV2","franceAgeRating","koreaAgeRating"]:
              print(k+"="+str(ia.get(k)))
          aa=al["data"]["attributes"]
          print("subtitle="+str(aa.get("subtitle")))
          print("privacy_policy="+str(aa.get("privacyPolicyUrl")))
          va=v["data"]["attributes"]
          print("copyright="+str(va.get("copyright")))
          la=vl["data"]["attributes"]
          for k in ["description","keywords","marketingUrl","promotionalText","supportUrl","whatsNew"]:
              val=la.get(k)
              print(k+"="+(("SET" if val else "EMPTY") if k=="description" else str(val)))
          ra=ar["data"]["attributes"]
          nondefault={k:x for k,x in ra.items() if x not in (None,False,"NONE")}
          print("age_rating_nondefault="+json.dumps(nondefault,sort_keys=True,separators=(",",":")))
          print("privacy_usage_count="+str(len((usage or {}).get("data",[]))))
          if pub and pub.get("data"):
              print("privacy_published="+str(pub["data"]["attributes"].get("published")))
          else:
              print("privacy_published=unknown")
          print("FINAL_SAFE_VERIFY_END")
          PY
