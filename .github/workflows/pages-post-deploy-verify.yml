name: Pages post-deployment public allowlist
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-post-deploy-verify
  cancel-in-progress: false

jobs:
  live-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live public routes and private source exclusions
        run: node scripts/verify-pages-production.mjs --enforce
