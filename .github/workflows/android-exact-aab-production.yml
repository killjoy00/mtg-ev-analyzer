name: Android exact AAB Production release

on:
  push:
    branches: [main]
    paths:
      - '.github/android-exact-aab-production-request.json'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: android-exact-aab-production-release
  cancel-in-progress: false

jobs:
  release:
    name: upload and publish exact Android AAB to Production
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: pack-one-mobile-release
    env:
      PACKONE_ANDROID_PACKAGE: pro.packone.app
    steps:
      - uses: actions/checkout@v4

      - id: request
        name: Resolve reviewed exact-AAB release request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path('.github/android-exact-aab-production-request.json').read_text())
          expected={'operation','reason','source_run_id','source_artifact_id','source_sha','artifact_name','artifact_digest','version_code','track','data_safety_run_id'}
          if set(r) != expected:
              raise SystemExit(f'Invalid exact-AAB request keys: {sorted(r)}')
          if r.get('operation') != 'upload-exact-android-aab-production':
              raise SystemExit('Invalid exact-AAB release operation.')
          if not isinstance(r.get('reason'),str) or not r['reason'].strip():
              raise SystemExit('Release reason is required.')
          if r.get('artifact_name') != 'pack-one-play-signed-aab':
              raise SystemExit('Unexpected artifact name.')
          if str(r.get('track')) != 'production':
              raise SystemExit('Production AAB release must target production.')
          if not isinstance(r.get('data_safety_run_id'),int) or r['data_safety_run_id'] <= 0:
              raise SystemExit('A successful submitted Google Play Data safety run is required.')
          if not str(r.get('version_code','')).isdigit() or str(r['version_code']).startswith('0'):
              raise SystemExit('version_code must be a positive integer.')
          if not isinstance(r.get('source_run_id'),int) or r['source_run_id'] <= 0:
              raise SystemExit('source_run_id must be positive.')
          if not isinstance(r.get('source_artifact_id'),int) or r['source_artifact_id'] <= 0:
              raise SystemExit('source_artifact_id must be positive.')
          if not isinstance(r.get('source_sha'),str) or len(r['source_sha']) != 40:
              raise SystemExit('source_sha must be a full commit SHA.')
          if not isinstance(r.get('artifact_digest'),str) or not r['artifact_digest'].startswith('sha256:'):
              raise SystemExit('artifact_digest must be a sha256 digest.')
          for key in ['source_run_id','source_artifact_id','source_sha','artifact_name','artifact_digest','version_code','track','data_safety_run_id']:
              print(f"{key}={r[key]}")
          PY

      - name: Require current approved main and unchanged mobile source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse FETCH_HEAD)" ]] || {
            echo "Checked-out revision is no longer current main." >&2
            exit 1
          }
          source_sha="${{ steps.request.outputs.source_sha }}"
          git fetch --no-tags --depth=100 origin main
          git cat-file -e "$source_sha^{commit}"
          git show "${source_sha}:.github/android-production-bundle-request.json" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("android_admob") == "enabled", "The signed source build did not opt in to live Android AdMob"'
          changed="$(git diff --name-only "$source_sha" HEAD -- mobile/)"
          if [[ -n "$changed" ]]; then
            echo "Refusing to release stale Android artifact because mobile/ changed after source $source_sha:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          echo "Verified no mobile/ changes after exact artifact source $source_sha."

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify pinned GitHub artifact metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.request.outputs.source_artifact_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.request.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          headers={
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)
          repo=os.environ['GITHUB_REPOSITORY']
          run=get(f"https://api.github.com/repos/{repo}/actions/runs/{os.environ['SOURCE_RUN_ID']}")
          if run.get('name') != 'Android production bundle' or run.get('event') != 'push' or run.get('head_branch') != 'main':
              raise SystemExit('Signed Android AAB must come from the protected main push workflow, not a PR or manual build.')
          if run.get('conclusion') != 'success' or run.get('head_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit(f"Unexpected source run identity/state: conclusion={run.get('conclusion')} head_sha={run.get('head_sha')}")
          art=get(f"https://api.github.com/repos/{repo}/actions/artifacts/{os.environ['SOURCE_ARTIFACT_ID']}")
          if art.get('name') != os.environ['ARTIFACT_NAME']:
              raise SystemExit(f"Unexpected artifact name: {art.get('name')}")
          if art.get('expired') is True:
              raise SystemExit('Pinned Android AAB artifact has expired.')
          if art.get('digest') != os.environ['ARTIFACT_DIGEST']:
              raise SystemExit(f"Unexpected artifact digest: {art.get('digest')}")
          wr=art.get('workflow_run') or {}
          if str(wr.get('id')) != os.environ['SOURCE_RUN_ID'] or wr.get('head_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit(f"Artifact source run mismatch: {wr}")
          print('Verified pinned artifact metadata.')
          PY

      - name: Verify submitted AdMob Data safety run is from protected main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_SAFETY_RUN_ID: ${{ steps.request.outputs.data_safety_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          now=json.loads(Path('.github/google-play-data-safety-request.json').read_text())
          if now.get('mode')!='submit' or now.get('android_admob')!='enabled':
              raise SystemExit('Submitted AdMob Data safety is required before Production.')
          run_id=os.environ['DATA_SAFETY_RUN_ID']
          hdr={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run_id
          with urllib.request.urlopen(urllib.request.Request(url,headers=hdr)) as resp: run=json.load(resp)
          if run.get('name')!='Google Play Data Safety' or run.get('event')!='push' or run.get('conclusion')!='success':
              raise SystemExit('Data safety evidence requires a successful protected main push run.')
          sha=run.get('head_sha','')
          subprocess.run(['git','cat-file','-e',sha+'^{commit}'],check=True)
          saved=json.loads(subprocess.check_output(['git','show',sha+':.github/google-play-data-safety-request.json'],text=True))
          if saved.get('mode')!='submit' or saved.get('android_admob')!='enabled':
              raise SystemExit('Data safety evidence is a dry-run or ad-disabled request.')
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          print('Verified submitted Android AdMob Data safety run',run_id)
          PY

      - id: artifact
        name: Download and verify exact signed AAB
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ steps.request.outputs.source_artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.request.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/android-exact-aab.zip"
          out="$RUNNER_TEMP/android-exact-aab"
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             -o "$zip"
          expected="$(printf '%s' "$ARTIFACT_DIGEST" | sed 's/^sha256://')"
          actual="$(sha256sum "$zip" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || {
            echo "Artifact ZIP digest mismatch." >&2
            exit 1
          }
          mkdir -p "$out"
          unzip -q "$zip" -d "$out"
          count="$(find "$out" -type f -name '*.aab' | wc -l | tr -d ' ')"
          [[ "$count" == "1" ]] || {
            echo "Expected exactly one AAB in pinned artifact; found $count." >&2
            exit 1
          }
          aab="$(find "$out" -type f -name '*.aab' -print -quit)"
          signer="$(keytool -printcert -jarfile "$aab" | awk -F': ' '/SHA1:/{print $2; exit}')"
          expected_signer='83:BB:D7:ED:15:27:BA:BE:18:B6:E7:FD:92:F5:A3:50:BD:62:7B:2B'
          [[ "$signer" == "$expected_signer" ]] || {
            echo "Pinned AAB signer does not match registered Google Play upload certificate." >&2
            exit 1
          }
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          echo "Verified pinned AAB ZIP digest and upload certificate SHA-1."

      - id: auth
        name: Authenticate to Google Cloud and Google Play
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - id: upload
        name: Upload exact AAB to Google Play Internal Testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(node .github/scripts/play-exact-internal-release.mjs             "${{ steps.artifact.outputs.aab }}"             "${{ steps.request.outputs.version_code }}")"
          echo "$result"
          version="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.versionCode))' "$result")"
          [[ "$version" == "${{ steps.request.outputs.version_code }}" ]]
          echo "version_code=$version" >> "$GITHUB_OUTPUT"

      - name: Verify live links and Google Play app signing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-mobile-links.mjs
          node mobile/scripts/verify-play-signing.mjs "${{ steps.upload.outputs.version_code }}"

      - id: promote
        name: Submit exact AAB to existing Google Play Production track
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKONE_PRODUCTION_RELEASE_APPROVED: '1'
        shell: bash
        run: |
          set -euo pipefail
          result="$(node mobile/scripts/play-production-release.mjs "${{ steps.upload.outputs.version_code }}")"
          echo "$result"
          committed="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(v.committed)))' "$result")"
          release_status="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.releaseStatus))' "$result")"
          track="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.track))' "$result")"
          [[ "$committed" == "true" && "$release_status" == "completed" && "$track" == "production" ]]
          {
            echo "## Pack One Android public Production submission"
            printf -- '- Source run: `%s`\n' "${{ steps.request.outputs.source_run_id }}"
            printf -- '- Source revision: `%s`\n' "${{ steps.request.outputs.source_sha }}"
            printf -- '- Artifact ID: `%s`\n' "${{ steps.request.outputs.source_artifact_id }}"
            printf -- '- Artifact digest: `%s`\n' "${{ steps.request.outputs.artifact_digest }}"
            printf -- '- Version code: `%s`\n' "${{ steps.upload.outputs.version_code }}"
            echo "- Production track: completed, committed"
            echo "- Existing Production countries preserved"
            echo "- Submitted Android AdMob Data safety evidence: ${{ steps.request.outputs.data_safety_run_id }}"
            echo "- Google Play review/managed publishing may delay user visibility."
          } >> "$GITHUB_STEP_SUMMARY"
