name: release corpus admin 606
run-name: release corpus admin 606 exact 2d64266

# One-off guarded promotion for the reviewed #614 merge. The workflow builds
# one artifact set, proves it in development, then promotes those same bundles
# to production and exercises the authenticated live admin contract.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-corpus-admin-606.yml

permissions:
  contents: read

concurrency:
  group: deploy-neon-functions
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: patient-shadow-91417882
      RELEASE_COMMIT: 2d64266bb6a154b266f3a7ccdc61826f23e7994a
      DEV_BRANCH: br-twilight-hill-ayffyd2b
      PROD_BRANCH: br-orange-feather-ayps8kep
      PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
      PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
      PATREON_WEBHOOK_SECRET: ${{ secrets.PATREON_WEBHOOK_SECRET }}
      PACK1_RATE_LIMIT_SECRET: ${{ secrets.PACK1_RATE_LIMIT_SECRET }}
      PACK1_DELETION_ADMIN_EMAIL: ${{ secrets.PACK1_DELETION_ADMIN_EMAIL }}
      PACK1_DELETION_ADMIN_PASSWORD: ${{ secrets.PACK1_DELETION_ADMIN_PASSWORD }}
      PACK1_ACCOUNT_DELETE_RESEND_API_KEY: ${{ secrets.PACK1_ACCOUNT_DELETE_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve the reviewed release and required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY" || { echo '::error::NEON_API_KEY is missing.'; exit 1; }
          test ${#PACK1_RATE_LIMIT_SECRET} -ge 32 || { echo '::error::PACK1_RATE_LIMIT_SECRET is missing or too short.'; exit 1; }
          [[ "$PACK1_DELETION_ADMIN_EMAIL" == *@* ]] || { echo '::error::PACK1_DELETION_ADMIN_EMAIL is missing or malformed.'; exit 1; }
          test ${#PACK1_DELETION_ADMIN_PASSWORD} -ge 16 || { echo '::error::PACK1_DELETION_ADMIN_PASSWORD is missing or too short.'; exit 1; }
          [[ "$PACK1_ACCOUNT_DELETE_RESEND_API_KEY" == re_* && ${#PACK1_ACCOUNT_DELETE_RESEND_API_KEY} -gt 3 ]] || { echo '::error::PACK1_ACCOUNT_DELETE_RESEND_API_KEY is missing or malformed.'; exit 1; }
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Release SHA is malformed.'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          echo "Releasing reviewed commit $RELEASE_COMMIT"

      - name: Install pinned release tools
        run: npm install -g neon@4.17.4 esbuild@0.28.2

      - name: Preflight both database branches before any upload
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          for branch in "$DEV_BRANCH" "$PROD_BRANCH"; do
            connection=$(neon connection-string "$branch" --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
            echo "::add-mask::$connection"
            DATABASE_URL="$connection" node scripts/verify-neon-schema.mjs
            admin_count=$(psql "$connection" -v ON_ERROR_STOP=1 -Atc 'SELECT count(*) FROM pack1_admins')
            test "$admin_count" -ge 1 || { echo "::error::$branch has no Pack One admin identity for authenticated acceptance."; exit 1; }
            echo "$branch schema and admin preflight passed"
          done

      - name: Require the corrected static admin module before backend promotion
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --max-time 60 "https://packone.pro/admin/corpus.mjs?release=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-corpus.mjs"
          grep -Fq 'Serving revision' "$RUNNER_TEMP/live-corpus.mjs"
          grep -Fq 'Active serving' "$RUNNER_TEMP/live-corpus.mjs"
          grep -Fq 'Source snapshots' "$RUNNER_TEMP/live-corpus.mjs"
          echo 'Corrected corpus admin frontend is live.'

      - name: Check optional Patreon activation before any upload
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(node --input-type=module -e "import {validPatreonPolicy} from './patreon-policy.mjs';console.log(validPatreonPolicy())")
          echo "PATREON_RUNTIME_ENABLED=$enabled" >> "$GITHUB_ENV"
          if [[ "$enabled" == true ]]; then
            test -n "$PATREON_CLIENT_ID" && test -n "$PATREON_CLIENT_SECRET" && test -n "$PATREON_WEBHOOK_SECRET" || { echo '::error::Activated Patreon requires all runtime secrets.'; exit 1; }
          fi

      - name: Build and verify one immutable bundle set
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$RELEASE_COMMIT"
          find "$RUNNER_TEMP/pack1-bundles" -name index.mjs -print0 | sort -z | xargs -0 sha256sum | tee "$RUNNER_TEMP/bundle-sha256.txt"

      - name: Deploy the checked bundles to development
        shell: bash
        run: |
          set -euo pipefail
          while IFS=: read -r slug entry; do
            extra=()
            if [[ "$slug" == pack1growth ]]; then
              extra+=(--env "PACK1_RATE_LIMIT_SECRET=$PACK1_RATE_LIMIT_SECRET"
                --env "PACK1_DELETION_ADMIN_EMAIL=$PACK1_DELETION_ADMIN_EMAIL"
                --env "PACK1_DELETION_ADMIN_PASSWORD=$PACK1_DELETION_ADMIN_PASSWORD"
                --env "PACK1_ACCOUNT_DELETION_ENABLED=1"
                --env "PACK1_VERIFICATION_SWEEP_ENABLED=1")
            fi
            neon functions deploy "$slug" --src "$RUNNER_TEMP/pack1-bundles/$slug" --no-bundle \
              --project-id "$PROJECT_ID" --branch "$DEV_BRANCH" --runtime nodejs24 --wait "${extra[@]}"
          done < .github/neon-functions.txt

      - name: Prove the exact revision and all Daily flows in development
        run: node tests/release-functions-smoke.mjs "$DEV_BRANCH" "$RELEASE_COMMIT" --daily --settle --expect-deletion-email=false

      - name: Prove the authenticated corpus contract in development
        shell: bash
        env:
          TARGET_BRANCH: ${{ env.DEV_BRANCH }}
          CORPUS_URL: https://br-twilight-hill-ayffyd2b-draftrunapi.compute.c-5.us-east-2.aws.neon.tech/v1/admin/corpus
          CORPUS_FILE: ${{ runner.temp }}/corpus-development.json
        run: |
          set -euo pipefail
          connection=$(neon connection-string "$TARGET_BRANCH" --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          token=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          csrf=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          echo "::add-mask::$token"
          echo "::add-mask::$csrf"
          session_hash=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
          csrf_hash=$(printf '%s' "$csrf" | sha256sum | cut -d' ' -f1)
          admin_id=$(psql "$connection" -v ON_ERROR_STOP=1 -Atc 'SELECT auth_user_id::text FROM pack1_admins ORDER BY auth_user_id LIMIT 1')
          test -n "$admin_id"
          cleanup() {
            psql "$connection" -v ON_ERROR_STOP=1 --set=session_hash="$session_hash" >/dev/null <<'SQL'
          DELETE FROM account_sessions WHERE session_hash=:'session_hash';
          SQL
          }
          trap cleanup EXIT
          psql "$connection" -v ON_ERROR_STOP=1 --set=session_hash="$session_hash" --set=auth_user_id="$admin_id" --set=csrf_hash="$csrf_hash" >/dev/null <<'SQL'
          INSERT INTO account_sessions(session_hash,auth_user_id,csrf_hash,expires_at)
          VALUES (:'session_hash', :'auth_user_id'::uuid, :'csrf_hash', now()+interval '15 minutes');
          SQL
          curl -fsS --retry 4 --retry-all-errors --max-time 120 \
            -H "Cookie: __Host-pack1_account=$token" -H 'Accept: application/json' \
            "$CORPUS_URL?release=$GITHUB_RUN_ID" -o "$CORPUS_FILE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const data=JSON.parse(fs.readFileSync(process.env.CORPUS_FILE,'utf8'));
          const own=(row,key)=>Object.prototype.hasOwnProperty.call(row,key);
          const yes=value=>value===true||value==='t';
          for(const key of ['sets','snapshots','components','history','blocked_sources'])assert.ok(Array.isArray(data[key]),`${key} array`);
          assert.ok(data.corpus_version,'corpus_version');
          assert.notEqual(data.serving_revision,null,'serving_revision');
          assert.ok(data.sets.length,'sets');
          const setFields=['active_snapshot_id','serving_parent_count','serving_component_count','active_snapshot_retained_count','staged_count','historical_retained_count'];
          assert.ok(data.sets.some(row=>setFields.every(key=>own(row,key))),'new set reporting fields');
          const snapshotFields=['source_snapshot_id','retained_count','eligible_count','serving_count','active','environment_status','lifecycle_status'];
          assert.ok(data.snapshots.some(row=>snapshotFields.every(key=>own(row,key))),'new snapshot reporting fields');
          const live=data.sets.find(row=>row.status==='Live'&&row.active_snapshot_id);
          assert.ok(live,'a Live set with an active snapshot');
          const snapshot=data.snapshots.find(row=>row.source_snapshot_id===live.active_snapshot_id);
          assert.ok(snapshot,'active snapshot inventory row');
          assert.ok(yes(snapshot.active),'active snapshot flag');
          assert.equal(snapshot.environment_status,'Live');
          assert.equal(Number(live.serving_count),Number(live.serving_parent_count)+Number(live.serving_component_count));
          assert.equal(Number(live.serving_parent_count),Number(snapshot.serving_count));
          assert.equal(Number(live.active_snapshot_retained_count),Number(snapshot.retained_count));
          console.log(JSON.stringify({environment:'development',serving_revision:data.serving_revision,sets:data.sets.length,snapshots:data.snapshots.length,live_set:live.set_id},null,2));
          NODE

      - name: Deploy the identical checked bundles to production
        shell: bash
        run: |
          set -euo pipefail
          while IFS=: read -r slug entry; do
            extra=()
            if [[ "$slug" == pack1growth ]]; then
              extra+=(--env "PACK1_RATE_LIMIT_SECRET=$PACK1_RATE_LIMIT_SECRET"
                --env "PACK1_DELETION_ADMIN_EMAIL=$PACK1_DELETION_ADMIN_EMAIL"
                --env "PACK1_DELETION_ADMIN_PASSWORD=$PACK1_DELETION_ADMIN_PASSWORD"
                --env "PACK1_ACCOUNT_DELETION_ENABLED=1"
                --env "PACK1_VERIFICATION_SWEEP_ENABLED=1"
                --env "PACK1_ACCOUNT_DELETE_RESEND_API_KEY=$PACK1_ACCOUNT_DELETE_RESEND_API_KEY")
              if [[ "$PATREON_RUNTIME_ENABLED" == true ]]; then
                extra+=(--env "PATREON_CLIENT_ID=$PATREON_CLIENT_ID" --env "PATREON_CLIENT_SECRET=$PATREON_CLIENT_SECRET" --env "PATREON_WEBHOOK_SECRET=$PATREON_WEBHOOK_SECRET")
              fi
            fi
            neon functions deploy "$slug" --src "$RUNNER_TEMP/pack1-bundles/$slug" --no-bundle \
              --project-id "$PROJECT_ID" --branch "$PROD_BRANCH" --runtime nodejs24 --wait "${extra[@]}"
          done < .github/neon-functions.txt

      - name: Prove the exact revision and all Daily flows in production
        run: node tests/release-functions-smoke.mjs "$PROD_BRANCH" "$RELEASE_COMMIT" --daily --settle --expect-deletion-email=true

      - name: Prove the authenticated live corpus contract through the production gateway
        shell: bash
        env:
          TARGET_BRANCH: ${{ env.PROD_BRANCH }}
          CORPUS_URL: https://api.packone.pro/draft/v1/admin/corpus
          CORPUS_FILE: ${{ runner.temp }}/corpus-production.json
        run: |
          set -euo pipefail
          connection=$(neon connection-string "$TARGET_BRANCH" --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          token=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          csrf=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          echo "::add-mask::$token"
          echo "::add-mask::$csrf"
          session_hash=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
          csrf_hash=$(printf '%s' "$csrf" | sha256sum | cut -d' ' -f1)
          admin_id=$(psql "$connection" -v ON_ERROR_STOP=1 -Atc 'SELECT auth_user_id::text FROM pack1_admins ORDER BY auth_user_id LIMIT 1')
          test -n "$admin_id"
          cleanup() {
            psql "$connection" -v ON_ERROR_STOP=1 --set=session_hash="$session_hash" >/dev/null <<'SQL'
          DELETE FROM account_sessions WHERE session_hash=:'session_hash';
          SQL
          }
          trap cleanup EXIT
          psql "$connection" -v ON_ERROR_STOP=1 --set=session_hash="$session_hash" --set=auth_user_id="$admin_id" --set=csrf_hash="$csrf_hash" >/dev/null <<'SQL'
          INSERT INTO account_sessions(session_hash,auth_user_id,csrf_hash,expires_at)
          VALUES (:'session_hash', :'auth_user_id'::uuid, :'csrf_hash', now()+interval '15 minutes');
          SQL
          curl -fsS --retry 4 --retry-all-errors --max-time 120 \
            -H "Cookie: __Host-pack1_account=$token" -H 'Accept: application/json' \
            "$CORPUS_URL?release=$GITHUB_RUN_ID" -o "$CORPUS_FILE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const data=JSON.parse(fs.readFileSync(process.env.CORPUS_FILE,'utf8'));
          const own=(row,key)=>Object.prototype.hasOwnProperty.call(row,key);
          const yes=value=>value===true||value==='t';
          for(const key of ['sets','snapshots','components','history','blocked_sources'])assert.ok(Array.isArray(data[key]),`${key} array`);
          assert.ok(data.corpus_version,'corpus_version');
          assert.notEqual(data.serving_revision,null,'serving_revision');
          assert.ok(data.sets.length,'sets');
          const setFields=['active_snapshot_id','serving_parent_count','serving_component_count','active_snapshot_retained_count','staged_count','historical_retained_count'];
          assert.ok(data.sets.some(row=>setFields.every(key=>own(row,key))),'new set reporting fields');
          const snapshotFields=['source_snapshot_id','retained_count','eligible_count','serving_count','active','environment_status','lifecycle_status'];
          assert.ok(data.snapshots.some(row=>snapshotFields.every(key=>own(row,key))),'new snapshot reporting fields');
          const live=data.sets.find(row=>row.status==='Live'&&row.active_snapshot_id);
          assert.ok(live,'a Live set with an active snapshot');
          const snapshot=data.snapshots.find(row=>row.source_snapshot_id===live.active_snapshot_id);
          assert.ok(snapshot,'active snapshot inventory row');
          assert.ok(yes(snapshot.active),'active snapshot flag');
          assert.equal(snapshot.environment_status,'Live');
          assert.equal(Number(live.serving_count),Number(live.serving_parent_count)+Number(live.serving_component_count));
          assert.equal(Number(live.serving_parent_count),Number(snapshot.serving_count));
          assert.equal(Number(live.active_snapshot_retained_count),Number(snapshot.retained_count));
          console.log(JSON.stringify({environment:'production',serving_revision:data.serving_revision,sets:data.sets.length,snapshots:data.snapshots.length,live_set:live.set_id},null,2));
          NODE

      - name: Verify the production gateway serves the promoted revision
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch(`https://api.packone.pro/draft/health?quick=1&release=${process.env.GITHUB_RUN_ID}`,{signal:AbortSignal.timeout(60000)});
          const health=await response.json();
          assert.equal(response.status,200,JSON.stringify(health));
          assert.equal(health.ok,true);
          assert.equal(health.release_commit,process.env.RELEASE_COMMIT);
          console.log(JSON.stringify({gateway_release:health.release_commit},null,2));
          NODE

      - name: Record release evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Corpus admin #606 exact-SHA promotion'
            echo
            echo "- Reviewed commit: \`$RELEASE_COMMIT\`"
            echo "- Development branch: \`$DEV_BRANCH\`"
            echo "- Production branch: \`$PROD_BRANCH\`"
            if [[ -f "$RUNNER_TEMP/bundle-sha256.txt" ]]; then
              echo '- Bundle hashes:'
              echo '```text'
              cat "$RUNNER_TEMP/bundle-sha256.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
