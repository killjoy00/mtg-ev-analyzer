name: Pack One Play credential recheck
on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-play-credential-recheck.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Pack One Play API access
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "play_secret_present=no"
            exit 1
          fi
          echo "play_secret_present=yes"
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os, requests, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info=json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
          creds=service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/androidpublisher"]
          )
          creds.refresh(Request())
          h={"Authorization":"Bearer "+creds.token,"Content-Type":"application/json"}
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app"
          r=requests.post(base+"/edits",headers=h,json={},timeout=30)
          print("packone_edit_http="+str(r.status_code))
          if r.status_code!=200:
              try:
                  e=r.json().get("error",{})
                  print("PLAY_ERROR",e.get("code"),e.get("status"),e.get("message"))
              except Exception:
                  pass
              sys.exit(1)
          edit=r.json()["id"]
          tracks=requests.get(base+f"/edits/{edit}/tracks",headers=h,timeout=30)
          print("tracks_http="+str(tracks.status_code))
          if tracks.status_code==200:
              names=sorted({str(x.get("track","")) for x in tracks.json().get("tracks",[]) if x.get("track")})
              print("tracks="+",".join(names))
          else:
              print("tracks=unavailable")
          d=requests.delete(base+f"/edits/{edit}",headers=h,timeout=30)
          print("edit_cleanup_http="+str(d.status_code))
          print("play_service_account="+str(info.get("client_email","")))
          PY
