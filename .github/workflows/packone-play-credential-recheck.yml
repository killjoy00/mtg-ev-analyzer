name: Pack One Play credential recheck
on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-play-credential-recheck.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secret availability
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "play_secret_present=no"
            exit 1
          fi
          echo "play_secret_present=yes"
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Verify Pack One edit access
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app"
          code="$(curl -sS -o "$RUNNER_TEMP/edit.json" -w '%{http_code}' -X POST "${base}/edits" -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" -d '{}')"
          echo "packone_edit_http=${code}"
          test "$code" = "200"
          id="$(jq -r '.id' "$RUNNER_TEMP/edit.json")"
          curl -sS -X DELETE "${base}/edits/${id}" -H "Authorization: Bearer ${ACCESS_TOKEN}" >/dev/null
          echo "packone_edit_cleanup=yes"
