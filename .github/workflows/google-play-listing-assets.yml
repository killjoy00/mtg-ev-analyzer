name: Google Play listing assets

on:
  push:
    branches: [main]
    paths:
      - '.github/google-play-listing-assets-request.json'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: google-play-listing-assets
  cancel-in-progress: false

jobs:
  upload-listing-assets:
    name: upload reviewed Google Play icon and phone screenshots
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: pack-one-mobile-release
    steps:
      - uses: actions/checkout@v4

      - name: Resolve reviewed Play listing request
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('.github/google-play-listing-assets-request.json', 'utf8'));
          const expected = ['artifact_digest','language','operation','reason','source_artifact_id','source_run_id','source_sha'];
          const keys = Object.keys(request).sort();
          if (JSON.stringify(keys) !== JSON.stringify(expected)) throw new Error('Invalid Google Play listing request keys.');
          if (request.operation !== 'upload-google-play-listing-assets') throw new Error('Invalid Google Play listing operation.');
          if (request.language !== 'en-US') throw new Error('Only the reviewed en-US listing is allowed.');
          if (!Number.isInteger(request.source_run_id) || request.source_run_id <= 0) throw new Error('Invalid source_run_id.');
          if (!Number.isInteger(request.source_artifact_id) || request.source_artifact_id <= 0) throw new Error('Invalid source_artifact_id.');
          if (!/^[a-f0-9]{40}$/.test(request.source_sha || '')) throw new Error('Invalid source_sha.');
          if (!/^sha256:[a-f0-9]{64}$/.test(request.artifact_digest || '')) throw new Error('Invalid artifact_digest.');
          if (typeof request.reason !== 'string' || !request.reason.trim()) throw new Error('A review reason is required.');
          fs.appendFileSync(process.env.GITHUB_ENV, [
            'SOURCE_RUN_ID=' + request.source_run_id,
            'SOURCE_ARTIFACT_ID=' + request.source_artifact_id,
            'SOURCE_SHA=' + request.source_sha,
            'ARTIFACT_DIGEST=' + request.artifact_digest,
            'LISTING_LANGUAGE=' + request.language,
            ''
          ].join('\n'));
          NODE

      - name: Require current approved main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse FETCH_HEAD)" ]] || {
            echo "Checked-out revision is no longer current main." >&2
            exit 1
          }

      - name: Download exact reviewed Android screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$SOURCE_RUN_ID" > run.json
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/artifacts/$SOURCE_ARTIFACT_ID" > artifact.json

          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('run.json', 'utf8'));
          const artifact = JSON.parse(fs.readFileSync('artifact.json', 'utf8'));
          if (run.id !== Number(process.env.SOURCE_RUN_ID)) throw new Error('Source run id mismatch.');
          if (run.event !== 'push' || run.head_branch !== 'main') throw new Error('Screenshots must come from a main push run.');
          if (run.head_sha !== process.env.SOURCE_SHA) throw new Error('Source run SHA mismatch.');
          if (artifact.id !== Number(process.env.SOURCE_ARTIFACT_ID)) throw new Error('Source artifact id mismatch.');
          if (artifact.name !== 'pack-one-android-store-screenshots') throw new Error('Unexpected artifact name.');
          if (artifact.expired) throw new Error('Reviewed screenshot artifact has expired.');
          if (artifact.workflow_run && artifact.workflow_run.id !== Number(process.env.SOURCE_RUN_ID)) throw new Error('Artifact is not attached to the reviewed run.');
          if (artifact.digest !== process.env.ARTIFACT_DIGEST) throw new Error('Reviewed screenshot artifact digest mismatch.');
          NODE

          curl --fail --location --silent --show-error "${auth[@]}" "$api/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" --output android-screenshots.zip
          mkdir -p reviewed
          unzip -q android-screenshots.zip -d reviewed

      - name: Validate reviewed icon and phone screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reviewed/play
          base64 --decode .github/play-assets/pack-one-p1-icon-512.png.b64 > reviewed/play/icon.png
          [[ "$(sha256sum reviewed/play/icon.png | awk '{print $1}')" == "e44233fe8cab56f5de4f891bc04450411122b4c592d68228dd37f486de361640" ]]

          python3 <<'PY'
          from pathlib import Path
          import struct

          def jpeg_size(path):
              data = path.read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise SystemExit(f'{path} is not a JPEG')
              i = 2
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  length = struct.unpack('>H', data[i:i+2])[0]
                  if marker in tuple(range(0xC0, 0xC4)) + tuple(range(0xC5, 0xC8)) + tuple(range(0xC9, 0xCC)) + tuple(range(0xCD, 0xD0)):
                      height, width = struct.unpack('>HH', data[i+3:i+7])
                      return width, height
                  i += length
              raise SystemExit(f'Could not read JPEG dimensions from {path}')

          expected = [
              '01-daily-decision.jpg',
              '02-reveal-comparison.jpg',
              '03-daily-hub.jpg',
              '04-practice.jpg',
              '05-career.jpg',
          ]
          root = Path('reviewed/android')
          actual = sorted(p.name for p in root.glob('*.jpg'))
          if actual != expected:
              raise SystemExit(f'Unexpected Android screenshot set: {actual!r}')
          for name in expected:
              path = root / name
              if path.stat().st_size < 50000:
                  raise SystemExit(f'{name} is suspiciously small: {path.stat().st_size} bytes')
              if jpeg_size(path) != (1080, 1920):
                  raise SystemExit(f'{name} is not 1080x1920')

          icon = Path('reviewed/play/icon.png').read_bytes()
          if icon[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Play icon is not PNG')
          width, height, bit_depth, color_type = struct.unpack('>IIBB', icon[16:26])
          if (width, height) != (512, 512) or bit_depth != 8 or color_type not in (2, 6):
              raise SystemExit('Play icon metadata is invalid')
          print('Validated Play icon and five reviewed phone screenshots.')
          PY

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Replace en-US Google Play icon and phone screenshots
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: pro.packone.app
        shell: bash
        run: |
          set -euo pipefail
          root="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          upload_root="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME"
          edit_id=""
          committed=0
          cleanup() {
            if [[ -n "$edit_id" && "$committed" != 1 ]]; then
              curl --fail --silent --show-error --request DELETE --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$edit_id" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          edit_response="$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" --header 'Content-Type: application/json' --data '{}' "$root/edits")"
          edit_id="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.id) process.exit(2); process.stdout.write(x.id)' "$edit_response")"
          curl --fail-with-body --silent --show-error --request DELETE --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$edit_id/listings/$LISTING_LANGUAGE/phoneScreenshots" >/dev/null
          curl --fail-with-body --silent --show-error --request DELETE --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$edit_id/listings/$LISTING_LANGUAGE/icon" >/dev/null

          icon_response="$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" --header 'Content-Type: image/png' --data-binary '@reviewed/play/icon.png' "$upload_root/edits/$edit_id/listings/$LISTING_LANGUAGE/icon?uploadType=media")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.image?.id){console.error(x);process.exit(2)} console.log("Uploaded Play icon:", x.image.id)' "$icon_response"

          : > uploaded-ids.txt
          for path in reviewed/android/*.jpg; do
            response="$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" --header 'Content-Type: image/jpeg' --data-binary "@$path" "$upload_root/edits/$edit_id/listings/$LISTING_LANGUAGE/phoneScreenshots?uploadType=media")"
            node -e 'const x=JSON.parse(process.argv[1]); if(!x.image?.id){console.error(x);process.exit(2)} console.log(x.image.id)' "$response" >> uploaded-ids.txt
          done
          [[ "$(wc -l < uploaded-ids.txt | tr -d ' ')" == "5" ]]

          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$edit_id/listings/$LISTING_LANGUAGE/phoneScreenshots" > pending-screenshots.json
          node -e 'const x=require("./pending-screenshots.json"); if((x.images||[]).length!==5){console.error(x);process.exit(2)}'
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$edit_id/listings/$LISTING_LANGUAGE/icon" > pending-icon.json
          node -e 'const x=require("./pending-icon.json"); if((x.images||[]).length!==1){console.error(x);process.exit(2)}'

          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" --header 'Content-Type: application/json' --data '{}' "$root/edits/$edit_id:commit" > commit.json
          committed=1
          edit_id=""
          echo "Committed reviewed en-US Play icon and five phone screenshots."

      - name: Verify committed Play icon and phone screenshots
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: pro.packone.app
        shell: bash
        run: |
          set -euo pipefail
          root="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          verify_edit=""
          cleanup() {
            if [[ -n "$verify_edit" ]]; then
              curl --fail --silent --show-error --request DELETE --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$verify_edit" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          response="$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" --header 'Content-Type: application/json' --data '{}' "$root/edits")"
          verify_edit="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.id) process.exit(2); process.stdout.write(x.id)' "$response")"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$verify_edit/listings/$LISTING_LANGUAGE/phoneScreenshots" > verified-screenshots.json
          node -e 'const x=require("./verified-screenshots.json"); const n=(x.images||[]).length; if(n!==5){console.error(x);process.exit(2)} console.log("Verified committed Google Play phone screenshot count:", n)'
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $PLAY_ACCESS_TOKEN" "$root/edits/$verify_edit/listings/$LISTING_LANGUAGE/icon" > verified-icon.json
          node -e 'const x=require("./verified-icon.json"); const n=(x.images||[]).length; if(n!==1){console.error(x);process.exit(2)} console.log("Verified committed Google Play app icon count:", n)'
