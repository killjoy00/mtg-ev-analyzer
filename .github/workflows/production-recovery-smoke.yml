name: production recovery webhook smoke

on:
  push:
    branches: [main]
    paths: ['.github/production-recovery-smoke-request.json']

permissions:
  contents: read

concurrency:
  group: pack1-production-recovery-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate reviewed production recovery smoke request
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value=JSON.parse(fs.readFileSync('.github/production-recovery-smoke-request.json','utf8'));
          const keys=Object.keys(value).sort();
          if(JSON.stringify(keys)!==JSON.stringify(['operation','reason']))throw Error('Invalid production recovery smoke request.');
          if(value.operation!=='run'||typeof value.reason!=='string'||value.reason.length<8)throw Error('Invalid production recovery smoke request.');
          NODE
      - name: Verify production recovery Worker is healthy
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://pack1-authhook.killjoy00.workers.dev/health?quick=1',{redirect:'error',signal:AbortSignal.timeout(10000)});
          if(!response.ok)throw Error('Production recovery Worker health check failed.');
          const body=await response.json();
          if(body?.service!=='pack1authhook'||body?.environment!=='production')throw Error('Production recovery Worker health marker mismatch.');
          console.log('Production recovery Worker health passed.');
          NODE
      - name: Run production recovery request smoke
        run: node scripts/auth-webhook-production-smoke.mjs
