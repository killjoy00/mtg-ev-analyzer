name: Import reviewed Android 100925 AAB without changing Google Play tracks

# A one-time, source-pinned import. The reviewed artifact was already built,
# Android-audited and signed by the protected release workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-upload-existing-aab.yml'

permissions:
  contents: read

concurrency:
  group: pack-one-existing-aab-internal-upload
  cancel-in-progress: false

jobs:
  upload-reviewed-artifact:
    if: github.repository == 'killjoy00/mtg-ev-analyzer'
    name: Upload exact signed AAB without changing any Play track
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pack-one-mobile-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Require current main and verify original artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse FETCH_HEAD)" ]] || {
            echo 'Main moved; refusing an unreviewed artifact upload.' >&2
            exit 1
          }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39661127682")"
          jq -e '
            .name == "Android production bundle" and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == "e76119e14181f63fe4216163d32dd9195f97562d"
          ' <<< "$run" >/dev/null || {
            echo 'Source build is not the reviewed successful Pack One build.' >&2
            exit 1
          }
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12375542620")"
          jq -e '
            .id == 12375542620 and
            .name == "pack-one-play-signed-aab" and
            .expired == false and
            .workflow_run.id == 39661127682 and
            .digest == "sha256:406889dc5fe541e0ea9859571a636b985bf18a11ae881a15636339900183e786"
          ' <<< "$artifact" >/dev/null || {
            echo 'Signed AAB source artifact has changed or expired.' >&2
            exit 1
          }
          # Reject a source-equivalent candidate if later commits changed
          # mobile binary inputs; web/API/docs/test changes do not alter it.
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/e76119e14181f63fe4216163d32dd9195f97562d...$GITHUB_SHA")"
          jq -e '[.files[] | .filename | select(startswith("mobile/") or startswith(".github/actions/mobile-validate/") or . == ".github/workflows/android-production-bundle.yml")] | length == 0' <<< "$comparison" >/dev/null || {
            echo 'Native build inputs changed since signed artifact; refusing stale release.' >&2
            exit 1
          }
          echo 'Verified original Android app binary inputs remain unchanged.'
          echo 'Verified existing AAB artifact #12375542620 from successful run #39661127682.'

      - name: Download exact already-signed AAB (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: pack-one-play-signed-aab
          run-id: 39661127682
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/existing-signed-aab

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify previously reviewed Play upload signature
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/existing-signed-aab/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" > "$RUNNER_TEMP/existing-aab-jarverify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/existing-aab-jarverify.txt"
          expected='83:BB:D7:ED:15:27:BA:BE:18:B6:E7:FD:92:F5:A3:50:BD:62:7B:2B'
          actual="$(keytool -printcert -jarfile "$bundle" | awk -F': ' '/SHA1:/{print $2; exit}')"
          [[ "$actual" == "$expected" ]] || {
            echo 'AAB does not match the Google Play registered Pack One upload certificate.' >&2
            exit 1
          }
          echo "Verified registered Google Play upload signer: $actual"
          # The Actions artifact itself is pinned above by run, ID, source SHA,
          # and its GitHub-calculated ZIP SHA-256. This downloaded AAB is
          # separately authenticated by the registered Play upload certificate.
          digest="$(sha256sum "$bundle" | cut -d" " -f1)"
          echo "Downloaded signed AAB SHA-256: $digest"

      - id: auth
        name: Authenticate to Google Play with protected release identity
        uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Preflight exact bundle version and preserve existing tracks
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const api='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app';
          const headers={authorization:'Bearer '+process.env.PLAY_ACCESS_TOKEN,'content-type':'application/json'};
          async function req(path,method='GET',optional=false){
            const r=await fetch(api+path,{method,headers,body:method==='POST'?'{}':undefined});
            if(optional&&r.status===404)return null;
            if(!r.ok)throw Error('Google Play preflight '+method+' '+path+' returned HTTP '+r.status);
            return r.status===204?null:await r.json();
          }
          const edit=await req('/edits','POST');
          if(!edit?.id)throw Error('Google Play did not issue a release edit');
          try{
            const base='/edits/'+encodeURIComponent(edit.id);
            const bundles=await req(base+'/bundles');
            if((bundles?.bundles||[]).some(b=>Number(b.versionCode)===100925))
              throw Error('Version 100925 is already present in Google Play; refusing duplicate upload');
            const all=await req(base+'/tracks');
            const internal=await req(base+'/tracks/internal','GET',true);
            const closed=await req(base+'/tracks/production-access','GET',true);
            const hasCompleted=(track,code)=>(track?.releases||[]).some(
              r=>r.status==='completed'&&(r.versionCodes||[]).map(String).includes(code));
            if(!hasCompleted(internal,'100858'))
              throw Error('Expected completed Internal Testing version 100858; refusing changed Play state');
            if(!hasCompleted(closed,'100772'))
              throw Error('Expected completed production-access Closed Testing 100772; refusing changed qualification state');
            writeFileSync(process.env.RUNNER_TEMP+'/android-play-tracks-before.json',JSON.stringify({
              internal,closed,all:all?.tracks||[]
            }));
            console.log('Checked: version 100925 unused; Internal 100858 and Closed 100772 are completed. All tracks will be preserved.');
          } finally {
            await req('/edits/'+encodeURIComponent(edit.id),'DELETE');
          }
          NODE

      - name: Upload existing AAB to Play bundle library without track assignment
        shell: bash
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const api='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app';
          const upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/pro.packone.app';
          const token=process.env.PLAY_ACCESS_TOKEN;
          async function req(path,{method='GET',body,contentType='application/json',root=api,optional=false}={}){
            const r=await fetch(root+path,{
              method,
              headers:{authorization:'Bearer '+token,...(body===undefined?{}:{'content-type':contentType})},
              body,
              signal:AbortSignal.timeout(600000)
            });
            if(optional&&r.status===404)return null;
            if(!r.ok)throw Error('Google Play bundle-only upload '+method+' failed with HTTP '+r.status);
            const text=await r.text();
            return text?JSON.parse(text):null;
          }
          const bundle=readFileSync(process.env.RUNNER_TEMP+'/existing-signed-aab/app-release.aab');
          const edit=await req('/edits',{method:'POST',body:'{}'});
          if(!edit?.id)throw Error('Google Play did not return an edit ID');
          let committed=false;
          try{
            const base='/edits/'+encodeURIComponent(edit.id);
            const uploaded=await req(base+'/bundles?uploadType=media',{
              root:upload,method:'POST',body:bundle,contentType:'application/octet-stream'
            });
            const version=String(uploaded?.versionCode??'');
            if(version!=='100925')
              throw Error('Uploaded AAB version code mismatch: expected 100925, got '+version);
            const before=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/android-play-tracks-before.json','utf8'));
            const all=await req(base+'/tracks');
            const internal=await req(base+'/tracks/internal',{optional:true});
            const closed=await req(base+'/tracks/production-access',{optional:true});
            if(JSON.stringify(all?.tracks||[])!==JSON.stringify(before.all)||
               JSON.stringify(internal)!==JSON.stringify(before.internal)||
               JSON.stringify(closed)!==JSON.stringify(before.closed))
              throw Error('Play release tracks changed during bundle-only import; refusing to commit');
            await req(base+':commit',{method:'POST',body:'{}'});
            committed=true;
            console.log(JSON.stringify({
              packageName:'pro.packone.app',versionCode:version,
              uploaded:true,committed:true,trackAssignment:'none'
            }));
          }finally{
            if(!committed)try{
              await req('/edits/'+encodeURIComponent(edit.id),{method:'DELETE'});
            }catch{console.error('Could not clean up incomplete Google Play edit.');}
          }
          NODE

      - name: Verify accepted bundle and unchanged Internal and Closed Testing tracks
        shell: bash
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const api='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app';
          const token=process.env.PLAY_ACCESS_TOKEN;
          async function req(path,method='GET',optional=false){
            const r=await fetch(api+path,{
              method,headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:method==='POST'?'{}':undefined
            });
            if(optional&&r.status===404)return null;
            if(!r.ok)throw Error('Google Play postflight '+method+' returned HTTP '+r.status);
            const text=await r.text();
            return text?JSON.parse(text):null;
          }
          const edit=await req('/edits','POST');
          if(!edit?.id)throw Error('No Google Play verification edit');
          try{
            const base='/edits/'+encodeURIComponent(edit.id);
            const bundles=await req(base+'/bundles');
            assert.ok((bundles?.bundles||[]).some(b=>String(b.versionCode)==='100925'),
              'Existing AAB version 100925 must be present in Google Play bundles');
            const before=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/android-play-tracks-before.json','utf8'));
            const all=await req(base+'/tracks');
            const internal=await req(base+'/tracks/internal','GET',true);
            const closed=await req(base+'/tracks/production-access','GET',true);
            assert.deepEqual(all?.tracks||[],before.all,'All preexisting Play tracks must remain unchanged');
            assert.deepEqual(internal,before.internal,'Active Internal Testing release must remain unchanged');
            assert.deepEqual(closed,before.closed,'Active production-access Closed Testing release must remain unchanged');
            console.log('Verified Google Play accepted signed AAB 100925 into the bundle library.');
            console.log('Verified Internal Testing 100858, production-access Closed Testing 100772 and all other tracks are unchanged.');
          } finally {
            await req('/edits/'+encodeURIComponent(edit.id),'DELETE');
          }
          NODE
          {
            echo '## Google Play existing AAB upload'
            echo '- Reused exact signed AAB artifact #12375542620, without rebuilding.'
            echo '- Package: `pro.packone.app`'
            echo '- Uploaded version code: `100925`'
            echo '- Stored in Google Play bundle library; no track or release assigned.'
            echo '- Existing Internal 100858 and Closed 100772: unchanged (verified).'
            echo '- No Production release or tester settings changed.'
          } >> "$GITHUB_STEP_SUMMARY"
