# Inspection trigger refreshed after regular success and Cube dispatch.
name: Inspect recent reviewed release runs

on:
  push:
    branches:
      - ops/traditional-v4-dev-stage-20260921
    paths:
      - .github/workflows/inspect-traditional-v4-dev-stage.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Record recent release runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow publish-puzzle-components.yml \
            --event workflow_dispatch \
            --branch main \
            --limit 20 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName \
            > ops/recent-reviewed-release-runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/recent-reviewed-release-runs.json
          git commit -m "Record recent reviewed release runs [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
