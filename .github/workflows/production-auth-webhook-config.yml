name: configure production auth recovery webhook

on:
  push:
    branches: [main]
    paths: ['.github/production-auth-webhook-config-request.json']

permissions:
  contents: read

concurrency:
  group: pack1-production-auth-webhook-config
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate reviewed configuration request
        id: request
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value=JSON.parse(fs.readFileSync('.github/production-auth-webhook-config-request.json','utf8'));
          const keys=Object.keys(value).sort();
          if(JSON.stringify(keys)!==JSON.stringify(['operation','reason']))throw Error('Invalid production Auth webhook configuration request.');
          if(!['ensure-enabled','disable'].includes(value.operation)||typeof value.reason!=='string'||value.reason.length<8)throw Error('Invalid production Auth webhook configuration request.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'operation='+value.operation+'\n');
          NODE
      - name: Verify production recovery Worker health
        if: steps.request.outputs.operation == 'ensure-enabled'
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://pack1-authhook.killjoy00.workers.dev/health?quick=1',{redirect:'error',signal:AbortSignal.timeout(10000)});
          if(!response.ok)throw Error('Production recovery Worker health check failed.');
          const body=await response.json();
          if(body?.service!=='pack1authhook'||body?.environment!=='production')throw Error('Production recovery Worker health marker mismatch.');
          NODE
      - name: Ensure exact production Neon Auth webhook subscription
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://console.neon.tech/api/v2/projects/patient-shadow-91417882/branches/br-orange-feather-ayps8kep/auth/webhooks';
          const headers={
            accept:'application/json',
            authorization:'Bearer '+process.env.NEON_API_KEY,
            'content-type':'application/json',
          };
          const operation='${{ steps.request.outputs.operation }}';
          const desired={
            enabled:operation==='ensure-enabled',
            webhook_url:'https://pack1-authhook.killjoy00.workers.dev/webhook',
            enabled_events:['send.magic_link'],
            timeout_seconds:5,
          };
          const get=async()=>{
            const response=await fetch(endpoint,{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error('Could not read production Neon Auth webhook configuration; HTTP '+response.status+'.');
            return response.json();
          };
          const before=await get();
          console.log('PRODUCTION_AUTH_WEBHOOK_BEFORE '+JSON.stringify({
            enabled:Boolean(before.enabled),
            webhook_url:String(before.webhook_url||''),
            enabled_events:Array.isArray(before.enabled_events)?before.enabled_events:[],
            timeout_seconds:Number(before.timeout_seconds||0),
          }));
          const update=await fetch(endpoint,{
            method:'PUT',
            headers,
            body:JSON.stringify(desired),
            redirect:'error',
            signal:AbortSignal.timeout(15000),
          });
          if(!update.ok)throw Error('Could not update production Neon Auth webhook configuration; HTTP '+update.status+'.');
          const after=await get();
          const exact=after.enabled===desired.enabled
            && after.webhook_url===desired.webhook_url
            && Array.isArray(after.enabled_events)
            && after.enabled_events.length===1
            && after.enabled_events[0]==='send.magic_link'
            && Number(after.timeout_seconds)===5;
          if(!exact)throw Error('Production Neon Auth webhook configuration did not match the fixed recovery-only contract.');
          console.log('PRODUCTION_AUTH_WEBHOOK_AFTER '+JSON.stringify(desired));
          NODE
