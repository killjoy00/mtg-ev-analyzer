name: R2 patch daily API backend

on:
  push:
    branches: [r2-corpus-migration]
    paths:
      - '.github/workflows/r2-patch-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch daily API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          text = p.read_text()
          old = "const STATIC_ORIGIN = 'https://packone.pro';\n"
          new = "const STATIC_ORIGIN = 'https://packone.pro';\nconst REPLAY_SHARD_ORIGIN = 'https://data.packone.pro';\n"
          if text.count(old) != 1:
              raise SystemExit('STATIC_ORIGIN patch target not unique')
          text = text.replace(old, new, 1)
          old = "async function staticJson(path) {\n  const response = await fetch(new URL(String(path).replace(/^\\.\\//, ''), `${STATIC_ORIGIN}/`));\n  if (!response.ok) throw new Error(`Static data request failed (${response.status}).`);\n  return response.json();\n}\n"
          new = "async function staticJson(path) {\n  const relative = String(path).replace(/^\\.\\//, '');\n  const origin = /^data\\/[^/]+\\/shards\\/[^/]+\\.json$/.test(relative)\n    ? REPLAY_SHARD_ORIGIN\n    : STATIC_ORIGIN;\n  const response = await fetch(new URL(relative, `${origin}/`));\n  if (!response.ok) throw new Error(`Static data request failed (${response.status}).`);\n  return response.json();\n}\n"
          if text.count(old) != 1:
              raise SystemExit('staticJson patch target not unique')
          p.write_text(text.replace(old, new, 1))
          PY
          node --check worker/index.js
          npm test
          git diff --check
      - name: Commit backend patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Read daily challenge replay shards from R2'
          git push origin "HEAD:$GITHUB_REF_NAME"
