name: contextual-value-v1-h-freeze-core-audit

on:
  push:
    branches:
      - research/contextual-value-v1-h-freeze-audit-529
    paths:
      - '.github/workflows/contextual-value-v1-h-freeze-core-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PHASE_A2_PILOT_RUN: '36289846820'
  PHASE_A2_FULL_RUN: '36290030236'
  ABLATION_RUN: '36280148906'
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned model dependency
        run: python -m pip install --disable-pip-version-check 'scikit-learn==1.9.1'
      - name: Compile freeze audit
        run: python -m py_compile research/contextual_value_h_freeze_audit.py research/contextual_value_phase_a_bakeoff.py

      - name: Download Phase A2 fold 0
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-phase-a2-fold-0
          path: folds
          run-id: ${{ env.PHASE_A2_PILOT_RUN }}
          github-token: ${{ github.token }}

      - name: Download Phase A2 remaining folds
        uses: actions/download-artifact@v4
        with:
          pattern: contextual-value-v1-phase-a2-fold-*
          path: folds
          merge-multiple: true
          run-id: ${{ env.PHASE_A2_FULL_RUN }}
          github-token: ${{ github.token }}

      - name: Download no-strong validation nuisance
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-ablation-no_strong_entirely-fold--1
          path: no-strong
          run-id: ${{ env.ABLATION_RUN }}
          github-token: ${{ github.token }}

      - name: Download prior ablation report
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-ablation-audit
          path: ablation
          run-id: ${{ env.ABLATION_RUN }}
          github-token: ${{ github.token }}

      - name: Run frozen H core audit
        shell: bash
        run: |
          set -euo pipefail
          TRAIN_ARGS=()
          REPORT_ARGS=()
          for f in 0 1 2 3 4; do
            TRAIN_ARGS+=(--train-shard "folds/phase-a2-fold-$f.npz")
            REPORT_ARGS+=(--train-report "folds/phase-a2-fold-$f-report.json")
          done
          python3 research/contextual_value_h_freeze_audit.py \
            "${TRAIN_ARGS[@]}" \
            "${REPORT_ARGS[@]}" \
            --validation-shard folds/phase-a2-fold--1.npz \
            --validation-report folds/phase-a2-fold--1-report.json \
            --no-strong-predictions no-strong/no_strong_entirely-fold--1.jsonl.gz \
            --no-strong-report no-strong/no_strong_entirely-fold--1-report.json \
            --ablation-report ablation/ablation-report.json \
            --out results/contextual-value-v1/h-freeze-core-audit

      - name: Assert freeze boundaries
        run: |
          python3 - <<'PY'
          import json
          p="results/contextual-value-v1/h-freeze-core-audit/h-freeze-core-audit.json"
          r=json.load(open(p))
          assert r["assessment_opened"] is False
          assert r["benchmark_reproduction"]["passed"] is True
          assert r["benchmark_reproduction"]["max_abs_error"] <= 1e-9
          assert r["behavior_nuisance_sensitivity"]["only_behavior_propensity_changed"] is True
          assert r["behavior_nuisance_sensitivity"]["selection_policy_changed"] is False
          assert r["behavior_nuisance_sensitivity"]["q_values_changed"] is False
          assert r["environment_power"]["rule_defined_in_frozen_protocol"] is False
          assert r["environment_power"]["classification"] == "unresolved"
          assert set(r["slice_uncertainty_frozen_behavior"]) == {
              "set","pick","skill","experience"
          }
          PY

      - name: Upload freeze audit report
        uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-h-freeze-core-audit
          path: results/contextual-value-v1/h-freeze-core-audit/
          retention-days: 30
