name: release QA auth webhook

on:
  push:
    branches: [main]
    paths: ['.github/auth-webhook-request.json']

permissions:
  contents: read

concurrency:
  group: pack1-auth-webhook-qa
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
      PACK1_AUTH_RESEND_API_KEY: ${{ secrets.PACK1_AUTH_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve reviewed QA Auth webhook request
        id: request
        run: node scripts/auth-webhook-request.mjs
      - name: Resolve exact implementation revision
        if: steps.request.outputs.operation == 'deploy-qa' || steps.request.outputs.operation == 'deploy-qa-fail' || steps.request.outputs.operation == 'deploy-qa-retry'
        shell: bash
        run: |
          set -euo pipefail
          commit="${{ steps.request.outputs.commit }}"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Install pinned Worker deployment tool
        if: steps.request.outputs.operation != 'idle'
        run: npm install --prefix "$RUNNER_TEMP/auth-webhook-tools" --no-audit --no-fund wrangler@4.132.0
      - name: Check dedicated recovery-email credential
        if: steps.request.outputs.operation == 'check-secret'
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/auth-webhook-tools
        run: node scripts/auth-webhook-control.mjs check-secret
      - name: Deploy QA recovery-email Worker
        if: steps.request.outputs.operation == 'deploy-qa'
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/auth-webhook-tools
        run: node scripts/auth-webhook-control.mjs deploy-qa
      - name: Deploy QA forced-failure recovery-email Worker
        if: steps.request.outputs.operation == 'deploy-qa-fail'
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/auth-webhook-tools
        run: node scripts/auth-webhook-control.mjs deploy-qa-fail
      - name: Deploy QA post-send retry recovery-email Worker
        if: steps.request.outputs.operation == 'deploy-qa-retry'
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/auth-webhook-tools
        run: node scripts/auth-webhook-control.mjs deploy-qa-retry
      - name: Remove QA recovery-email Worker
        if: steps.request.outputs.operation == 'delete-qa'
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/auth-webhook-tools
        run: node scripts/auth-webhook-control.mjs delete-qa
