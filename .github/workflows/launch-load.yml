name: isolated launch NAT acceptance
on:
  pull_request:
    paths: ['.github/preview-dns-recovery.json', 'scripts/create-ci-neon-branch.mjs', 'scripts/control-read.mjs', 'scripts/edge-control.mjs', 'tests/ci-provisioning.test.mjs', 'scripts/launch-load*', 'scripts/launch-practice-browser.mjs', '.github/workflows/launch-load.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pack1-gateway-preview
  cancel-in-progress: false
  queue: max
jobs:
  nat:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject a stale queued PR before provisioning
        if: github.event_name == 'pull_request'
        env:
          REVIEWED_BRANCH: ${{ github.head_ref }}
          REVIEWED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current_head="$(timeout 30s git ls-remote --exit-code origin "refs/heads/$REVIEWED_BRANCH" | awk 'NR==1 { print $1 }')"
          test "$current_head" = "$REVIEWED_SOURCE_SHA" || {
            echo '::error::Queued NAT source is stale; no preview resources were provisioned.'
            exit 1
          }
      - name: Verify scoped Cloudflare access
        env:
          CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
        run: node scripts/edge-control.mjs preflight
      - name: Set emergency expiry
        id: expiry
        run: echo "expires_at=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Create disposable production-sized branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CI_BRANCH_PREFIX: launch-load-${{ github.run_id }}-${{ github.run_attempt }}
          CI_BRANCH_PARENT: br-orange-feather-ayps8kep
          CI_BRANCH_EXPIRES: ${{ steps.expiry.outputs.expires_at }}
          CI_BRANCH_SUSPEND: 300
        run: node scripts/create-ci-neon-branch.mjs
      - name: Install pinned deployment tools
        run: node .github/scripts/install-wrangler-tool.mjs "$RUNNER_TEMP/edge-tools" neon@4.17.4 esbuild@0.28.2
      - name: Install pinned browser driver
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - name: Prepare isolated schema and exact revision
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          ESBUILD_BIN: ${{ runner.temp }}/edge-tools/node_modules/.bin/esbuild
        run: |
          node --input-type=module -e "import {checkBranch} from './scripts/edge-control.mjs';checkBranch(process.env.PREVIEW_BRANCH);if(process.env.PREVIEW_CREATED!=='true')throw Error('Fresh isolated branch required');"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          node scripts/ci-migration-plan.mjs launch-load > "$RUNNER_TEMP/pack1-migrations.txt"
          while IFS= read -r migration; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < "$RUNNER_TEMP/pack1-migrations.txt"
          node scripts/verify-neon-schema.mjs
          PACK1_RELEASE_COMMIT="$GITHUB_SHA" node scripts/warm-practice-cache.mjs
          node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$GITHUB_SHA"
      - name: Prepare accounts, entitlements, score history and query plans
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          LOAD_FIXTURE_FILE: ${{ runner.temp }}/launch-load-fixtures.json
        run: node scripts/launch-load-fixtures.mjs
      - name: Deploy isolated Functions and private gateway
        id: deploy
        env:
          CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          EDGE_TOOLS_DIR: ${{ runner.temp }}/edge-tools
        run: node scripts/edge-control.mjs deploy
      - name: Verify browser interception before idle measurements
        env:
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          LOAD_FIXTURE_FILE: ${{ runner.temp }}/launch-load-fixtures.json
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PACK1_BROWSER_SMOKE: '1'
        run: node scripts/launch-practice-browser.mjs
      - name: Measure confirmed-idle and warm practice in the browser
        id: browser
        continue-on-error: true
        env:
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          LOAD_FIXTURE_FILE: ${{ runner.temp }}/launch-load-fixtures.json
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/launch-practice-browser.mjs
      - name: Allow the browser request window to expire before NAT measurement
        run: node --input-type=module -e "await new Promise(r=>setTimeout(r,65000))"
      - name: Run declared shared-network stages until the first failed gate
        env:
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          LOAD_FIXTURE_FILE: ${{ runner.temp }}/launch-load-fixtures.json
        run: node scripts/launch-load.mjs
      - name: Enforce the independent browser gate
        if: steps.browser.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-load-${{ github.run_id }}
          path: |
            artifacts/launch-load
            artifacts/ci-resources
          retention-days: 30
      - name: Remove this private preview route
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        env:
          CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
          PACK1_ENFORCE_PREVIEW_OWNER: '1'
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: node scripts/edge-control.mjs disable
      - name: Delete the disposable branch
        if: always() && steps.neon.outputs.created == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: patient-shadow-91417882
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
