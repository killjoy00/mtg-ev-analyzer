name: Download real MTG cards for Pack One creative review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-card-creative-sources.yml'
      - '.github/scripts/fetch-real-card-creative-sources.mjs'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve three verified real MSH cards used in Pack One example
        run: node .github/scripts/fetch-real-card-creative-sources.mjs
      - name: Save verified card images and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-real-card-art
          path: real-card-art/
          retention-days: 2
