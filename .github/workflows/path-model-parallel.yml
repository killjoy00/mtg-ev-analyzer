name: generate-path-models-parallel

on:
  push:
    branches: [feature/counterfactual-pack-paths]
    paths:
      - '.github/workflows/path-model-parallel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: [msh, sos, tmt, ecl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ${{ matrix.set }} path model
        shell: bash
        run: |
          set -euo pipefail
          LOWER='${{ matrix.set }}'
          UPPER=$(printf '%s' "$LOWER" | tr '[:lower:]' '[:upper:]')
          SOURCE_DATE=$(python - "$LOWER" <<'PY'
          import json, sys
          data=json.load(open(f"data/{sys.argv[1]}/manifest.json"))
          print(data["source"]["data_date"])
          PY
          )
          MAX_TRAINING=$(python - "$LOWER" <<'PY'
          import json, sys
          data=json.load(open(f"data/{sys.argv[1]}/manifest.json"))
          print(data["cohort"]["training_drafts"])
          PY
          )
          mkdir -p raw-data
          INPUT="raw-data/draft_data_public.$UPPER.PremierDraft.csv.gz"
          curl --fail --location --retry 5 --retry-delay 3 \
            --output "$INPUT" \
            "https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.$UPPER.PremierDraft.csv.gz"
          python scripts/build_path_model.py \
            --input "$INPUT" \
            --output-dir "data/$LOWER" \
            --expansion "$UPPER" \
            --source-date "$SOURCE_DATE" \
            --minimum-games 100 \
            --top-fraction 0.15 \
            --max-training-drafts "$MAX_TRAINING" \
            --max-bytes 4000000
          python - "$LOWER" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path('data')/sys.argv[1]/'path-model.json'
          model=json.loads(path.read_text())
          assert model['model_version']=='strong-player-counterfactual-path-v3'
          assert model['training']['excluded_replay_drafts'] >= 250
          assert len(model['cards']) > 100
          assert len(model['pairs']) > 100
          assert path.stat().st_size < 4_000_000
          print(json.dumps({
            'set': sys.argv[1],
            'training': model['training'],
            'cards': len(model['cards']),
            'pairs': len(model['pairs']),
            'bytes': path.stat().st_size,
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: path-model-${{ matrix.set }}
          path: data/${{ matrix.set }}/path-model.json
          retention-days: 7

  collect:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: path-model-msh
          path: data/msh
      - uses: actions/download-artifact@v4
        with:
          name: path-model-sos
          path: data/sos
      - uses: actions/download-artifact@v4
        with:
          name: path-model-tmt
          path: data/tmt
      - uses: actions/download-artifact@v4
        with:
          name: path-model-ecl
          path: data/ecl
      - name: Commit generated path models
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*/path-model.json
          git commit -m 'Generate counterfactual path models [data-generated]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
