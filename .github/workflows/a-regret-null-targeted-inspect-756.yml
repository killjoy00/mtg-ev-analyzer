name: a-regret-null-targeted-inspect-756

on:
  push:
    branches:
      - research/a-regret-null-calibration-756
    paths:
      - .github/workflows/a-regret-null-targeted-inspect-756.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact frozen entry points
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin d121aa4b63f738ea039e15a21f839d97cbafb427
          git show d121aa4b63f738ea039e15a21f839d97cbafb427:research/one_time/a_regret_p1p1.py.gz.b64 | base64 -d | gzip -d > /tmp/p1.py
          grep -n -A 170 -E '^def (read_contexts_no_outcomes|build_a_scores|support_for|first_stage|second_stage)' /tmp/p1.py
