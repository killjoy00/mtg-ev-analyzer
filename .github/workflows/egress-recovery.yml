name: Egress recovery evidence

on:
  schedule:
    - cron: '43 15 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/neon-egress-evidence.mjs'
      - 'scripts/check-corpus-health.mjs'
      - 'scripts/corpus-health-freshness.mjs'
      - 'scripts/launch-alert.mjs'
      - 'tests/*egress*'
      - 'tests/corpus-health-scope-postgres.mjs'
      - '.github/workflows/egress-recovery.yml'
      - '.github/workflows/corpus-operations.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neon-egress-evidence.mjs'
      - 'scripts/check-corpus-health.mjs'
      - 'scripts/corpus-health-freshness.mjs'
      - 'scripts/launch-alert.mjs'
      - 'tests/*egress*'
      - 'tests/corpus-health-scope-postgres.mjs'
      - '.github/workflows/egress-recovery.yml'
      - '.github/workflows/corpus-operations.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: egress-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute counter, workflow-shell and alert-isolation regressions
        run: node --test tests/neon-egress-evidence.test.mjs tests/corpus-egress-regression.test.mjs
      - name: Ensure PostgreSQL client is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Execute actual health SQL on isolated fixture rows
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
          PGDATABASE: fixture
        run: node tests/corpus-health-scope-postgres.mjs
  provider-evidence:
    needs: regressions
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find previous successful main observation
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            let runs;
            try {
              runs = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'egress-recovery.yml', branch: 'main',
                status: 'success', per_page: 10
              });
            } catch (error) {
              // Expected only before this new workflow has first reached main.
              if (error.status !== 404) throw error;
              core.notice('No previous main workflow exists; establish a baseline, not a zero-usage claim.');
              return;
            }
            const previous = runs.data.workflow_runs.find(run =>
              run.id !== context.runId && run.event !== 'pull_request');
            if (previous) core.setOutput('run_id', String(previous.id));
            else core.notice('No previous successful main observation; comparison will be unavailable.');
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run_id != ''
        with:
          name: neon-egress-evidence
          path: previous-egress-evidence
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Capture bounded provider evidence without SQL or corpus reads
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [[ -f previous-egress-evidence/report.json ]]; then
            args+=(--previous previous-egress-evidence/report.json)
          fi
          # #547 merged at 19:42:23 UTC. Ceil to the next full hour and also
          # bound by the last 24 eligible hours; never compare across a reset.
          node scripts/neon-egress-evidence.mjs --since 2026-09-25T19:42:23Z "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-egress-evidence
          path: artifacts/neon-egress-evidence/
          if-no-files-found: warn
          retention-days: 90
