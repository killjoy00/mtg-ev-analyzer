name: Egress recovery evidence

on:
  schedule:
    - cron: '43 15 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/neon-egress-evidence.mjs'
      - 'scripts/private-egress-report.mjs'
      - 'scripts/private-compute-report.mjs'
      - 'scripts/check-corpus-health.mjs'
      - 'scripts/corpus-health-freshness.mjs'
      - 'scripts/launch-alert.mjs'
      - 'tests/*egress*'
      - 'tests/corpus-health-scope-postgres.mjs'
      - '.github/workflows/egress-recovery.yml'
      - '.github/workflows/corpus-operations.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neon-egress-evidence.mjs'
      - 'scripts/private-egress-report.mjs'
      - 'scripts/private-compute-report.mjs'
      - 'scripts/check-corpus-health.mjs'
      - 'scripts/corpus-health-freshness.mjs'
      - 'scripts/launch-alert.mjs'
      - 'tests/*egress*'
      - 'tests/corpus-health-scope-postgres.mjs'
      - '.github/workflows/egress-recovery.yml'
      - '.github/workflows/corpus-operations.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: egress-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute counter, workflow-shell and alert-isolation regressions
        run: node --test tests/neon-egress-evidence.test.mjs tests/corpus-egress-regression.test.mjs tests/private-egress-report.test.mjs tests/private-compute-report.test.mjs
      - name: Ensure PostgreSQL client is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Execute actual health SQL on isolated fixture rows
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
          PGDATABASE: fixture
        run: node tests/corpus-health-scope-postgres.mjs
  provider-evidence:
    needs: regressions
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: pack-one-mobile-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture bounded provider evidence into verified private storage
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
        run: node scripts/private-egress-report.mjs
