name: Apple associated domains diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * 1'
  pull_request:
    paths:
      - '.well-known/apple-app-site-association'
      - 'mobile/app.json'
      - 'mobile/app.config.ts'
      - 'scripts/check-apple-associated-domains.mjs'
      - 'tests/apple-associated-domains.test.mjs'
      - '.github/workflows/apple-associated-domains.yml'
  push:
    branches: [main]
    paths:
      - '.well-known/apple-app-site-association'
      - 'mobile/app.json'
      - 'mobile/app.config.ts'
      - 'scripts/check-apple-associated-domains.mjs'
      - 'tests/apple-associated-domains.test.mjs'
      - '.github/workflows/apple-associated-domains.yml'

permissions:
  contents: read

concurrency:
  group: apple-associated-domains-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check expected iOS/Android association rules
        run: |
          node --test tests/apple-associated-domains.test.mjs
          node scripts/check-apple-associated-domains.mjs --check
      - name: Inspect published origin and Apple's CDN (read-only)
        run: node scripts/check-apple-associated-domains.mjs --live
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-associated-domains-diagnostic
          path: artifacts/apple-associated-domains.json
          retention-days: 7
          if-no-files-found: ignore
