name: contextual-value-v1-margin-q-export

on:
  push:
    branches:
      - research/contextual-value-v1-h-freeze-audit-529
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  ABLATION_RUN: '36280148906'
  PYTHONUNBUFFERED: '1'

jobs:
  export:
    name: q-fold-${{ matrix.fold }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - fold: 1
            compact_run: '36289366966'
            compact_name: contextual-value-v1-phase-a-compact-fold-1
            prior_run: '36290030236'
          - fold: 2
            compact_run: '36289366966'
            compact_name: contextual-value-v1-phase-a-compact-fold-2
            prior_run: '36290030236'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned model dependency
        run: python -m pip install --disable-pip-version-check 'scikit-learn==1.9.1'

      - name: Compile frozen Phase A2 fitter
        run: python -m py_compile research/contextual_value_phase_a_bakeoff.py

      - name: Download exact compact fold
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.compact_name }}
          path: compact
          run-id: ${{ matrix.compact_run }}
          github-token: ${{ github.token }}

      - name: Download frozen strong-offset-only nuisance
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-ablation-strong_offset_only-fold-${{ matrix.fold }}
          path: behavior
          run-id: ${{ env.ABLATION_RUN }}
          github-token: ${{ github.token }}

      - name: Download frozen held feature checkpoint
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-ablation-held-${{ matrix.fold }}
          path: held
          run-id: ${{ env.ABLATION_RUN }}
          github-token: ${{ github.token }}

      - name: Download prior Phase A2 fold for parity
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-phase-a2-fold-${{ matrix.fold }}
          path: prior
          run-id: ${{ matrix.prior_run }}
          github-token: ${{ github.token }}

      - name: Re-export frozen cross-fit Q scores
        shell: bash
        run: |
          set -euo pipefail
          FOLD='${{ matrix.fold }}'
          python3 research/contextual_value_phase_a_bakeoff.py fit-fold \
            --fold "$FOLD" \
            --compact-db "compact/phase-a-compact-fold-$FOLD.sqlite" \
            --compact-schema "compact/phase-a-compact-fold-$FOLD-schema.json" \
            --behavior-predictions "behavior/strong_offset_only-fold-$FOLD.jsonl.gz" \
            --held-features "held/held-features-fold-$FOLD.jsonl.gz" \
            --out "results/contextual-value-v1/margin-q-fold-$FOLD"

      - name: Assert exact prior parity and research boundary
        shell: bash
        run: |
          FOLD='${{ matrix.fold }}'
          python3 - <<PY
          import json
          import numpy as np
          fold=int("$FOLD")
          base=f"results/contextual-value-v1/margin-q-fold-{fold}"
          new=np.load(f"{base}/phase-a2-fold-{fold}.npz",allow_pickle=False)
          old=np.load(f"prior/phase-a2-fold-{fold}.npz",allow_pickle=False)
          report=json.load(open(f"{base}/phase-a2-fold-{fold}-report.json"))
          prior=json.load(open(f"prior/phase-a2-fold-{fold}-report.json"))
          assert report["assessment_opened"] is False
          assert report["assessment_outcomes_used"] is False
          assert report["sklearn_version"] == "1.9.1"
          assert {"q_rich","q_simple","behavior","phi_rich","phi_simple"} <= set(new.files)
          max_float_diff=0.0
          for key in old.files:
              assert key in new.files, key
              left,right=new[key],old[key]
              assert left.shape == right.shape, key
              if left.dtype.kind in "f":
                  finite=np.isfinite(left)&np.isfinite(right)
                  diff=float(np.max(np.abs(left[finite]-right[finite]))) if np.any(finite) else 0.0
                  max_float_diff=max(max_float_diff,diff)
                  assert np.array_equal(np.isnan(left),np.isnan(right)), key
                  assert diff <= 1e-10, (key,diff)
              else:
                  assert np.array_equal(left,right), key
          for section in ("q_diagnostics_rich","q_diagnostics_simple_retained"):
              for metric,value in report[section]["overall"].items():
                  prior_value=prior[section]["overall"][metric]
                  if isinstance(value,(int,float)):
                      assert abs(float(value)-float(prior_value)) <= 1e-10, (section,metric,value,prior_value)
                  else:
                      assert value == prior_value, (section,metric)
          print(json.dumps({
              "fold":fold,
              "q_rows":int(len(new["q_rich"])),
              "prior_parity":True,
              "max_float_diff":max_float_diff,
              "tolerance":1e-10,
              "assessment_opened":False,
          },sort_keys=True))
          PY

      - name: Upload frozen Q-score fold
        uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-margin-q-fold-${{ matrix.fold }}
          path: results/contextual-value-v1/margin-q-fold-${{ matrix.fold }}/
          retention-days: 30
