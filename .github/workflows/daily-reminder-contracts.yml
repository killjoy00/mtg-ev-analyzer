name: Daily reminder contracts

on:
  pull_request:
    paths:
      - '*reminder*'
      - 'worker/*reminder*'
      - 'worker/growth-function.js'
      - 'worker/account-session.mjs'
      - 'edge/gateway.mjs'
      - 'growth-api.mjs'
      - 'game-date.mjs'
      - 'scripts/reconcile-neon-schedulers.mjs'
      - 'tests/support/**'
      - '.github/workflows/secure-auth-release.yml'
      - 'worker/account-deletion*'
      - 'migrations/**'
      - 'tests/*reminder*'
      - 'mobile/**'
      - '.github/workflows/daily-reminder-contracts.yml'

permissions:
  contents: read

concurrency:
  group: reminder-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: pack1
          POSTGRES_USER: pack1_ci
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pack1_ci -d pack1"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PACK1_TEST_DATABASE_URL: postgresql://pack1_ci:fixture-only@127.0.0.1:5432/pack1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
      - name: Exercise consent, schedule, provider and protected release contracts
        run: node --test tests/daily-reminder-schedule.test.mjs tests/daily-reminders.test.mjs tests/daily-reminder-release-controls.test.mjs
      - name: Apply real migrations to an isolated PostgreSQL database
        run: node scripts/prepare-test-database.mjs
      - name: Require actual PostgreSQL reminder and concurrency contracts
        run: node tests/daily-reminders-postgres.mjs
