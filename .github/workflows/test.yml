name: test

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['.github/model-rollout-request.json']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployment bundles and embedded revisions
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-audit --no-fund esbuild@0.28.2
          ESBUILD_BIN="$RUNNER_TEMP/release-tools/node_modules/.bin/esbuild" node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$GITHUB_SHA"
      - name: Hydrate replay shards from R2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/r2_replay_shards.sh hydrate
      - name: Run tests with replay shards required
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REQUIRE_REPLAY_SHARDS: '1'
        run: npm test
      - name: Run fork tests without private replay shards
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm test
      - name: Audit production datasets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python scripts/audit_datasets.py --fail-on-error


  c179-runtime-privilege-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/179c1-runtime-delete-privilege-probe-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove deployed worker runtime DELETE privilege
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 30 https://br-twilight-hill-ayffyd2b-c179probe.compute.c-5.us-east-2.aws.neon.tech/179c1-runtime-delete-privilege-probe-8d3d5174)
          printf '%s\n' "$body"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.ok!==true||x.delete_row_count!==0||x.before_count!==x.after_count||x.same_role!==true)process.exit(1)' "$body"
