name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths-ignore: ['.github/model-rollout-request.json']

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect required-suite scope
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_full=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            run_full=false
            mapfile -t changed_files < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
            if (( ${#changed_files[@]} == 0 )); then
              run_full=true
            else
              printf 'Changed files:\n'
              printf ' - %s\n' "${changed_files[@]}"
              for path in "${changed_files[@]}"; do
                case "$path" in
                  mobile/*|docs/mobile-*|docs/android-*|docs/parity.md|.github/workflows/mobile*.yml|.github/workflows/android-*.yml|.github/workflows/ios-*.yml|.github/workflows/google-play-access.yml|.github/android-*.txt|.github/ios-*.txt|.github/app-store-*.txt|.github/scripts/app-store-*.mjs|.gitignore)
                    ;;
                  *)
                    run_full=true
                    break
                    ;;
                esac
              done
            fi
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          if [[ "$run_full" == "true" ]]; then
            echo 'Running the full repository gate.'
          else
            echo 'Native-mobile/release-only PR: full web/backend gate is not required.'
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run_full == 'true'
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run_full == 'true'
        with:
          python-version: '3.12'
      - name: Verify deployment bundles and embedded revisions
        if: steps.scope.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-audit --no-fund esbuild@0.28.2
          ESBUILD_BIN="$RUNNER_TEMP/release-tools/node_modules/.bin/esbuild" node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$GITHUB_SHA"
      - name: Hydrate replay shards from R2
        if: steps.scope.outputs.run_full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: bash scripts/r2_replay_shards.sh hydrate
      - name: Run tests with replay shards required
        if: steps.scope.outputs.run_full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REQUIRE_REPLAY_SHARDS: '1'
        run: npm test
      - name: Run fork tests without private replay shards
        if: steps.scope.outputs.run_full == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm test
      - name: Audit production datasets
        if: steps.scope.outputs.run_full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python scripts/audit_datasets.py --fail-on-error

      # Keep this last so implementation regressions are visible even while a
      # release-critical secret is intentionally not yet provisioned. A
      # same-repository PR still cannot go green or merge without all four.
      - name: Verify account-deletion release secrets are provisioned
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          RATE_LIMIT_SECRET_PRESENT: ${{ secrets.PACK1_RATE_LIMIT_SECRET != '' }}
          DELETION_ADMIN_EMAIL_PRESENT: ${{ secrets.PACK1_DELETION_ADMIN_EMAIL != '' }}
          DELETION_ADMIN_PASSWORD_PRESENT: ${{ secrets.PACK1_DELETION_ADMIN_PASSWORD != '' }}
          DELETE_EMAIL_KEY: ${{ secrets.PACK1_ACCOUNT_DELETE_RESEND_API_KEY }}
          APPLE_TEAM_ID_PRESENT: ${{ secrets.APPLE_TEAM_ID != '' }}
          APPLE_SIGN_IN_KEY_ID_PRESENT: ${{ secrets.APPLE_SIGN_IN_KEY_ID != '' }}
          APPLE_SIGN_IN_KEY_P8_PRESENT: ${{ secrets.APPLE_SIGN_IN_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          [[ "$RATE_LIMIT_SECRET_PRESENT" == true ]] || { echo '::error::PACK1_RATE_LIMIT_SECRET is not provisioned.'; exit 1; }
          [[ "$DELETION_ADMIN_EMAIL_PRESENT" == true ]] || { echo '::error::PACK1_DELETION_ADMIN_EMAIL is not provisioned.'; exit 1; }
          [[ "$DELETION_ADMIN_PASSWORD_PRESENT" == true ]] || { echo '::error::PACK1_DELETION_ADMIN_PASSWORD is not provisioned.'; exit 1; }
          [[ "$DELETE_EMAIL_KEY" == re_* && ${#DELETE_EMAIL_KEY} -gt 3 ]] || { echo '::error::PACK1_ACCOUNT_DELETE_RESEND_API_KEY is not provisioned or is malformed.'; exit 1; }
          [[ "$APPLE_TEAM_ID_PRESENT" == true ]] || { echo '::error::APPLE_TEAM_ID is not provisioned.'; exit 1; }
          [[ "$APPLE_SIGN_IN_KEY_ID_PRESENT" == true ]] || { echo '::error::APPLE_SIGN_IN_KEY_ID is not provisioned.'; exit 1; }
          [[ "$APPLE_SIGN_IN_KEY_P8_PRESENT" == true ]] || { echo '::error::APPLE_SIGN_IN_KEY_P8 is not provisioned.'; exit 1; }

