name: test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore: ['.github/model-rollout-request.json']

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          output="$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/ci-change-scope.mjs --force broad --github-output "$output"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if ! git fetch --no-tags origin main:refs/remotes/origin/main; then
              echo '::warning::Unable to fetch origin/main; running broad validation.'
              node scripts/ci-change-scope.mjs --force broad --github-output "$output"
              exit 0
            fi
            if ! base="$(git merge-base origin/main "$PR_HEAD_SHA")"; then
              echo '::warning::Unable to compute merge base; running broad validation.'
              node scripts/ci-change-scope.mjs --force broad --github-output "$output"
              exit 0
            fi
            node scripts/ci-change-scope.mjs --base "$base" --head "$PR_HEAD_SHA" --github-output "$output"
            exit 0
          fi
          if [[ "$PUSH_BEFORE" =~ ^[a-f0-9]{40}$ && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            node scripts/ci-change-scope.mjs --base "$PUSH_BEFORE" --head "$GITHUB_SHA" --github-output "$output"
          else
            echo '::warning::Push base is unavailable; running broad validation.'
            node scripts/ci-change-scope.mjs --force broad --github-output "$output"
          fi

      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git merge-base origin/main "$PR_HEAD_SHA")"
          git diff --check "$base" "$PR_HEAD_SHA"

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.profile == 'standard' || steps.scope.outputs.profile == 'heavy' || steps.scope.outputs.profile == 'broad'
        with:
          python-version: '3.12'

      - name: Verify deployment bundles and embedded revisions
        if: steps.scope.outputs.build_bundles == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-audit --no-fund esbuild@0.28.2
          ESBUILD_BIN="$RUNNER_TEMP/release-tools/node_modules/.bin/esbuild" node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$GITHUB_SHA"

      - name: Validate publication-only source
        if: steps.scope.outputs.profile == 'publication'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-campaign-links.mjs --check
          node scripts/check-creator-challenges.mjs
          node --test             tests/ci-change-scope.test.mjs             tests/campaign-links.test.mjs             tests/campaign-link-publish.test.mjs             tests/creator-challenges.test.mjs             tests/publication-pr-checks.test.mjs
          printf '%s\n' publication > "$RUNNER_TEMP/ci-selected-validation"

      - name: Validate documentation-only change
        if: steps.scope.outputs.profile == 'docs'
        run: |
          echo 'Documentation-only change: diff integrity passed; no product suite selected.'
          printf '%s\n' docs > "$RUNNER_TEMP/ci-selected-validation"

      - name: Validate native-mobile required-check contract
        if: steps.scope.outputs.profile == 'mobile'
        run: |
          node --test tests/ci-workflow-policy.test.mjs
          printf '%s\n' mobile > "$RUNNER_TEMP/ci-selected-validation"

      - name: Validate workflow and helper contracts
        if: steps.scope.outputs.profile == 'ci'
        run: |
          npm run test:syntax
          node --test \
            tests/ci-workflow-policy.test.mjs \
            tests/workflow-block-scalars.test.mjs \
            tests/publication-pr-checks.test.mjs \
            tests/browser-replay-hydration.test.mjs
          printf '%s\n' ci > "$RUNNER_TEMP/ci-selected-validation"

      - name: Validate static presentation
        if: steps.scope.outputs.profile == 'static'
        run: |
          node --test tests/editorial.test.mjs tests/surface-focus.test.mjs tests/module-cache-version.test.mjs
          printf '%s\n' static > "$RUNNER_TEMP/ci-selected-validation"

      - name: Run application tests without replay corpus hydration
        if: steps.scope.outputs.profile == 'standard'
        run: |
          npm test
          printf '%s\n' standard > "$RUNNER_TEMP/ci-selected-validation"

      - name: Hydrate replay shards from R2
        if: steps.scope.outputs.hydrate_replays == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: bash scripts/hydrate-replay-shards.sh

      - name: Run heavy or fail-closed tests with replay shards required
        if: (steps.scope.outputs.profile == 'heavy' || steps.scope.outputs.profile == 'broad') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REQUIRE_REPLAY_SHARDS: '1'
        run: npm test

      - name: Run fork heavy tests without private replay shards
        if: (steps.scope.outputs.profile == 'heavy' || steps.scope.outputs.profile == 'broad') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm test

      - name: Audit production datasets
        if: steps.scope.outputs.audit_datasets == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python scripts/audit_datasets.py --fail-on-error

      - name: Mark heavy validation complete
        if: success() && (steps.scope.outputs.profile == 'heavy' || steps.scope.outputs.profile == 'broad')
        shell: bash
        run: printf '%s\n' "${{ steps.scope.outputs.profile }}" > "$RUNNER_TEMP/ci-selected-validation"

      - name: Verify selected validation completed
        if: always()
        shell: bash
        env:
          EXPECTED_PROFILE: ${{ steps.scope.outputs.profile }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ci-selected-validation" || {
            echo "::error::No selected validation path completed for profile $EXPECTED_PROFILE."
            exit 1
          }
          actual="$(cat "$RUNNER_TEMP/ci-selected-validation")"
          [[ "$actual" == "$EXPECTED_PROFILE" ]] || {
            echo "::error::Completed validation '$actual' does not match selected profile '$EXPECTED_PROFILE'."
            exit 1
          }
          echo "Selected CI validation passed: $EXPECTED_PROFILE"
