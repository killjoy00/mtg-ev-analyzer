name: Patch challenge start once

on:
  push:
    branches:
      - feature/growth-loop-sprint
    paths:
      - scripts/patch_challenge_start.py
      - .github/workflows/patch-challenge-start-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply analytics timing fix
        run: python scripts/patch_challenge_start.py
      - name: Run tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit fix
        run: |
          rm scripts/patch_challenge_start.py .github/workflows/patch-challenge-start-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make challenge-start analytics race-proof"
          git push origin HEAD:feature/growth-loop-sprint
