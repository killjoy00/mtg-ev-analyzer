name: Retired data cleanup
on:
  push:
    branches: [main]
    paths: [data/selection-policy.json, scripts/purge_retired_data.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Purge retired replay objects
        run: python scripts/purge_retired_data.py --remote
      - name: Remove pre-policy trophy caches so retired source archives cannot be restored
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("trophies-")) | .id' > /tmp/retired-cache-ids
          while read -r cache_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
          done < /tmp/retired-cache-ids
