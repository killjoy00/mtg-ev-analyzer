name: Technical debt refactor follow-up

on:
  push:
    branches:
      - refactor/technical-debt-cleanup
    paths:
      - .github/workflows/technical-debt-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/technical-debt-cleanup
          fetch-depth: 0

      - name: Tighten architecture cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'growth.mjs',
              'Your Pack 1 identity now follows you across devices.',
              'Your Pack One identity now follows you across devices.',
              'account branding',
          )
          replace_once(
              'app.js',
              '<button class="button primary" id="another-full">Draft another Pack 1</button>',
              '<button class="button primary" id="another-full">New pack</button>',
              'full pack result button',
          )

          replay = Path('replay-data.mjs').read_text()
          replay = replay.replace(
              "picks: Array.isArray(replay.picks)\n? replay.picks.map((pick) => ({ ...pick, candidates: sortPackByRarity(pick.candidates || []) }))\n: replay.picks,",
              "picks: Array.isArray(replay.picks)\n          ? replay.picks.map((pick) => ({ ...pick, candidates: sortPackByRarity(pick.candidates || []) }))\n          : replay.picks,",
          )
          replay = replay.replace(
              "if (isCatalog(url)) {\ncatalogSnapshot = data;\nscheduleWarm();\n        }",
              "if (isCatalog(url)) {\n          catalogSnapshot = data;\n          scheduleWarm();\n        }",
          )
          Path('replay-data.mjs').write_text(replay)

          Path('tests/architecture.test.mjs').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';

          function source(path) {
            return readFileSync(new URL(`../${path}`, import.meta.url), 'utf8');
          }

          const lifecycleModules = [
            'render-lifecycle.mjs',
            'bootstrap.mjs',
            'product.mjs',
            'flow-fixes.mjs',
            'growth.mjs',
            'retention.mjs',
            'social.mjs',
          ];

          test('one centralized render lifecycle owns DOM mutation observation', () => {
            const sources = lifecycleModules.map(source);
            const observerCount = sources.reduce(
              (sum, text) => sum + (text.match(/\bnew MutationObserver\b/g)?.length || 0),
              0,
            );
            assert.equal(observerCount, 1);
            assert.match(source('render-lifecycle.mjs'), /new MutationObserver/);
            for (const path of lifecycleModules.filter((path) => path !== 'render-lifecycle.mjs')) {
              assert.doesNotMatch(source(path), /\bnew MutationObserver\b/, `${path} must subscribe to the shared lifecycle`);
            }
          });

          test('replay loading never monkeypatches global fetch', () => {
            const sources = ['bootstrap.mjs', 'replay-data.mjs', 'app.js', 'social.mjs'].map(source).join('\n');
            assert.doesNotMatch(sources, /globalThis\.fetch\s*=/);
            assert.match(source('app.js'), /loadReplayJson/);
            assert.match(source('social.mjs'), /loadReplayJson/);
          });

          test('obsolete patch modules stay removed', () => {
            const root = new URL('../', import.meta.url);
            assert.equal(existsSync(new URL('human-copy.mjs', root)), false);
            assert.equal(existsSync(new URL('replay-runtime.mjs', root)), false);
            assert.doesNotMatch(source('bootstrap.mjs'), /human-copy|replay-runtime/);
            assert.doesNotMatch(source('package.json'), /human-copy|replay-runtime/);
          });

          test('the page has one stylesheet entrypoint and no inline style block', () => {
            const html = source('index.html');
            assert.doesNotMatch(html, /<style(?:\s|>)/i);
            const stylesheets = [...html.matchAll(/<link[^>]+rel="stylesheet"[^>]+href="([^"]+)"/gi)].map((match) => match[1]);
            assert.deepEqual(stylesheets, ['pack1.css?v=3']);
          });
          '''.replace('\n          ', '\n').lstrip())
          PY

      - name: Verify full test suite
        run: npm test

      - name: Verify diff
        run: git diff --check

      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name "pack-one-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add architecture guardrails"
          git push origin HEAD:refactor/technical-debt-cleanup
