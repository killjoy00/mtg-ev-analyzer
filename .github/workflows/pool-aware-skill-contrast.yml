name: Pool-aware refit - skill-aware contrast

on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-skill-contrast.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pool-aware-skill-contrast
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python scripts/pool_aware_skill_contrast.py --self-test
          python scripts/test_pool_aware_archive.py
          python scripts/pool_aware_fast_fit.py
  measure:
    needs: preflight
    name: Skill contrast - ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        set: [dft, tdm, ktk, hob, powered-cube, eoe, fin, ecl, tmt, sos]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: scripts:.
      AWS_DEFAULT_REGION: auto
      RESEARCH_SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Restore successful original statistical report
        if: "!contains(fromJSON('[\"ecl\",\"tmt\"]'), matrix.set)"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45917142265
          name: pool-aware-score-report-${{ matrix.set }}
          path: artifacts/skill/prior
      - name: Restore successful P1P2 statistical report
        if: contains(fromJSON('["ecl","tmt"]'), matrix.set)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45919980278
          name: pool-aware-score-report-${{ matrix.set }}
          path: artifacts/skill/prior
      - name: Restore exact prior Cube metadata
        if: matrix.set == 'powered-cube'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45907384134
          name: pool-aware-development-powered-cube
          path: artifacts/skill/rules
      - name: Restore exact prior Khans metadata
        if: matrix.set == 'ktk'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45909032928
          name: pool-aware-development-ktk
          path: artifacts/skill/rules
      - name: Pin prior windows and rules
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil,os,hashlib
          from pathlib import Path
          sid=os.environ['RESEARCH_SET']
          root=Path('artifacts/skill')
          p=json.loads((root/'prior/score-report.json').read_text())['provenance']
          assert p['set']==sid
          folder=root/'input'
          folder.mkdir(parents=True,exist_ok=True)
          source=root/'rules/metadata/rules.json.gz' if sid in ('powered-cube','ktk') else Path(f'research/data/{sid}-rules-context-2026-10-29.json.gz')
          shutil.copyfile(source,folder/'rules.json.gz')
          assert hashlib.sha256((folder/'rules.json.gz').read_bytes()).hexdigest()==p['sources']['metadata']
          (folder/'windows.json').write_text(json.dumps(p['windows'],indent=2)+'\n')
          (folder/'purge.txt').write_text(str(p['purge_days']))
          PY
      - name: Restore exact source archives, no uploads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          input=artifacts/skill/input
          python -u scripts/pool_aware_restore.py --set "$RESEARCH_SET" --metadata "$input/rules.json.gz" --windows "$input/windows.json" --purge-days "$(cat "$input/purge.txt")"
      - name: Fit both cohorts and compare scoring on identical validation choices
        run: |
          python -u scripts/pool_aware_skill_contrast.py --manifest "raw-data/pool-refit/$RESEARCH_SET/manifest.json" --prior-report artifacts/skill/prior/score-report.json --output artifacts/skill/result
      - name: Retain aggregate fit and score report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-skill-report-${{ matrix.set }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/skill/result/score-report.json
      - name: Transfer minimal anonymous score bank
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-skill-bank-${{ matrix.set }}
          retention-days: 1
          if-no-files-found: error
          path: artifacts/skill/result/
  aggregate:
    if: always() && needs.preflight.result == 'success' && needs.measure.result != 'cancelled'
    needs: [preflight, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pool-aware-skill-bank-*
          path: artifacts/skill/sets
      - name: Combine all measured formats and evaluate fixed gates
        run: python -u scripts/pool_aware_skill_contrast.py --aggregate artifacts/skill/sets --output artifacts/skill/combined-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-skill-combined-report
          retention-days: 90
          if-no-files-found: error
          path: artifacts/skill/combined-report.json
