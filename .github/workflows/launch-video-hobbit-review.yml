name: Hobbit Launch Video Review Build

on:
  push:
    branches:
      - content/launch-video-review-20261019
    paths:
      - .github/workflows/launch-video-hobbit-review.yml
      - docs/marketing/launch-video/**

permissions:
  contents: read

jobs:
  inspect-production-project:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source renderer and edit timeline
        run: |
          echo '===== PACKAGED README ====='
          unzip -p docs/marketing/launch-video/pack-one-launch-editable-project.zip README.md
          echo '===== RENDERER ====='
          unzip -p docs/marketing/launch-video/pack-one-launch-editable-project.zip build_video.py
          echo '===== TIMELINE ====='
          unzip -p docs/marketing/launch-video/pack-one-launch-editable-project.zip timeline.json
