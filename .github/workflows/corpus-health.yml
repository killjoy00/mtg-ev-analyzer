name: Reviewed full corpus health
on:
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [development, production]
        default: development
        required: true
permissions:
  contents: read
concurrency:
  group: packone-corpus-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g neon@4.17.4
      - name: Verify current corpus without changing source payloads or publication
        run: |
          set -euo pipefail
          umask 077
          case "$TARGET" in
            development) branch=br-twilight-hill-ayffyd2b ;;
            production) branch=br-orange-feather-ayps8kep ;;
            *) exit 1 ;;
          esac
          connection=$(neon connection-string "$branch" --project-id patient-shadow-91417882 --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          printf '%s' "$connection" > "$RUNNER_TEMP/health.connection"
          DATABASE_URL="$connection" node scripts/verify-neon-schema.mjs
          node scripts/check-corpus-health.mjs "$RUNNER_TEMP/health.connection" | tee corpus-health-summary.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-health-${{ inputs.target || 'production' }}
          path: corpus-health-summary.jsonl
