name: iOS TestFlight

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-testflight.yml'
  push:
    branches:
      - 'chatgpt/pack-one-mobile-v2-ios-testflight'
    paths:
      - '.github/ios-testflight-request.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-smoke:
    name: production iOS archive structure
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production mobile config
        run: npm test
      - name: Generate production iOS project
        env:
          CI: '1'
          PACKONE_BUILD_PROFILE: production
        run: npx expo prebuild --platform ios --clean
      - name: Archive iPhone device build without signing
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); schemes=data.get("workspace",{}).get("schemes",[]); print(schemes[0] if schemes else "")')"
          test -n "$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PackOne.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
          test -d "$RUNNER_TEMP/PackOne.xcarchive"

  testflight:
    name: sign and upload TestFlight internal build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ASC_KEY_ID: ${{ secrets.PACKONE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.PACKONE_ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.PACKONE_ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.PACKONE_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require Apple distribution credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "Missing required GitHub secret: $name" >&2; exit 1; }
          done
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production mobile config
        run: npm test
      - name: Write App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Generate production iOS project
        env:
          CI: '1'
          PACKONE_BUILD_PROFILE: production
        run: npx expo prebuild --platform ios --clean
      - name: Archive signed Pack One app
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); schemes=data.get("workspace",{}).get("schemes",[]); print(schemes[0] if schemes else "")')"
          test -n "$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PackOne.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive
      - name: Upload to TestFlight Internal Only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
            <key>testFlightInternalTestingOnly</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PackOne.xcarchive" \
            -exportPath "$RUNNER_TEMP/PackOneExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          {
            echo "## Pack One iOS TestFlight upload"
            echo
            echo "- Bundle ID: `pro.packone.app`"
            echo "- App Store Connect app ID: `6814318676`"
            echo "- Distribution: TestFlight Internal Only"
            echo "- Upload completed through authenticated Xcode distribution."
          } >> "$GITHUB_STEP_SUMMARY"
