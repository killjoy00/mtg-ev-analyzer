name: R2 initial replay shard sync

on:
  push:
    branches: [r2-corpus-migration]
    paths:
      - '.github/workflows/r2-initial-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify R2 access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ENDPOINT"
          test -n "$R2_BUCKET"
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" >/dev/null

      - name: Record local replay shard inventory
        shell: bash
        run: |
          set -euo pipefail
          find data -type f -path '*/shards/*.json' -printf '%s\t%p\n' | sort -k2 > /tmp/local-shards.tsv
          count="$(wc -l < /tmp/local-shards.tsv)"
          bytes="$(awk '{sum += $1} END {printf "%.0f", sum}' /tmp/local-shards.tsv)"
          echo "LOCAL_SHARD_COUNT=$count" >> "$GITHUB_ENV"
          echo "LOCAL_SHARD_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "Local shard files: $count"
          echo "Local shard bytes: $bytes"
          test "$count" -gt 0
          test "$bytes" -gt 0

      - name: Upload replay shards to R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync data "s3://$R2_BUCKET/data" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude '*' \
            --include '*/shards/*.json' \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'public, max-age=3600'

      - name: Verify R2 inventory matches local shards
        shell: bash
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix 'data/' \
            --endpoint-url "$R2_ENDPOINT" \
            --output json > /tmp/r2-objects.json
          python - <<'PY'
          import json, os, sys
          payload = json.load(open('/tmp/r2-objects.json'))
          objects = [o for o in payload.get('Contents', []) if '/shards/' in o.get('Key', '') and o.get('Key', '').endswith('.json')]
          remote_count = len(objects)
          remote_bytes = sum(int(o.get('Size') or 0) for o in objects)
          local_count = int(os.environ['LOCAL_SHARD_COUNT'])
          local_bytes = int(os.environ['LOCAL_SHARD_BYTES'])
          print(f'Remote shard files: {remote_count}')
          print(f'Remote shard bytes: {remote_bytes}')
          if remote_count != local_count or remote_bytes != local_bytes:
              print(f'R2 inventory mismatch: local={local_count}/{local_bytes}, remote={remote_count}/{remote_bytes}', file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Verify public CORS and representative JSON
        shell: bash
        run: |
          set -euo pipefail
          samples=(
            'data/hob/shards/000.json'
            'data/powered-cube/shards/000.json'
            'data/stx/shards/000.json'
          )
          for object in "${samples[@]}"; do
            test -f "$object"
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --location \
              --header 'Origin: https://packone.pro' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              --connect-timeout 20 --max-time 60 \
              "https://data.packone.pro/$object")"
            test "$status" = '200'
            allowed="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$headers")"
            test "$allowed" = 'https://packone.pro'
            python - "$body" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          assert isinstance(payload.get('replays'), list) and payload['replays'], 'missing replays'
          PY
            echo "$object: public CORS + JSON OK"
          done

      - name: Summary
        shell: bash
        run: |
          {
            echo '## R2 initial shard migration'
            echo "- Files: $LOCAL_SHARD_COUNT"
            echo "- Bytes: $LOCAL_SHARD_BYTES"
            echo '- Bucket API access: OK'
            echo '- Public custom domain: OK'
            echo '- CORS for https://packone.pro: OK'
            echo '- Representative shard JSON: OK'
            echo '- Source GitHub data was not deleted or modified.'
          } >> "$GITHUB_STEP_SUMMARY"
