name: inspect recorded distributed latency failures
on:
  push:
    branches: ['diagnostics/1051-nat-report']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: killjoy00/mtg-ev-analyzer
          run-id: 37588116932
          github-token: ${{ github.token }}
          pattern: distributed-capacity-1-runner-*
          path: reports
      - name: Print bounded latency and phase evidence from recorded reports
        run: |
          python3 - <<'PY'
          import json, pathlib
          def inspect(obj, file):
            if isinstance(obj, dict):
              if 'root_failure' in obj:
                root=obj.get('root_failure') or {}
                print(json.dumps({'kind':'root_failure','file':file,'stage':obj.get('stage'),'shard':obj.get('shard'),'category':root.get('category'),'reason':root.get('reason'),'latency':root.get('latency')}))
              requests=obj.get('requests')
              if isinstance(requests,list):
                for route in ['start','reroll','read','view','pick']:
                  rows=sorted([r for r in requests if isinstance(r,dict) and r.get('route')==route and isinstance(r.get('ms'),(int,float))],key=lambda r:r['ms'],reverse=True)[:3]
                  for row in rows:
                    print(json.dumps({'kind':'slow_request','file':file,'stage':obj.get('stage'),'shard':obj.get('shard'),'route':route,'ms':row.get('ms'),'status':row.get('status'),'endpoint':row.get('endpoint'),'diagnostics':row.get('diagnostics')}))
              for key,value in obj.items():
                if key != 'requests': inspect(value,file)
            elif isinstance(obj,list):
              for value in obj: inspect(value,file)
          for path in pathlib.Path('reports').rglob('*.json'):
            try: inspect(json.loads(path.read_text()),path.name)
            except (ValueError,UnicodeError): pass
          PY
