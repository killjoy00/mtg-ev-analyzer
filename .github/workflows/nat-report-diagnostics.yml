name: daily concurrency regression
on:
  push:
    branches: ['diagnostics/1051-nat-report']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise overlapping Daily generation
        run: node --test tests/daily-schedule-concurrency.test.mjs
