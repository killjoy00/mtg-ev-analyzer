name: Native Android tablet store captures

on:
  pull_request:
    paths:
      - '.github/workflows/android-tablet-store-captures.yml'
      - '.github/scripts/capture-android-tablet-screenshots.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tablet-store-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated unsigned Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_PACKONE_ENV: preview
      EXPO_PUBLIC_PACKONE_SCREENSHOT_FIXTURES: '1'
      EXPO_PUBLIC_PACKONE_API_ORIGIN: https://example.invalid
      PACKONE_BUILD_PROFILE: preview
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Install Android screenshot image tools
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate preview Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Resolve exact Android toolchain cache inputs
        id: toolchain-inputs
        run: python3 scripts/prepare-android-toolchain.py --outputs
      - name: Restore verified Android SDK packages
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/ndk/${{ steps.toolchain-inputs.outputs.ndk_version }}
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/cmake/3.22.1
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/platforms/android-36
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/build-tools/36.0.0
          key: ${{ steps.toolchain-inputs.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}
      - name: Verify and prepare SDK dependencies before the app build
        id: prepare-toolchain
        timeout-minutes: 12
        run: python3 scripts/prepare-android-toolchain.py
      - name: Save only verified SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/ndk/${{ steps.toolchain-inputs.outputs.ndk_version }}
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/cmake/3.22.1
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/platforms/android-36
            ${{ steps.toolchain-inputs.outputs.sdk_root }}/build-tools/36.0.0
          key: ${{ steps.toolchain-inputs.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}
      - name: Compute unsigned Gradle cache key
        id: gradle-cache
        env:
          PACKONE_GRADLE_CACHE_JAVA: '17'
        run: node scripts/gradle-cache-key.mjs
      - name: Restore shared unsigned Gradle dependencies and build state
        id: gradle-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/node_modules/**/.cxx
          key: ${{ steps.gradle-cache.outputs.key }}
          restore-keys: |
            ${{ steps.gradle-cache.outputs.restore_key }}
      - name: Resolve Gradle plugin dependencies with bounded HTTP recovery
        working-directory: mobile/android
        timeout-minutes: 9
        run: node ../scripts/prepare-gradle-dependencies.mjs
      - name: Build installable preview APK
        id: apk-build
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/native-build
          ./gradlew :app:assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64 2>&1 | tee ../../artifacts/native-build/gradle.log
      - name: Save successful unsigned Gradle build state
        if: steps.gradle-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/node_modules/**/.cxx
          key: ${{ steps.gradle-cache.outputs.key }}
      - name: Locate preview APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -size +1M -print -quit)"
          test -f "$apk"
          echo "SCREENSHOT_ANDROID_APK=$GITHUB_WORKSPACE/mobile/$apk" >> "$GITHUB_ENV"
      - name: Preserve exact unsigned preview APK
        uses: actions/upload-artifact@v4
        with:
          name: tablet-preview-apk
          path: ${{ env.SCREENSHOT_ANDROID_APK }}
          if-no-files-found: error
          retention-days: 14

  capture:
    name: Capture native ${{ matrix.size }} tablet
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: seven-inch
            profile: 'Nexus 7 2013'
            display: '1215x2160'
          - size: ten-inch
            profile: 'Nexus 10'
            display: '1620x2880'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tablet-preview-apk
          path: preview-apk
      - name: Enable KVM for Android emulator when available
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            ls -l /dev/kvm
          else
            echo "No /dev/kvm exposed on this hosted runner; emulator action may fall back to software acceleration."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lossless screenshot encoder
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Capture the actual Android tablet interface
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          TABLET_SIZE: ${{ matrix.size }}
          TABLET_PROFILE: ${{ matrix.profile }}
          TABLET_DISPLAY: ${{ matrix.display }}
          ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/capture-android-tablet-screenshots.py
      - name: Preserve genuine tablet screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-android-${{ matrix.size }}-store-screenshots
          path: tablet-store-captures/${{ matrix.size }}
          if-no-files-found: error
          retention-days: 30
