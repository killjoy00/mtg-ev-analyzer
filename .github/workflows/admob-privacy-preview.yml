name: AdMob privacy preview

on:
  pull_request:
    paths:
      - '.github/workflows/admob-privacy-preview.yml'
      - 'mobile/modules/packone-admob-privacy/**'
      - 'mobile/plugins/with-admob-rdp.cjs'
      - 'mobile/src/ads/privacyQa.ts'

permissions:
  contents: read

concurrency:
  group: admob-privacy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_PACKONE_ENV: preview
  PACKONE_BUILD_PROFILE: preview
  PACKONE_ADMOB_TEST_BANNERS: '1'
  PACKONE_ADMOB_PRIVACY_QA: '1'

jobs:
  android:
    name: Build and audit Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_PACKONE_AD_PROBE: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate preview project
        run: |
          node scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --clean
          python3 scripts/prepare-android-toolchain.py
      - name: Build and audit packaged permissions
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" | sed -n '1p' | grep -F "package: name='pro.packone.preview'"
          "$aapt" dump permissions "$apk" > "$RUNNER_TEMP/pack-one-admob-permissions.txt"
          if grep -E '(com\.google\.android\.gms\.permission\.AD_ID|android\.permission\.ACCESS_ADSERVICES_(AD_ID|TOPICS|ATTRIBUTION))' "$RUNNER_TEMP/pack-one-admob-permissions.txt"; then
            echo "::error::Privacy preview APK still includes an advertising identifier or AdServices permission."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pack-one-admob-privacy-preview-android
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/pack-one-admob-permissions.txt
          if-no-files-found: error
          retention-days: 7
