name: postdeploy live smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser dependency
        run: npm install --no-save playwright@1.55.0
      - name: Verify deployed Pages release
        run: node tests/postdeploy-live-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdeploy-live-smoke
          path: artifacts/postdeploy-*.png
          if-no-files-found: ignore
