name: build Cube image refresh function

on:
  push:
    branches: [fix-cube-standard-images]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            worker/draft-run-function.mjs
            worker/growth-function.js
            worker/trophy-import.mjs
            worker/trophy-import-auth.mjs
            worker/draft-run-pool.mjs
            corpus/draft-run/catalog.json
            draft-run.mjs
            scoring.mjs
            gameplay.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bundle Draft Run function
        run: |
          set -euo pipefail
          mkdir -p dist
          npx --yes esbuild@0.25.9 worker/draft-run-function.mjs \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node24 \
            --minify \
            --outfile=dist/index.mjs
          node --check dist/index.mjs
          wc -c dist/index.mjs
          sha256sum dist/index.mjs
      - name: Package Neon function
        run: |
          set -euo pipefail
          (cd dist && zip -9 ../draftrun-function.zip index.mjs)
          ls -lh draftrun-function.zip
          sha256sum draftrun-function.zip
      - uses: actions/upload-artifact@v4
        with:
          name: draftrun-cube-image-refresh-bundle
          path: draftrun-function.zip
          if-no-files-found: error
          retention-days: 1
