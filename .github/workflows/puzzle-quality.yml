name: Offline puzzle quality contracts
on:
  pull_request:
    paths:
      - 'scripts/puzzle_quality*.py'
      - 'scripts/card_strength_benchmark.py'
      - 'tests/test_puzzle_quality.py'
      - 'research/puzzle-quality-v1.json'
      - 'research/card-strength-requirements.txt'
      - '.github/workflows/puzzle-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/card-strength-requirements.txt
      - run: python -m pip install -r research/card-strength-requirements.txt
      - run: python -m unittest discover -s tests -p test_puzzle_quality.py -v
      - run: python -m unittest discover -s tests -p test_card_strength_benchmark.py -v
