name: Temporary leaderboard-name patcher

on:
  push:
    branches:
      - feat/editable-leaderboard-name

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editable-leaderboard-name
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply feature patch
        run: node scripts/apply-leaderboard-name-feature.mjs
      - name: Run unit and syntax tests
        run: npm test
      - name: Commit patched source
        run: |
          rm scripts/apply-leaderboard-name-feature.mjs
          rm .github/workflows/_temp_apply_leaderboard_name.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add editable leaderboard names'
          git push origin HEAD:feat/editable-leaderboard-name
