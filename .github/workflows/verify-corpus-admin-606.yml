name: verify corpus admin 606 closeout
run-name: verify corpus admin 606 closeout

# Read-only closeout for the exact #614 production release. The promotion run
# completed deployment and acceptance, but its final probe appended an
# unsupported query parameter to the otherwise valid gateway health route.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-corpus-admin-606.yml

permissions:
  contents: read

concurrency:
  group: verify-corpus-admin-606
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: patient-shadow-91417882
      RELEASE_COMMIT: 2d64266bb6a154b266f3a7ccdc61826f23e7994a
      DEV_BRANCH: br-twilight-hill-ayffyd2b
      PROD_BRANCH: br-orange-feather-ayps8kep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Neon CLI
        run: npm install -g neon@4.17.4

      - name: Verify exact release markers directly and through the public gateway
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const expected=process.env.RELEASE_COMMIT;
          const direct=[
            ['draftrunapi','https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech/health?quick=1'],
            ['pack1growth','https://br-orange-feather-ayps8kep-pack1growth.compute.c-5.us-east-2.aws.neon.tech/health?quick=1'],
            ['pack1api','https://br-orange-feather-ayps8kep-pack1api.compute.c-5.us-east-2.aws.neon.tech/health?quick=1'],
          ];
          const read=async(url)=>{
            const response=await fetch(url,{headers:{'cache-control':'no-cache',pragma:'no-cache'},signal:AbortSignal.timeout(30000)});
            const body=await response.json();
            assert.equal(response.status,200,JSON.stringify(body));
            assert.equal(body.ok,true,JSON.stringify(body));
            assert.equal(body.release_commit,expected,JSON.stringify(body));
            return body;
          };
          for(const [service,url] of direct) {
            await read(url);
            console.log(`${service} serves ${expected}`);
          }
          for(let attempt=1;attempt<=6;attempt++) {
            await read('https://api.packone.pro/draft/health?quick=1');
            if(attempt<6)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          console.log(`public gateway held ${expected} for 25s`);
          NODE

      - name: Verify corrected static corpus module is live
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --max-time 60 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            https://packone.pro/admin/corpus.mjs -o "$RUNNER_TEMP/live-corpus.mjs"
          grep -Fq 'Serving revision' "$RUNNER_TEMP/live-corpus.mjs"
          grep -Fq 'Active serving' "$RUNNER_TEMP/live-corpus.mjs"
          grep -Fq 'Source snapshots' "$RUNNER_TEMP/live-corpus.mjs"
          echo 'Corrected corpus admin frontend remains live.'

      - name: Verify development fixture cleanup
        shell: bash
        run: |
          set -euo pipefail
          connection=$(neon connection-string "$DEV_BRANCH" --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          admin_count=$(psql "$connection" -v ON_ERROR_STOP=1 -Atc 'SELECT count(*) FROM pack1_admins')
          test "$admin_count" = 0 || { echo "::error::Development temporary admin fixture was not removed (count=$admin_count)."; exit 1; }
          echo 'Development temporary admin fixture is clean.'

      - name: Verify authenticated live corpus contract
        shell: bash
        env:
          CORPUS_FILE: ${{ runner.temp }}/corpus-production.json
        run: |
          set -euo pipefail
          connection=$(neon connection-string "$PROD_BRANCH" --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          token=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          csrf=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          echo "::add-mask::$token"
          echo "::add-mask::$csrf"
          session_hash=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
          csrf_hash=$(printf '%s' "$csrf" | sha256sum | cut -d' ' -f1)
          admin_id=$(psql "$connection" -v ON_ERROR_STOP=1 -Atc 'SELECT auth_user_id::text FROM pack1_admins ORDER BY auth_user_id LIMIT 1')
          test -n "$admin_id"
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            psql "$connection" -v ON_ERROR_STOP=1 --set=session_hash="$session_hash" >/dev/null <<'SQL'
          DELETE FROM account_sessions WHERE session_hash=:'session_hash';
          SQL
            exit "$status"
          }
          trap cleanup EXIT
          psql "$connection" -v ON_ERROR_STOP=1 --set=session_hash="$session_hash" --set=auth_user_id="$admin_id" --set=csrf_hash="$csrf_hash" >/dev/null <<'SQL'
          INSERT INTO account_sessions(session_hash,auth_user_id,csrf_hash,expires_at)
          VALUES (:'session_hash', :'auth_user_id'::uuid, :'csrf_hash', now()+interval '15 minutes');
          SQL
          curl -fsS --retry 4 --retry-all-errors --max-time 120 \
            -H "Cookie: __Host-pack1_account=$token" -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            https://api.packone.pro/draft/v1/admin/corpus -o "$CORPUS_FILE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const data=JSON.parse(fs.readFileSync(process.env.CORPUS_FILE,'utf8'));
          const own=(row,key)=>Object.prototype.hasOwnProperty.call(row,key);
          const yes=value=>value===true||value==='t';
          for(const key of ['sets','snapshots','components','history','blocked_sources'])assert.ok(Array.isArray(data[key]),`${key} array`);
          assert.ok(data.corpus_version,'corpus_version');
          assert.notEqual(data.serving_revision,null,'serving_revision');
          assert.ok(data.sets.length,'sets');
          const setFields=['active_snapshot_id','serving_parent_count','serving_component_count','active_snapshot_retained_count','staged_count','historical_retained_count'];
          assert.ok(data.sets.some(row=>setFields.every(key=>own(row,key))),'new set reporting fields');
          const snapshotFields=['source_snapshot_id','retained_count','eligible_count','serving_count','active','environment_status','lifecycle_status'];
          assert.ok(data.snapshots.some(row=>snapshotFields.every(key=>own(row,key))),'new snapshot reporting fields');
          const live=data.sets.find(row=>row.status==='Live'&&row.active_snapshot_id);
          assert.ok(live,'a Live set with an active snapshot');
          const snapshot=data.snapshots.find(row=>row.source_snapshot_id===live.active_snapshot_id);
          assert.ok(snapshot,'active snapshot inventory row');
          assert.ok(yes(snapshot.active),'active snapshot flag');
          assert.equal(snapshot.environment_status,'Live');
          assert.equal(Number(live.serving_count),Number(live.serving_parent_count)+Number(live.serving_component_count));
          assert.equal(Number(live.serving_parent_count),Number(snapshot.serving_count));
          assert.equal(Number(live.active_snapshot_retained_count),Number(snapshot.retained_count));
          console.log(JSON.stringify({serving_revision:data.serving_revision,sets:data.sets.length,snapshots:data.snapshots.length,live_set:live.set_id},null,2));
          NODE

      - name: Record closeout evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Corpus admin #606 production closeout'
            echo
            echo "- Exact deployed revision: \`$RELEASE_COMMIT\`"
            echo '- Public gateway health: verified with the permitted `?quick=1` query'
            echo '- Static admin module: verified live'
            echo '- Development fixture cleanup: verified'
            echo '- Authenticated production corpus contract: verified'
          } >> "$GITHUB_STEP_SUMMARY"
