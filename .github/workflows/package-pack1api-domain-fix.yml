name: Package pack1api domain fix

on:
  push:
    branches:
      - domain/packone-pro-runtime

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, '[pack1api-bundle]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: domain/packone-pro-runtime
      - name: Build complete pack1api bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack1api artifacts/domain-cutover
          cp worker/index.js /tmp/pack1api/index.js
          cp worker/core.mjs /tmp/pack1api/core.mjs
          cp worker/path-model.mjs /tmp/pack1api/path-model.mjs
          (cd /tmp/pack1api && zip -q /tmp/pack1api.zip index.js core.mjs path-model.mjs)
          cp /tmp/pack1api.zip artifacts/domain-cutover/pack1api.zip
      - name: Upload corrected bundle
        uses: actions/upload-artifact@v4
        with:
          name: pack1api-domain-fix
          path: artifacts/domain-cutover/pack1api.zip
          if-no-files-found: error
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/package-pack1api-domain-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-time pack1api packager [pack1api-bundle]'
          git push origin HEAD:domain/packone-pro-runtime
