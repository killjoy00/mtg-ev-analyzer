name: Live production browser verification
on:
  workflow_dispatch:
    inputs:
      first_environment:
        description: 'Daily to run first'
        type: choice
        options: [mixed, powered-cube, latest]
        default: mixed
        required: true
      measurement_mode:
        description: 'Measure only the first Daily and skip pre-click account navigation'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: production-browser-verification
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
      - name: Complete live Daily browser verification
        env:
          PACK1_DAILY_FIRST: ${{ inputs.first_environment }}
          PACK1_DAILY_MEASUREMENT: ${{ inputs.measurement_mode && '1' || '0' }}
        run: node tests/production-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-verification
          path: artifacts/production
          retention-days: 30
