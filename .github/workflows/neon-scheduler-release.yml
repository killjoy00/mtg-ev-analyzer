name: Neon scheduler release

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Enable the reviewed production schedulers or disable them'
        type: choice
        options: [enable, disable]
        default: enable
        required: true
      commit:
        description: 'Exact current main SHA required when enabling'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pack1-neon-scheduler-release
  cancel-in-progress: false

jobs:
  schedulers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTION: ${{ inputs.action }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require reviewed current main when enabling
        if: env.ACTION == 'enable'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Enable requires an exact commit SHA.'; exit 1; }
          git fetch --no-tags origin main
          test "$RELEASE_COMMIT" = "$(git rev-parse origin/main)"
          git checkout --detach "$RELEASE_COMMIT"

      - name: Verify scheduler-aware production functions are live
        if: env.ACTION == 'enable'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT="$RELEASE_COMMIT" node --input-type=module <<'NODE'
          const commit=process.env.RELEASE_COMMIT;
          const roots=[
            'https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech',
            'https://br-orange-feather-ayps8kep-pack1growth.compute.c-5.us-east-2.aws.neon.tech',
          ];
          for(const root of roots){
            const response=await fetch(root+'/health?quick=1',{redirect:'error',signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('Production scheduler health check failed.');
            const data=await response.json();
            if(data.release_commit!==commit)throw Error('Production scheduler function revision does not match reviewed main.');
          }
          NODE

      - name: Reconcile production Neon Function Triggers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY"
          node scripts/reconcile-neon-schedulers.mjs "$ACTION" | tee "$RUNNER_TEMP/neon-schedulers.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/neon-schedulers.json','utf8'));
          const lines=[
            '# Neon schedulers',
            '',
            `- enabled: ${data.enabled}`,
            `- branch: ${data.branch_id}`,
            '',
            '| trigger | enabled | next run (UTC) |',
            '|---|---|---|',
            ...data.results.map(row=>`| ${row.name} | ${row.enabled} | ${row.next_run_at||''} |`),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
