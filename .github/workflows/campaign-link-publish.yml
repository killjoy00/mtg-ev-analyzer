name: publish Pack One campaign link
run-name: publish ${{ inputs.kind }} / ${{ inputs.slug }} / ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Publication kind
        required: true
        default: campaign
        type: string
      operation:
        description: Reconciliation operation reference
        required: false
        default: none
        type: string
      creator_action:
        description: Creator route action
        required: false
        default: publish
        type: string
      creator_challenge_id:
        description: Creator challenge UUID
        required: false
        default: ''
        type: string
      creator_name:
        description: Sanitized creator public name
        required: false
        default: ''
        type: string
      creator_headline:
        description: Sanitized creator campaign headline
        required: false
        default: ''
        type: string
      creator_score:
        description: Authoritative creator score
        required: false
        default: ''
        type: string
      creator_environment:
        description: Authoritative creator environment
        required: false
        default: ''
        type: string
      creator_source_type:
        description: Authoritative creator source type
        required: false
        default: ''
        type: string
      creator_source_day:
        description: Historical Daily date when applicable
        required: false
        default: ''
        type: string
      slug:
        description: Canonical /go/ slug
        required: true
        type: string
      destination:
        description: Pack One destination
        required: true
        default: /
        type: string
      source:
        description: Canonical acquisition source
        required: true
        type: string
      campaign:
        description: Canonical campaign name
        required: true
        type: string
      medium:
        description: Optional canonical acquisition medium
        required: false
        default: ''
        type: string
      social_title:
        description: Optional Pack One social title
        required: false
        default: ''
        type: string
      social_description:
        description: Optional Pack One social description
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

concurrency:
  group: packone-campaign-link-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CAMPAIGN_SLUG: ${{ inputs.slug }}
      CAMPAIGN_DESTINATION: ${{ inputs.destination }}
      CAMPAIGN_SOURCE: ${{ inputs.source }}
      CAMPAIGN_NAME: ${{ inputs.campaign }}
      CAMPAIGN_MEDIUM: ${{ inputs.medium }}
      CAMPAIGN_SOCIAL_TITLE: ${{ inputs.social_title }}
      CAMPAIGN_SOCIAL_DESCRIPTION: ${{ inputs.social_description }}
      PUBLISH_KIND: ${{ inputs.kind }}
      PUBLISH_OPERATION: ${{ inputs.operation }}
      CREATOR_ACTION: ${{ inputs.creator_action }}
      CREATOR_CHALLENGE_ID: ${{ inputs.creator_challenge_id }}
      CREATOR_NAME: ${{ inputs.creator_name }}
      CREATOR_HEADLINE: ${{ inputs.creator_headline }}
      CREATOR_SCORE: ${{ inputs.creator_score }}
      CREATOR_ENVIRONMENT: ${{ inputs.creator_environment }}
      CREATOR_SOURCE_TYPE: ${{ inputs.creator_source_type }}
      CREATOR_SOURCE_DAY: ${{ inputs.creator_source_day }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward to latest reviewed main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        if: inputs.kind == 'creator' && inputs.creator_action == 'publish'
        with:
          python-version: '3.12'

      - name: Install creator card renderer
        if: inputs.kind == 'creator' && inputs.creator_action == 'publish'
        run: python3 -m pip install --quiet 'Pillow==11.3.0'

      - name: Prepare deterministic campaign route
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_KIND" == "creator" ]]; then
            node scripts/prepare-creator-challenge-publish.mjs
            if [[ "$CREATOR_ACTION" == "publish" ]]; then
              python3 scripts/generate-creator-social-card.py \
                --output "go/${CAMPAIGN_SLUG}/creator-card.png" \
                --creator "$CREATOR_NAME" \
                --score "$CREATOR_SCORE" \
                --environment "$CREATOR_ENVIRONMENT" \
                --source-type "$CREATOR_SOURCE_TYPE" \
                --source-day "$CREATOR_SOURCE_DAY"
            fi
          elif [[ "$PUBLISH_KIND" == "campaign" ]]; then
            node scripts/prepare-campaign-link-publish.mjs
          else
            echo "::error::Unknown publication kind: $PUBLISH_KIND"
            exit 1
          fi

      - name: Validate generated source
        run: |
          node scripts/generate-campaign-links.mjs --check
          node scripts/check-creator-challenges.mjs
          npm test

      - name: Publish automation branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_KIND" == "creator" ]]; then
            branch="automation/creator-challenge-${CAMPAIGN_SLUG}-${PUBLISH_OPERATION:0:8}"
          else
            branch="automation/campaign-link-${CAMPAIGN_SLUG}"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$PUBLISH_KIND" == "creator" ]]; then
            git add creator-challenges.json "go/${CAMPAIGN_SLUG}"
          else
            git add campaign-links.json "go/${CAMPAIGN_SLUG}/index.html"
          fi
          if git diff --cached --quiet; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Requested route state is already present on main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$PUBLISH_KIND" == "creator" ]]; then
            git commit -m "${CREATOR_ACTION^} creator challenge: ${CAMPAIGN_SLUG}"
          else
            git commit -m "Publish campaign link: ${CAMPAIGN_SLUG}"
          fi
          head_sha="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Open protected-main pull request
        if: steps.branch.outputs.already_published != 'true'
        id: pr
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            if [[ "$PUBLISH_KIND" == "creator" ]]; then
              pr_title="${CREATOR_ACTION^} creator challenge: ${CAMPAIGN_SLUG}"
              pr_body="Admin-requested Pack One creator challenge publication. The immutable source association and sanitized static route were generated deterministically; required test and browser checks are dispatched explicitly before merge."
            else
              pr_title="Publish campaign link: ${CAMPAIGN_SLUG}"
              pr_body="Admin-requested Pack One vanity link publication. The route and registry entry were generated deterministically; required test and browser checks are dispatched explicitly before merge."
            fi
            if ! pr_url="$(gh pr create --base main --head "$BRANCH" --title "$pr_title" --body "$pr_body")"; then
              echo "::error::GitHub Actions is not allowed to create pull requests for this repository. Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
              echo "The validated automation branch is \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Campaign publication PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch required checks
        if: steps.branch.outputs.already_published != 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run test.yml --ref "$BRANCH"
          gh workflow run e2e.yml --ref "$BRANCH"

      - name: Wait for required checks
        if: steps.branch.outputs.already_published != 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          wait_for_workflow() {
            local workflow="$1"
            local label="$2"
            for attempt in $(seq 1 120); do
              runs="$(gh run list --workflow "$workflow" --branch "$BRANCH" --event workflow_dispatch                 --limit 20 --json databaseId,headSha,status,conclusion,url)"
              row="$(printf '%s' "$runs" | jq -r --arg sha "$HEAD_SHA"                 '[.[] | select(.headSha==$sha)][0] | if . then [.databaseId,.status,(.conclusion // ""),.url] | @tsv else "" end')"
              if [[ -n "$row" ]]; then
                IFS=$'\t' read -r run_id status conclusion run_url <<< "$row"
                if [[ "$status" == completed ]]; then
                  if [[ "$conclusion" == success ]]; then
                    echo "$label passed: $run_url" >> "$GITHUB_STEP_SUMMARY"
                    return 0
                  fi
                  echo "::error::$label failed with conclusion $conclusion: $run_url"
                  return 1
                fi
              fi
              sleep 10
            done
            echo "::error::Timed out waiting for $label."
            return 1
          }
          wait_for_workflow test.yml test
          wait_for_workflow e2e.yml browser

      - name: Merge checked campaign PR
        if: steps.branch.outputs.already_published != 'true'
        shell: bash
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --squash --delete-branch
          echo "Merged campaign publication PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Request Pages build from merged main
        if: steps.branch.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/pages-build.json
          for attempt in $(seq 1 120); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status')"
            if [[ "$status" == built ]]; then
              echo "GitHub Pages build completed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == errored ]]; then
              echo "::error::GitHub Pages build failed."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for GitHub Pages build."
          exit 1

      - name: Verify live vanity route
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const slug=process.env.CAMPAIGN_SLUG;
          const expected=new URL(process.env.CAMPAIGN_DESTINATION,'https://packone.pro');
          expected.searchParams.set('utm_source',process.env.CAMPAIGN_SOURCE);
          expected.searchParams.set('utm_campaign',process.env.CAMPAIGN_NAME);
          if(process.env.CAMPAIGN_MEDIUM)expected.searchParams.set('utm_medium',process.env.CAMPAIGN_MEDIUM);
          const live='https://packone.pro/go/'+slug+'/';
          const marker='location.replace('+JSON.stringify(expected.toString())+')';
          let last='';
          for(let attempt=0;attempt<36;attempt++) {
            try {
              const response=await fetch(live,{headers:{'cache-control':'no-cache'}});
              const html=await response.text();
              if(response.ok&&html.includes(marker)) {
                console.log('Published '+live+' -> '+expected);
                process.exit(0);
              }
              last='HTTP '+response.status;
            } catch(error) {
              last=String(error?.message||error);
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw new Error('Live campaign route verification failed: '+last);
          NODE
          echo "Published https://packone.pro/go/${CAMPAIGN_SLUG}/" >> "$GITHUB_STEP_SUMMARY"
