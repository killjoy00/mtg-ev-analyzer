name: isolated practice performance comparison
on:
  pull_request:
    paths:
      - 'scripts/practice-performance.mjs'
      - 'scripts/practice-reroll-performance.mjs'
      - 'scripts/practice-cache-publication.mjs'
      - 'worker/draft-run-selection.mjs'
      - 'migrations/0039_practice_serving_cache.sql'
      - 'migrations/0045_batched_practice_selector.sql'
      - 'migrations/0050_practice_recency_bias.sql'
      - 'tests/practice-performance.test.mjs'
      - '.github/workflows/practice-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: practice-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  checked-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require passing CI for the unchanged PR head before creating a copy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEWED_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const {GITHUB_REPOSITORY:repo,GH_TOKEN:token,REVIEWED_HEAD:head,REVIEWED_PR:pr}=process.env;
          const headers={authorization:'Bearer '+token,accept:'application/vnd.github+json'};
          async function get(path) {
            const response=await fetch('https://api.github.com/repos/'+repo+path,{headers,redirect:'error',signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200,'GitHub CI gate read');
            return response.json();
          }
          let accepted=false;
          for(let attempt=0;attempt<80;attempt++) {
            const [pull,checks]=await Promise.all([get('/pulls/'+pr),get('/commits/'+head+'/check-runs?per_page=100')]);
            assert.equal(pull.head.sha,head,'reviewed source head must remain unchanged');
            assert.equal(pull.state,'open','performance acceptance is for the open reviewed PR');
            const latest=new Map();
            for(const check of checks.check_runs) {
              if(check.head_sha===head&&check.app?.slug==='github-actions'&&['test','browser'].includes(check.name)&&!latest.has(check.name))latest.set(check.name,check);
            }
            const required=['test','browser'].map(name=>latest.get(name));
            if(required.every(check=>check?.status==='completed'&&check.conclusion==='success')) {accepted=true;break;}
            assert.ok(!required.some(check=>check?.status==='completed'&&check.conclusion!=='success'),'required CI must pass before disposable database writes');
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.ok(accepted,'required CI did not finish within the source gate');
          console.log('Unchanged PR source passed test and browser CI.');
          NODE
  baseline:
    needs: checked-source
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Set emergency expiry
        id: expiry
        run: echo "expires_at=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Create disposable production-sized copy
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: patient-shadow-91417882
          parent_branch: br-orange-feather-ayps8kep
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: practice-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          database: pack1
          role: pack1_owner
          suspend_timeout: 300
          expires_at: ${{ steps.expiry.outputs.expires_at }}
      - name: Install batched selector function
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          psql -X -d "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0045_batched_practice_selector.sql
          psql -X -d "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0050_practice_recency_bias.sql
      - name: Verify isolated target, build derived cache and compare selection
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PACK1_BENCHMARK_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PACK1_BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PACK1_BENCHMARK_SAMPLES: '3'
          PACK1_BENCHMARK_CACHE: '1'
        run: node scripts/practice-performance.mjs
      - name: Verify concurrent publication rollback and bulk trigger cost
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PACK1_BENCHMARK_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: node scripts/practice-cache-publication.mjs
      - name: Diagnose reroll latency and an isolated candidate index
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PACK1_BENCHMARK_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: node scripts/practice-reroll-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-performance-${{ github.run_id }}
          path: artifacts/practice-performance
          retention-days: 30
      - name: Delete this disposable copy
        if: always() && steps.neon.outputs.branch_id != '' && steps.neon.outputs.created == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: patient-shadow-91417882
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
