name: inspect Cloudflare routing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-audit-request.txt'

permissions:
  contents: read

concurrency:
  group: cloudflare-read-only-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read a limited Cloudflare routing inventory
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
        run: node scripts/audit-cloudflare.mjs "$RUNNER_TEMP/cloudflare-routing.json"
      - name: Save the sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-routing-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-routing.json
          retention-days: 7
          if-no-files-found: error
