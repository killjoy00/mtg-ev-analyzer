name: contextual-value-v1-four-way-assessment

on:
  workflow_dispatch:
  push:
    branches:
      - research/contextual-value-v1-h-freeze-audit-529
    paths:
      - '.github/workflows/contextual-value-v1-four-way-assessment.yml'

permissions:
  actions: read
  contents: read

env:
  CORE_RUN: '36256947308'
  FROZEN_RUN: '36337059424'
  BASE: https://17lands-public.s3.amazonaws.com/analysis_data
  PYTHONUNBUFFERED: '1'

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned numeric dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2' 'scikit-learn==1.9.1'

      - name: Compile locked assessment
        run: python -m py_compile research/contextual_value_four_way_assessment.py research/contextual_value_four_way_fresh.py

      - name: Download original immutable cohort manifest
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-preprocessed-core-8000
          path: frozen-cohort
          run-id: ${{ env.CORE_RUN }}
          github-token: ${{ github.token }}

      - name: Download frozen four-way score bundle
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-four-way-freeze
          path: frozen-models
          run-id: ${{ env.FROZEN_RUN }}
          github-token: ${{ github.token }}

      - name: Download fresh confirmation reports
        uses: actions/download-artifact@v4
        with:
          pattern: contextual-value-v1-four-way-fresh-*
          path: fresh-reports
          merge-multiple: false
          run-id: ${{ env.FROZEN_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen protocol identity before assessment data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          cohort=json.load(open('frozen-cohort/cohort-manifest.json'))
          freeze=json.load(open('frozen-models/four-way-freeze.json'))
          assert len(cohort['selected_drafts']) == 8000
          assert freeze['assessment_opened'] is False
          assert freeze['assessment_outcomes_used'] is False
          assert freeze['parity']['passed'] is True
          assert freeze['fingerprint_sha256'] == 'd1f3cb78d1674b1424805b33637c89d3f3977baa890db61ff534fa7700cb5f33'
          assert freeze['models'] == ['H','J','N','Q']
          counts={s:sum(r['split']==s for r in cohort['selected_drafts']) for s in ('train','validation','assessment')}
          assert counts['assessment'] > 0
          print(json.dumps({'selected_drafts':8000,'split_counts':counts,'bundle_fingerprint':freeze['fingerprint_sha256'],'assessment_opened':False},sort_keys=True))
          PY

      - name: Download exact core 17Lands Premier archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-data
          for EXPANSION in MSH SOS ECL TLA; do
            curl --fail --location --retry 5 --retry-delay 3 --output "raw-data/draft-$EXPANSION.csv.gz" "$BASE/draft_data/draft_data_public.$EXPANSION.PremierDraft.csv.gz"
            curl --fail --location --retry 5 --retry-delay 3 --output "raw-data/game-$EXPANSION.csv.gz" "$BASE/game_data/game_data_public.$EXPANSION.PremierDraft.csv.gz"
          done

      - name: Verify archive snapshots before opening assessment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifest=json.load(open('frozen-cohort/archive-manifest.json'))
          for row in manifest['archives']:
              p=pathlib.Path('raw-data')/pathlib.Path(row['path']).name
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              actual=h.hexdigest()
              if actual != row['sha256']:
                  raise SystemExit(f"archive drift: {p.name} {actual} != {row['sha256']}")
          print('all original archive hashes verified; assessment may now open')
          PY

      - name: Run one-shot frozen four-way locked assessment
        shell: bash
        run: |
          set -euo pipefail
          FRESH=()
          for EXPANSION in EOE FIN TDM DFT; do
            FRESH+=(--fresh-report "fresh-reports/contextual-value-v1-four-way-fresh-$EXPANSION/report.json")
          done
          python3 research/contextual_value_four_way_assessment.py \
            --draft-archive raw-data/draft-MSH.csv.gz --game-archive raw-data/game-MSH.csv.gz \
            --draft-archive raw-data/draft-SOS.csv.gz --game-archive raw-data/game-SOS.csv.gz \
            --draft-archive raw-data/draft-ECL.csv.gz --game-archive raw-data/game-ECL.csv.gz \
            --draft-archive raw-data/draft-TLA.csv.gz --game-archive raw-data/game-TLA.csv.gz \
            --cohort-manifest frozen-cohort/cohort-manifest.json \
            --archive-manifest frozen-cohort/archive-manifest.json \
            --freeze-json frozen-models/four-way-freeze.json \
            --freeze-q-pickle frozen-models/four-way-rich-q.pkl \
            "${FRESH[@]}" \
            --output results/contextual-value-v1/four-way-assessment/report.json

      - name: Assert assessment is scored once and never fit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('results/contextual-value-v1/four-way-assessment/report.json'))
          assert r['phase'] == 'four_way_locked_assessment'
          assert r['assessment_opened'] is True
          assert r['assessment_outcomes_loaded'] is True
          assert r['assessment_outcomes_used_for_fit'] is False
          assert r['assessment_outcomes_used_for_scoring'] is True
          assert r['model_tuning_authorized'] is False
          assert set(r['gates']) == {'H','J','N','Q'}
          print(json.dumps({'decision':r['decision'],'confirmed':r['familywise_confirmed_models'],'leader':r['unique_assessment_leader']},sort_keys=True))
          PY

      - name: Upload locked assessment report
        uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-four-way-assessment
          path: results/contextual-value-v1/four-way-assessment/report.json
          retention-days: 90