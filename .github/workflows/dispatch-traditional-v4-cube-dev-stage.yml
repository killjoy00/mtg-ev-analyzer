name: One-shot Traditional v4 Cube development staging dispatcher

on:
  push:
    branches:
      - ops/traditional-v4-dev-stage-20260921
    paths:
      - .github/workflows/dispatch-traditional-v4-cube-dev-stage.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch-cube:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Require successful regular v4 development staging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run watch 35675750660 --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Dispatch and verify reviewed Cube development stage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=publish-puzzle-components.yml
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 50 --json databaseId --jq '.[].databaseId' | sort -n)"

          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main \
            -f target=development \
            -f action=stage \
            -f source=v4-powered-cube

          id=""
          for attempt in $(seq 1 60); do
            after="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 50 --json databaseId --jq '.[].databaseId' | sort -n)"
            id="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -n 1)"
            if [[ -n "$id" ]]; then break; fi
            sleep 2
          done
          test -n "$id"

          gh run view "$id" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
            --jq '. + {source:"v4-powered-cube",target:"development",action:"stage",run_id:.databaseId} | del(.databaseId)' \
            > ops/traditional-v4-cube-stage-result.json

          set +e
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status
          rc=$?
          set -e

          gh run view "$id" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
            --jq '. + {source:"v4-powered-cube",target:"development",action:"stage",run_id:.databaseId} | del(.databaseId)' \
            > ops/traditional-v4-cube-stage-result.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/traditional-v4-cube-stage-result.json
          git commit -m "Record Traditional v4 Cube development stage [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

          exit "$rc"
