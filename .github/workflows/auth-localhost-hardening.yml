name: prove Neon Auth localhost behavior in QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/auth-localhost-hardening-request.json'
      - '.github/workflows/auth-localhost-hardening.yml'
      - 'scripts/auth-localhost-hardening.mjs'
      - 'tests/auth-localhost-hardening.test.mjs'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: pack1-auth-localhost-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_BIN: ${{ runner.temp }}/neon-tools/node_modules/.bin/neon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Neon CLI
        run: npm install --prefix "$RUNNER_TEMP/neon-tools" --no-audit --no-fund neon@4.17.4
      - name: Prove localhost capability in QA and restore QA
        run: node scripts/auth-localhost-hardening.mjs qa
