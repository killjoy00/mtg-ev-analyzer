name: harden production Neon Auth localhost

on:
  push:
    branches: [main]
    paths:
      - '.github/auth-localhost-hardening-request.json'
      - '.github/workflows/auth-localhost-hardening.yml'
      - 'scripts/auth-localhost-hardening.mjs'
      - 'tests/auth-localhost-hardening.test.mjs'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - '.github/auth-localhost-hardening-request.json'
      - '.github/workflows/auth-localhost-hardening.yml'
      - 'scripts/auth-localhost-hardening.mjs'
      - 'tests/auth-localhost-hardening.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack1-auth-localhost-hardening
  cancel-in-progress: false

jobs:
  qa-mutation-opt-in:
    name: require explicit QA mutation opt-in
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require approval for this exact PR revision
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected="AUTH_HARDENING_QA_MUTATION_APPROVED=$HEAD_SHA"
          if ! printf '%s\n' "$PR_BODY" | grep -Fqx "$expected"; then
            echo "This PR changes Auth-hardening trigger paths that can mutate QA Neon Auth." >&2
            echo "Explicit per-revision opt-in required: $expected" >&2
            exit 1
          fi

  qa:
    needs: qa-mutation-opt-in
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Neon CLI
        run: npm install --prefix "$RUNNER_TEMP/neon-tools" --no-audit --no-fund neon@5.0.0
      - name: Prove localhost capability in QA and restore QA
        env:
          NEON_BIN: ${{ runner.temp }}/neon-tools/node_modules/.bin/neon
        run: node scripts/auth-localhost-hardening.mjs qa

  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PACK1_DELETION_ADMIN_EMAIL: ${{ secrets.PACK1_DELETION_ADMIN_EMAIL }}
      PACK1_DELETION_ADMIN_PASSWORD: ${{ secrets.PACK1_DELETION_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Neon CLI
        run: npm install --prefix "$RUNNER_TEMP/neon-tools" --no-audit --no-fund neon@5.0.0
      - name: Disable production localhost allowance and verify auth flows
        env:
          NEON_BIN: ${{ runner.temp }}/neon-tools/node_modules/.bin/neon
        run: node scripts/auth-localhost-hardening.mjs production
