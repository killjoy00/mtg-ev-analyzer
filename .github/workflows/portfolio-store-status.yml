name: Portfolio store status (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * *'
  pull_request:
    paths:
      - '.github/portfolio-status/**'
      - '.github/workflows/portfolio-store-status.yml'
  push:
    branches: [main]
    paths:
      - '.github/portfolio-status/**'
      - '.github/workflows/portfolio-store-status.yml'
permissions:
  contents: read
concurrency:
  group: portfolio-store-status
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/portfolio-status -p 'test_*.py'
  apple:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pack-one-mobile-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require current reviewed main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - run: python3 -m pip install --quiet 'PyJWT[crypto]==2.10.1'
      - name: Read Apple release lifecycle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 .github/portfolio-status/portfolio_apple_status.py "$RUNNER_TEMP/apple.json"
      - uses: actions/upload-artifact@v4
        with:
          name: public-apple-release-status
          path: ${{ runner.temp }}/apple.json
          retention-days: 7
          if-no-files-found: error
  play:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pack-one-mobile-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require current reviewed main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Authenticate to Google Play via existing protected workload identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Read Play release lifecycle without edits
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 .github/portfolio-status/portfolio_play_status.py "$RUNNER_TEMP/play.json"
      - uses: actions/upload-artifact@v4
        with:
          name: public-play-release-status
          path: ${{ runner.temp }}/play.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [apple, play]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.apple.result == 'success' || needs.play.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.apple.result == 'success'
        with:
          name: public-apple-release-status
          path: ${{ runner.temp }}/portfolio-status
      - uses: actions/download-artifact@v4
        if: needs.play.result == 'success'
        with:
          name: public-play-release-status
          path: ${{ runner.temp }}/portfolio-status
      - name: Publish only validated public evidence to dedicated status issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/portfolio-status/publish_status_issue.py "$RUNNER_TEMP/portfolio-status"
