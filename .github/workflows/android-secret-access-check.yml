name: Android secret access check

on:
  push:
    branches:
      - 'chatgpt/pack-one-mobile-v2-android-internal-testing'
    paths:
      - '.github/workflows/android-secret-access-check.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: pack-one
      - name: Verify secret access
        run: |
          set -euo pipefail
          gcloud secrets versions access 1 --project=pack-one --secret=packone-android-upload-keystore-b64 >/dev/null
          gcloud secrets versions access 1 --project=pack-one --secret=packone-android-upload-password >/dev/null
          echo "Android secret access verified."
