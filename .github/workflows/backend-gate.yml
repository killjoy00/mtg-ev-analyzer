name: backend schema gate

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'draft-run.mjs'
      - 'draft-run-policy.mjs'
      - 'daily-selection.mjs'
      - 'draft-run-difficulty.mjs'
      - 'data/selection-policy.json'
      - 'game-date.mjs'
      - 'tests/*backend-smoke.mjs'
      - 'scripts/verify-neon-schema.mjs'
      - 'scripts/load_verified_draft_run.mjs'
      - 'scripts/*corpus*manifest.mjs'
      - 'scripts/load*tro*.mjs'
      - 'scripts/backend-gate-scope.mjs'
      - 'scripts/backend-gate-map.json'
      - 'tests/backend-gate-scope.test.mjs'
      - '.github/workflows/prepare-rebuild.yml'
      - '.github/workflows/backend-gate.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  precheck:
    name: backend schema gate precheck
    runs-on: ubuntu-latest
    outputs:
      needs_neon: ${{ steps.scope.outputs.needs_neon }}
      full_suite: ${{ steps.scope.outputs.full_suite }}
      domains: ${{ steps.scope.outputs.domains }}
      domains_json: ${{ steps.scope.outputs.domains_json }}
      suites_json: ${{ steps.scope.outputs.suites_json }}
      season_destructive: ${{ steps.scope.outputs.season_destructive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify backend scope classifier
        run: node --test tests/backend-gate-scope.test.mjs
      - name: Detect Neon integration scope
        id: scope
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          fail_closed() {
            echo 'needs_neon=true' >> "$GITHUB_OUTPUT"
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            echo 'domains=' >> "$GITHUB_OUTPUT"
            echo 'domains_json=["account","subscriptions","draft_run","daily","corpus","seasons"]' >> "$GITHUB_OUTPUT"
            echo 'suites_json=[]' >> "$GITHUB_OUTPUT"
            echo 'season_destructive=true' >> "$GITHUB_OUTPUT"
          }
          if ! git fetch --no-tags origin main:refs/remotes/origin/main; then
            echo '::warning::Unable to fetch origin/main; forcing the full Neon integration suite.'
            fail_closed
            exit 0
          fi
          if ! stack_base_sha="$(git merge-base origin/main "$HEAD_SHA")"; then
            echo '::warning::Unable to compute stack merge base; forcing the full Neon integration suite.'
            fail_closed
            exit 0
          fi
          mapfile -t changed_files < <(git diff --name-only "$stack_base_sha" "$HEAD_SHA")
          printf 'Stack changes from %s to %s:\n' "$stack_base_sha" "$HEAD_SHA"
          printf ' - %s\n' "${changed_files[@]}"
          if ! node scripts/backend-gate-scope.mjs "${changed_files[@]}"; then
            echo '::warning::Backend classifier failed; forcing the full Neon integration suite.'
            fail_closed
          fi

  backend-domain:
    name: backend ${{ matrix.domain }}
    needs: precheck
    # Fork PRs do not receive repository secrets. Keep them skipped rather than
    # failing or ever pointing the fixture suites at the production branch.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && (needs.precheck.result != 'success' || needs.precheck.outputs.needs_neon != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.precheck.outputs.domains_json || '["account","subscriptions","draft_run","daily","corpus","seasons"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Neon CI credential
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY" || {
            echo '::error::NEON_API_KEY is not configured. Add the Neon GitHub Integration or a repository Actions secret before enabling this gate.'
            exit 1
          }

      - name: Set emergency branch expiry
        id: expiry
        shell: bash
        run: echo "expires_at=$(date -u --date '+4 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create isolated Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: patient-shadow-91417882
          api_key: ${{ secrets.NEON_API_KEY }}
          # Explicit parent: never inherit Neon's default-branch label (see docs/DATABASE-RECOVERY.md).
          parent_branch: br-orange-feather-ayps8kep
          branch_name: ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.domain }}
          database: pack1
          role: pack1_owner
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Prepare isolated connection
        shell: bash
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo 'Neon branch did not return a database URL.'; exit 1; }
          connection_file="$RUNNER_TEMP/pack1-ci.connection"
          printf '%s' "$DATABASE_URL" > "$connection_file"
          chmod 600 "$connection_file"
          echo "PACK1_CI_CONNECTION=$connection_file" >> "$GITHUB_ENV"

      - name: Apply pending migrations
        shell: bash
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          stack_base_sha="$(git merge-base origin/main "$HEAD_SHA")"
          echo "STACK_BASE_SHA=$stack_base_sha" >> "$GITHUB_ENV"

          mapfile -t migration_changes < <(git diff --name-status "$stack_base_sha" "$HEAD_SHA" -- 'migrations/*.sql')
          for change in "${migration_changes[@]}"; do
            status="${change%%$'\t'*}"
            path="${change#*$'\t'}"
            if [[ "$status" != 'A' ]]; then
              echo "::error file=$path::Existing migration files are immutable in backend-gated PRs; add a new migration instead (status $status)."
              exit 1
            fi
          done

          # Disposable CI branches are cloned from the deployed Neon default branch,
          # which can lag Git main. Replay the known additive/repeatable mobile release
          # backlog until those migrations are promoted, then add migrations introduced
          # by this PR. This keeps merged-but-not-deployed schema prerequisites available
          # without blindly replaying historical migrations.
          release_backlog=(migrations/0037_mobile_oauth_handoffs.sql migrations/0038_mobile_practice_idempotency.sql migrations/0039_practice_serving_cache.sql migrations/0040_mobile_minimum_version.sql migrations/0040_practice_reroll_index.sql migrations/0041_corpus_source_snapshots.sql migrations/0041_apple_auth.sql migrations/0042_serving_revision_snapshot_staging.sql migrations/0043_corpus_activation_readiness.sql migrations/0044_snapshot_scoped_puzzle_uniqueness.sql migrations/0045_apple_subscriptions.sql migrations/0046_public_identity_safety.sql migrations/0047_admin_user_account_controls.sql)
          mapfile -t pending < <(
            {
              for migration in "${release_backlog[@]}" migrations/0048_uncapped_v5_components.sql migrations/0049_cross_version_corpus_cutover.sql; do
                [[ -f "$migration" ]] && printf '%s\n' "$migration"
              done
              printf '%s\n' "${migration_changes[@]}" | awk -F '\t' '$1 == "A" { print $2 }'
            } | sort -u
          )
          if (( ${#pending[@]} == 0 )); then
            echo 'No pending migrations in this PR.'
          else
            for migration in "${pending[@]}" migrations/0048_uncapped_v5_components.sql migrations/0049_cross_version_corpus_cutover.sql; do
              echo "Applying $migration"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            done
          fi

      - name: Resolve accepted v5 fixtures for custom Practice domains
        id: v5_fixture
        if: matrix.domain == 'corpus' || matrix.domain == 'subscriptions'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {DRAFT_RUN_CORPUS_VERSION,V5_CORPUS_VERSION} from './draft-run.mjs';
          import {corpusDatabase} from './scripts/neon-corpus-db.mjs';
          if(DRAFT_RUN_CORPUS_VERSION===V5_CORPUS_VERSION) {
            const query=corpusDatabase(process.env.PACK1_CI_CONNECTION);
            const active=(await query(`SELECT count(*)::int n FROM draft_run_environment_policy p
              JOIN corpus_source_snapshots s ON s.source_snapshot_id=p.active_snapshot_id
              WHERE p.set_id IN ('blb','hob','msh','neo') AND p.status='Live'
                AND s.corpus_version=$1 AND s.lifecycle_status='Approved'`,[V5_CORPUS_VERSION])).rows[0];
            if(Number(active.n)===4)process.exit(0); // deployed v5 clones already have complete fixtures
            const release=JSON.parse(fs.readFileSync('research/v5-validated-release.json'));
            const id=String(release.run_id);
            if(!/^[1-9][0-9]{4,20}$/.test(id))throw Error('Invalid accepted candidate run');
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`,{
              headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('Cannot verify candidate workflow');
            const run=await response.json();
            if(run.conclusion!=='success'||run.head_branch!=='main'||run.event!=='workflow_dispatch'||
              run.path!=='.github/workflows/rebuild-v5-draft-run-corpus.yml'||run.head_sha!==release.commit)
              throw Error('Fixture must come from the exact successful main candidate');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_id=${id}\n`);
          }
          NODE

      - uses: actions/download-artifact@v4
        if: steps.v5_fixture.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.v5_fixture.outputs.run_id }}
          name: validated-v5-candidate-${{ steps.v5_fixture.outputs.run_id }}
          path: generated/v5-ci-candidate

      - name: Run isolated backend domain
        shell: bash
        env:
          PACK1_CI_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BACKEND_DOMAIN: ${{ matrix.domain }}
          V5_FIXTURE_RUN_ID: ${{ steps.v5_fixture.outputs.run_id }}
        run: |
          set -euo pipefail
          connection="$(cat "$PACK1_CI_CONNECTION")"

          # Always-run foundation for every isolated backend group.
          DATABASE_URL="$connection" node scripts/verify-neon-schema.mjs
          psql "$connection" -v ON_ERROR_STOP=1 -c "DELETE FROM draft_run_readiness_keys"
          node tests/season-backend-smoke.mjs "$PACK1_CI_CONNECTION" --production-bootstrap

          # A corpus bump (or loader/import change) must still prove that the
          # checked-in corpus can be loaded before production serves it.
          if git diff --quiet "$STACK_BASE_SHA" "$HEAD_SHA" -- 'corpus/draft-run/**' scripts/load_verified_draft_run.mjs worker/trophy-import.mjs; then
            echo 'No corpus or loader/import changes; using the cloned production corpus.'
          else
            node scripts/load_verified_draft_run.mjs "$PACK1_CI_CONNECTION"
          fi
          if [[ -n "$V5_FIXTURE_RUN_ID" ]]; then
            node tests/v5-backend-corpus-fixture.mjs "$PACK1_CI_CONNECTION" generated/v5-ci-candidate --dev-fixtures
          fi

          mapfile -t targeted_suites < <(
            BACKEND_DOMAIN="$BACKEND_DOMAIN" node -e '
              const fs = require("node:fs");
              const map = JSON.parse(fs.readFileSync("scripts/backend-gate-map.json", "utf8"));
              const suites = map.domains?.[process.env.BACKEND_DOMAIN]?.suites;
              if (!Array.isArray(suites) || suites.length === 0) process.exit(2);
              for (const suite of suites) console.log(suite);
            '
          )
          echo "Backend routing domain: $BACKEND_DOMAIN"

          for suite in "${targeted_suites[@]}"; do
            [[ -n "$suite" ]] || continue
            # The destructive season suite is deliberately deferred to the end.
            [[ "$suite" == 'tests/season-backend-smoke.mjs' ]] && continue
            echo "Running isolated backend suite: $suite"
            node "$suite" "$PACK1_CI_CONNECTION" --dev-fixtures
          done

          if [[ "$BACKEND_DOMAIN" == 'seasons' ]]; then
            echo 'Running destructive season fixtures last.'
            node tests/season-backend-smoke.mjs "$PACK1_CI_CONNECTION" --dev-fixtures
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-readiness-isolated-${{ github.run_id }}-${{ matrix.domain }}
          path: artifacts/corpus-readiness
          if-no-files-found: ignore
          retention-days: 30

      - name: Delete isolated Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: patient-shadow-91417882
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}

  backend-gate:
    name: backend-gate
    needs: [precheck, backend-domain]
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && (needs.precheck.result != 'success' || needs.precheck.outputs.needs_neon != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate isolated backend domains
        shell: bash
        env:
          PRECHECK_RESULT: ${{ needs.precheck.result }}
          DOMAIN_RESULT: ${{ needs.backend-domain.result }}
          BACKEND_FULL: ${{ needs.precheck.result != 'success' || needs.precheck.outputs.full_suite != 'false' }}
          DOMAINS_JSON: ${{ needs.precheck.outputs.domains_json }}
        run: |
          set -euo pipefail
          if [[ "$DOMAIN_RESULT" != 'success' ]]; then
            echo "::error::At least one required isolated backend domain was skipped, cancelled, or failed (aggregate result: $DOMAIN_RESULT)."
            exit 1
          fi

          if [[ "$BACKEND_FULL" == 'true' && "$PRECHECK_RESULT" == 'success' ]]; then
            DOMAINS_JSON="$DOMAINS_JSON" node -e '
              const expected = ["account","subscriptions","draft_run","daily","corpus","seasons"].sort();
              const actual = JSON.parse(process.env.DOMAINS_JSON || "[]").sort();
              if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error("Full backend routing omitted a domain: " + JSON.stringify(actual));
              }
            '
          fi

          echo 'All required isolated backend domain jobs succeeded.'
