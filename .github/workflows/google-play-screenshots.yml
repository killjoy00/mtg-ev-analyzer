name: Google Play screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/google-play-screenshot-upload-request.json'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: google-play-screenshot-upload
  cancel-in-progress: false

jobs:
  upload:
    name: upload reviewed Pack One screenshots to Google Play
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: pack-one-mobile-release
    steps:
      - uses: actions/checkout@v4

      - id: request
        name: Resolve reviewed Play screenshot request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          request=json.loads(Path('.github/google-play-screenshot-upload-request.json').read_text())
          expected={'operation','reason','screenshotRunId','screenshotHeadSha'}
          if set(request) != expected:
              raise SystemExit(f'Invalid Google Play screenshot request keys: {sorted(request)}')
          if request.get('operation') != 'upload-pack-one-google-play-screenshots':
              raise SystemExit('Invalid Google Play screenshot upload operation.')
          reason=request.get('reason')
          if not isinstance(reason,str) or not reason.strip():
              raise SystemExit('Google Play screenshot upload reason is required.')
          run_id=request.get('screenshotRunId')
          if not isinstance(run_id,int) or run_id <= 0:
              raise SystemExit('screenshotRunId must be a positive integer.')
          head_sha=request.get('screenshotHeadSha')
          if not isinstance(head_sha,str) or not re.fullmatch(r'[0-9a-f]{40}',head_sha):
              raise SystemExit('screenshotHeadSha must be a full lowercase commit SHA.')
          print(f'run_id={run_id}')
          print(f'head_sha={head_sha}')
          PY

      - name: Require current approved main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse FETCH_HEAD)" ]]

      - name: Validate reviewed Android screenshot artifact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.request.outputs.run_id }}
          EXPECTED_HEAD_SHA: ${{ steps.request.outputs.head_sha }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')"
          workflow_path="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.path')"
          [[ "$head_sha" == "$EXPECTED_HEAD_SHA" ]]
          [[ "$workflow_path" == ".github/workflows/mobile-store-screenshots.yml" ]]
          android_conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "capture Android phone")][-1].conclusion // ""')"
          [[ "$android_conclusion" == "success" ]]

      - name: Download reviewed Android screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: pack-one-android-store-screenshots
          path: play-screenshots
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.run_id }}

      - id: auth
        name: Authenticate to Google Cloud and Google Play
        uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upload Google Play phone screenshots
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SCREENSHOT_ROOT: play-screenshots/android
        run: node .github/scripts/google-play-upload-screenshots.mjs
