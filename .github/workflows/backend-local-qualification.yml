name: local backend qualification
on:
  pull_request:
    paths: ['scripts/run-local-backend-domain.mjs', 'tests/support/local-backend-suite.mjs', 'tests/support/postgres-fixture.mjs', 'tests/local-backend-runner.test.mjs', '.github/workflows/backend-local-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: pack1
          POSTGRES_USER: pack1_ci
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pack1_ci -d pack1"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PACK1_TEST_DATABASE_URL: postgresql://pack1_ci:fixture-only@127.0.0.1:5432/pack1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare real migrations and immutable small corpus
        run: node scripts/prepare-test-database.mjs
      - name: Run all existing account integration assertions unchanged
        run: node scripts/run-local-backend-domain.mjs account
      # Qualification only: the existing Neon gate remains authoritative until
      # this complete domain has passed on the same real PostgreSQL version.
