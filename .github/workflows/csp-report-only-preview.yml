name: CSP Report-Only isolated preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/csp-report-only-preview-server.mjs'
      - 'scripts/build-pages-preview.mjs'
      - 'tests/csp-report-only-preview.test.mjs'
      - 'tests/csp-report-only-preview-e2e.mjs'
      - '.github/workflows/csp-report-only-preview.yml'
      - 'index.html'
      - 'bootstrap.mjs'
      - 'ads.mjs'
      - 'growth.mjs'
      - 'growth-api.mjs'
      - 'practice/**'
      - 'mobile-membership-complete/**'

permissions:
  contents: read

concurrency:
  group: csp-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check safe report-only policy, sanitizer and local-only listener
        run: node --test tests/csp-report-only-preview.test.mjs
      - name: Install browser fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          install_browsers() {
            timeout --kill-after=30 480 "$@" && return 0
            echo '::warning::Playwright dependency installation timed out; retrying.'
            sudo pkill -KILL -x apt-get || true
            for _ in $(seq 60); do pgrep -x 'apt-get|dpkg' >/dev/null || break; sleep 1; done
            sudo dpkg --configure -a || true
            { sudo grep -rlZ 'azure\.archive\.ubuntu\.com' /etc/apt || true; } |
              xargs -0r sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g'
            timeout --kill-after=30 600 "$@"
          }
          install_browsers npx playwright install --with-deps chromium webkit
      - name: Stage exact reviewed public site without deploying
        run: node scripts/build-pages-preview.mjs --out artifacts/csp-report-preview
      - name: Start HTTP Report-Only server restricted to localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup node scripts/csp-report-only-preview-server.mjs --dir artifacts/csp-report-preview >/tmp/csp-local-preview.log 2>&1 &
          echo $! > /tmp/csp-local-preview.pid
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:4175/ -o /dev/null
      - name: Verify Chromium and WebKit report-only behavior
        run: node tests/csp-report-only-preview-e2e.mjs
      - name: Exercise account, ads, gameplay and Practice fixture flows
        shell: bash
        env:
          PACK1_E2E_URL: http://127.0.0.1:4175
        run: |
          set -euo pipefail
          for spec in \
            tests/e2e.mjs \
            tests/sets-e2e.mjs \
            tests/practice-hub-e2e.mjs \
            tests/account-e2e.mjs \
            tests/ads-e2e.mjs \
            tests/profile-e2e.mjs; do
            echo "::group::CSP Report-Only fixture: $spec"
            node --import ./tests/e2e-production-guard.mjs "$spec"
            echo "::endgroup::"
          done
      - name: Save redacted directive and origin counts
        run: |
          node --input-type=module -e '
            import {writeFile} from "node:fs/promises";
            const response=await fetch("http://127.0.0.1:4175/__csp-summary");
            if(!response.ok)throw Error("Missing local report-only summary");
            const summary=await response.json();
            if(summary.total<1)throw Error("No CSP reports collected");
            await writeFile("artifacts/csp-report-only-summary.json",JSON.stringify(summary,null,2)+"\n");
            console.log("Local CSP violations (candidate not enforced): "+JSON.stringify(summary));
          '
      - name: Stop local preview
        if: always()
        run: |
          if [ -f /tmp/csp-local-preview.pid ]; then kill "$(cat /tmp/csp-local-preview.pid)" || true; fi
      - name: Upload aggregate only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csp-report-only-aggregates
          path: artifacts/csp-report-only-summary.json
          retention-days: 7
          if-no-files-found: ignore
