name: a-regret-aggregate-debug-756

on:
  push:
    branches:
      - research/a-regret-bound-756
    paths:
      - .github/workflows/a-regret-aggregate-debug-756.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frozen aggregate interface
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin f3ac148ff16066d1c1c4c59adf33e195e1c222ee
          git show f3ac148ff16066d1c1c4c59adf33e195e1c222ee:research/one_time/a_regret_later_aggregate.py.gz.b64 \
            | base64 -d | gzip -d > /tmp/aggregate.py
          python -m py_compile /tmp/aggregate.py
          grep -n -C 8 -E "input-root|glob|later-report|later-regret|ArgumentParser|def main|bootstrap" /tmp/aggregate.py | head -n 500
