name: Pool-aware skill contrast - full library audit

on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-skill-expansion.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pool-aware-skill-expansion
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python scripts/pool_aware_skill_expansion.py --self-test
          python scripts/test_pool_aware_archive.py
          python scripts/pool_aware_fast_fit.py
  measure:
    needs: preflight
    name: Audit - ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        set: [dft, tdm, ktk, hob, powered-cube, eoe, fin, ecl, tmt, sos, blb, bro, dmu, dsk, fdn, fra, hbg, lci, ltr, mh3, mkm, mom, msh, neo, one, otj, pio, sir, snc, tla, woe]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: scripts:.
      AWS_DEFAULT_REGION: auto
      RESEARCH_SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Recover frozen original skill-contrast coefficients
        if: contains(fromJSON('["dft","tdm","ktk","hob","powered-cube","eoe","fin","ecl","tmt","sos"]'), matrix.set)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45934747442
          name: pool-aware-skill-report-${{ matrix.set }}
          path: artifacts/expansion/prior
      - name: Recover original Cube metadata
        if: matrix.set == 'powered-cube'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45907384134
          name: pool-aware-development-powered-cube
          path: artifacts/expansion/rules
      - name: Recover original Khans metadata
        if: matrix.set == 'ktk'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45909032928
          name: pool-aware-development-ktk
          path: artifacts/expansion/rules
      - name: Restore original rules for the ten locked environments
        run: |
          set -euo pipefail
          mkdir -p artifacts/expansion/input artifacts/expansion/result
          if [ -s artifacts/expansion/prior/score-report.json ]; then
            if [ "$RESEARCH_SET" = ktk ] || [ "$RESEARCH_SET" = powered-cube ]; then
              cp artifacts/expansion/rules/metadata/rules.json.gz artifacts/expansion/input/rules.json.gz
            else
              cp "research/data/$RESEARCH_SET-rules-context-2026-10-29.json.gz" artifacts/expansion/input/rules.json.gz
            fi
          fi
      - name: Restore exact retained public source archives
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -u scripts/pool_aware_skill_expansion.py --stage restore --set "$RESEARCH_SET" --work artifacts/expansion/input --output artifacts/expansion/result
      - name: Verify chronology and freeze rule metadata before reading choices
        run: |
          set -euo pipefail
          args=()
          if [ -s artifacts/expansion/prior/score-report.json ]; then
            args+=(--prior-report artifacts/expansion/prior/score-report.json)
          fi
          python -u scripts/pool_aware_skill_expansion.py --stage inputs --set "$RESEARCH_SET" --work artifacts/expansion/input --output artifacts/expansion/result "${args[@]}"
      - name: Measure frozen recipe and audit contextual scores and actual outcomes
        run: |
          set -euo pipefail
          args=()
          if [ -s artifacts/expansion/prior/score-report.json ]; then
            args+=(--prior-report artifacts/expansion/prior/score-report.json)
          fi
          python -u scripts/pool_aware_skill_expansion.py --stage measure --set "$RESEARCH_SET" --work artifacts/expansion/input --output artifacts/expansion/result "${args[@]}"
      - name: Preserve aggregate report, bounded public card examples and pinned rules
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-expansion-report-${{ matrix.set }}
          retention-days: 90
          if-no-files-found: error
          path: |
            artifacts/expansion/result/report.json
            artifacts/expansion/input/rules.json.gz
            artifacts/expansion/input/metadata-provenance.json
            artifacts/expansion/input/windows.json
      - name: Transfer anonymous source-cluster score bank for paired pooled simulation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-expansion-transfer-${{ matrix.set }}
          retention-days: 1
          if-no-files-found: error
          path: artifacts/expansion/result/
  aggregate:
    if: always() && needs.preflight.result == 'success' && needs.measure.result != 'cancelled'
    needs: [preflight, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pool-aware-expansion-transfer-*
          path: artifacts/expansion/sets
      - name: Aggregate full library, original-ten replication and paired outcome correlations
        run: python -u scripts/pool_aware_skill_expansion.py --aggregate artifacts/expansion/sets --output artifacts/expansion/combined-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-expansion-combined-report
          retention-days: 90
          if-no-files-found: error
          path: artifacts/expansion/combined-report.json
