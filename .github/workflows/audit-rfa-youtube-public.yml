name: Check Published RFA Video Public Page

on:
  push:
    branches:
      - content/launch-video-review-20261019
    paths:
      - .github/workflows/audit-rfa-youtube-public.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public YouTube metadata without account credentials
        run: |
          node --input-type=module <<'NODE'
          const id='wKoz5ngNL4o';
          const urls=[
            'https://www.youtube.com/watch?v='+id,
            'https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json',
            'https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id),
            'https://www.youtube-nocookie.com/embed/'+id
          ];
          const extract=(html,name)=>{
            const esc=name.replace(/[-/\^$*+?.()|[\]{}]/g,'\\$&');
            for(const pat of [
              new RegExp('<meta[^>]+(?:property|name)=(["\\x27])'+esc+'\\1[^>]+content=(["\\x27])([^]*?)\\2','i'),
              new RegExp('<meta[^>]+content=(["\\x27])([^]*?)\\1[^>]+(?:property|name)=(["\\x27])'+esc+'\\3','i')]){
              const m=html.match(pat);if(m)return m[3]||m[2];
            }return null;
          };
          for(const u of urls){
            try{
              const response=await fetch(u,{headers:{'user-agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36',
                'accept-language':'en-US,en;q=0.9'},signal:AbortSignal.timeout(14000)});
              const text=await response.text();
              const item={url:u,status:response.status,bytes:text.length,
                title:extract(text,'og:title')||text.match(/<title>([^<]{3,200})<\/title>/i)?.[1],
                description:extract(text,'og:description')||extract(text,'description'),
                image:extract(text,'og:image'),
                isWatchHtml:text.includes('ytInitialPlayerResponse'),
                isSignInBlocked:/sign in to confirm|unusual traffic/i.test(text),
                isUnavailable:/this video is unavailable|video unavailable/i.test(text)};
              if(text.startsWith('{')){try{const d=JSON.parse(text);item.oembed={title:d.title,author_name:d.author_name,thumbnail_url:d.thumbnail_url,error:d.error,code:d.code}}catch{}}
              console.log('PUBLIC_RESULT',JSON.stringify(item));
              if(item.isWatchHtml){
                const textStart=text.indexOf('ytInitialPlayerResponse');
                const chunk=text.slice(textStart,textStart+800000);
                const m=chunk.match(/ytInitialPlayerResponse\s*=\s*({[^;]*});/);
                if(m)try{
                  const p=JSON.parse(m[1]);
                  console.log('PLAYER_METADATA',JSON.stringify({
                    playabilityStatus:p.playabilityStatus?.status,
                    reason:p.playabilityStatus?.reason,
                    videoDetails:{
                      videoId:p.videoDetails?.videoId,title:p.videoDetails?.title,
                      lengthSeconds:p.videoDetails?.lengthSeconds,
                      shortDescription:p.videoDetails?.shortDescription,
                      author:p.videoDetails?.author,
                      channelId:p.videoDetails?.channelId,
                      keywords:p.videoDetails?.keywords,
                      isLiveContent:p.videoDetails?.isLiveContent
                    },
                    captions:p.captions?.playerCaptionsTracklistRenderer?.captionTracks?.map(t=>({languageCode:t.languageCode,name:t.name?.simpleText,kind:t.kind}))||[]
                  }));
                }catch(e){console.log('PLAYER_PARSE_ERROR',e.message)}
              }
            }catch(e){console.log('PUBLIC_ERROR',JSON.stringify({url:u,error:e.message}))}
          }
          NODE
