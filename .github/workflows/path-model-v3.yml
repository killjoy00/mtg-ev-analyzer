name: build-path-model-v3

on:
  push:
    branches: [feature/counterfactual-pack-paths]
    paths:
      - scripts/build_path_model.py
      - .github/workflows/path-model-v3.yml

permissions:
  contents: write

jobs:
  build-path-models:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build four set path models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-data
          for LOWER in msh sos tmt ecl; do
            UPPER=$(printf '%s' "$LOWER" | tr '[:lower:]' '[:upper:]')
            SOURCE_DATE=$(python - "$LOWER" <<'PY'
          import json, sys
          data=json.load(open(f"data/{sys.argv[1]}/manifest.json"))
          print(data["source"]["data_date"])
          PY
            )
            MAX_TRAINING=$(python - "$LOWER" <<'PY'
          import json, sys
          data=json.load(open(f"data/{sys.argv[1]}/manifest.json"))
          print(data["cohort"]["training_drafts"])
          PY
            )
            INPUT="raw-data/draft_data_public.$UPPER.PremierDraft.csv.gz"
            echo "Downloading $UPPER public draft data..."
            curl --fail --location --retry 5 --retry-delay 3 \
              --output "$INPUT" \
              "https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.$UPPER.PremierDraft.csv.gz"
            python scripts/build_path_model.py \
              --input "$INPUT" \
              --output-dir "data/$LOWER" \
              --expansion "$UPPER" \
              --source-date "$SOURCE_DATE" \
              --minimum-games 100 \
              --top-fraction 0.15 \
              --max-training-drafts "$MAX_TRAINING" \
              --max-bytes 4000000
            rm -f "$INPUT"
          done
      - name: Validate path model artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for set_id in ('msh','sos','tmt','ecl'):
              path=Path('data')/set_id/'path-model.json'
              data=json.loads(path.read_text())
              assert data['model_version']=='strong-player-counterfactual-path-v3'
              assert data['training']['excluded_replay_drafts'] >= 250
              assert len(data['cards']) > 100
              assert len(data['pairs']) > 100
              assert path.stat().st_size < 4_000_000
              print(set_id, len(data['cards']), len(data['pairs']), path.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: path-model-v3
          path: data/*/path-model.json
          retention-days: 14
      - name: Commit generated path models
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*/path-model.json
          if git diff --cached --quiet; then
            echo 'Path models unchanged.'
            exit 0
          fi
          git commit -m 'Generate counterfactual path models [data-generated]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
