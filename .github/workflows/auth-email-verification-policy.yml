name: enable optional production email verification

on:
  push:
    branches: [main]
    paths:
      - '.github/auth-email-verification-policy-request.json'
      - '.github/workflows/auth-email-verification-policy.yml'
      - 'scripts/auth-email-verification-policy.mjs'
      - 'tests/auth-email-verification-policy.test.mjs'

permissions:
  contents: read

concurrency:
  group: pack1-auth-email-verification-policy
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Neon CLI
        run: npm install --prefix "$RUNNER_TEMP/neon-tools" --no-audit --no-fund neon@5.0.0
      - name: Enable optional email verification with fixed production guards
        env:
          NEON_BIN: ${{ runner.temp }}/neon-tools/node_modules/.bin/neon
        run: node scripts/auth-email-verification-policy.mjs production
