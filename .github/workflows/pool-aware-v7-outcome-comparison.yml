name: Pool-aware v7 - outcome arm coordination hold

on:
  push:
    branches: [research/v7-outcome-card-term-20261128]
    paths: ['.github/workflows/pool-aware-v7-outcome-comparison.yml']
  workflow_dispatch:

permissions:
  contents: read

# Dedicated group: intentionally supersede ONLY the obsolete standalone
# outcome comparison (46160300756). Never share the neutral release group.
concurrency:
  group: pool-aware-v7-outcome-comparison
  cancel-in-progress: true

jobs:
  coordination-hold:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/v7-outcome-card-term-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hold standalone outcome acceptance
        run: |
          echo "Standalone outcome acceptance is superseded by the binding issue #1863 coordination addendum."
          echo "No archive access, no validation choices, no fitting, no production access."
          echo "Reuse the implementation only in the single combined refit and reviewed acceptance after the ordered residual decisions are frozen."
