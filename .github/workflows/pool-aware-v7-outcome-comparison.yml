name: Pool-aware v7 - one locked outcome comparison

on:
  push:
    branches: [research/v7-outcome-card-term-20261128]
    paths: ['.github/workflows/pool-aware-v7-outcome-comparison.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pool-aware-v7-outcome-comparison
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/v7-outcome-card-term-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check -r research/card-strength-requirements.txt
          python -m py_compile scripts/pool_aware_v7_outcome_comparison.py scripts/pool_aware_v7_outcome_strength.py
          python scripts/pool_aware_v7_outcome_comparison.py --self-test
  measure:
    needs: preflight
    name: Outcome paired validation - ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        set: [blb, bro, dft, dmu, dsk, ecl, eoe, fdn, fin, fra, hbg, hob, ktk, lci, ltr, mh3, mkm, mom, msh, neo, one, otj, pio, powered-cube, sir, snc, sos, tdm, tla, tmt, woe]
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      AWS_DEFAULT_REGION: auto
      RESEARCH_SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r research/card-strength-requirements.txt
      - name: Recover measured expansion fit and rules
        if: "!contains(fromJSON('[\"woe\",\"bro\",\"dmu\",\"hbg\",\"mom\",\"neo\",\"one\",\"sir\",\"snc\"]'), matrix.set)"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45942026287
          name: pool-aware-expansion-report-${{ matrix.set }}
          path: artifacts/reviewed/prior
      - name: Recover measured legacy/duplicate-filtered fit and rules
        if: contains(fromJSON('["woe","bro","dmu","hbg","mom","neo","one","sir","snc"]'), matrix.set)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46028685209
          name: pool-aware-recovery-report-${{ matrix.set }}
          path: artifacts/reviewed/prior
      - name: Recover completed reviewed validation and anonymous score bank
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46107297635
          name: pool-aware-v7-reviewed-transfer-${{ matrix.set }}
          path: artifacts/reviewed/previous
      - name: Download the complete frozen residual fit registry
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46107297635
          pattern: pool-aware-v7-refit-*
          path: artifacts/registry
      - name: Restore exact retained public archives
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u scripts/pool_aware_skill_reviewed_validation.py --stage restore-all --set "$RESEARCH_SET" --work artifacts/reviewed/input --output artifacts/reviewed/result
      - name: Authenticate prior fit, metadata and windows
        run: python -u scripts/pool_aware_skill_reviewed_validation.py --stage inputs --set "$RESEARCH_SET" --prior artifacts/reviewed/prior --work artifacts/reviewed/input --output artifacts/reviewed/result
      - name: Evaluate outcome and contrast on the exact completed validation rows
        run: python -u scripts/pool_aware_v7_outcome_comparison.py --stage measure --set "$RESEARCH_SET" --prior artifacts/reviewed/prior --old artifacts/reviewed/previous --fits artifacts/registry --output artifacts/reviewed/result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-v7-outcome-report-${{ matrix.set }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/reviewed/result/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-v7-outcome-transfer-${{ matrix.set }}
          retention-days: 3
          if-no-files-found: error
          path: artifacts/reviewed/result/
  aggregate:
    needs: [preflight, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r research/card-strength-requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pool-aware-v7-outcome-transfer-*
          path: artifacts/reviewed/sets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46107297635
          name: pool-aware-v7-reviewed-combined-report
          path: artifacts/reviewed/reference
      - name: Recover completed separate strong-only decision when available
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46158605617
          name: pool-aware-v7-strong-only-combined-report
          path: artifacts/reviewed/strong-only
      - name: Apply the locked paired decision rule
        run: python -u scripts/pool_aware_v7_outcome_comparison.py --stage aggregate --banks artifacts/reviewed/sets --reference artifacts/reviewed/reference/combined-report.json --strong-reference artifacts/reviewed/strong-only/combined-report.json --output artifacts/reviewed/combined-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-v7-outcome-combined-report
          retention-days: 90
          if-no-files-found: error
          path: artifacts/reviewed/combined-report.json

