name: Pack One domain runtime rewrite

on:
  push:
    branches:
      - domain/packone-pro-runtime

permissions:
  contents: write

jobs:
  rewrite-and-bundle:
    if: ${{ !contains(github.event.head_commit.message, '[domain-rewrite]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: domain/packone-pro-runtime
          fetch-depth: 0

      - name: Replace retired hostname
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            sed -i 's/magic\.planitnow\.us/packone.pro/g' "$file"
          done < <(grep -RIlZ --exclude-dir=.git 'magic.planitnow.us' . || true)
          if grep -RIl --exclude-dir=.git 'magic.planitnow.us' .; then
            echo 'Old hostname remains after rewrite.' >&2
            exit 1
          fi

      - name: Build Neon function bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack1api /tmp/pack1growth artifacts/domain-cutover
          cp worker/index.js /tmp/pack1api/index.js
          cp worker/core.mjs /tmp/pack1api/core.mjs
          cp worker/growth-function.js /tmp/pack1growth/index.js
          (cd /tmp/pack1api && zip -q /tmp/pack1api.zip index.js core.mjs)
          (cd /tmp/pack1growth && zip -q /tmp/pack1growth.zip index.js)
          cp /tmp/pack1api.zip artifacts/domain-cutover/pack1api.zip
          cp /tmp/pack1growth.zip artifacts/domain-cutover/pack1growth.zip

      - name: Upload function bundles
        uses: actions/upload-artifact@v4
        with:
          name: packone-domain-neon-bundles
          path: artifacts/domain-cutover/*.zip
          if-no-files-found: error

      - name: Remove one-time workflow and commit rewrite
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/packone-domain-runtime-rewrite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Finish packone.pro runtime cutover [domain-rewrite]'
          git push origin HEAD:domain/packone-pro-runtime
