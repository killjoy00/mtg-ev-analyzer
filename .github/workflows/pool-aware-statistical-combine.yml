name: Pool-aware refit - combine all ten format results

# One-shot aggregation of already measured historical development results.
on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-statistical-combine.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Restore eight successful original banks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45917142265
          pattern: pool-aware-statistical-*
          path: artifacts/statistical/original
      - name: Restore two recovered banks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45919980278
          pattern: pool-aware-statistical-*
          path: artifacts/statistical/recovery
      - name: Require all ten distinct source reports and banks
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          root = Path('artifacts/statistical')
          output = root / 'sets'
          output.mkdir(parents=True, exist_ok=True)
          for origin, ids in [('original', ('dft','tdm','ktk','hob','powered-cube','eoe','fin','sos')), ('recovery', ('ecl','tmt'))]:
              for sid in ids:
                  name = 'pool-aware-statistical-' + sid
                  src = root / origin / name
                  report = json.loads((src / 'score-report.json').read_text())
                  assert report['provenance']['set'] == sid
                  assert report['simulation'].get('status','complete') == 'complete'
                  assert (src / 'simulation-bank.json.gz').is_file()
                  shutil.copytree(src, output / name)
          assert len(list(output.glob('*/score-report.json'))) == 10
          PY
      - name: Run final combined historical development report
        run: |
          python -u scripts/pool_aware_statistical_validation.py --aggregate artifacts/statistical/sets --output artifacts/statistical/combined-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/statistical/combined-report.json').read_text())
          assert len(r['completed_sets']) == 10 and not r['missing_sets']
          assert all(v['development_gate']['coverage_complete'] for v in r['runs'].values())
          assert not r['release_allowed']
          PY
      - name: Preserve aggregate report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-statistical-all-ten-report
          retention-days: 90
          if-no-files-found: error
          path: artifacts/statistical/combined-report.json
