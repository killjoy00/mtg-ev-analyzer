name: Pool-aware v7 - residual-only rarity shrinkage comparison

on:
  push:
    branches: [research/v7-rarity-shrinkage-20261128]
    paths: ['.github/workflows/pool-aware-v7-rarity-shrinkage.yml']
  workflow_dispatch:

permissions:
  contents: read

# Intentional one-time supersession in this experiment's dedicated group.
# Never use the shared reviewed-release concurrency group.
concurrency:
  group: pool-aware-v7-rarity-shrinkage
  cancel-in-progress: true

jobs:
  hold:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/v7-rarity-shrinkage-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo 'Owner coordination addendum: rarity fitting is paused.'
          echo 'Require corrected residual 70/30 second-color trigger, feature freeze, and compatible selected stage decision before restoring the measurement workflow.'
          echo 'Do not read validation choices, use earlier selection output, or launch any final refit here.'
