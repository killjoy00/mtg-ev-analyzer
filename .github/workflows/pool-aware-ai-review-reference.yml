name: Pool-aware refit - AI review reference

on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-ai-review-reference.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reference:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download immutable four-format reports and blind samples
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45907384134
          pattern: pool-aware-*
          path: artifacts/ai-review-input/main
      - name: Download exact KTK recovery inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45909032928
          pattern: pool-aware-*
          path: artifacts/ai-review-input/ktk
      - name: Verify sample locks and enrich reviewer-only reference from Scryfall
        run: python scripts/pool_aware_review_reference.py --input artifacts/ai-review-input --lock research/pool-aware-candidate-lock-v1.json --output artifacts/ai-review-reference
      - name: Preserve only blinded public reference and sample evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-ai-review-reference
          retention-days: 90
          path: artifacts/ai-review-reference/
          if-no-files-found: error
