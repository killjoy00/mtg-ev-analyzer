name: Audit deployed A vs research A (#529)

on:
  push:
    branches:
      - audit-529-a-transfer
    paths:
      - scripts/audit_a_transfer_529.py
      - scripts/build_replays.py
      - scripts/import_all_trophies.py
      - reports/ISSUE-529-A-TRANSFER-AUDIT-DECISION-RULE.md
      - corpus/draft-run/**
      - data/**/manifest.json
  workflow_dispatch:

concurrency:
  group: issue-529-a-transfer-audit
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  audit-set:
    name: Audit ${{ matrix.set }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - set: msh
            archive: MSH
            cohort_run: 36256947308
            cohort_name: contextual-value-v1-preprocessed-core-8000
            cohort_kind: core
            freeze_run: ''
            freeze_name: ''
          - set: sos
            archive: SOS
            cohort_run: 36256947308
            cohort_name: contextual-value-v1-preprocessed-core-8000
            cohort_kind: core
            freeze_run: ''
            freeze_name: ''
          - set: ecl
            archive: ECL
            cohort_run: 36256947308
            cohort_name: contextual-value-v1-preprocessed-core-8000
            cohort_kind: core
            freeze_run: ''
            freeze_name: ''
          - set: tla
            archive: TLA
            cohort_run: 36256947308
            cohort_name: contextual-value-v1-preprocessed-core-8000
            cohort_kind: core
            freeze_run: ''
            freeze_name: ''
          - set: eoe
            archive: EOE
            cohort_run: 36371215506
            cohort_name: contextual-value-v1-q-guard10-20k-cohort-EOE
            cohort_kind: later
            freeze_run: ''
            freeze_name: ''
          - set: fin
            archive: FIN
            cohort_run: 36371215506
            cohort_name: contextual-value-v1-q-guard10-20k-cohort-FIN
            cohort_kind: later
            freeze_run: 36475098718
            freeze_name: contextual-value-v1-r-independent-confirmation-freeze-FIN
          - set: tdm
            archive: TDM
            cohort_run: 36371215506
            cohort_name: contextual-value-v1-q-guard10-20k-cohort-TDM
            cohort_kind: later
            freeze_run: 36475098718
            freeze_name: contextual-value-v1-r-independent-confirmation-freeze-TDM
          - set: dft
            archive: DFT
            cohort_run: 36371215506
            cohort_name: contextual-value-v1-q-guard10-20k-cohort-DFT
            cohort_kind: later
            freeze_run: 36475098718
            freeze_name: contextual-value-v1-r-independent-confirmation-freeze-DFT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile the scoring-only audit
        run: python -m py_compile scripts/audit_a_transfer_529.py

      - name: Install frozen numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'

      - name: Download frozen research cohort
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cohort_name }}
          path: cohort
          run-id: ${{ matrix.cohort_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Extract only the outcome-free cohort identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ "${{ matrix.cohort_kind }}" = "core" ]; then
            p="$(find cohort -type f -name 'cohort-manifest.json' -print -quit)"
          else
            p="$(find cohort -type f -name 'cohort.json' -print -quit)"
          fi
          test -n "$p"
          cp "$p" work/cohort.json

      - name: Download frozen 45k scoring context
        if: ${{ matrix.freeze_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.freeze_name }}
          path: freeze
          run-id: ${{ matrix.freeze_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Extract the outcome-free 45k scoring context
        if: ${{ matrix.freeze_name != '' }}
        shell: bash
        run: |
          set -euo pipefail
          p="$(find freeze -type f -name 'frozen-evaluation-context.npz' -print -quit)"
          test -n "$p"
          cp "$p" work/frozen-evaluation-context.npz

      - name: Download the exact public 17Lands snapshot objects
        shell: bash
        env:
          BASE: https://17lands-public.s3.amazonaws.com/analysis_data
        run: |
          set -euo pipefail
          mkdir -p raw results
          curl --fail --location --retry 5 --retry-delay 3             --output raw/draft.csv.gz             "$BASE/draft_data/draft_data_public.${{ matrix.archive }}.PremierDraft.csv.gz"
          curl --fail --location --retry 5 --retry-delay 3             --output raw/game.csv.gz             "$BASE/game_data/game_data_public.${{ matrix.archive }}.PremierDraft.csv.gz"

      - name: Reproduce deployed A and measure agreement
        shell: bash
        run: |
          set -euo pipefail
          freeze=()
          if [ -f work/frozen-evaluation-context.npz ]; then
            freeze=(--freeze-context work/frozen-evaluation-context.npz)
          fi
          python scripts/audit_a_transfer_529.py             --set "${{ matrix.set }}"             --draft raw/draft.csv.gz             --game raw/game.csv.gz             --cohort work/cohort.json             "${freeze[@]}"             --out "results/${{ matrix.set }}.json"

      - name: Upload set audit
        uses: actions/upload-artifact@v4
        with:
          name: a-transfer-${{ matrix.set }}
          path: results/${{ matrix.set }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate A-transfer audit
    needs: audit-set
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: a-transfer-*
          path: set-results

      - name: Build final reports
        run: python scripts/audit_a_transfer_529.py --aggregate set-results --out final-report

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: a-transfer-529-final
          path: final-report
          if-no-files-found: error
          retention-days: 30
