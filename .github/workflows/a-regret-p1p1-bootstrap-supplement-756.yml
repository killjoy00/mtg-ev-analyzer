name: a-regret-p1p1-bootstrap-supplement-756

on:
  push:
    branches:
      - research/a-regret-null-calibration-756
    paths:
      - .github/workflows/a-regret-p1p1-bootstrap-supplement-756.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PRERUN_RUN: '36451550413'
  BASE: https://17lands-public.s3.amazonaws.com/analysis_data

jobs:
  rows:
    name: p1-rep0-bootstrap-${{ matrix.expansion }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - expansion: FIN
            draft_sha: 9d5b2a3e908bb8daf0ea6e951097714b651546370a5c852893dc90a1f2f6ab8b
          - expansion: TDM
            draft_sha: 831ba8bc4be5eabe140fac00a8e6eaded3f3f931685be8f91403ad9cfde5cbf5
          - expansion: DFT
            draft_sha: 7812d16e0de78ff7a69faf9981f7ff03be4dfc618a86f14369424ec2204580cd
          - expansion: MSH
            draft_sha: 64100d71db77e0f0ef8ba893b259a1024eb6d15816db337c7758e7d96bc29cf7
          - expansion: SOS
            draft_sha: df6220d8941e99b7264a54a7a7427096246ee6510057a83d4c9424b472761853
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2'
      - name: Materialize exact frozen P1P1 analyzer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin d121aa4b63f738ea039e15a21f839d97cbafb427
          git show d121aa4b63f738ea039e15a21f839d97cbafb427:research/one_time/a_regret_p1p1.py.gz.b64 | base64 -d | gzip -d > research/a_regret_p1p1_frozen_runtime.py
          python -m py_compile research/a_regret_p1p1_frozen_runtime.py research/a_regret_p1p1_rep0_bootstrap_supplement.py
      - uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-r-independent-confirmation-prerun
          path: prior
          run-id: ${{ env.PRERUN_RUN }}
          github-token: ${{ github.token }}
      - name: Download exact draft archive
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
          DRAFT_SHA: ${{ matrix.draft_sha }}
        run: |
          set -euo pipefail
          mkdir -p raw
          curl --fail --location --retry 5 --retry-delay 3 --output raw/draft.csv.gz "$BASE/draft_data/draft_data_public.$EXPANSION.PremierDraft.csv.gz"
          echo "$DRAFT_SHA  raw/draft.csv.gz" | sha256sum -c -
      - name: Compute replicate-0 scenario rows
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
        run: |
          set -euo pipefail
          mkdir -p "results/$EXPANSION"
          python research/a_regret_p1p1_rep0_bootstrap_supplement.py \
            --expansion "$EXPANSION" \
            --draft-archive raw/draft.csv.gz \
            --spent-ledger prior/spent-draft-ledger.json.gz \
            --reserve-json prior/reserve.json \
            --frozen-analyzer research/a_regret_p1p1_frozen_runtime.py \
            --output "results/$EXPANSION/rep0-all-scenarios.npz"
      - uses: actions/upload-artifact@v4
        with:
          name: p1-rep0-bootstrap-${{ matrix.expansion }}
          path: results/${{ matrix.expansion }}/rep0-all-scenarios.npz
          retention-days: 90

  aggregate:
    needs: rows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-rep0-bootstrap-*
          path: sets
      - name: Aggregate 10k bootstrap widths
        run: |
          mkdir -p results
          python research/a_regret_p1p1_rep0_bootstrap_aggregate.py \
            --input-root sets \
            --output results/p1p1-rep0-all-scenario-bootstrap.json
      - uses: actions/upload-artifact@v4
        with:
          name: p1p1-rep0-all-scenario-bootstrap-756
          path: results/p1p1-rep0-all-scenario-bootstrap.json
          retention-days: 90
