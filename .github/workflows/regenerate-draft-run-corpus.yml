name: regenerate-draft-run-corpus

# The corpus version is hashed into every puzzle id, so declaring a new one
# without rebuilding the rows leaves the app serving a version its own
# published corpus does not carry - validateDraftRunPuzzle rejects every
# puzzle, and the health endpoint goes 503 on the catalog mismatch. Two earlier
# attempts at this bump were reverted for exactly that.
#
# So the bump and the regeneration are one act here: declare the version,
# rebuild every environment from it, prove the whole suite passes on the
# result, and only then commit - or commit nothing at all.
on:
  workflow_dispatch:
    inputs:
      corpus_version:
        description: 'New corpus version, e.g. elite-trophy-colour-stage-v7'
        required: true
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    # The shards this reads are the same ones the set builders write.
    concurrency:
      group: set-data-import-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to latest main under import lock
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Hydrate replay shards from R2
        run: bash scripts/r2_replay_shards.sh hydrate

      - name: Refuse a half-rebuilt data directory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          # One corpus, one model. Regenerating while a set rebuild is only
          # partly done would publish rows from two models under one label,
          # which is the failure the version discipline exists to prevent.
          by_version = defaultdict(list)
          for entry in json.loads(Path('data/catalog.json').read_text())['sets']:
              manifest = json.loads(Path('data', entry['id'], 'manifest.json').read_text())
              by_version[manifest['model']['model_version']].append(entry['id'])
          if len(by_version) != 1:
              for version, ids in sorted(by_version.items()):
                  print(f'{version}: {len(ids)} sets -> {" ".join(sorted(ids))}')
              raise SystemExit('data/ holds more than one replay model; finish the rebuild first')
          version, ids = next(iter(by_version.items()))
          print(f'All {len(ids)} sets are {version}.')

          missing = [i for i in ids if not any(Path('data', i, 'shards').glob('*.json'))]
          if missing:
              raise SystemExit(f'No hydrated shards for: {" ".join(missing)}')
          PY

      - name: Declare the new corpus version
        env:
          NEW_VERSION: ${{ inputs.corpus_version }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(python scripts/set_policy.py --set-corpus-version "$NEW_VERSION")"
          echo "Corpus version $previous -> $NEW_VERSION"
          echo "PREVIOUS_VERSION=$previous" >> "$GITHUB_ENV"

      - name: Regenerate every environment at the new version
        run: python scripts/build_verified_trophy_corpus.py

      - name: The full suite must pass on the regenerated corpus
        run: npm test

      - name: Report what changed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('corpus/draft-run/catalog.json').read_text())
          print(f"corpus_version: {catalog['corpus_version']}")
          print(f"model_version:  {catalog['model_version']}")
          total = sum(s['puzzles'] for s in catalog['sets'])
          print(f"{len(catalog['sets'])} environments, {total} decisions")
          PY
          git diff --stat -- corpus/draft-run draft-run.mjs

      - name: Commit the bump and the corpus together
        env:
          NEW_VERSION: ${{ inputs.corpus_version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add draft-run.mjs corpus/draft-run
          if git diff --cached --quiet; then
            echo '::error::Nothing changed; the corpus was not regenerated.'
            exit 1
          fi
          # One commit. A bump that lands without its rows is the failure this
          # workflow exists to make impossible.
          git commit -m "Republish the Draft Run corpus at $NEW_VERSION [data-generated]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
