name: One-shot Traditional v4 regular development staging

on:
  push:
    branches:
      - ops/traditional-v4-dev-stage-20260921
    paths:
      - .github/workflows/dispatch-traditional-v4-dev-stage.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch Traditional v4 regular development staging'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Dispatch reviewed regular development stage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          workflow=publish-puzzle-components.yml
          source=v4-regular-phase2
          result_file=ops/traditional-v4-regular-stage-result.json
          mkdir -p ops

          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 50 --json databaseId --jq '.[].databaseId' | sort -n)"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main \
            -f target=development \
            -f action=stage \
            -f source="$source"

          id=""
          for attempt in $(seq 1 60); do
            after="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 50 --json databaseId --jq '.[].databaseId' | sort -n)"
            id="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -n 1)"
            if [[ -n "$id" ]]; then break; fi
            sleep 2
          done

          if [[ -z "$id" ]]; then
            jq -n --arg source "$source" '{target:"development",action:"stage",source:$source,run_id:null,status:"dispatch_not_observed",conclusion:null}' > "$result_file"
            rc=2
          else
            set +e
            gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status
            rc=$?
            set -e
            gh run view "$id" --repo "$GITHUB_REPOSITORY" \
              --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt > /tmp/run.json
            jq --arg source "$source" '. + {target:"development",action:"stage",source:$source,run_id:.databaseId} | del(.databaseId)' \
              /tmp/run.json > "$result_file"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result_file"
          git commit -m "Record Traditional v4 regular development stage [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
          exit "$rc"
