name: One-shot Traditional v4 development staging dispatcher

on:
  push:
    branches:
      - ops/traditional-v4-dev-stage-20260921
    paths:
      - .github/workflows/dispatch-traditional-v4-dev-stage.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch Traditional v4 development staging'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Dispatch reviewed development-stage runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          workflow=publish-puzzle-components.yml
          result_file=ops/traditional-v4-dev-stage-results.json
          mkdir -p ops

          stage_one() {
            local source="$1"
            local before after id rc conclusion
            before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 50 --json databaseId --jq '.[].databaseId' | sort -n)"

            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main \
              -f target=development \
              -f action=stage \
              -f source="$source"

            id=""
            for attempt in $(seq 1 60); do
              after="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 50 --json databaseId --jq '.[].databaseId' | sort -n)"
              id="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -n 1)"
              if [[ -n "$id" ]]; then break; fi
              sleep 2
            done

            if [[ -z "$id" ]]; then
              jq -n --arg source "$source" '{source:$source,run_id:null,status:"dispatch_not_observed",conclusion:null}' > "/tmp/$source.json"
              return 2
            fi

            set +e
            gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status
            rc=$?
            set -e

            conclusion="$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // ""')"
            gh run view "$id" --repo "$GITHUB_REPOSITORY" \
              --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
              --jq --arg source "$source" '. + {source:$source,run_id:.databaseId} | del(.databaseId)' \
              > "/tmp/$source.json"
            return "$rc"
          }

          regular_rc=0
          stage_one v4-regular-phase2 || regular_rc=$?

          cube_rc=99
          if [[ "$regular_rc" -eq 0 ]]; then
            cube_rc=0
            stage_one v4-powered-cube || cube_rc=$?
          else
            jq -n '{source:"v4-powered-cube",run_id:null,status:"not_dispatched_after_regular_failure",conclusion:null}' > /tmp/v4-powered-cube.json
          fi

          jq -s '{target:"development",action:"stage",runs:.}' \
            /tmp/v4-regular-phase2.json /tmp/v4-powered-cube.json > "$result_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result_file"
          git commit -m "Record Traditional v4 development staging run IDs [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

          if [[ "$regular_rc" -ne 0 || "$cube_rc" -ne 0 ]]; then
            exit 1
          fi
