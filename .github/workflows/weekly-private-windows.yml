name: Pack One Patreon Publisher
on:
  pull_request:
    paths:
      - 'scripts/pack-one-weekly-*.mjs'
      - 'scripts/pack-one-patreon-publisher.mjs'
      - 'tests/pack-one-patreon-publisher.test.mjs'
      - 'scripts/package-weekly-windows.mjs'
      - 'weekly-patreon-contract.mjs'
      - 'patreon-post-read.mjs'
      - 'worker/weekly-publisher.mjs'
      - 'scripts/patreon-desktop/**'
      - 'tests/pack-one-weekly*.mjs'
      - 'tests/test_patreon_desktop.py'
      - 'tests/test_patreon_weekly_private.py'
      - '.github/workflows/weekly-private-windows.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pack-one-weekly-*.mjs'
      - 'scripts/pack-one-patreon-publisher.mjs'
      - 'tests/pack-one-patreon-publisher.test.mjs'
      - 'scripts/package-weekly-windows.mjs'
      - 'weekly-patreon-contract.mjs'
      - 'patreon-post-read.mjs'
      - 'worker/weekly-publisher.mjs'
      - 'scripts/patreon-desktop/**'
      - 'tests/pack-one-weekly*.mjs'
      - 'tests/test_patreon_desktop.py'
      - 'tests/test_patreon_weekly_private.py'
      - '.github/workflows/weekly-private-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked Node dependency installation failed' }
          python -m pip install pyinstaller==6.22.3 tzdata==2026.5
      - name: Validate private recap state machine and desktop adapter
        run: |
          node --test tests/pack-one-weekly.test.mjs tests/pack-one-weekly-publish.test.mjs tests/pack-one-weekly-paired.test.mjs tests/pack-one-patreon-publisher.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Weekly JavaScript contract tests failed' }
          python -m unittest discover -s tests -p test_patreon_weekly_private.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Private bridge contracts failed' }
          python -m unittest discover -s tests -p test_patreon_desktop.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Weekly pick contracts failed' }
      - name: Assemble portable private runtime
        shell: pwsh
        run: |
          node scripts/package-weekly-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable source assembly failed' }
          if (!(Test-Path dist/weekly-setup/runtime/build.json)) { throw 'Portable runtime manifest missing' }
          python -m PyInstaller --onefile --console --name WeeklyPrivateBridge --collect-all tzdata --distpath dist/weekly-setup/runtime --workpath build/weekly-bridge scripts/patreon-desktop/weekly_private_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Private bridge build failed' }
          python -m PyInstaller --onefile --noconsole --name PackOnePatreonPublisher --distpath dist/weekly-setup --workpath build/weekly-setup scripts/patreon-desktop/weekly_setup.py
          if ($LASTEXITCODE -ne 0) { throw 'Setup executable build failed' }
      - name: Bundle locked Chromium and exercise real renderer
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD 'dist/weekly-setup/runtime/browsers'
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser install failed' }
          node --test tests/pack-one-weekly-render-browser.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Render test failed' }
      - name: Validate packaged setup and disabled-by-default bridge
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath dist/weekly-setup/PackOnePatreonPublisher.exe -ArgumentList '--self-test' -PassThru
          if (!$setup.WaitForExit(90000)) {
            taskkill /PID $setup.Id /T /F
            throw 'Packaged setup self-test exceeded 90 seconds'
          }
          if ($setup.ExitCode -ne 0) { throw "Packaged setup self-test exit code $($setup.ExitCode) (11=DPAPI, 12=runtime, 13=marker)" }
          if (!(Test-Path dist/weekly-setup/setup-self-test.ok)) { throw 'Packaged setup self-test marker missing' }
          Remove-Item dist/weekly-setup/setup-self-test.ok
          '{}' | & dist/weekly-setup/runtime/WeeklyPrivateBridge.exe
          if ($LASTEXITCODE -ne 1) { throw 'Bridge must reject public CI' }
          $LASTEXITCODE = 0
      - name: Create source-only public installer bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist/weekly-setup/* -DestinationPath dist/PackOnePatreonPublisher.zip -CompressionLevel Optimal
          (Get-FileHash dist/PackOnePatreonPublisher.zip -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii dist/PublisherSHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packone-patreon-publisher
          path: |
            dist/PackOnePatreonPublisher.zip
            dist/PublisherSHA256.txt
          retention-days: 14
  release:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packone-patreon-publisher
          path: dist
      - name: Publish reviewed package only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "patreon-publisher-windows-${{ github.sha }}" dist/PackOnePatreonPublisher.zip dist/PublisherSHA256.txt --repo "${{ github.repository }}" --latest=false --target "${{ github.sha }}" --title 'Pack One Patreon Publisher for Windows' --notes 'Replaces both previous helpers. Close old helpers, extract the ZIP, and open PackOnePatreonPublisher.exe. Keep the existing pairing or generate one code in Pack One Admin > Patreon. Enable automatic posting once. All connected article types share this application and PostyBirb session; no database login or Patreon API token is needed.'
