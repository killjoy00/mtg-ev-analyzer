name: Public Patreon desktop feed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patreon-desktop-feed.yml'
      - 'scripts/patreon-desktop-feed.mjs'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packone-patreon-feed
  cancel-in-progress: false
jobs:
  feed:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find today's trusted main-branch rendered artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
            const {data}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'daily-social-post.yml',branch:'main',per_page:30});
            for(const run of data.workflow_runs) {
              if(run.run_attempt!==1 || !['schedule','workflow_dispatch','push'].includes(run.event) || run.head_repository?.full_name!==context.payload.repository.full_name)continue;
              const day=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(run.created_at));
              if(day!==today)continue;
              const {data:artifacts}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id});
              if(artifacts.artifacts.some(a=>a.name==='packone-featured-pick'&&!a.expired)) {
                core.setOutput('run_id',String(run.id));break;
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.run_id != ''
        with:
          name: packone-featured-pick
          path: artifacts/featured-pick
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Refresh public media and supported API publication check
        run: node scripts/patreon-desktop-feed.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_LIVE: 'true'
          DESKTOP_FEED_VERIFY_ONLY: ${{ steps.artifact.outputs.run_id == '' && 'true' || 'false' }}
          PATREON_CREATOR_ACCESS_TOKEN: ${{ secrets.PATREON_CREATOR_ACCESS_TOKEN }}
