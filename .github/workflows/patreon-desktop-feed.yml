name: Patreon Pick of the Week

on:
  schedule:
    # 15-minute readiness refreshes Wednesday/Thursday. The script enforces
    # the Chicago morning gate and same previous-week key across DST.
    - cron: '7,22,37,52 14-23 * * 3,4'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/patreon-desktop-feed.yml'
      - 'scripts/patreon-weekly-pick-feed.mjs'
      - 'scripts/pack-one-weekly-data.mjs'
      - 'scripts/pack-one-weekly-render.mjs'
      - 'tests/pack-one-weekly.test.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('packone-weekly-pick-review-{0}', github.ref) || 'packone-patreon-feed' }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/pack-one-weekly.test.mjs tests/patreon-desktop-feed.test.mjs tests/featured-patreon.test.mjs

  feed:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check weekly window and immutable public media
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {appendFile} from 'node:fs/promises';
          import {weeklyPickGate} from './scripts/patreon-weekly-pick-feed.mjs';
          import {githubJson} from './scripts/patreon-desktop-feed.mjs';
          const gate=weeklyPickGate();
          if(!gate){await appendFile(process.env.GITHUB_OUTPUT,'due=false\n');}
          else {
            const existing=await githubJson('contents/'+gate.publication_day+'/post.json?ref=packone-patreon-feed',{token:process.env.GITHUB_TOKEN});
            await appendFile(process.env.GITHUB_OUTPUT,'due=true\nnew_media='+String(!existing)+'\n');
          }
          JS
      - name: Install pinned rendering dependencies for a new weekly pick only
        if: steps.preflight.outputs.due == 'true' && steps.preflight.outputs.new_media == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Freeze or refresh aggregate weekly pick for the desktop publisher
        if: steps.preflight.outputs.due == 'true'
        run: node scripts/patreon-weekly-pick-feed.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PATREON_CREATOR_ACCESS_TOKEN: ${{ secrets.PATREON_CREATOR_ACCESS_TOKEN }}
