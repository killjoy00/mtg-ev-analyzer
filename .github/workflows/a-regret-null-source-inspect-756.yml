name: a-regret-null-source-inspect-756

on:
  push:
    branches:
      - research/a-regret-null-calibration-756
    paths:
      - .github/workflows/a-regret-null-source-inspect-756.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover frozen analyzers and inspect
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin d121aa4b63f738ea039e15a21f839d97cbafb427
          git fetch --depth=1 origin e966e4d7c92aeb1b3e86ccbe3dea469f1ee72c77
          git show d121aa4b63f738ea039e15a21f839d97cbafb427:research/one_time/a_regret_p1p1.py.gz.b64 | base64 -d | gzip -d > /tmp/p1.py
          git show e966e4d7c92aeb1b3e86ccbe3dea469f1ee72c77:research/one_time/a_regret_later.py.gz.b64 | base64 -d | gzip -d > /tmp/later.py
          python -m py_compile /tmp/p1.py /tmp/later.py
          echo "=== P1 imports/constants/args ==="
          sed -n '1,140p' /tmp/p1.py
          echo "=== P1 data/model ==="
          sed -n '140,320p' /tmp/p1.py
          echo "=== P1 fit/score ==="
          sed -n '320,520p' /tmp/p1.py
          echo "=== P1 main ==="
          sed -n '520,760p' /tmp/p1.py
          echo "=== LATER imports/data ==="
          sed -n '1,240p' /tmp/later.py
          echo "=== LATER fit ==="
          sed -n '240,460p' /tmp/later.py
          echo "=== LATER score/main ==="
          sed -n '460,720p' /tmp/later.py
