name: one-shot neon release 3c1ceb5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-release-3c1ceb5.yml'

permissions:
  contents: read

concurrency:
  group: one-shot-neon-release-3c1ceb5
  cancel-in-progress: false

env:
  PROJECT_ID: patient-shadow-91417882
  RELEASE_COMMIT: 3c1ceb5a4c4be0d94c7dc4b2d682af399a368e06

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"
      - name: Install pinned release tools
        run: npm install -g neon@4.17.4 esbuild@0.28.2
      - name: Verify development schema
        shell: bash
        run: |
          set -euo pipefail
          connection=$(neon connection-string br-twilight-hill-ayffyd2b --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          DATABASE_URL="$connection" node scripts/verify-neon-schema.mjs
      - name: Build reviewed bundles
        run: node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$RELEASE_COMMIT"
      - name: Deploy development functions
        shell: bash
        run: |
          set -euo pipefail
          while IFS=: read -r slug entry; do
            neon functions deploy "$slug" --src "$RUNNER_TEMP/pack1-bundles/$slug" --no-bundle               --project-id "$PROJECT_ID" --branch br-twilight-hill-ayffyd2b --runtime nodejs24 --wait
          done < .github/neon-functions.txt
      - name: Verify development revision
        run: node tests/release-functions-smoke.mjs br-twilight-hill-ayffyd2b "$RELEASE_COMMIT" --daily --settle

  production:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
      PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
      PATREON_WEBHOOK_SECRET: ${{ secrets.PATREON_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"
      - name: Install pinned release tools
        run: npm install -g neon@4.17.4 esbuild@0.28.2
      - name: Require reviewed revision in development
        run: node tests/release-functions-smoke.mjs br-twilight-hill-ayffyd2b "$RELEASE_COMMIT" --daily
      - name: Verify compatible frontend is published
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://packone.pro/draft-run-format.mjs -o "$RUNNER_TEMP/run-format.mjs"
          grep -q 'function draftRunLength' "$RUNNER_TEMP/run-format.mjs"
          curl -fsS --max-time 30 https://packone.pro/data/selection-policy.json -o "$RUNNER_TEMP/selection-policy.json"
          node -e 'const p=require(process.argv[1]);if(p.run_length!==8||p.selection_version!=="eight-pick-v4")throw Error("Compatible frontend is not published")' "$RUNNER_TEMP/selection-policy.json"
      - name: Verify production schema
        shell: bash
        run: |
          set -euo pipefail
          connection=$(neon connection-string br-orange-feather-ayps8kep --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          DATABASE_URL="$connection" node scripts/verify-neon-schema.mjs
      - name: Check Patreon activation
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(node --input-type=module -e "import {validPatreonPolicy} from './patreon-policy.mjs';console.log(validPatreonPolicy())")
          echo "PATREON_RUNTIME_ENABLED=$enabled" >> "$GITHUB_ENV"
          if [[ "$enabled" == true ]]; then
            test -n "$PATREON_CLIENT_ID"
            test -n "$PATREON_CLIENT_SECRET"
            test -n "$PATREON_WEBHOOK_SECRET"
          fi
      - name: Build reviewed bundles
        run: node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$RELEASE_COMMIT"
      - name: Deploy production functions
        shell: bash
        run: |
          set -euo pipefail
          while IFS=: read -r slug entry; do
            extra=()
            if [[ "$slug" == pack1growth && "$PATREON_RUNTIME_ENABLED" == true ]]; then
              extra+=(--env "PATREON_CLIENT_ID=$PATREON_CLIENT_ID" --env "PATREON_CLIENT_SECRET=$PATREON_CLIENT_SECRET" --env "PATREON_WEBHOOK_SECRET=$PATREON_WEBHOOK_SECRET")
            fi
            neon functions deploy "$slug" --src "$RUNNER_TEMP/pack1-bundles/$slug" --no-bundle               --project-id "$PROJECT_ID" --branch br-orange-feather-ayps8kep --runtime nodejs24 --wait "${extra[@]}"
          done < .github/neon-functions.txt
      - name: Verify production revision and Daily flows
        run: node tests/release-functions-smoke.mjs br-orange-feather-ayps8kep "$RELEASE_COMMIT" --daily --settle
