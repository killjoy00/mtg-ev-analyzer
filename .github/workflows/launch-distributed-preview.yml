name: exclusive distributed preview acceptance
on:
  workflow_call:
    inputs:
      require_performance:
        type: string
        required: true
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: pack1-gateway-preview
  cancel-in-progress: false
  queue: max
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.neon.outputs.branch_id }}
      created: ${{ steps.neon.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recheck unchanged source after waiting for exclusive preview access
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEWED_PR: ${{ github.event.pull_request.number }}
          REQUIRE_PERFORMANCE: ${{ inputs.require_performance }}
        run: node scripts/require-ci-source.mjs --once
      - name: Verify scoped Cloudflare access
        env:
          CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
        run: node scripts/edge-control.mjs preflight
      - name: Set emergency expiry
        id: expiry
        run: echo "expires_at=$(date -u --date '+75 minutes' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Record pre-provisioning whole-project usage baseline
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/launch-distributed-setup.mjs budget
      - name: Create disposable production-sized branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CI_BRANCH_PREFIX: launch-load-${{ github.run_id }}-${{ github.run_attempt }}
          CI_BRANCH_PARENT: br-orange-feather-ayps8kep
          CI_BRANCH_EXPIRES: ${{ steps.expiry.outputs.expires_at }}
          CI_BRANCH_SUSPEND: 300
        run: node scripts/create-ci-neon-branch.mjs
      - name: Install pinned deployment tools
        run: node .github/scripts/install-wrangler-tool.mjs "$RUNNER_TEMP/edge-tools" neon@4.17.4 esbuild@0.28.2
      - name: Prepare isolated schema and exact revision
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          ESBUILD_BIN: ${{ runner.temp }}/edge-tools/node_modules/.bin/esbuild
        run: |
          node --input-type=module -e "import {checkBranch} from './scripts/edge-control.mjs';checkBranch(process.env.PREVIEW_BRANCH);if(process.env.PREVIEW_CREATED!=='true')throw Error('Fresh isolated branch required');"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          node scripts/ci-migration-plan.mjs launch-distributed > "$RUNNER_TEMP/pack1-migrations.txt"
          while IFS= read -r migration; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < "$RUNNER_TEMP/pack1-migrations.txt"
          node scripts/verify-neon-schema.mjs
          PACK1_RELEASE_COMMIT="$GITHUB_SHA" node scripts/warm-practice-cache.mjs
          node scripts/build-neon-functions.mjs "$RUNNER_TEMP/pack1-bundles" "$GITHUB_SHA"
      - name: Prepare accounts, entitlements, score history and query plans
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          LOAD_FIXTURE_FILE: /tmp/pack1-launch-fixtures.json
        run: node scripts/launch-distributed-fixtures.mjs
      - name: Deploy isolated Functions and private gateway
        id: deploy
        env:
          CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          EDGE_TOOLS_DIR: ${{ runner.temp }}/edge-tools
        run: node scripts/edge-control.mjs deploy
      - name: Prove retained private-preview telemetry before gameplay
        env:
          CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
        run: node scripts/launch-distributed-setup.mjs telemetry
      - name: Initialize exact-run isolated coordinator and resource guards
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PREVIEW_BRANCH: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_CREATED: ${{ steps.neon.outputs.created }}
          LOAD_FIXTURE_FILE: /tmp/pack1-launch-fixtures.json
        run: node scripts/launch-distributed-control.mjs
      - name: Encrypt isolated fixture credentials for the generator jobs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          LOAD_FIXTURE_FILE: /tmp/pack1-launch-fixtures.json
        run: node scripts/launch-distributed-bundle.mjs pack
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-encrypted-fixtures-${{ github.run_attempt }}
          path: artifacts/load-private
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-capacity-${{ github.run_attempt }}-setup
          path: artifacts/launch-load
          retention-days: 30
  cohort:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_EDGE_TOKEN: ${{ matrix.shard == 0 && secrets.CLOUDFLARE_EDGE_TOKEN || '' }}
      PREVIEW_BRANCH: ${{ needs.setup.outputs.branch }}
      LOAD_FIXTURE_FILE: /tmp/pack1-launch-fixtures.json
      LOAD_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: isolated-encrypted-fixtures-${{ github.run_attempt }}
          path: artifacts/load-private
      - run: node scripts/launch-distributed-bundle.mjs unpack
      - name: Persistent real-egress cohort, live barriers, gated 25/50 holds
        run: node scripts/launch-distributed-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-capacity-${{ github.run_attempt }}-runner-${{ matrix.shard }}
          path: artifacts/launch-load
          retention-days: 30
  collect_cleanup:
    needs: [setup, cohort]
    if: always() && needs.setup.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
      PREVIEW_BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: distributed-capacity-${{ github.run_attempt }}-*
          path: artifacts/distributed-results
      - name: Independently recompute cohort and complete-stage acceptance
        run: node scripts/launch-distributed-collect.mjs
      - name: Disable the private preview route even after a failed gate
        if: always()
        run: node scripts/edge-control.mjs disable
      - name: Delete the disposable branch even after failed collection or disable
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: patient-shadow-91417882
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ needs.setup.outputs.branch }}
      - name: Verify preview mapping absence and branch GET 404
        if: always()
        run: node scripts/launch-distributed-setup.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-capacity-${{ github.run_attempt }}-final
          path: artifacts/launch-load
          retention-days: 30
