name: dispatch account deletion maintenance once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-dispatch-account-deletion-maintenance.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch production account deletion maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/killjoy00/mtg-ev-analyzer/actions/workflows/account-deletion-maintenance.yml/dispatches \
            -d '{"ref":"main"}'
