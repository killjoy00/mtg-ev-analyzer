name: Corpus Operations
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Additive ingestion only; new sets stay Candidate'
        type: choice
        options: [development, production]
        default: development
      validated_run_id:
        description: 'Successful development Corpus Operations run ID whose exact artifact may be promoted'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: corpus-operations
  cancel-in-progress: false
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed code
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g neon@4.17.4
      - name: Prepare explicit connection and require additive schema
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TARGET: ${{ inputs.target || 'development' }}
        run: |
          set -euo pipefail
          umask 077
          case "$TARGET" in
            development) branch=br-twilight-hill-ayffyd2b ;;
            production) branch=br-orange-feather-ayps8kep ;;
            *) exit 1 ;;
          esac
          connection=$(neon connection-string "$branch" --project-id patient-shadow-91417882 --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          printf '%s' "$connection" > "$RUNNER_TEMP/corpus.connection"
          DATABASE_URL="$connection" node scripts/verify-neon-schema.mjs
      - name: Require reviewed development artifact for production
        if: ${{ (inputs.target || 'development') == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id || '' }}
        run: |
          set -euo pipefail
          test -n "$VALIDATED_RUN_ID" || { echo 'production requires validated_run_id from a successful development Corpus Operations run' >&2; exit 1; }
          gh run view "$VALIDATED_RUN_ID" --json conclusion,workflowName,headBranch,headSha | jq -e --arg sha "$GITHUB_SHA" 'select(.conclusion=="success" and .workflowName=="Corpus Operations" and .headBranch=="main" and .headSha==$sha)' >/dev/null
          rm -rf generated/corpus-candidates generated/corpus-operations
          mkdir -p generated/corpus-candidates generated/corpus-operations
          gh run download "$VALIDATED_RUN_ID" --name "corpus-operations-$VALIDATED_RUN_ID" --dir "$RUNNER_TEMP/validated"
          root="$RUNNER_TEMP/validated"
          [[ -d "$root/generated" ]] && root="$root/generated"
          test -f "$root/corpus-candidates/catalog.json"
          test -f "$root/corpus-operations/discovery.json"
          cp -R "$root/corpus-candidates/." generated/corpus-candidates/
          cp -R "$root/corpus-operations/." generated/corpus-operations/
      - uses: actions/cache/restore@v4
        if: ${{ (inputs.target || 'development') != 'production' }}
        with:
          path: generated/corpus-candidates
          key: corpus-candidates-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            corpus-candidates-${{ github.sha }}-
            corpus-candidates-
      - name: Discover archives and metadata
        if: ${{ (inputs.target || 'development') != 'production' }}
        run: |
          python scripts/discover-corpus.py
          node scripts/register-corpus-sources.mjs "$RUNNER_TEMP/corpus.connection"
      - name: Build, validate and ingest new Candidates
        if: ${{ (inputs.target || 'development') != 'production' }}
        run: |
          set -euo pipefail
          sets=$(cat generated/corpus-operations/pending.txt)
          if [[ -z "$sets" ]]; then echo 'No new corpus candidates.'; exit 0; fi
          python -u scripts/run_import_all_trophies.py --sets "$sets" --output generated/corpus-candidates --workers 2 --max-seconds 6000 --discard-source-archives
          node scripts/load_all_trophies.mjs unused generated/corpus-candidates --validate-only
          node scripts/load_all_trophies.mjs "$RUNNER_TEMP/corpus.connection" generated/corpus-candidates
      - name: Load exact development-validated artifact to production Candidate
        if: ${{ (inputs.target || 'development') == 'production' }}
        run: |
          set -euo pipefail
          node scripts/register-corpus-sources.mjs "$RUNNER_TEMP/corpus.connection"
          node scripts/load_all_trophies.mjs unused generated/corpus-candidates --validate-only
          node scripts/load_all_trophies.mjs "$RUNNER_TEMP/corpus.connection" generated/corpus-candidates
      - name: Verify newly ingested Candidate health
        shell: bash
        env:
          TARGET: ${{ inputs.target || 'development' }}
        run: |
          set -euo pipefail
          sets=$(cat generated/corpus-operations/pending.txt)
          if [[ -z "$sets" ]]; then
            echo 'No newly ingested corpus candidates; skipping deep payload health scan.'
            exit 0
          fi
          IFS=',' read -r -a set_args <<< "$sets"
          node scripts/check-corpus-health.mjs "$RUNNER_TEMP/corpus.connection" "${set_args[@]}"
          if [[ "$TARGET" == development ]]; then
            node scripts/candidate-gameplay-canary.mjs "$RUNNER_TEMP/corpus.connection"
          fi
      - name: Record import failures
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: node scripts/record-corpus-import-status.mjs "$RUNNER_TEMP/corpus.connection" generated/corpus-candidates
      - uses: actions/cache/save@v4
        if: ${{ always() && (inputs.target || 'development') != 'production' }}
        with:
          path: generated/corpus-candidates
          key: corpus-candidates-${{ github.sha }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.target || 'development') != 'production' }}
        with:
          name: corpus-operations-${{ github.run_id }}
          retention-days: 90
          path: |
            generated/corpus-operations/
            generated/corpus-candidates/catalog.json
            generated/corpus-candidates/*/manifest.json
            generated/corpus-candidates/*/trophies.jsonl.gz
            generated/corpus-candidates/*/puzzles.jsonl.gz
