name: CSP source inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - 'about/**'
      - 'admin/**'
      - 'contact/**'
      - 'creator/**'
      - 'd/**'
      - 'disclosure/**'
      - 'go/**'
      - 'how-it-works/**'
      - 'learn/**'
      - 'methodology/**'
      - 'open/**'
      - 'patreon/**'
      - 'practice/**'
      - 'privacy/**'
      - 'reset-password/**'
      - 'scoring/**'
      - 'sets/**'
      - 'share/**'
      - 'terms/**'
      - 'scripts/audit-site-csp.mjs'
      - 'scripts/build-pages-preview.mjs'
      - 'tests/site-csp-audit.test.mjs'
      - '.github/workflows/site-csp-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - 'about/**'
      - 'admin/**'
      - 'contact/**'
      - 'creator/**'
      - 'd/**'
      - 'disclosure/**'
      - 'go/**'
      - 'how-it-works/**'
      - 'learn/**'
      - 'methodology/**'
      - 'open/**'
      - 'patreon/**'
      - 'practice/**'
      - 'privacy/**'
      - 'reset-password/**'
      - 'scoring/**'
      - 'sets/**'
      - 'share/**'
      - 'terms/**'
      - 'scripts/audit-site-csp.mjs'
      - 'scripts/build-pages-preview.mjs'
      - 'tests/site-csp-audit.test.mjs'
      - '.github/workflows/site-csp-inventory.yml'

permissions:
  contents: read

concurrency:
  group: csp-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify scanner rules
        run: node --test tests/site-csp-audit.test.mjs
      - name: Inventory current published-source CSP dependencies
        run: node scripts/audit-site-csp.mjs
      - name: Upload source inventory for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csp-source-inventory
          path: artifacts/site-csp-audit.json
          retention-days: 7
          if-no-files-found: ignore
