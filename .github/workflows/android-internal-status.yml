name: Android Internal Testing status

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    name: read Google Play internal track
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: pack-one-mobile-release
    steps:
      - uses: actions/checkout@v4
      - name: Require current approved main revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Store operations are allowed only from main." >&2; exit 1; }
          git fetch --no-tags --depth=1 origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          [[ "$head_sha" == "$main_sha" ]] || {
            echo "Checked-out revision $head_sha is no longer current main ($main_sha)." >&2
            exit 1
          }
          echo "Verified current main revision: $head_sha"
      - id: auth
        name: Authenticate to Google Play
        uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Verify next monotonic version-code allocation
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKONE_ANDROID_PACKAGE: pro.packone.app
        run: node mobile/scripts/play-next-version-code.mjs
      - name: Read Internal Testing status
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app"
          auth_header="Authorization: Bearer $PLAY_ACCESS_TOKEN"
          edit_json="$(curl --fail-with-body --silent --show-error -X POST -H "$auth_header" -H 'Content-Type: application/json' -d '{}' "$base/edits")"
          edit_id="$(node -e 'const v=JSON.parse(process.argv[1]); if (!v.id) process.exit(1); process.stdout.write(v.id)' "$edit_json")"
          cleanup() { curl --silent --show-error -X DELETE -H "$auth_header" "$base/edits/$edit_id" >/dev/null || true; }
          trap cleanup EXIT
          track_json="$(curl --fail-with-body --silent --show-error -H "$auth_header" "$base/edits/$edit_id/tracks/internal")"
          testers_json="$(curl --fail-with-body --silent --show-error -H "$auth_header" "$base/edits/$edit_id/testers/internal")"
          echo "$track_json"
          echo "$testers_json"
          echo "## Google Play Internal Testing status" >> "$GITHUB_STEP_SUMMARY"
          echo "$track_json" >> "$GITHUB_STEP_SUMMARY"
          echo "## Google Play Internal Testing testers" >> "$GITHUB_STEP_SUMMARY"
          echo "$testers_json" >> "$GITHUB_STEP_SUMMARY"
