name: Android Internal Testing status

on:
  push:
    branches: [main]
    paths:
      - '.github/android-internal-status-request.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  status:
    name: read Google Play internal track
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    environment: pack-one-mobile-release
    steps:
      - uses: actions/checkout@v4
      - name: Resolve reviewed Android internal status request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('.github/android-internal-status-request.json').read_text())
          if set(request) != {'operation','reason'}:
              raise SystemExit('Invalid Android internal status request keys.')
          if request.get('operation') != 'check-android-internal-status':
              raise SystemExit('Invalid Android internal status operation.')
          reason=request.get('reason')
          if not isinstance(reason,str) or not reason.strip():
              raise SystemExit('Android internal status request requires a reason.')
          print('Reviewed Android internal status request:', reason)
          PY
      - name: Require current approved main revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Store operations are allowed only from main." >&2; exit 1; }
          git fetch --no-tags --depth=1 origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          [[ "$head_sha" == "$main_sha" ]] || {
            echo "Checked-out revision $head_sha is no longer current main ($main_sha)." >&2
            exit 1
          }
          echo "Verified current main revision: $head_sha"
      - id: auth
        name: Authenticate to Google Play
        uses: google-github-actions/auth@v3
        with:
          project_id: pack-one
          workload_identity_provider: projects/77537515004/locations/global/workloadIdentityPools/github/providers/mtg-ev-analyzer
          service_account: packone-play-ci@pack-one.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Verify next monotonic version-code allocation
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKONE_ANDROID_PACKAGE: pro.packone.app
        run: node mobile/scripts/play-next-version-code.mjs
      - name: Read Internal Testing status
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app"
          auth_header="Authorization: Bearer $PLAY_ACCESS_TOKEN"
          edit_json="$(curl --fail-with-body --silent --show-error -X POST -H "$auth_header" -H 'Content-Type: application/json' -d '{}' "$base/edits")"
          edit_id="$(node -e 'const v=JSON.parse(process.argv[1]); if (!v.id) process.exit(1); process.stdout.write(v.id)' "$edit_json")"
          cleanup() { curl --silent --show-error -X DELETE -H "$auth_header" "$base/edits/$edit_id" >/dev/null || true; }
          trap cleanup EXIT
          track_json="$(curl --fail-with-body --silent --show-error -H "$auth_header" "$base/edits/$edit_id/tracks/internal")"
          echo "$track_json"
          echo "## Google Play Internal Testing status" >> "$GITHUB_STEP_SUMMARY"
          echo "$track_json" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            comment_body="$(TRACK_JSON="$track_json" node <<'NODE'
          const track=JSON.parse(process.env.TRACK_JSON || '{}');
          const releases=Array.isArray(track.releases) ? track.releases : [];
          const latest=releases[0] || {};
          const codes=Array.isArray(latest.versionCodes) ? latest.versionCodes.join(', ') : 'none';
          const status=typeof latest.status === 'string' ? latest.status : 'unknown';
          const name=typeof latest.name === 'string' ? latest.name : 'unnamed';
          process.stdout.write([
            'Android Internal Testing status check:',
            '',
            '- Track: `internal`',
            `- Latest release: \`${name}\``,
            `- Version code(s): \`${codes}\``,
            `- Release status: \`${status}\``,
            `- Verified from current main: \`${process.env.GITHUB_SHA || 'unknown'}\``,
          ].join('\n'));
          NODE
            )"
            payload="$(COMMENT_BODY="$comment_body" node -e 'process.stdout.write(JSON.stringify({body:process.env.COMMENT_BODY}))')"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/524/comments" >/dev/null
          fi
