name: Mobile exact-main RC smoke

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/ios-testflight.yml'
      - '.github/workflows/android-internal-testing.yml'
      - '.github/workflows/android-production-bundle.yml'
      - '.github/workflows/mobile-exact-main-rc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-exact-main-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate exact current main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "RC smoke is allowed only from main." >&2; exit 1; }
          git fetch --no-tags --depth=1 origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          [[ "$head_sha" == "$main_sha" ]] || { echo "Checked-out revision $head_sha is no longer current main ($main_sha)." >&2; exit 1; }
          echo "Verified exact current main: $head_sha"
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Run full mobile validation
        run: npm test

  ios-archive:
    name: build unsigned iOS RC archive
    # The validate job proves this run started on exact main. If main moves after
    # validation, both native builds may finish, but the manifest job treats them
    # as stale evidence and emits no exact-main RC manifest.
    needs: validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Set RC build number
        shell: bash
        run: echo "PACKONE_IOS_BUILD_NUMBER=$((300000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Generate production iOS project
        env:
          CI: '1'
          PACKONE_BUILD_PROFILE: production
        run: npx expo prebuild --platform ios --clean
      - name: Archive iPhone device build without signing
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          xcodebuild -workspace "$workspace" -scheme PackOne -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PackOne.xcarchive" CURRENT_PROJECT_VERSION="$PACKONE_IOS_BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          plist="$RUNNER_TEMP/PackOne.xcarchive/Products/Applications/PackOne.app/Info.plist"
          test -f "$plist"
          expected_version="$(node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("store-release.json","utf8")); process.stdout.write(v.appStoreVersion)')"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$expected_version" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$PACKONE_IOS_BUILD_NUMBER" ]]
          python3 -c 'import plistlib,sys; data=plistlib.load(open(sys.argv[1], "rb")); assert data.get("ITSAppUsesNonExemptEncryption") is False' "$plist"
          ditto -c -k --keepParent "$RUNNER_TEMP/PackOne.xcarchive" "$RUNNER_TEMP/PackOne-unsigned.xcarchive.zip"
      - name: Audit generated iOS privacy surface
        shell: bash
        run: |
          set -euo pipefail
          python3 ./scripts/audit-ios-archive.py "$RUNNER_TEMP/PackOne.xcarchive" --output "$RUNNER_TEMP/pack-one-ios-native-audit.json"
      - name: Upload iOS native audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-ios-native-audit
          path: ${{ runner.temp }}/pack-one-ios-native-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned iOS RC archive
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-ios-unsigned-rc
          path: ${{ runner.temp }}/PackOne-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7

  android-bundle:
    name: build Android RC bundle
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deterministic mobile dependencies
        run: |
          node ./scripts/check-build-toolchain.mjs
          npm ci --no-audit --no-fund
      - name: Set RC version code
        shell: bash
        run: echo "PACKONE_ANDROID_VERSION_CODE=$((300000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Generate production Android project
        env:
          CI: '1'
          PACKONE_BUILD_PROFILE: production
        run: npx expo prebuild --platform android --clean
      - name: Compute unsigned Gradle cache key
        id: gradle-cache
        env:
          PACKONE_GRADLE_CACHE_JAVA: '17'
        run: node ./scripts/gradle-cache-key.mjs
      - name: Restore unsigned Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/node_modules/**/.cxx
          key: ${{ steps.gradle-cache.outputs.key }}
      - name: Verify native Android version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "versionCode[[:space:]]+$PACKONE_ANDROID_VERSION_CODE([[:space:]]|$)" android/app/build.gradle
          expected="$(node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("store-release.json","utf8")); process.stdout.write(v.playVersionName)')"
          grep -Eq "versionName[[:space:]]+['\"]$expected['\"]" android/app/build.gradle
      - name: Build release app bundle
        working-directory: mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon --build-cache
      - name: Audit generated Android privacy surface
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)"
          test -n "$manifest"
          python3 ../scripts/audit-android-manifest.py "$manifest" --output "$RUNNER_TEMP/pack-one-android-native-audit.json"
      - name: Upload Android native audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-android-native-audit
          path: ${{ runner.temp }}/pack-one-android-native-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify bundle signature
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" | tee /tmp/jarsigner.txt
          grep -q "jar verified" /tmp/jarsigner.txt
      - name: Upload Android RC bundle
        uses: actions/upload-artifact@v4
        with:
          name: pack-one-android-rc
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Verify unsigned Gradle cache contains no signing material
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${PACKONE_ANDROID_UPLOAD_KEYSTORE:-}" ]]
          [[ -z "${PACKONE_ANDROID_UPLOAD_PASSWORD:-}" ]]
          [[ -z "${PACKONE_ANDROID_UPLOAD_KEY_ALIAS:-}" ]]
          forbidden="$RUNNER_TEMP/pack-one-gradle-cache-forbidden.txt"
          : > "$forbidden"
          for root in "$HOME/.gradle/caches" "$HOME/.gradle/wrapper"; do
            [[ -d "$root" ]] || continue
            find "$root" -type f \( -name 'gradle.properties' -o -iname '*.jks' -o -iname '*.p12' -o -iname '*.keystore' \) -print >> "$forbidden"
          done
          while IFS= read -r -d '' dir; do
            find "$dir" -type f \( -name 'gradle.properties' -o -iname '*.jks' -o -iname '*.p12' -o -iname '*.keystore' \) -print >> "$forbidden"
          done < <(find node_modules -type d -name .cxx -print0)
          if [[ -s "$forbidden" ]]; then
            echo '::error::Unsigned Gradle cache contains a forbidden signing/config file:'
            cat "$forbidden"
            exit 1
          fi
          echo 'Verified Gradle cache roots exclude Gradle user properties and keystore material.'
      - name: Save unsigned Gradle cache from main
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/node_modules/**/.cxx
          key: ${{ steps.gradle-cache.outputs.key }}

  manifest:
    name: record RC evidence
    needs: [validate, ios-archive, android-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconfirm exact current main after both builds
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "RC evidence is allowed only from main." >&2; exit 1; }
          git fetch --no-tags --depth=1 origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$head_sha" != "$main_sha" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RC source $head_sha became stale while native builds ran; current main is $main_sha. Build/audit results remain attached to the source run, but no exact-main RC manifest will be written."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "Reconfirmed exact current main after native builds: $head_sha"
      - name: Write exact-main RC manifest
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-evidence
          node - <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync('mobile/store-release.json', 'utf8'));
          const out = {
            source_sha: process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_number: process.env.GITHUB_RUN_NUMBER,
            ref: process.env.GITHUB_REF,
            app_store_version: release.appStoreVersion,
            play_version_name: release.playVersionName,
            publication: 'none',
            ios_artifact: 'unsigned archive; not installable/store-published',
            android_artifact: 'production bundle smoke; not Play-published'
          };
          fs.writeFileSync('rc-evidence/mobile-exact-main-rc.json', JSON.stringify(out, null, 2) + '\n');
          NODE
          cat rc-evidence/mobile-exact-main-rc.json
      - uses: actions/upload-artifact@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          name: pack-one-mobile-rc-evidence
          path: rc-evidence/mobile-exact-main-rc.json
          if-no-files-found: error
          retention-days: 30
