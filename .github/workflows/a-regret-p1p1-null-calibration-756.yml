name: a-regret-p1p1-null-calibration-756

on:
  push:
    branches:
      - research/a-regret-null-calibration-756
    paths:
      - research/A-REGRET-NULL-CALIBRATION-RUN-P1P1-756.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PRERUN_RUN: '36451550413'
  RETAINED_RUN: '36583791463'
  BASE: https://17lands-public.s3.amazonaws.com/analysis_data
  PYTHONUNBUFFERED: '1'

jobs:
  calibrate:
    name: p1-null-${{ matrix.expansion }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - expansion: FIN
            draft_sha: 9d5b2a3e908bb8daf0ea6e951097714b651546370a5c852893dc90a1f2f6ab8b
            artifact: a-regret-p1p1-FIN
          - expansion: TDM
            draft_sha: 831ba8bc4be5eabe140fac00a8e6eaded3f3f931685be8f91403ad9cfde5cbf5
            artifact: a-regret-p1p1-TDM
          - expansion: DFT
            draft_sha: 7812d16e0de78ff7a69faf9981f7ff03be4dfc618a86f14369424ec2204580cd
            artifact: a-regret-p1p1-DFT
          - expansion: MSH
            draft_sha: 64100d71db77e0f0ef8ba893b259a1024eb6d15816db337c7758e7d96bc29cf7
            artifact: a-regret-p1p1-MSH
          - expansion: SOS
            draft_sha: df6220d8941e99b7264a54a7a7427096246ee6510057a83d4c9424b472761853
            artifact: a-regret-p1p1-SOS

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned numeric dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'scipy==1.16.2'

      - name: Materialize exact frozen P1P1 analyzer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin d121aa4b63f738ea039e15a21f839d97cbafb427
          git show d121aa4b63f738ea039e15a21f839d97cbafb427:research/one_time/a_regret_p1p1.py.gz.b64 \
            | base64 -d | gzip -d > research/a_regret_p1p1_frozen_runtime.py
          python -m py_compile research/a_regret_p1p1_frozen_runtime.py research/a_regret_null_common.py research/a_regret_p1p1_null_calibration.py

      - name: Download exact retained #529 prior-use ledger
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-r-independent-confirmation-prerun
          path: prior
          run-id: ${{ env.PRERUN_RUN }}
          github-token: ${{ github.token }}

      - name: Download retained #756 P1P1 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: retained
          run-id: ${{ env.RETAINED_RUN }}
          github-token: ${{ github.token }}

      - name: Download and verify exact draft archive
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
          DRAFT_SHA: ${{ matrix.draft_sha }}
        run: |
          set -euo pipefail
          mkdir -p raw
          curl --fail --location --retry 5 --retry-delay 3 \
            --output raw/draft.csv.gz \
            "$BASE/draft_data/draft_data_public.$EXPANSION.PremierDraft.csv.gz"
          echo "$DRAFT_SHA  raw/draft.csv.gz" | sha256sum -c -

      - name: Run synthetic P1P1 null calibration
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
        run: |
          set -euo pipefail
          mkdir -p "results/$EXPANSION"
          python research/a_regret_p1p1_null_calibration.py \
            --expansion "$EXPANSION" \
            --draft-archive raw/draft.csv.gz \
            --spent-ledger prior/spent-draft-ledger.json.gz \
            --reserve-json prior/reserve.json \
            --frozen-analyzer research/a_regret_p1p1_frozen_runtime.py \
            --retained-result-dir retained \
            --output-dir "results/$EXPANSION"

      - name: Assert no real outcome access
        shell: bash
        env:
          EXPANSION: ${{ matrix.expansion }}
        run: |
          python - <<'PY'
          import json, os
          e=os.environ['EXPANSION']
          r=json.load(open(f'results/{e}/p1-null-environment.json'))
          assert r['outcome_columns_read']==[]
          assert r['a_reconstruction']['outcome_columns_read']==[]
          assert r['a_validation']['checked_rows']==r['retained_scored_rows']
          assert r['replicates']>=20
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p1-null-calibration-${{ matrix.expansion }}
          path: results/${{ matrix.expansion }}/
          retention-days: 90

  aggregate:
    needs: calibrate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-null-calibration-*
          path: sets
      - name: Aggregate P1P1 calibration
        run: |
          mkdir -p results
          python research/a_regret_p1p1_null_aggregate.py \
            --input-root sets \
            --output results/p1p1-null-calibration-aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: p1p1-null-calibration-aggregate-756
          path: results/p1p1-null-calibration-aggregate.json
          retention-days: 90
