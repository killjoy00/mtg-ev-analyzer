name: Pack One ASC metadata verify
on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-asc-metadata-verify.yml"]
permissions:
  contents: read
jobs:
  verify:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os,time,json,jwt,requests
          kid=os.environ["ASC_KEY_ID"].strip(); iss=os.environ["ASC_ISSUER_ID"].strip()
          key=os.environ["ASC_KEY_P8"].replace("\\n","\n").strip(); now=int(time.time())
          tok=jwt.encode({"iss":iss,"iat":now-5,"exp":now+900,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          H={"Authorization":f"Bearer {tok}"}; B="https://api.appstoreconnect.apple.com/v1"
          def g(path):
            r=requests.get(B+path,headers=H,timeout=30); r.raise_for_status(); return r.json()
          app=g("/apps/6814318676")["data"]
          al=g("/appInfoLocalizations/73302616-4346-4b3c-8540-140a431cb6a0")["data"]
          vl=g("/appStoreVersionLocalizations/cc3dfd3b-b29c-4387-8f4b-a2df20f5c49a")["data"]
          info="382f1166-fe38-45d0-a3dd-0edb6cc3c684"
          rels={}
          for rel in ["primaryCategory","primarySubcategoryOne","primarySubcategoryTwo","secondaryCategory"]:
              rels[rel]=g(f"/appInfos/{info}/relationships/{rel}")["data"]
          print("VERIFY_BEGIN")
          print("content_rights="+str(app["attributes"].get("contentRightsDeclaration")))
          print("subtitle="+str(al["attributes"].get("subtitle")))
          print("privacy_policy="+str(al["attributes"].get("privacyPolicyUrl")))
          print("description_chars="+str(len(vl["attributes"].get("description") or "")))
          print("keywords="+str(vl["attributes"].get("keywords")))
          print("marketing_url="+str(vl["attributes"].get("marketingUrl")))
          print("support_url="+str(vl["attributes"].get("supportUrl")))
          print("promotional_text="+str(vl["attributes"].get("promotionalText")))
          for k,v in rels.items(): print(k+"="+(v.get("id") if isinstance(v,dict) else "null"))
          print("VERIFY_END")
          PY
