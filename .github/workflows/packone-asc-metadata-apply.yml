name: Pack One ASC metadata apply
on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-asc-metadata-apply.yml"]
permissions:
  contents: read
jobs:
  apply:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply Pack One metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os,time,json,jwt,requests,sys

          APP_ID="6814318676"
          APPINFO_ID="382f1166-fe38-45d0-a3dd-0edb6cc3c684"
          APPINFOLOC_ID="73302616-4346-4b3c-8540-140a431cb6a0"
          VERSION_ID="04b0ee74-7d94-41e4-8463-79524972fce6"
          VERSIONLOC_ID="cc3dfd3b-b29c-4387-8f4b-a2df20f5c49a"

          description = """Sharpen your Limited draft decisions with eight real choices at a time.

          Pack One turns qualified trophy drafts from public 17Lands archives into short decision runs. See the original pack and the drafter's earlier cards, lock your pick, then compare it with the historical trophy choice and model-supported alternatives.

          THREE DAILY CHALLENGES
          • Daily Draft Run — decisions across current and historical sets
          • Daily Powered Cube — high-powered Cube picks
          • Daily Latest Set — eight choices from the newest supported release

          PRACTICE & PROGRESS
          Play all three Dailies as a guest. Create a free account to save progress, join leaderboards, review career history, and run unlimited regular practice. Existing Elite entitlements can also unlock Powered Cube and custom-set practice.

          TRANSPARENT SCORING
          Matching the trophy drafter earns 100. Other choices can earn partial credit based on model support. Pack One keeps the historical choice and model evidence distinct and links to its methodology.

          Pack One adapts 17Lands public datasets and uses card metadata and images from Scryfall. Magic: The Gathering card names, art, symbols, trademarks, and related intellectual property belong to Wizards of the Coast and other applicable rights holders.

          Pack One is unofficial Fan Content permitted under the Wizards Fan Content Policy. It is not approved or endorsed by Wizards of the Coast."""
          description="\n".join(line.strip() for line in description.splitlines()).strip()
          keywords="draft,limited,card,strategy,cube,training,practice,picks,deckbuilding,trophy,decision"
          promotional="Eight real draft decisions. Make your pick, then compare it with the trophy choice and model support."

          assert len(description) <= 4000
          assert len(keywords.encode("utf-8")) <= 100
          assert len(promotional) <= 170
          assert len("Draft Decision Trainer") <= 30

          kid=os.environ["ASC_KEY_ID"].strip(); iss=os.environ["ASC_ISSUER_ID"].strip()
          key=os.environ["ASC_KEY_P8"].replace("\\n","\n").strip(); now=int(time.time())
          tok=jwt.encode({"iss":iss,"iat":now-5,"exp":now+900,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          H={"Authorization":f"Bearer {tok}","Content-Type":"application/json"}
          B="https://api.appstoreconnect.apple.com/v1"

          def patch(path,body,label):
              r=requests.patch(B+path,headers=H,json=body,timeout=30)
              print(label+"_http="+str(r.status_code))
              if r.status_code not in (200,204):
                  try:
                      for e in r.json().get("errors",[])[:5]:
                          print("ASC_ERROR",label,e.get("status"),e.get("code"),e.get("title"),e.get("detail"))
                  except Exception: pass
                  return False
              return True

          ok=True
          ok &= patch(f"/appInfoLocalizations/{APPINFOLOC_ID}",{
            "data":{"type":"appInfoLocalizations","id":APPINFOLOC_ID,"attributes":{
              "subtitle":"Draft Decision Trainer",
              "privacyPolicyUrl":"https://packone.pro/privacy/"
            }}
          },"app_info_localization")

          ok &= patch(f"/appStoreVersionLocalizations/{VERSIONLOC_ID}",{
            "data":{"type":"appStoreVersionLocalizations","id":VERSIONLOC_ID,"attributes":{
              "description":description,
              "keywords":keywords,
              "marketingUrl":"https://packone.pro/",
              "promotionalText":promotional,
              "supportUrl":"https://packone.pro/contact/"
            }}
          },"version_localization")

          ok &= patch(f"/appInfos/{APPINFO_ID}",{
            "data":{"type":"appInfos","id":APPINFO_ID,"relationships":{
              "primaryCategory":{"data":{"type":"appCategories","id":"GAMES"}},
              "primarySubcategoryOne":{"data":{"type":"appCategories","id":"GAMES_CARD"}},
              "primarySubcategoryTwo":{"data":{"type":"appCategories","id":"GAMES_STRATEGY"}}
            }}
          },"categories")

          ok &= patch(f"/apps/{APP_ID}",{
            "data":{"type":"apps","id":APP_ID,"attributes":{
              "contentRightsDeclaration":"USES_THIRD_PARTY_CONTENT"
            }}
          },"content_rights")

          if not ok:
              sys.exit(1)

          print("metadata_apply=success")
          print("description_chars="+str(len(description)))
          print("keywords_bytes="+str(len(keywords.encode("utf-8"))))
          print("promotional_chars="+str(len(promotional)))
          PY
