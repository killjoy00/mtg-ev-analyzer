name: Pool-aware refit - assessment preparation

on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-assessment-preparation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test blinded-review evaluator with synthetic fixtures
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python scripts/pool_aware_quality_eval.py --self-test
          mkdir -p artifacts/pool-assessment
          python scripts/pool_aware_quality_eval.py --power-plan > artifacts/pool-assessment/power-plan.json
      - name: Check public source metadata without reading assessment rows
        run: python scripts/pool_aware_assessment_inventory.py --output artifacts/pool-assessment/archive-headers.json
      - name: Preserve non-sensitive preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-assessment-preparation
          retention-days: 90
          if-no-files-found: error
          path: artifacts/pool-assessment/
