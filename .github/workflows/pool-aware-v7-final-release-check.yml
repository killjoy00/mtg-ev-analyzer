name: Pool-aware v7 - final source and stability audit

on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-v7-final-release-check.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pool-aware-v7-neutral-release-check
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python scripts/pool_aware_skill_final_validation.py --self-test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45942026287
          pattern: pool-aware-expansion-report-*
          path: artifacts/parser-coverage/fits/expansion
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46028685209
          pattern: pool-aware-recovery-report-*
          path: artifacts/parser-coverage/fits/recovery
      - name: Verify parser coverage on the exact 31 pinned rules snapshots
        run: python scripts/pool_aware_mana_parser_inventory.py --fits artifacts/parser-coverage/fits --output artifacts/parser-coverage/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-mana-parser-coverage
          retention-days: 90
          if-no-files-found: error
          path: artifacts/parser-coverage/report.json
  measure:
    needs: preflight
    name: Final check - ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        set: [blb, bro, dft, dmu, dsk, ecl, eoe, fdn, fin, fra, hbg, hob, ktk, lci, ltr, mh3, mkm, mom, msh, neo, one, otj, pio, powered-cube, sir, snc, sos, tdm, tla, tmt, woe]
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      AWS_DEFAULT_REGION: auto
      RESEARCH_SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Recover measured expansion fit and rules
        if: "!contains(fromJSON('[\"woe\",\"bro\",\"dmu\",\"hbg\",\"mom\",\"neo\",\"one\",\"sir\",\"snc\"]'), matrix.set)"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45942026287
          name: pool-aware-expansion-report-${{ matrix.set }}
          path: artifacts/final/prior
      - name: Recover measured legacy/duplicate-filtered fit and rules
        if: contains(fromJSON('["woe","bro","dmu","hbg","mom","neo","one","sir","snc"]'), matrix.set)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46028685209
          name: pool-aware-recovery-report-${{ matrix.set }}
          path: artifacts/final/prior
      - name: Recover exact previously validated mana-parser comparator
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46058171727
          name: pool-aware-parser-report-${{ matrix.set }}
          path: artifacts/final/previous
      - name: Restore exact retained public archives
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u scripts/pool_aware_skill_final_validation.py --stage restore --set "$RESEARCH_SET" --work artifacts/final/input --output artifacts/final/result
      - name: Authenticate prior fit, metadata and windows
        run: python -u scripts/pool_aware_skill_final_validation.py --stage inputs --set "$RESEARCH_SET" --prior artifacts/final/prior --work artifacts/final/input --output artifacts/final/result
      - name: Validate frozen coefficients with explicit source routes and bounded pack adjustment
        run: python -u scripts/pool_aware_skill_final_validation.py --stage measure --set "$RESEARCH_SET" --prior artifacts/final/prior --previous artifacts/final/previous --work artifacts/final/input --output artifacts/final/result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-final-report-${{ matrix.set }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/final/result/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-final-transfer-${{ matrix.set }}
          retention-days: 1
          if-no-files-found: error
          path: artifacts/final/result/
  aggregate:
    if: always() && needs.preflight.result == 'success' && needs.measure.result != 'cancelled'
    needs: [preflight, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pool-aware-final-transfer-*
          path: artifacts/final/sets
      - name: Aggregate all final-candidate formats
        run: python -u scripts/pool_aware_skill_final_validation.py --stage aggregate --banks artifacts/final/sets --output artifacts/final/combined-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-final-combined-report
          retention-days: 90
          if-no-files-found: error
          path: artifacts/final/combined-report.json

  production-shadow:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONPATH: scripts:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '17313c11e8a7aa2b05b0e79cd5dc3b6719ab5889'
          path: production-policy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 'psycopg[binary]==3.2.9'
          python scripts/pool_aware_v7_final_production_shadow.py --self-test
          npm install -g neon@4.17.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45942026287
          pattern: pool-aware-expansion-report-*
          path: artifacts/shadow/fits/expansion
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46028685209
          pattern: pool-aware-recovery-report-*
          path: artifacts/shadow/fits/recovery
      - name: Pin production membership and selection policy
        run: |
          mkdir -p artifacts/shadow
          node --input-type=module <<'JS' > artifacts/shadow/policy.json
          import {corpusMembership} from './production-policy/worker/corpus-components.mjs';
          import versions from './production-policy/model-versions.json' with {type:'json'};
          import policy from './production-policy/data/selection-policy.json' with {type:'json'};
          console.log(JSON.stringify({commit:'17313c11e8a7aa2b05b0e79cd5dc3b6719ab5889',
            parent:versions.v6.corpus_version,model:versions.v6.model_version,
            membership:corpusMembership({serving:true}),max_pick:policy.max_pick}));
          JS
      - name: Audit stored production supports in read-only transactions
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          connection_file="$RUNNER_TEMP/v7-shadow.connection"
          trap 'rm -f "$connection_file"' EXIT
          connection=$(neon connection-string br-orange-feather-ayps8kep --project-id patient-shadow-91417882 --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          printf '%s' "$connection" > "$connection_file"
          unset connection
          python -u scripts/pool_aware_v7_final_production_shadow.py --connection-file "$connection_file" --policy artifacts/shadow/policy.json --fits artifacts/shadow/fits --output artifacts/shadow/production-shadow-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pool-aware-v7-final-production-shadow-report
          retention-days: 90
          if-no-files-found: error
          path: artifacts/shadow/production-shadow-report.json
