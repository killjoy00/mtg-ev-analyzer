name: contextual-value-v1-propensity-lbfgs-audit

on:
  push:
    branches:
      - research/contextual-value-v1-propensity-lbfgs-529
    paths:
      - '.github/workflows/contextual-value-v1-propensity-lbfgs-audit.yml'
      - 'research/contextual_value_propensity_lbfgs.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned optimizer dependency
        run: python -m pip install --disable-pip-version-check 'scipy==1.18.1'
      - name: Download successful development cohort
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-preprocessed-core-8000
          path: preprocessed-core
          run-id: 36256947308
          github-token: ${{ github.token }}
      - name: Download fold -1 training feature shards
        uses: actions/download-artifact@v4
        with:
          pattern: contextual-value-v1-feature-fold--1-*
          path: precomputed-features
          merge-multiple: true
          run-id: 36256947308
          github-token: ${{ github.token }}
      - name: Download retained 250-epoch validation nuisance
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-nuisance-fold--1
          path: precomputed-validation
          run-id: 36256947308
          github-token: ${{ github.token }}
      - name: Run training-only L-BFGS convergence audit
        run: |
          python3 research/contextual_value_propensity_lbfgs.py \
            --cohort-dir preprocessed-core \
            --feature-shard precomputed-features/train-feature-fold--1-MSH.jsonl.gz \
            --feature-shard precomputed-features/train-feature-fold--1-SOS.jsonl.gz \
            --feature-shard precomputed-features/train-feature-fold--1-ECL.jsonl.gz \
            --feature-shard precomputed-features/train-feature-fold--1-TLA.jsonl.gz \
            --validation-nuisance precomputed-validation/validation-nuisance.jsonl.gz \
            --source-sha aa5b17d96b43f3ce08f52fad55ba17f327472c1b \
            --out results/contextual-value-v1/propensity-lbfgs-audit.json
      - name: Assert convergence and assessment boundary
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open("results/contextual-value-v1/propensity-lbfgs-audit.json"))
          assert report["scope"] == "development_only"
          assert report["assessment_opened"] is False
          assert report["assessment_outcomes_used"] is False
          assert report["solver"]["success"] is True
          assert report["solver"]["final_gradient_max_abs"] <= report["solver"]["gtol"]
          assert report["solver"]["gradient_self_check"]["max_abs_error"] <= 2e-6
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-propensity-lbfgs-audit
          path: results/contextual-value-v1/propensity-lbfgs-audit.json
          retention-days: 30
