name: verify Pack One email ownership flow in QA

on:
  push:
    branches: [main]
    paths: ['.github/auth-verification-qa-request.json']
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable Neon branch id
        required: true
        type: string
      authBase:
        description: Disposable Neon Auth base URL
        required: true
        type: string
      reason:
        description: Why this QA acceptance is being run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pack1-auth-verification-qa
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
      PACK1_AUTH_RESEND_API_KEY: ${{ secrets.PACK1_AUTH_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize and validate QA verification request
        env:
          DISPATCH_BRANCH: ${{ inputs.branch }}
          DISPATCH_AUTH_BASE: ${{ inputs.authBase }}
          DISPATCH_REASON: ${{ inputs.reason }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const fromDispatch=process.env.GITHUB_EVENT_NAME==='workflow_dispatch';
          const value=fromDispatch
            ? {
                operation:'run',
                branch:process.env.DISPATCH_BRANCH||'',
                authBase:process.env.DISPATCH_AUTH_BASE||'',
                reason:process.env.DISPATCH_REASON||'',
              }
            : JSON.parse(fs.readFileSync('.github/auth-verification-qa-request.json','utf8'));
          if(JSON.stringify(Object.keys(value).sort())!==JSON.stringify(['authBase','branch','operation','reason']))throw Error('Invalid QA verification request.');
          if(value.operation!=='run'||typeof value.reason!=='string'||value.reason.length<12)throw Error('Invalid QA verification request.');
          if(!/^br-[a-z0-9-]{6,60}$/.test(value.branch||''))throw Error('Invalid QA verification branch.');
          if(['br-orange-feather-ayps8kep','br-twilight-hill-ayffyd2b'].includes(value.branch))throw Error('QA verification must not target production or development.');
          const authBase=new URL(value.authBase);
          if(authBase.protocol!=='https:'||!authBase.hostname.endsWith('.neon.tech')||authBase.pathname!=='/pack1/auth')throw Error('Invalid QA verification Auth base.');
          const requestPath=path.join(process.env.RUNNER_TEMP,'auth-verification-qa-request.json');
          fs.writeFileSync(requestPath,JSON.stringify(value)+'\n',{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV,'AUTH_VERIFICATION_QA_REQUEST_PATH='+requestPath+'\n');
          NODE
      - name: Install pinned QA verification tools
        run: npm install --prefix "$RUNNER_TEMP/auth-verification-tools" --no-audit --no-fund neon@5.0.0 wrangler@4.132.0
      - name: Run disposable email-verification acceptance
        env:
          EDGE_TOOLS_DIR: ${{ runner.temp }}/auth-verification-tools
        run: node scripts/auth-verification-qa-acceptance-v2.mjs
