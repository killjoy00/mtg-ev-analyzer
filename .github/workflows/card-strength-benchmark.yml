name: Card strength benchmark contracts

on:
  pull_request:
    paths:
      - 'scripts/card_strength_benchmark.py'
      - 'scripts/card_outcomes.py'
      - 'tests/test_card_strength_benchmark.py'
      - 'research/card-strength-*.json'
      - 'research/card-strength-requirements.txt'
      - '.github/workflows/card-strength-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/card-strength-requirements.txt
      - run: python -m pip install -r research/card-strength-requirements.txt
      - run: python -m unittest discover -s tests -p test_card_strength_benchmark.py -v
      - run: python -m unittest discover -s tests -p test_card_outcomes.py -v
