name: production draftrun gameplay smoke

on:
  push:
    branches: ["deploy-draftrun-cors"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech
      ORIGIN: https://packone.pro
    steps:
      - name: Verify production Draft Run browser contract and gameplay
        shell: bash
        run: |
          set -euo pipefail
          CURL=(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 60)

          headers="$(mktemp)"
          code="$("${CURL[@]}" -o /dev/null -D "$headers" -w '%{http_code}' \
            -X OPTIONS "$BASE/health" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type')"
          test "$code" = 204
          grep -iq "^access-control-allow-origin: $ORIGIN" "$headers"

          health="$("${CURL[@]}" --fail "$BASE/health" -H "Origin: $ORIGIN")"
          echo "$health" | jq -e '.ok == true and .service == "draft-run"' >/dev/null

          session="$("${CURL[@]}" --fail -X POST "$BASE/v1/session" \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            --data '{"displayName":"QA production smoke"}')"
          token="$(echo "$session" | jq -r '.token')"
          test -n "$token" && test "$token" != null

          mixed="$("${CURL[@]}" --fail -X POST "$BASE/v1/runs" \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -H "Authorization: Bearer $token" \
            --data '{"environment":"mixed"}')"
          echo "$mixed" | jq -e '.id and .current.pick_number == 1 and .current.set_id != "powered-cube"' >/dev/null

          cube="$("${CURL[@]}" --fail -X POST "$BASE/v1/runs" \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -H "Authorization: Bearer $token" \
            --data '{"environment":"powered-cube"}')"
          echo "$cube" | jq -e '.id and .current.pick_number == 2 and .current.set_id == "powered-cube" and .rerolls.pack == 2' >/dev/null

          cube_id="$(echo "$cube" | jq -r '.id')"
          old_puzzle="$(echo "$cube" | jq -r '.current.puzzle_id')"
          cube_action="$(echo "$cube" | jq -c '{revision:.revision,round:(.answers|length),puzzleId:.current.puzzle_id,type:"pack"}')"
          rerolled="$("${CURL[@]}" --fail -X POST "$BASE/v1/runs/$cube_id/reroll" \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -H "Authorization: Bearer $token" \
            --data "$cube_action")"
          echo "$rerolled" | jq -e --arg old "$old_puzzle" '.rerolls.pack == 1 and .current.set_id == "powered-cube" and .current.puzzle_id != $old' >/dev/null

          echo 'Production Draft Run CORS, health, session, mixed run, Powered Cube run, and Cube reroll all passed.'
