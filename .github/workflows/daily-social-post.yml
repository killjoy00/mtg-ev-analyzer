name: post Pack One Daily to Bluesky and Discord

on:
  push:
    branches: [main]
    paths:
      - 'scripts/featured-pick-correction.mjs'
  schedule:
    # 07:10 Pacific, summer and winter. Durable receipts deduplicate every trigger
    # and let later triggers recover a missed or delayed earlier one.
    # In winter 14:10 UTC is 06:10 PST and skips; 15:10 UTC posts at 07:10 PST.
    - cron: '10 14 * * *'
    - cron: '10 15 * * *'
    - cron: '10 16 * * *'
  pull_request:
    paths:
      - '.github/workflows/daily-social-post.yml'
      - 'scripts/post-daily-social.mjs'
      - 'scripts/daily-social-ledger.mjs'
      - 'tests/daily-social-post.test.mjs'
      - 'tests/daily-social-ledger.test.mjs'
      - 'scripts/preview-featured-pick.mjs'
      - 'scripts/featured-pick.mjs'
      - 'scripts/featured-pick-correction.mjs'
      - 'scripts/generate-featured-pick.mjs'
      - 'scripts/render-featured-pick.mjs'
      - 'scripts/featured-soundtrack.mjs'
      - 'scripts/publish-featured-pick.mjs'
      - 'scripts/publish-featured-patreon.mjs'
      - 'scripts/capture-patreon-session.mjs'
      - 'scripts/upload-daily-short.mjs'
      - 'tests/featured-pick.test.mjs'
      - 'tests/featured-patreon.test.mjs'
      - 'tests/featured-soundtrack.test.mjs'
      - 'docs/FEATURED-PICK-MORNINGS.md'
  workflow_dispatch:
    inputs:
      live:
        description: 'Publish for real (default is a no-network dry run)'
        type: boolean
        default: false
        required: true
      source_day:
        description: 'Pacific Daily date from the independent Neon scheduler (empty for owner runs)'
        type: string
        default: ''
        required: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  # Dry runs and PR tests never occupy the live publisher's serialized queue.
  group: ${{ github.event_name == 'pull_request' && format('packone-social-review-{0}', github.ref) || (github.event_name == 'workflow_dispatch' && inputs.live != true && format('packone-social-preview-{0}', github.ref) || 'packone-social-live') }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name != 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify offline publishing contracts
        run: node --test tests/daily-social-post.test.mjs tests/daily-social-ledger.test.mjs tests/daily-social-dispatch.test.mjs tests/featured-pick.test.mjs tests/featured-patreon.test.mjs
      - name: Publish or preview Daily
        if: github.event_name != 'pull_request'
        run: node scripts/post-daily-social.mjs
        env:
          MANUAL_LIVE: ${{ inputs.live }}
          SOURCE_PACIFIC_DAY: ${{ inputs.source_day }}
          GITHUB_TOKEN: ${{ github.token }}
          SOCIAL_LEDGER_ISSUE: '1135'
          BLUESKY_HANDLE: ${{ secrets.PACKONE_BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.PACKONE_BLUESKY_APP_PASSWORD }}
          DISCORD_WEBHOOK_URLS: ${{ secrets.PACKONE_DISCORD_WEBHOOK_URLS }}
          DAILY_IMAGE_URL_TEMPLATE: ${{ vars.PACKONE_DAILY_IMAGE_URL_TEMPLATE }}

  featured:
    outputs:
      artifact_ready: ${{ steps.featured_artifact.outputs.artifact-id != '' }}
    # The same independent Neon clock (07:10, 07:20, 07:40 Pacific) and GitHub
    # fallback drive both Daily announcements and yesterday's separate feature.
    if: >-
      github.repository == 'killjoy00/mtg-ev-analyzer' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.live == true))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MANUAL_LIVE: ${{ github.event_name == 'push' && 'true' || inputs.live }}
      SOURCE_PACIFIC_DAY: ${{ inputs.source_day }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.PACKONE_BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.PACKONE_BLUESKY_APP_PASSWORD }}
      DISCORD_WEBHOOK_URLS: ${{ secrets.PACKONE_DISCORD_WEBHOOK_URLS }}
      PACKONE_YOUTUBE_CLIENT_ID: ${{ secrets.PACKONE_YOUTUBE_CLIENT_ID }}
      PACKONE_YOUTUBE_CLIENT_SECRET: ${{ secrets.PACKONE_YOUTUBE_CLIENT_SECRET }}
      PACKONE_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PACKONE_YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PAUSED: ${{ vars.PACKONE_YOUTUBE_UPLOAD_PAUSED }}
      FEATURED_YOUTUBE_PAUSED: ${{ vars.PACKONE_FEATURED_YOUTUBE_PAUSED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned project dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify selection and original soundtrack
        run: node --test tests/featured-pick.test.mjs tests/featured-soundtrack.test.mjs
      - name: Select the previous Pacific day's most debated pick
        id: select
        run: node scripts/generate-featured-pick.mjs
      - name: Install browser and video codec for real card images
        if: steps.select.outputs.selected == 'true'
        run: |
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Render real-card social image, Patreon copy and scored vertical Short
        if: steps.select.outputs.selected == 'true'
        run: node scripts/render-featured-pick.mjs
      - uses: actions/upload-artifact@v4
        id: featured_artifact
        if: steps.select.outputs.selected == 'true'
        with:
          name: packone-featured-pick
          path: artifacts/featured-pick/
          if-no-files-found: error
          retention-days: 7
      - name: Show owner where to get the Patreon draft
        if: steps.select.outputs.selected == 'true'
        env:
          FEATURE_ARTIFACT_URL: ${{ steps.featured_artifact.outputs.artifact-url }}
        run: |
          {
            echo "### Featured pick for Patreon"
            echo "The copy is **not in Patreon's Drafts section**. We cannot create Patreon drafts through its public API."
            echo "Download the generated media and open **patreon.md**:"
            echo
            echo "[Download today's featured-pick artifact]($FEATURE_ARTIFACT_URL)"
            echo
            echo "The featured YouTube Short now includes a synthesized original soundtrack."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish featured pick to configured channels, once
        if: steps.select.outputs.selected == 'true'
        run: node scripts/publish-featured-pick.mjs

  featured-patreon:
    # Runs separately so a Patreon session/UI failure cannot stop other social destinations.
    # Run even if another featured destination failed AFTER the artifact upload.
    needs: [featured]
    if: >-
      always() &&
      github.repository == 'killjoy00/mtg-ev-analyzer' &&
      github.ref == 'refs/heads/main' &&
      needs.featured.outputs.artifact_ready == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.live == true))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MANUAL_LIVE: ${{ github.event_name == 'push' && 'true' || inputs.live }}
      SOURCE_PACIFIC_DAY: ${{ inputs.source_day }}
      PACKONE_PATREON_AUTOPUBLISH_ENABLED: ${{ vars.PACKONE_PATREON_AUTOPUBLISH_ENABLED }}
      PACKONE_PATREON_STORAGE_STATE_B64: ${{ secrets.PACKONE_PATREON_STORAGE_STATE_B64 }}
      PATREON_CREATOR_ACCESS_TOKEN: ${{ secrets.PATREON_CREATOR_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies and test Patreon publishing guards
        run: |
          npm ci --no-audit --no-fund
          node --test tests/featured-patreon.test.mjs
      - name: Download rendered featured image, data and Patreon copy
        uses: actions/download-artifact@v4
        with:
          name: packone-featured-pick
          path: artifacts/featured-pick
      - name: Install Chromium only if Patreon publisher is activated
        if: env.PACKONE_PATREON_AUTOPUBLISH_ENABLED == 'true'
        run: npx playwright install --with-deps chromium
      - name: Publish and verify public Patreon image post
        run: node scripts/publish-featured-patreon.mjs

  featured-preview:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project and offline test deterministic selection
        run: |
          npm ci --no-audit --no-fund
          node --test tests/featured-pick.test.mjs tests/featured-soundtrack.test.mjs
      - name: Generate deidentified production pick preview (no secrets)
        run: node scripts/preview-featured-pick.mjs
      - name: Install browser and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Render real-card graphic and original-scored 20-second Short, no publication
        run: node scripts/render-featured-pick.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packone-featured-preview
          path: artifacts/featured-pick/
          if-no-files-found: error
          retention-days: 5
