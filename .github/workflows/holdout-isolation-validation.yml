name: holdout-isolation-validation

on:
  push:
    branches:
      - measure/164-selection-movement
  workflow_dispatch:

concurrency:
  group: holdout-isolation-selection-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: generated/holdout-isolation
          key: holdout-isolation-pinned-v1-${{ hashFiles('results/scoring-2026-09-16/downloads.json') }}

      - name: Download exact pinned evaluation archives
        run: |
          python - <<'PY'
          import json
          import pathlib
          import urllib.request

          root = pathlib.Path("generated/holdout-isolation")
          pins = json.loads(pathlib.Path("results/scoring-2026-09-16/downloads.json").read_text())
          for pin in pins:
              directory = root / pin["set_id"]
              directory.mkdir(parents=True, exist_ok=True)
              path = directory / f'{pin["kind"]}.csv.gz'
              if path.exists() and path.stat().st_size == pin["bytes"]:
                  continue
              temp = path.with_suffix(path.suffix + ".download")
              urllib.request.urlretrieve(pin["url"], temp)
              temp.replace(path)
          PY

      - name: Run fold-isolation comparison
        run: |
          python scripts/compare_holdout_isolation.py \
            --work generated/holdout-isolation \
            --sets "${{ matrix.set }}" \
            --out generated/holdout-isolation/report.json
          echo '--- HOLDOUT ISOLATION REPORT ---'
          cat generated/holdout-isolation/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: holdout-isolation-selection-${{ matrix.set }}
          path: generated/holdout-isolation/report.json
          if-no-files-found: error
