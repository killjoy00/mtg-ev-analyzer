name: live release e2e

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Diagnose live production start
        env:
          PACK1_LIVE_URL: https://magic.planitnow.us
        run: node tests/live-start-diagnostic.mjs
      - name: Upload live verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack1-live-release-screenshots
          path: artifacts/live-*.png
          if-no-files-found: ignore
