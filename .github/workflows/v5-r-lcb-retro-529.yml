name: v5 vs frozen R-LCB retrospective 529

on:
  push:
    branches:
      - research/v5-r-lcb-retro-2026-10-04
    paths:
      - scripts/v5_r_lcb_actions_529.py
      - scripts/v5_r_lcb_aggregate_529.py
      - .github/workflows/v5-r-lcb-retro-529.yml

permissions:
  contents: read
  actions: read

jobs:
  reconstruct-v5:
    name: Reconstruct v5 ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: FIN
            sid: fin
            draft_url: https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.FIN.PremierDraft.csv.gz
            game_url: https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.FIN.PremierDraft.csv.gz
          - env: TDM
            sid: tdm
            draft_url: https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.TDM.PremierDraft.csv.gz
            game_url: https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.TDM.PremierDraft.csv.gz
          - env: DFT
            sid: dft
            draft_url: https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.DFT.PremierDraft.csv.gz
            game_url: https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.DFT.PremierDraft.csv.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'
      - name: Download frozen 15k environment context
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-r-independent-confirmation-freeze-${{ matrix.env }}
          path: freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36475098718
      - name: Download shipped v5 environment artifact
        uses: actions/download-artifact@v4
        with:
          name: v5-environment-${{ matrix.sid }}
          path: v5env
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37097278712
      - name: Download exact pinned 17Lands archives
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --output draft.csv.gz '${{ matrix.draft_url }}'
          curl --fail --location --retry 4 --retry-all-errors --output game.csv.gz '${{ matrix.game_url }}'
      - name: Reconstruct exact uncapped v5 actions and outcomes
        env:
          PYTHONPATH: scripts:.
        run: |
          python scripts/v5_r_lcb_actions_529.py \
            --set '${{ matrix.env }}' \
            --draft draft.csv.gz \
            --game game.csv.gz \
            --freeze freeze/frozen-evaluation-context.npz \
            --v5-artifact-root v5env \
            --out out/actions.npz \
            --meta out/meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: v5-r-action-${{ matrix.env }}
          path: out
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate R-LCB vs v5
    runs-on: ubuntu-latest
    needs: reconstruct-v5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'
      - name: Download reconstructed v5 actions
        uses: actions/download-artifact@v4
        with:
          pattern: v5-r-action-*
          path: actions
      - name: Download frozen 45k contexts
        uses: actions/download-artifact@v4
        with:
          pattern: contextual-value-v1-r-independent-confirmation-freeze-*
          path: freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36475098718
      - name: Download historical frozen R confirmation result
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-r-independent-confirmation-45k-final
          path: historical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36475283530
      - name: Restore exact historical OPE implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hist
          git cat-file -e a7c0afd3cd5f2f872d312fe26f510894c305ef3b^{commit} || git fetch --no-tags origin a7c0afd3cd5f2f872d312fe26f510894c305ef3b
          git show a7c0afd3cd5f2f872d312fe26f510894c305ef3b:research/contextual_value_draft_weighted_ope.py > hist/contextual_value_draft_weighted_ope.py
      - name: Run exact retrospective comparison
        run: |
          python scripts/v5_r_lcb_aggregate_529.py \
            --hist-root hist \
            --freeze-root freeze \
            --action-root actions \
            --historical-r-report historical/report.json \
            --out result
      - uses: actions/upload-artifact@v4
        with:
          name: v5-vs-r-lcb-retrospective-529
          path: result
          if-no-files-found: error
          retention-days: 90
