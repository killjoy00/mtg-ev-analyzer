name: Clear-Easy forward check
# The locked, unattended forward check for the clear-Easy Daily rule
# (docs/DIFFICULTY-REVIEW-2026-11.md). Read-only: two SELECT statements, only
# per-puzzle counts leave the database, and nothing is written or deployed.
# The run fails only when the check says the rule should be turned off while
# it is still choosing Dailies; turning it off stays a deliberate release step.
on:
  schedule:
    - cron: '43 10 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packone-easy-forward-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed code
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g neon@4.17.4
      - name: Read aggregate Easy outcomes and apply the locked thresholds
        run: |
          set -euo pipefail
          umask 077
          connection=$(neon connection-string br-orange-feather-ayps8kep --project-id patient-shadow-91417882 --database-name pack1 --role-name pack1_owner)
          echo "::add-mask::$connection"
          printf '%s' "$connection" > "$RUNNER_TEMP/easy-forward-check.connection"
          node scripts/easy-forward-check.mjs "$RUNNER_TEMP/easy-forward-check.connection" --summary "$GITHUB_STEP_SUMMARY"
