name: R2 trigger cleanup

on:
  push:
    branches: [r2-corpus-migration]
    paths: ['.github/workflows/r2-trigger-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove migration-only push triggers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          edits = {
            '.github/workflows/import-all-trophies.yml': [
              "      - scripts/r2_replay_shards.sh\n",
              "      - .github/workflows/import-all-trophies.yml\n",
            ],
            '.github/workflows/build-more-sets.yml': [
              "      - '.github/workflows/build-more-sets.yml'\n",
              "      - 'scripts/r2_replay_shards.sh'\n",
            ],
            '.github/workflows/build-powered-cube.yml': [
              "      - 'scripts/r2_replay_shards.sh'\n",
            ],
            '.github/workflows/backfill-legacy-sets.yml': [
              "      - 'scripts/r2_replay_shards.sh'\n",
              "      - '.github/workflows/backfill-legacy-sets.yml'\n",
            ],
          }
          for filename, needles in edits.items():
              path = Path(filename)
              text = path.read_text()
              for needle in needles:
                  if text.count(needle) != 1:
                      raise SystemExit(f'{filename}: expected exactly one {needle.strip()!r}')
                  text = text.replace(needle, '', 1)
              path.write_text(text)
          PY
          rm .github/workflows/r2-trigger-cleanup.yml
          git diff --check
      - name: Commit trigger cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Avoid unrelated data rebuilds on R2 rollout'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
