name: 179C1 bootstrap deletion admin

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  bootstrap:
    if: >-
      github.repository == 'killjoy00/mtg-ev-analyzer' &&
      github.event.pull_request.number == 249 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/179c1-secure-account-deletion-main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ADMIN_EMAIL: ${{ secrets.PACK1_DELETION_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.PACK1_DELETION_ADMIN_PASSWORD }}
    steps:
      - name: Bootstrap non-human Better Auth principal
        shell: bash
        run: |
          node <<'NODE'
          const AUTH_BASE='https://ep-hidden-bonus-ayfmcpys.neonauth.c-5.us-east-2.aws.neon.tech/pack1/auth';
          const ORIGIN='https://packone.pro';
          const email=String(process.env.ADMIN_EMAIL||'').trim();
          const password=String(process.env.ADMIN_PASSWORD||'');
          if(email.toLowerCase()!=='deletion-admin@packone.pro')throw new Error('Deletion admin email secret is not the reviewed service-principal address.');
          if(password.length<16)throw new Error('Deletion admin password secret is missing or too short.');

          function sessionCookie(response){
            const raw=String(response.headers.get('set-cookie')||'');
            return raw.split(/,(?=\s*[^;,]+=)/)[0]?.split(';')[0]?.trim()||'';
          }
          async function call(path,body,cookie=''){
            const response=await fetch(AUTH_BASE+path,{
              method:'POST',
              headers:{origin:ORIGIN,accept:'application/json','content-type':'application/json',...(cookie?{cookie}:{})},
              body:JSON.stringify(body||{}),
              redirect:'manual',
              signal:AbortSignal.timeout(15000),
            });
            const data=await response.json().catch(()=>({}));
            return {response,data,cookie:sessionCookie(response)||cookie};
          }
          async function close(cookie){
            if(!cookie)return;
            try{await call('/sign-out',{},cookie);}catch{}
          }

          let signed=await call('/sign-in/email',{email,password,rememberMe:false});
          let created=false;
          if(!signed.response.ok){
            const signup=await call('/sign-up/email',{name:'Pack One deletion service',email,password});
            if(!signup.response.ok)throw new Error(`Service-principal bootstrap failed (${signup.response.status}).`);
            created=true;
            await close(signup.cookie);
            signed=await call('/sign-in/email',{email,password,rememberMe:false});
          }
          const id=String(signed.data?.user?.id||'');
          if(!signed.response.ok||!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)){
            throw new Error('Service-principal sign-in verification failed.');
          }
          if(String(signed.data?.user?.email||'').toLowerCase()!==email.toLowerCase())throw new Error('Service-principal identity mismatch.');
          await close(signed.cookie);
          console.log(`Deletion service principal credential bootstrap: ${created?'created and ':''}sign-in verified.`);
          NODE
