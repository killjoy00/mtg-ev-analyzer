name: card image release
run-name: card image release / ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full reviewed main commit SHA to deploy and refresh'
        type: string
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: packone-card-image-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require the reviewed main revision
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - name: Deploy development, promote production, then refresh card images
        run: node scripts/card-image-release.mjs "${{ inputs.commit }}"
