name: Bootstrap mobile AdMob lockfile (temporary feature branch)

on:
  push:
    branches: ['feat/ios-parity-admob-banner-20261116']
    paths:
      - mobile/package.json
      - .github/workflows/mobile-admob-lock-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/feat/ios-parity-admob-banner-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: mobile/.node-version
      - name: Update lockfile without running install scripts
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency lockfile on the feature branch
        run: |
          if ! git diff --quiet -- mobile/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/package-lock.json
            git commit -m "chore(mobile): lock Google Mobile Ads dependency tree"
            git push origin HEAD:feat/ios-parity-admob-banner-20261116
          fi
