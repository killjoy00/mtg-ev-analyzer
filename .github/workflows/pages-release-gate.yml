name: Pages release parity
on:
  pull_request:
    paths:
      - '_config.yml'
      - 'scripts/build-pages-preview.mjs'
      - 'scripts/check-pages-jekyll-parity.mjs'
      - '.github/workflows/pages-release-gate.yml'
      - '.well-known/**'
      - 'assets/**'
      - 'data/**'
      - 'corpus/**'
      - '*.html'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.json'
      - 'about/**'
      - 'contact/**'
      - 'privacy/**'
      - 'terms/**'
      - 'practice/**'
      - 'admin/**'
      - 'learn/**'
      - 'sets/**'
      - 'creator/**'
      - 'go/**'
      - 'share/**'
      - 'open/**'
      - 'd/**'
      - 'reset-password/**'
      - 'mobile-membership-complete/**'
  push:
    branches: [main]
    paths:
      - '_config.yml'
      - 'scripts/build-pages-preview.mjs'
      - 'scripts/check-pages-jekyll-parity.mjs'
      - '.github/workflows/pages-release-gate.yml'
      - '.well-known/**'
      - 'assets/**'
      - 'data/**'
      - 'corpus/**'
      - '*.html'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.json'
      - 'about/**'
      - 'contact/**'
      - 'privacy/**'
      - 'terms/**'
      - 'practice/**'
      - 'admin/**'
      - 'learn/**'
      - 'sets/**'
      - 'creator/**'
      - 'go/**'
      - 'share/**'
      - 'open/**'
      - 'd/**'
      - 'reset-password/**'
      - 'mobile-membership-complete/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jekyll-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build actual GitHub Pages Jekyll artifact without deploying
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify Jekyll bytes, routes and excluded source
        run: |
          set -euo pipefail
          node scripts/check-pages-jekyll-parity.mjs _site
      - name: Verify current public site compatibility (read-only baseline)
        run: node scripts/verify-pages-production.mjs --baseline
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-release-parity
          path: artifacts/pages-release-parity.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Install isolated browser fixtures
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run user-facing acceptance against actual Jekyll output
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m http.server 4174 --directory _site >/tmp/pack1-jekyll-preflight.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/ -o /dev/null
          node tests/pages-preview-browser-smoke.mjs
          export PACK1_E2E_URL=http://127.0.0.1:4174
          for spec in \
            tests/e2e.mjs \
            tests/sets-e2e.mjs \
            tests/practice-hub-e2e.mjs \
            tests/account-e2e.mjs \
            tests/ads-e2e.mjs \
            tests/profile-e2e.mjs; do
            echo "::group::Actual Jekyll output: ${spec}"
            node --import ./tests/e2e-production-guard.mjs "$spec"
            echo "::endgroup::"
          done
