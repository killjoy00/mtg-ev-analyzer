name: provision account-deletion service principal

on:
  pull_request:
    paths:
      - '.github/account-deletion-admin-provision-request.json'
      - '.github/workflows/account-deletion-admin-provision.yml'
      - 'scripts/provision-account-deletion-admin.mjs'

permissions:
  contents: read

concurrency:
  group: pack1-account-deletion-admin-provision
  cancel-in-progress: false

jobs:
  provision:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: patient-shadow-91417882
      PROD_BRANCH: br-orange-feather-ayps8kep
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PACK1_DELETION_ADMIN_EMAIL: ${{ secrets.PACK1_DELETION_ADMIN_EMAIL }}
      PACK1_DELETION_ADMIN_PASSWORD: ${{ secrets.PACK1_DELETION_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate reviewed provisioning request and secrets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const request=JSON.parse(fs.readFileSync('.github/account-deletion-admin-provision-request.json','utf8'));
          if(request.operation!=='provision-account-deletion-admin')throw Error('Unexpected provisioning operation.');
          if(request.target!=='production')throw Error('Provisioning target must be production.');
          if(request.email!=='account-deletion@packone.pro')throw Error('Provisioning email does not match reviewed service identity.');
          NODE
          [[ "$PACK1_DELETION_ADMIN_EMAIL" == 'account-deletion@packone.pro' ]] || {
            echo '::error::PACK1_DELETION_ADMIN_EMAIL must be the reviewed non-human service identity.'
            exit 1
          }
          test ${#PACK1_DELETION_ADMIN_PASSWORD} -ge 24 || {
            echo '::error::PACK1_DELETION_ADMIN_PASSWORD is missing or too short.'
            exit 1
          }

      - name: Install pinned Neon CLI and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/neon-tools" --no-audit --no-fund neon@4.17.4
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Create or authenticate non-human service principal
        shell: bash
        env:
          PACK1_DELETION_ADMIN_ID_FILE: ${{ runner.temp }}/pack1-deletion-admin-id
        run: |
          set -euo pipefail
          node scripts/provision-account-deletion-admin.mjs

      - name: Promote through supported Neon Auth management and verify isolation
        shell: bash
        run: |
          set -euo pipefail
          neon="$RUNNER_TEMP/neon-tools/node_modules/.bin/neon"
          service_id="$(cat "$RUNNER_TEMP/pack1-deletion-admin-id")"
          [[ "$service_id" =~ ^[0-9a-fA-F-]{36}$ ]] || exit 1

          "$neon" neon-auth user set-role "$service_id" --roles admin             --branch "$PROD_BRANCH" --project-id "$PROJECT_ID" >/dev/null

          connection="$("$neon" connection-string "$PROD_BRANCH"             --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)"
          echo "::add-mask::$connection"

          role="$(psql "$connection" -v ON_ERROR_STOP=1 -Atc             "SELECT role FROM neon_auth.\"user\" WHERE id='$service_id'::uuid")"
          [[ "$role" == 'admin' ]] || {
            echo '::error::Service principal was not promoted to the admin role.'
            exit 1
          }

          links="$(psql "$connection" -v ON_ERROR_STOP=1 -Atc             "SELECT count(*) FROM account_links WHERE auth_user_id='$service_id'::uuid")"
          [[ "$links" == '0' ]] || {
            echo '::error::Service principal unexpectedly has a Pack One account link.'
            exit 1
          }

          echo 'Deletion service principal is provisioned as a distinct, unlinked Auth admin.'
