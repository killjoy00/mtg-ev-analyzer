name: Pack One Lab archive validation

on:
  pull_request:
    paths:
      - '.github/workflows/pack-one-lab-archive-validation.yml'
      - 'scripts/prepare_pack_one_lab.py'
      - 'scripts/pack_one_lab_picks.py'
      - 'scripts/format_research.py'
      - 'scripts/rules_mana_context.py'
      - 'research/pack-one-lab/archive-packets.mjs'
      - 'research/pack-one-lab/editorial.mjs'
      - 'research/data/fra-rules-context-2026-10-29.json.gz'

permissions:
  contents: read

concurrency:
  group: pack-one-lab-archive-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-archive-contract:
    # No secrets, protected environment, database, AI, email, artifacts or publication.
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact public archives and editorial input contract
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          chmod 700 "$temp_dir"
          python3 scripts/prepare_pack_one_lab.py --verify-only --out "$temp_dir/evidence.json"
          node --input-type=module - "$temp_dir/evidence.json" <<'JS'
          import {readFileSync} from 'node:fs';
          import {archivePackets} from './research/pack-one-lab/archive-packets.mjs';
          const report=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const packets=archivePackets(report);
          if(report.cohort.complete_trajectories<100)throw Error('Too few complete pinned draft trajectories.');
          if(report.cohort.first_game_decks<100)throw Error('Too few matched first-game observations.');
          console.log('Lab: pinned source and aggregate contract verified; '+packets.length+' qualified additional research topics. No article or raw data exported.');
          JS
