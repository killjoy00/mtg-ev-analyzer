name: test Cube image normalization

on:
  push:
    branches: [fix-cube-standard-images]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hydrate Powered Cube shards from R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/powered-cube/shards
          aws s3 sync "s3://${R2_BUCKET}/data/powered-cube/shards" data/powered-cube/shards \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude '*' \
            --include '*.json'
      - name: Normalize Cube images without publishing
        shell: bash
        run: |
          set +e
          mkdir -p generated
          python scripts/refresh_powered_cube_images.py > generated/powered-cube-image-normalization.log 2>&1
          status=$?
          cat generated/powered-cube-image-normalization.log
          exit "$status"
      - name: Run tests
        run: npm test
      - name: Audit datasets
        run: python scripts/audit_datasets.py --fail-on-error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-image-normalization-diagnostics
          retention-days: 1
          if-no-files-found: warn
          path: |
            generated/powered-cube-standard-images.json
            generated/powered-cube-image-refresh-report.json
            generated/powered-cube-image-normalization.log
