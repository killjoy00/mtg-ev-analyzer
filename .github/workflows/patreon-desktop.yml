name: Patreon Windows helper
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patreon-desktop/**'
      - 'scripts/patreon-desktop-feed.mjs'
      - '.github/workflows/patreon-desktop.yml'
      - 'tests/test_patreon_desktop.py'
      - 'tests/patreon-desktop-feed.test.mjs'
  pull_request:
    paths:
      - 'scripts/patreon-desktop/**'
      - 'scripts/patreon-desktop-feed.mjs'
      - '.github/workflows/patreon-desktop.yml'
      - 'tests/test_patreon_desktop.py'
      - 'tests/patreon-desktop-feed.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test desktop protocol and duplicate protection
        run: python -m unittest discover -s tests -p test_patreon_desktop.py -v
      - name: Install pinned packager and Windows timezone database
        run: python -m pip install pyinstaller==6.22.3 tzdata==2026.5
      - name: Build standalone Windows helper
        run: python -m PyInstaller --onefile --noconsole --name PackOnePatreon --collect-all tzdata scripts/patreon-desktop/packone_patreon.py
      - name: Exercise packaged runtime
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/PackOnePatreon.exe -ArgumentList '--self-test' -Wait -PassThru
          if (!(Test-Path dist/runtime-self-test.ok)) { throw 'Runtime self-test produced no evidence' }
          Remove-Item dist/runtime-self-test.ok
          if ($process.ExitCode -ne 0) { throw 'Packaged runtime failed' }
          Get-FileHash dist/PackOnePatreon.exe -Algorithm SHA256 | Select-Object Hash | Out-File -Encoding ascii dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packone-patreon-windows
          path: dist/
          retention-days: 14
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packone-patreon-windows
          path: dist
      - name: Publish reviewed helper download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "patreon-desktop-${{ github.sha }}" dist/PackOnePatreon.exe dist/SHA256.txt --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Pack One Patreon for Windows' --notes 'Runs locally with PostyBirb+. First public post must be verified before automatic posting is enabled. Keep this helper and PostyBirb running.'
