name: production smoke

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

jobs:
  production-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The corpus aggregate below may retry a cold compute three times at ninety
    # seconds, which does not fit in the five minutes this job used to take.
    timeout-minutes: 12
    env:
      PACKONE_ORIGIN: https://packone.pro
      REPLAY_ORIGIN: https://data.packone.pro
    steps:
      - name: Verify Pack One frontend, replay storage, and backend browser contract
        shell: bash
        run: |
          set -euo pipefail

          declare -A services=(
            [pack1api]="https://br-orange-feather-ayps8kep-pack1api.compute.c-5.us-east-2.aws.neon.tech"
            [pack1growth]="https://br-orange-feather-ayps8kep-pack1growth.compute.c-5.us-east-2.aws.neon.tech"
            [draftrunapi]="https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech"
          )

          # draftrunapi's full /health aggregates every archived puzzle row, so
          # it answers in seconds warm and can pass twenty on a cold compute.
          # Asking it here only proved how long a scan takes: the check failed
          # on a healthy production release and passed on the next three pushes
          # unchanged. The marker below carries the same liveness, CORS and
          # release-commit contract in under a second; the corpus aggregate is
          # then checked on its own, with a timeout that matches the query.
          declare -A health_paths=(
            [pack1api]="/health"
            [pack1growth]="/health"
            [draftrunapi]="/health?quick=1"
          )

          header_value() {
            grep -i '^access-control-allow-origin:' "$1" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//; s/\r$//' || true
          }

          frontend="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 "$PACKONE_ORIGIN/" -o "$frontend"
          grep -q 'Pack One' "$frontend" || { echo 'packone.pro did not return the Pack One app'; exit 1; }

          manifest="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 "$PACKONE_ORIGIN/data/msh/manifest.json" -o "$manifest"
          shard_path="$(python - "$manifest" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          shards=payload.get('shards') or []
          assert shards and shards[0].get('path'), 'MSH manifest has no replay shard'
          path=str(shards[0]['path'])
          if path.startswith('./'):
              path='/' + path[2:]
          elif not path.startswith('/'):
              path='/data/msh/' + path
          print(path)
          PY
          )"
          shard_headers="$(mktemp)"
          shard_body="$(mktemp)"
          shard_status="$(curl --silent --show-error --max-time 20 -o "$shard_body" -D "$shard_headers" -w '%{http_code}' \
            "$REPLAY_ORIGIN$shard_path" -H "Origin: $PACKONE_ORIGIN")"
          test "$shard_status" = '200' || { echo "R2 replay shard returned HTTP $shard_status"; exit 1; }
          shard_origin="$(header_value "$shard_headers")"
          test "$shard_origin" = "$PACKONE_ORIGIN" || { echo "R2 replay shard CORS mismatch: ${shard_origin:-missing}"; exit 1; }
          python - "$shard_body" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          assert isinstance(payload.get('replays'), list) and payload['replays'], 'R2 shard has no replays'
          PY
          echo 'R2 replay shard: GET + CORS + JSON contract OK'

          for name in pack1api pack1growth draftrunapi; do
            base="${services[$name]}"
            preflight_headers="$(mktemp)"
            preflight_status="$(curl --silent --show-error --max-time 20 -o /dev/null -D "$preflight_headers" -w '%{http_code}' \
              -X OPTIONS "$base/health" \
              -H "Origin: $PACKONE_ORIGIN" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,content-type')"

            if [ "$preflight_status" != "204" ]; then
              echo "$name preflight returned HTTP $preflight_status, expected 204"
              cat "$preflight_headers"
              exit 1
            fi

            preflight_origin="$(header_value "$preflight_headers")"
            if [ "$preflight_origin" != "$PACKONE_ORIGIN" ]; then
              echo "$name preflight did not allow $PACKONE_ORIGIN (got: ${preflight_origin:-missing})"
              cat "$preflight_headers"
              exit 1
            fi

            get_headers="$(mktemp)"
            get_body="$(mktemp)"
            get_status="$(curl --silent --show-error --max-time 20 -o "$get_body" -D "$get_headers" -w '%{http_code}' \
              "$base${health_paths[$name]}" -H "Origin: $PACKONE_ORIGIN")"

            if [ "$get_status" != "200" ]; then
              echo "$name health returned HTTP $get_status, expected 200"
              cat "$get_body"
              exit 1
            fi

            get_origin="$(header_value "$get_headers")"
            if [ "$get_origin" != "$PACKONE_ORIGIN" ]; then
              echo "$name health response did not allow $PACKONE_ORIGIN (got: ${get_origin:-missing})"
              cat "$get_headers"
              exit 1
            fi

            grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$get_body" || {
              echo "$name health response was not healthy"
              cat "$get_body"
              exit 1
            }

            echo "$name: preflight + GET contract OK"
          done

      - name: Verify the served Draft Run corpus is complete
        shell: bash
        run: |
          set -euo pipefail

          # The contract step above deliberately asks draftrunapi for the quick
          # marker, which says nothing about the corpus. This is where the
          # aggregate is actually read: it returns 503 on an unrated puzzle, a
          # catalog set missing from the pool, fewer than four regular sets, or
          # a corpus version the served catalog does not carry. The previous
          # step has already woken the compute, so this runs warm.
          base='https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech'
          body="$(mktemp)"
          status='000'
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --max-time 90 -o "$body" -w '%{http_code}' \
              "$base/health" -H "Origin: $PACKONE_ORIGIN" || echo '000')"
            [ "$status" = '200' ] && break
            echo "draft-run corpus health attempt ${attempt}/3 returned HTTP ${status}"
            sleep $((attempt * 5))
          done

          if [ "$status" != '200' ]; then
            echo "draft-run corpus health returned HTTP $status, expected 200"
            cat "$body"
            exit 1
          fi

          python - "$body" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          if not payload.get('ok'):
              raise SystemExit(f'draft-run corpus health is not ok: {json.dumps(payload)[:800]}')
          for field in ('unrated_puzzles', 'missing_sets'):
              if payload.get(field):
                  raise SystemExit(f'draft-run corpus reports {field}={payload[field]!r}')
          if not payload.get('puzzles'):
              raise SystemExit('draft-run corpus reports no serving puzzles')
          print(
              'draft-run corpus OK: '
              f"corpus={payload.get('corpus_version')} scoring={payload.get('scoring_version')} "
              f"puzzles={payload.get('puzzles')} sets={payload.get('sets')} "
              f"regular={payload.get('regular_sets')}"
          )
          PY
