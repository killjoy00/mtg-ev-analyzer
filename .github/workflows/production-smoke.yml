name: production smoke

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

jobs:
  production-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PACKONE_ORIGIN: https://packone.pro
      REPLAY_ORIGIN: https://data.packone.pro
    steps:
      - name: Verify Pack One frontend, replay storage, and backend browser contract
        shell: bash
        run: |
          set -euo pipefail

          declare -A services=(
            [pack1api]="https://br-orange-feather-ayps8kep-pack1api.compute.c-5.us-east-2.aws.neon.tech"
            [pack1growth]="https://br-orange-feather-ayps8kep-pack1growth.compute.c-5.us-east-2.aws.neon.tech"
            [draftrunapi]="https://br-orange-feather-ayps8kep-draftrunapi.compute.c-5.us-east-2.aws.neon.tech"
          )

          header_value() {
            grep -i '^access-control-allow-origin:' "$1" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//; s/\r$//' || true
          }

          frontend="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 "$PACKONE_ORIGIN/" -o "$frontend"
          grep -q 'Pack One' "$frontend" || { echo 'packone.pro did not return the Pack One app'; exit 1; }

          manifest="$(mktemp)"
          curl --fail --silent --show-error --location --max-time 20 "$PACKONE_ORIGIN/data/msh/manifest.json" -o "$manifest"
          shard_path="$(python - "$manifest" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          shards=payload.get('shards') or []
          assert shards and shards[0].get('path'), 'MSH manifest has no replay shard'
          path=str(shards[0]['path'])
          if path.startswith('./'):
              path='/' + path[2:]
          elif not path.startswith('/'):
              path='/data/msh/' + path
          print(path)
          PY
          )"
          shard_headers="$(mktemp)"
          shard_body="$(mktemp)"
          shard_status="$(curl --silent --show-error --max-time 20 -o "$shard_body" -D "$shard_headers" -w '%{http_code}' \
            "$REPLAY_ORIGIN$shard_path" -H "Origin: $PACKONE_ORIGIN")"
          test "$shard_status" = '200' || { echo "R2 replay shard returned HTTP $shard_status"; exit 1; }
          shard_origin="$(header_value "$shard_headers")"
          test "$shard_origin" = "$PACKONE_ORIGIN" || { echo "R2 replay shard CORS mismatch: ${shard_origin:-missing}"; exit 1; }
          python - "$shard_body" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          assert isinstance(payload.get('replays'), list) and payload['replays'], 'R2 shard has no replays'
          PY
          echo 'R2 replay shard: GET + CORS + JSON contract OK'

          for name in pack1api pack1growth draftrunapi; do
            base="${services[$name]}"
            preflight_headers="$(mktemp)"
            preflight_status="$(curl --silent --show-error --max-time 20 -o /dev/null -D "$preflight_headers" -w '%{http_code}' \
              -X OPTIONS "$base/health" \
              -H "Origin: $PACKONE_ORIGIN" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,content-type')"

            if [ "$preflight_status" != "204" ]; then
              echo "$name preflight returned HTTP $preflight_status, expected 204"
              cat "$preflight_headers"
              exit 1
            fi

            preflight_origin="$(header_value "$preflight_headers")"
            if [ "$preflight_origin" != "$PACKONE_ORIGIN" ]; then
              echo "$name preflight did not allow $PACKONE_ORIGIN (got: ${preflight_origin:-missing})"
              cat "$preflight_headers"
              exit 1
            fi

            get_headers="$(mktemp)"
            get_body="$(mktemp)"
            get_status="$(curl --silent --show-error --max-time 20 -o "$get_body" -D "$get_headers" -w '%{http_code}' \
              "$base/health" -H "Origin: $PACKONE_ORIGIN")"

            if [ "$get_status" != "200" ]; then
              echo "$name health returned HTTP $get_status, expected 200"
              cat "$get_body"
              exit 1
            fi

            get_origin="$(header_value "$get_headers")"
            if [ "$get_origin" != "$PACKONE_ORIGIN" ]; then
              echo "$name health response did not allow $PACKONE_ORIGIN (got: ${get_origin:-missing})"
              cat "$get_headers"
              exit 1
            fi

            grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$get_body" || {
              echo "$name health response was not healthy"
              cat "$get_body"
              exit 1
            }

            echo "$name: preflight + GET contract OK"
          done
