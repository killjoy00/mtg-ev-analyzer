name: Pool-aware refit - one-shot DFT development pilot

# Research branch only. This is not a required check or production workflow.
on:
  push:
    branches: [research/pool-aware-credit-refit]
    paths: ['.github/workflows/pool-aware-refit-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pool-aware-refit-dft-pilot
  cancel-in-progress: false

jobs:
  development:
    if: github.repository == 'killjoy00/mtg-ev-analyzer' && github.ref == 'refs/heads/research/pool-aware-credit-refit'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: scripts:.
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Check isolated research contracts
        run: |
          set -euo pipefail
          python scripts/pool_aware_refit.py
          python scripts/pool_aware_features.py
          python scripts/test_pool_aware_archive.py
          python scripts/pool_aware_restore.py --self-test
          python scripts/pool_aware_pilot.py --self-test
          python scripts/pool_aware_fast_fit.py
      - name: Restore exact retained DFT sources and inspect timestamp extents
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/pool-refit
          python -u scripts/pool_aware_restore.py --set dft --metadata research/data/dft-rules-context-2026-10-29.json.gz --inspect-times > artifacts/pool-refit/archive-extent.json
      - name: Freeze development windows and recover local manifest
        run: |
          set -euo pipefail
          python scripts/pool_aware_pilot.py --extent artifacts/pool-refit/archive-extent.json --output artifacts/pool-refit/windows.json
          python scripts/pool_aware_restore.py --set dft --metadata research/data/dft-rules-context-2026-10-29.json.gz --windows artifacts/pool-refit/windows.json
      - name: Fit residual model and evaluate historical development partitions
        run: |
          set -euo pipefail
          python -u scripts/pool_aware_archive.py --manifest raw-data/pool-refit/dft/manifest.json --output artifacts/pool-refit/development.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/pool-refit/development.json').read_text())
          assert r['status']=='development_only' and r['final_assessment']=='locked'
          assert r['independent_quality']=='not_evaluated' and not r['synergy_active']
          print(json.dumps({'set':r['set'],'baseline_drafts':r['baseline_drafts'],
              'validation':{k:v['validation'] for k,v in r['arms'].items()},
              'final_assessment':r['final_assessment']},indent=2))
          PY
      - name: Preserve aggregate evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pool-aware-dft-development
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/pool-refit/archive-extent.json
            artifacts/pool-refit/windows.json
            artifacts/pool-refit/development.json
