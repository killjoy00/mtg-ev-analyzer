name: Pack One App Store Connect audit

on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-asc-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Pack One in App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, json
          import jwt, requests

          kid=os.environ["ASC_KEY_ID"].strip()
          iss=os.environ["ASC_ISSUER_ID"].strip()
          key=os.environ["ASC_KEY_P8"].replace("\\n","\n").strip()
          now=int(time.time())
          token=jwt.encode({"iss":iss,"iat":now-5,"exp":now+900,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          h={"Authorization":f"Bearer {token}"}
          base="https://api.appstoreconnect.apple.com/v1"
          app_id="6814318676"

          def req(path, params=None):
              r=requests.get(base+path,headers=h,params=params,timeout=30)
              print(f"GET {path} -> {r.status_code}")
              if r.status_code>=400:
                  try:
                      for e in r.json().get("errors",[])[:3]:
                          print("ASC_ERROR",e.get("status"),e.get("code"),e.get("title"),e.get("detail"))
                  except Exception: pass
                  return None
              return r.json()

          app=req(f"/apps/{app_id}")
          print("PACKONE_ASC_BEGIN")
          if app:
              a=app["data"]["attributes"]
              print("app_id="+app["data"]["id"])
              print("name="+str(a.get("name","")))
              print("bundle_id="+str(a.get("bundleId","")))
              print("sku="+str(a.get("sku","")))
              print("primary_locale="+str(a.get("primaryLocale","")))

          builds=req("/builds",{"filter[app]":app_id,"limit":"50","sort":"-uploadedDate"})
          if builds is not None:
              print("build_count_returned="+str(len(builds.get("data",[]))))
              for i,b in enumerate(builds.get("data",[])[:20],1):
                  x=b.get("attributes",{})
                  print("BUILD",i,json.dumps({
                    "id":b.get("id"),"version":x.get("version"),"uploadedDate":x.get("uploadedDate"),
                    "expirationDate":x.get("expirationDate"),"expired":x.get("expired"),
                    "processingState":x.get("processingState"),"minOsVersion":x.get("minOsVersion")
                  },separators=(",",":")))

          versions=req(f"/apps/{app_id}/appStoreVersions",{"limit":"50"})
          if versions is not None:
              print("app_store_version_count="+str(len(versions.get("data",[]))))
              for i,v in enumerate(versions.get("data",[])[:20],1):
                  x=v.get("attributes",{})
                  print("VERSION",i,json.dumps({
                    "id":v.get("id"),"versionString":x.get("versionString"),
                    "appStoreState":x.get("appStoreState"),"platform":x.get("platform"),
                    "createdDate":x.get("createdDate")
                  },separators=(",",":")))

          bundles=req("/bundleIds",{"filter[identifier]":"pro.packone.app","limit":"10"})
          if bundles is not None:
              print("bundle_record_count="+str(len(bundles.get("data",[]))))
              for b in bundles.get("data",[]):
                  x=b.get("attributes",{})
                  print("BUNDLE",json.dumps({
                    "id":b.get("id"),"identifier":x.get("identifier"),"name":x.get("name"),"platform":x.get("platform")
                  },separators=(",",":")))
                  bid=b.get("id")
                  caps=req(f"/bundleIds/{bid}/bundleIdCapabilities",{"limit":"100"}) if bid else None
                  if caps is not None:
                      print("capability_count="+str(len(caps.get("data",[]))))
                      for c in caps.get("data",[]):
                          x=c.get("attributes",{})
                          print("CAPABILITY",json.dumps({"capabilityType":x.get("capabilityType"),"settings":x.get("settings")},separators=(",",":")))

          print("apple_team_id_present="+("yes" if os.environ.get("APPLE_TEAM_ID","").strip() else "no"))
          print("PACKONE_ASC_END")
          PY
