name: Pack One App Store Connect audit

on:
  push:
    branches: ["chatgpt/packone-play-credential-check"]
    paths: [".github/workflows/packone-asc-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -n "${!name:-}" ]; then
              echo "${name}_present=yes"
            else
              echo "${name}_present=no"
            fi
          done
          if [ -n "${APPLE_TEAM_ID:-}" ]; then echo "APPLE_TEAM_ID_present=yes"; else echo "APPLE_TEAM_ID_present=no"; fi

      - name: Query Pack One in App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, json
          import jwt, requests

          key_id = os.environ["ASC_KEY_ID"].strip()
          issuer_id = os.environ["ASC_ISSUER_ID"].strip()
          private_key = os.environ["ASC_KEY_P8"].replace("\\n", "\n").strip()
          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer_id, "iat": now - 5, "exp": now + 900, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}
          base = "https://api.appstoreconnect.apple.com/v1"
          app_id = "6814318676"

          def get(path, params=None):
              r = requests.get(base + path, headers=headers, params=params, timeout=30)
              print(f"GET {path} -> {r.status_code}")
              if r.status_code >= 400:
                  try:
                      body = r.json()
                      errs = body.get("errors", [])
                      for e in errs[:3]:
                          print("ASC_ERROR", e.get("status"), e.get("code"), e.get("title"), e.get("detail"))
                  except Exception:
                      print("ASC_ERROR_BODY_UNREADABLE")
                  r.raise_for_status()
              return r.json()

          app = get(f"/apps/{app_id}")
          a = app["data"]["attributes"]
          print("PACKONE_ASC_BEGIN")
          print("app_id=" + app["data"]["id"])
          print("name=" + str(a.get("name", "")))
          print("bundle_id=" + str(a.get("bundleId", "")))
          print("sku=" + str(a.get("sku", "")))
          print("primary_locale=" + str(a.get("primaryLocale", "")))

          builds = get("/builds", {
              "filter[app]": app_id,
              "limit": "50",
              "sort": "-uploadedDate",
              "fields[builds]": "version,uploadedDate,expirationDate,expired,processingState,buildAudienceType,minOsVersion",
          })
          print("build_count_returned=" + str(len(builds.get("data", []))))
          for i, b in enumerate(builds.get("data", [])[:20], start=1):
              x = b.get("attributes", {})
              print("BUILD", i, json.dumps({
                  "id": b.get("id"),
                  "version": x.get("version"),
                  "uploadedDate": x.get("uploadedDate"),
                  "expirationDate": x.get("expirationDate"),
                  "expired": x.get("expired"),
                  "processingState": x.get("processingState"),
                  "buildAudienceType": x.get("buildAudienceType"),
                  "minOsVersion": x.get("minOsVersion"),
              }, separators=(",", ":")))

          versions = get("/appStoreVersions", {
              "filter[app]": app_id,
              "limit": "50",
              "sort": "-createdDate",
              "fields[appStoreVersions]": "versionString,appStoreState,platform,createdDate",
          })
          print("app_store_version_count=" + str(len(versions.get("data", []))))
          for i, v in enumerate(versions.get("data", [])[:20], start=1):
              x = v.get("attributes", {})
              print("VERSION", i, json.dumps({
                  "id": v.get("id"),
                  "versionString": x.get("versionString"),
                  "appStoreState": x.get("appStoreState"),
                  "platform": x.get("platform"),
                  "createdDate": x.get("createdDate"),
              }, separators=(",", ":")))
          print("PACKONE_ASC_END")
          PY
