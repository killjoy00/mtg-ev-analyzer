name: Traditional v4 revalidation

on:
  pull_request:
    paths:
      - 'research/TRADITIONAL-V4-REVALIDATION-PROTOCOL.md'
      - 'scripts/traditional_v4_revalidation.py'
      - 'scripts/traditional_puzzles.py'
      - 'scripts/build_replays.py'
      - 'scripts/import_all_trophies.py'
      - 'scripts/format_research.py'
      - 'scripts/eval_model.py'
      - 'tests/test_traditional_v4_revalidation.py'
      - '.github/workflows/traditional-v4-revalidation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: traditional-v4-revalidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen protocol and provenance guards
        run: |
          python -m unittest discover -s tests -p test_traditional_puzzles.py
          python -m unittest discover -s tests -p test_traditional_v4_revalidation.py
      - name: Download pinned complete production v8 evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35646313155
          name: verified-premier-trophies-35646313155-1
          path: generated/production-v8
      - name: Extract immutable per-environment v8 provenance and parity references
        run: |
          python scripts/traditional_v4_revalidation.py \
            --prepare-pins generated/production-v8 \
            --pins-out generated/frozen-v8
      - uses: actions/upload-artifact@v4
        with:
          name: traditional-v4-production-pins
          retention-days: 90
          if-no-files-found: error
          path: generated/frozen-v8

  measure:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        set:
          - powered-cube
          - hob
          - msh
          - sos
          - eoe
          - fin
          - tdm
          - dft
          - fdn
          - dsk
          - blb
          - mh3
          - otj
          - mkm
          - ktk
          - lci
          - woe
          - ltr
          - mom
          - one
          - bro
          - dmu
          - snc
          - neo
          - hbg
          - sir
          - pio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: traditional-v4-production-pins
          path: generated/frozen-v8
      - name: Recheck v4-only research invariants
        run: python -m unittest discover -s tests -p test_traditional_v4_revalidation.py
      - name: Reconstruct exact production v4 grader and evaluate Traditional source
        run: python -u scripts/traditional_v4_revalidation.py --set "${{ matrix.set }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traditional-v4-revalidation-${{ matrix.set }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            generated/traditional-v4-revalidation/*/measurements.json.gz
            generated/traditional-v4-revalidation/*/summary.json
            generated/traditional-v4-revalidation/*/manifest.json
            generated/traditional-v4-revalidation/*/puzzles.jsonl.gz
            generated/traditional-v4-revalidation/*/trophies.jsonl.gz

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: traditional-v4-revalidation-*
          path: generated/traditional-v4-results
      - name: Download historical v3 all-environment report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35386149822
          name: traditional-phase2-report
          path: generated/previous-v3/report
      - name: Download historical v3 Powered Cube measurements
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35386149822
          name: traditional-phase2-powered-cube
          path: generated/previous-v3/cube
      - name: Consolidate old/new gates, residuals, Cube windows and format-training audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t measurements < <(find generated/traditional-v4-results -name measurements.json.gz | sort)
          previous=$(find generated/previous-v3/report -name report.json -print -quit)
          previous_cube=$(find generated/previous-v3/cube -name measurements.json.gz -print -quit)
          test -n "$previous"
          test -n "$previous_cube"
          python scripts/traditional_v4_revalidation.py \
            --summarize "${measurements[@]}" \
            --previous "$previous" \
            --previous-cube "$previous_cube" \
            --out generated/traditional-v4-revalidation/report.json \
            --markdown generated/traditional-v4-revalidation/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traditional-v4-revalidation-report
          retention-days: 90
          if-no-files-found: warn
          path: |
            generated/traditional-v4-revalidation/report.json
            generated/traditional-v4-revalidation/REPORT.md
