name: iOS TestFlight status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: read App Store Connect build status
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: pack-one-mobile-release
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
      PACKONE_ASC_APP_ID: '6814318676'
    steps:
      - uses: actions/checkout@v4
      - name: Require current approved main revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Store operations are allowed only from main." >&2; exit 1; }
          git fetch --no-tags --depth=1 origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          [[ "$head_sha" == "$main_sha" ]] || {
            echo "Checked-out revision $head_sha is no longer current main ($main_sha)." >&2
            exit 1
          }
          echo "Verified current main revision: $head_sha"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read latest Pack One TestFlight builds
        run: node .github/scripts/app-store-build-status.mjs
      - name: Verify next monotonic build allocation
        run: node .github/scripts/app-store-next-build-number.mjs
