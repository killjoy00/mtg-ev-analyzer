name: creator production canary

on:
  push:
    branches: [main]
    paths:
      - '.github/creator-production-canary-request.json'

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  pages: write

concurrency:
  group: pack1-creator-production-canary
  cancel-in-progress: false

jobs:
  canary:
    name: live Practice and Daily creator canary
    runs-on: ubuntu-latest
    environment: pack-one-mobile-release
    timeout-minutes: 120
    env:
      PROJECT_ID: patient-shadow-91417882
      PROD_BRANCH: br-orange-feather-ayps8kep
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: request
        name: Resolve reviewed creator canary request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          request=json.loads(Path('.github/creator-production-canary-request.json').read_text())
          if set(request) != {'operation','reason','expected_release'}:
              raise SystemExit('Invalid creator production-canary request keys.')
          if request.get('operation') != 'run-creator-production-canary':
              raise SystemExit('Invalid creator production-canary operation.')
          reason=request.get('reason')
          release=str(request.get('expected_release',''))
          if not isinstance(reason,str) or not reason.strip():
              raise SystemExit('Creator production canary requires a reason.')
          import re
          if not re.fullmatch(r'[a-f0-9]{40}',release):
              raise SystemExit('Creator production canary requires an exact release SHA.')
          print('expected_release='+release)
          PY

      - name: Require current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse FETCH_HEAD)" ]] || {
            echo "Creator canary request is no longer current main." >&2
            exit 1
          }

      - name: Install pinned Neon client
        run: node .github/scripts/install-wrangler-tool.mjs "$RUNNER_TEMP/creator-canary-tools" neon@4.17.4

      - name: Prepare production connection
        shell: bash
        run: |
          set -euo pipefail
          neon="$RUNNER_TEMP/creator-canary-tools/node_modules/.bin/neon"
          connection="$("$neon" connection-string "$PROD_BRANCH" --project-id "$PROJECT_ID" --database-name pack1 --role-name pack1_owner)"
          echo "::add-mask::$connection"
          printf '%s' "$connection" > "$RUNNER_TEMP/creator-canary.connection"
          chmod 600 "$RUNNER_TEMP/creator-canary.connection"

      - name: Run live creator production canary
        env:
          PACK1_CREATOR_CANARY: '1'
          PACK1_LAUNCH_WATCHER_GITHUB_TOKEN: ${{ secrets.PACK1_LAUNCH_WATCHER_GITHUB_TOKEN }}
        run: node scripts/creator-production-canary.mjs "$RUNNER_TEMP/creator-canary.connection" "${{ steps.request.outputs.expected_release }}"

      - name: Remove retired creator canary static artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base_sha="$(git rev-parse origin/main)"
          branch="automation/creator-canary-cleanup-${GITHUB_RUN_ID}"
          git checkout -B "$branch" origin/main
          mapfile -t canary_routes < <(
            {
              find creator -mindepth 1 -maxdepth 1 -type d -name 'canary-*' -printf '%f\n'
              jq -r '.[] | select(.slug | startswith("canary-")) | .slug' creator-challenges.json
            } | sort -u
          )
          node scripts/cleanup-creator-canary-static.mjs
          if git diff --quiet -- creator-challenges.json creator; then
            echo "No creator canary static artifacts remain." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/check-creator-challenges.mjs
          node --test tests/creator-challenges.test.mjs tests/creator-production-canary-safety.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A creator-challenges.json creator
          git commit -m "Clean retired creator canary static artifacts"
          head_sha="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/${branch}"
          pr_url="$(gh pr create --base main --head "$branch" --title "Clean retired creator canary static artifacts" --body "Automated cleanup after the production creator canary verified its privacy-safe retired routes. Removes only creator/canary-* static routes and matching registry entries.")"
          echo "Cleanup PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run test.yml --ref "$branch"
          gh workflow run e2e.yml --ref "$branch"
          test_run=""
          e2e_run=""
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&head_sha=${head_sha}&per_page=100")"
            test_run="$(jq -r --arg branch "$branch" '.workflow_runs[] | select(.path==".github/workflows/test.yml" and .head_branch==$branch) | .id' <<<"$runs" | head -1)"
            e2e_run="$(jq -r --arg branch "$branch" '.workflow_runs[] | select(.path==".github/workflows/e2e.yml" and .head_branch==$branch) | .id' <<<"$runs" | head -1)"
            if [[ -n "$test_run" && -n "$e2e_run" ]]; then break; fi
            sleep 2
          done
          [[ -n "$test_run" && -n "$e2e_run" ]] || {
            echo "::error::Cleanup exact-head test/e2e dispatches never registered; refusing to merge."
            exit 1
          }
          gh run watch "$test_run" --exit-status --interval 10
          gh run watch "$e2e_run" --exit-status --interval 10
          gh pr merge "$pr_url" --squash --delete-branch --match-head-commit "$head_sha"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/creator-canary-pages-build.json
          for attempt in $(seq 1 120); do
            pages_status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status')"
            if [[ "$pages_status" == built ]]; then break; fi
            if [[ "$pages_status" == errored ]]; then
              echo "::error::Pages build failed after creator canary cleanup."
              exit 1
            fi
            sleep 5
          done
          [[ "$pages_status" == built ]] || {
            echo "::error::Timed out waiting for Pages build after creator canary cleanup."
            exit 1
          }

          live_registry="$(curl --fail --silent --show-error -H 'cache-control: no-cache' "https://packone.pro/creator-challenges.json?cleanup=${head_sha}")"
          jq -e 'all(.[]; ((.slug | startswith("canary-")) | not))' <<<"$live_registry" >/dev/null || {
            echo "::error::Live creator registry still contains a canary entry after cleanup."
            exit 1
          }
          for slug in "${canary_routes[@]}"; do
            code="$(curl --silent --show-error -H 'cache-control: no-cache' -o /tmp/creator-canary-cleanup-route.html -w '%{http_code}' "https://packone.pro/creator/${slug}/?cleanup=${head_sha}")"
            [[ "$code" == 404 || "$code" == 410 ]] || {
              echo "::error::Live canary route still exists after cleanup: ${slug} (HTTP ${code})"
              exit 1
            }
          done
          echo "Creator canary static cleanup is deployed and verified live." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload creator canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-production-canary-${{ github.run_id }}
          path: artifacts/creator-production-canary
          if-no-files-found: error
          retention-days: 90
