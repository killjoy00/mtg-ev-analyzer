name: Issue 179A secret readiness

on:
  push:
    branches:
      - ops/179a-secret-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production recovery secret is available
        env:
          RATE_SECRET: ${{ secrets.PACK1_RATE_LIMIT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ${#RATE_SECRET} -ge 32 ]; then
            echo 'PACK1_RATE_LIMIT_SECRET_READY=true'
          else
            echo '::error::PACK1_RATE_LIMIT_SECRET is missing or shorter than 32 characters.'
            exit 1
          fi
