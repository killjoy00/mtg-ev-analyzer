name: contextual-value-v1-phase-a-compact-pilot

on:
  push:
    branches:
      - research/contextual-value-v1-rich-features-529
    paths:
      - '.github/workflows/contextual-value-v1-phase-a-compact-pilot.yml'
      - 'research/contextual_value_phase_a_compact.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PHASE_A1_RUN: '36286752890'
  PILOT_FOLD: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  compact-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile compactor
        run: python -m py_compile research/contextual_value_phase_a_compact.py
      - name: Download validated rich fold
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-phase-a-rich-fold-${{ env.PILOT_FOLD }}
          path: source
          run-id: ${{ env.PHASE_A1_RUN }}
          github-token: ${{ github.token }}
      - name: Download validated fold report
        uses: actions/download-artifact@v4
        with:
          name: contextual-value-v1-phase-a-rich-report-fold-${{ env.PILOT_FOLD }}
          path: source-report
          run-id: ${{ env.PHASE_A1_RUN }}
          github-token: ${{ github.token }}
      - name: Compact and prove exact parity
        shell: bash
        run: |
          set -euo pipefail
          python3 research/contextual_value_phase_a_compact.py \
            --fold "$PILOT_FOLD" \
            --source "source/phase-a-rich-fold-$PILOT_FOLD.jsonl.gz" \
            --source-report "source-report/phase-a-rich-fold-$PILOT_FOLD-report.json" \
            --out "results/contextual-value-v1/phase-a-compact-pilot"
      - name: Assert parity
        run: |
          python3 - <<'PY'
          import json
          p="results/contextual-value-v1/phase-a-compact-pilot/phase-a-compact-fold-0-parity.json"
          r=json.load(open(p))
          assert r["exact_metadata_feature_presence_and_float64_value_parity"] is True
          assert r["assessment_opened"] is False
          assert r["assessment_outcomes_used"] is False
          assert r["decision_rows"] > 0
          assert r["candidate_rows"] > r["decision_rows"]
          print(json.dumps({
              "source_mb": r["source_payload_size_bytes"]/1024/1024,
              "compact_mb": r["compact_payload_size_bytes"]/1024/1024,
              "ratio": r["size_ratio_compact_over_source"],
          }, indent=2))
          PY
      - name: Upload compact pilot
        uses: actions/upload-artifact@v4
        with:
          name: contextual-value-v1-phase-a-compact-pilot-fold-0
          path: results/contextual-value-v1/phase-a-compact-pilot/
          retention-days: 30
