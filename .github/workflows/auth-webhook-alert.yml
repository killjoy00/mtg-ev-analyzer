name: production auth recovery failure alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'edge/auth-webhook.mjs'
      - 'scripts/auth-webhook-alert.mjs'
      - '.github/workflows/auth-webhook-alert.yml'
  pull_request:
    branches: [main]
    paths:
      - 'edge/auth-webhook.mjs'
      - 'scripts/auth-webhook-alert.mjs'
      - '.github/workflows/auth-webhook-alert.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: pack1-production-authhook-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify retained-log query access on pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/auth-webhook-alert.mjs check
      - name: Query retained failures and route alerts to GitHub Issues
        if: github.event_name != 'pull_request'
        run: node scripts/auth-webhook-alert.mjs alert
