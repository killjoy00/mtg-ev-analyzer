name: One-shot private quota timing investigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quota-stage-forensics.yml'
      - 'scripts/quota-stage-forensics.mjs'
      - 'tests/quota-stage-forensics.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/quota-stage-forensics.yml'
      - 'scripts/quota-stage-forensics.mjs'
      - 'tests/quota-stage-forensics.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test read-only analyzer without provider credentials
        run: node --test tests/quota-stage-forensics.test.mjs
  diagnosis:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_EDGE_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test read-only analyzer
        run: node --test tests/quota-stage-forensics.test.mjs
      - name: Emit aggregate historical and current stage counts
        run: node scripts/quota-stage-forensics.mjs
