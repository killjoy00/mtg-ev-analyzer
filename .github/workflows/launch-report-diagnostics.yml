name: inspect failed distributed stage report
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/launch-report-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  report:
    if: github.event.pull_request.number == 1051 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributed-capacity-1-runner-0
          path: failed-report
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37577079969
      - name: Print aggregate gate failure without actor, credential or egress data
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='failed-report';
          const files=fs.readdirSync(root,{recursive:true});
          for(const file of files) {
            if(!/^distributed-stage-\d+\.json$/.test(path.basename(file)))continue;
            const s=JSON.parse(fs.readFileSync(path.join(root,file),'utf8'));
            console.log(JSON.stringify({target:s.target,passed:s.passed,reasons:s.reasons,
              routes:s.routes,phase_routes:s.phase_routes,telemetry:s.telemetry,
              usage:s.usage&&{passed:s.usage.passed,reason:s.usage.reason,
                comparison:s.usage.comparison,ceiling_bytes:s.usage.ceiling_bytes}},null,2));
          }
          for(const file of files) {
            if(!/^cohort-0\.json$/.test(path.basename(file)))continue;
            const c=JSON.parse(fs.readFileSync(path.join(root,file),'utf8'));
            console.log(JSON.stringify({phase:c.phase,failure:c.failure,passed:c.passed}));
          }
          NODE
